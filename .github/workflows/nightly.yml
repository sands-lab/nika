name: Nightly

on:
  schedule:
    # 05:15 UTC daily (takes effect only after this file is on the default branch)
    - cron: "15 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.8.22"
  GNMIC_VERSION: "0.48.0"
  # Boot / artifact checks only — no deep evaluate_scenario or symptom E2E.
  NIKA_CI_VERIFY_DEPTH: artifact
  # GHA wall-clock subset of the release ISP variants the tests run locally.
  NIKA_CI_ISP_TOPOS: "pdh,abilene,janos-us"
  # eBGP prefix fan-out is currently unreliable on shared GHA runners.
  NIKA_CI_ISP_BGP_MODES: "ibgp_rr"

jobs:
  full-scenario-verify:
    name: scenario startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - name: Load lab kernel modules
        run: |
          sudo modprobe wireguard || true
          # Azure GitHub runners often lack vrf.ko; probe create instead of failing.
          if sudo modprobe vrf 2>/dev/null || sudo ip link add nika_vrf_probe type vrf table 110 2>/dev/null; then
            sudo ip link del nika_vrf_probe 2>/dev/null || true
            echo "NIKA_CI_VRF=1" >> "$GITHUB_ENV"
          else
            echo "NIKA_CI_VRF=0" >> "$GITHUB_ENV"
            echo "Linux VRF unavailable on this runner; enterprise_branch VRF cases will skip."
          fi
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Kathara scenario light startup (artifact)
        run: >
          uv run pytest
          tests/nika/net_env/test_scenario_e2e.py::KatharaScenarioE2ETest
          -q -ra

  failure-inject-contract:
    name: failure inject contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - name: Load lab kernel modules
        run: |
          sudo modprobe wireguard || true
          if sudo modprobe vrf 2>/dev/null || sudo ip link add nika_vrf_probe type vrf table 110 2>/dev/null; then
            sudo ip link del nika_vrf_probe 2>/dev/null || true
            echo "NIKA_CI_VRF=1" >> "$GITHUB_ENV"
          else
            echo "NIKA_CI_VRF=0" >> "$GITHUB_ENV"
            echo "Linux VRF unavailable on this runner; enterprise_branch VRF cases will skip."
          fi
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Kathara failure inject contract
        run: uv run pytest tests/nika/problems/test_failure_inject_contract.py::test_kathara_failure_inject_contract -q -ra

  clab-failure-inject-contract:
    name: clab failure inject contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install containerlab
        run: |
          for attempt in 1 2 3; do
            if bash -c "$(curl -fsSL https://get.containerlab.dev)"; then
              exit 0
            fi
            echo "containerlab install attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Install gnmic
        run: curl -fsSL https://get-gnmic.openconfig.net | bash -s -- --version "${GNMIC_VERSION}"
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Clab failure inject contract
        run: uv run pytest tests/nika/problems/test_failure_inject_contract.py::test_clab_failure_inject_contract -q -ra
      - name: Close stopped Containerlab nodes after topology loss
        run: uv run pytest tests/nika/workflows/test_session_containerlab_cleanup_live.py -q -ra

  failure-e2e:
    name: failure artifact e2e ${{ matrix.shard.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        shard:
          - name: baseline
            select: "not link_flap"
          - name: routing-flap
            select: >-
              link_flap and (simple_bgp or dc_clos or campus_lan or
              enterprise_branch or isp_)
          - name: programmable-flap
            select: >-
              link_flap and (p4_dc_fabric or p4_dc_gateway or sdn_l3_clos)
          - name: platform-flap
            select: "link_flap and (k8s_lab or min3clos)"
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - name: Load lab kernel modules
        run: |
          sudo modprobe wireguard || true
          # Azure GitHub runners often lack vrf.ko; probe create instead of failing.
          if sudo modprobe vrf 2>/dev/null || sudo ip link add nika_vrf_probe type vrf table 110 2>/dev/null; then
            sudo ip link del nika_vrf_probe 2>/dev/null || true
            echo "NIKA_CI_VRF=1" >> "$GITHUB_ENV"
          else
            echo "NIKA_CI_VRF=0" >> "$GITHUB_ENV"
            echo "Linux VRF unavailable on this runner; enterprise_branch VRF cases will skip."
          fi
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install containerlab for min3clos cases
        if: matrix.shard.name == 'baseline' || matrix.shard.name == 'platform-flap'
        run: |
          for attempt in 1 2 3; do
            if bash -c "$(curl -fsSL https://get.containerlab.dev)"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Install gnmic for min3clos cases
        if: matrix.shard.name == 'baseline' || matrix.shard.name == 'platform-flap'
        run: curl -fsSL https://get-gnmic.openconfig.net | bash -s -- --version "${GNMIC_VERSION}"
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Failure inject + artifact verify (${{ matrix.shard.name }})
        env:
          PYTEST_SELECT: ${{ matrix.shard.select }}
        run: >-
          uv run pytest tests/nika/problems/test_failure_e2e.py
          -q -ra -k "$PYTEST_SELECT"

  isp-integration:
    name: ISP integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - name: Load lab kernel modules
        run: |
          sudo modprobe wireguard || true
          # Azure GitHub runners often lack vrf.ko; probe create instead of failing.
          if sudo modprobe vrf 2>/dev/null || sudo ip link add nika_vrf_probe type vrf table 110 2>/dev/null; then
            sudo ip link del nika_vrf_probe 2>/dev/null || true
            echo "NIKA_CI_VRF=1" >> "$GITHUB_ENV"
          else
            echo "NIKA_CI_VRF=0" >> "$GITHUB_ENV"
            echo "Linux VRF unavailable on this runner; enterprise_branch VRF cases will skip."
          fi
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install containerlab
        run: |
          for attempt in 1 2 3; do
            if bash -c "$(curl -fsSL https://get.containerlab.dev)"; then
              exit 0
            fi
            echo "containerlab install attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Install gnmic
        run: curl -fsSL https://get-gnmic.openconfig.net | bash -s -- --version "${GNMIC_VERSION}"
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: ISP artifact matrix
        run: uv run pytest tests/nika/net_env/isp/test_isp_integration.py -q -ra

  k8s-llmd-sequential:
    name: k8s + llmd startup (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Free unused SDK space on the ephemeral runner
        if: runner.environment == 'github-hosted'
        # These SDKs are unrelated to NIKA. Preserve Docker images and lab caches.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
      - name: Require disk headroom for heavy labs
        run: |
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          available=$(df -B1 --output=avail "$docker_root" | tail -n 1)
          df -h "$docker_root"
          if [ "$available" -lt 32212254720 ]; then
            echo "::error::NIKA heavy labs require at least 30 GiB free on the Docker filesystem to avoid Kubernetes DiskPressure and pod eviction. Use a runner with more disk space."
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: k8s_lab + llmd_lab light startup (serial)
        run: |
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          available=$(df -B1 --output=avail "$docker_root" | tail -n 1)
          df -h "$docker_root"
          if [ "$available" -lt 32212254720 ]; then
            echo "::error::NIKA heavy labs require at least 30 GiB free on the Docker filesystem to avoid Kubernetes DiskPressure and pod eviction. Use a runner with more disk space."
            exit 1
          fi
          uv run pytest tests/nika/net_env/test_scenario_e2e.py::K8sScenarioE2ETest -q -ra --maxfail=1

  engine-runtimes-sequential:
    name: pinned engine k8s + llmd + SR Linux (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Engine trials run the oracle and verify the failure through MCP tools.
      NIKA_CI_ENGINE_RELEASE: "0.2.0"
      NIKA_CI_ENGINE_SPLIT: test
    steps:
      - uses: actions/checkout@v5
      - name: Free unused SDK space on the ephemeral runner
        if: runner.environment == 'github-hosted'
        # These SDKs are unrelated to NIKA. Preserve Docker images and lab caches.
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift
      - name: Require disk headroom for heavy labs
        run: |
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          available=$(df -B1 --output=avail "$docker_root" | tail -n 1)
          df -h "$docker_root"
          if [ "$available" -lt 32212254720 ]; then
            echo "::error::NIKA heavy labs require at least 30 GiB free on the Docker filesystem to avoid Kubernetes DiskPressure and pod eviction. Use a runner with more disk space."
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Build engine once for all three trials
        id: engine-build
        run: |
          commit=$(git rev-parse --short=12 HEAD)
          uv run nika engine build "$commit"
          echo "NIKA_CI_ENGINE_IMAGE=nika/benchmark-engine:$commit" >> "$GITHUB_ENV"
      - name: Prepare this release's required images before disk admission
        id: release-images
        run: |
          uv run python - <<'PYTHON'
          import os
          from nika.workflows.benchmark.release import load_release, preflight_release

          preflight_release(load_release(os.environ["NIKA_CI_ENGINE_RELEASE"], split="test"))
          PYTHON
      - name: k8s_lab oracle through engine
        env:
          NIKA_CI_ENGINE_TASK_ID: k8s_lab__k8s_networkpolicy_d__hadf9af15da3f
        run: |
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          available=$(df -B1 --output=avail "$docker_root" | tail -n 1)
          df -h "$docker_root"
          if [ "$available" -lt 32212254720 ]; then
            echo "::error::NIKA heavy labs require at least 30 GiB free on the Docker filesystem to avoid Kubernetes DiskPressure and pod eviction. Use a runner with more disk space."
            exit 1
          fi
          uv run pytest tests/benchmark/test_engine_container_e2e.py -q -ra
      - name: llmd_lab oracle through engine
        if: ${{ !cancelled() && steps.engine-build.outcome == 'success' && steps.release-images.outcome == 'success' }}
        env:
          NIKA_CI_ENGINE_TASK_ID: llmd_lab__k8s_coredns_isolat__h7de12dd02b9a
        run: |
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          available=$(df -B1 --output=avail "$docker_root" | tail -n 1)
          df -h "$docker_root"
          if [ "$available" -lt 32212254720 ]; then
            echo "::error::NIKA heavy labs require at least 30 GiB free on the Docker filesystem to avoid Kubernetes DiskPressure and pod eviction. Use a runner with more disk space."
            exit 1
          fi
          uv run pytest tests/benchmark/test_engine_container_e2e.py -q -ra
      - name: isp_pdh SR Linux oracle through engine
        if: ${{ !cancelled() && steps.engine-build.outcome == 'success' && steps.release-images.outcome == 'success' }}
        env:
          NIKA_CI_ENGINE_TASK_ID: isp_pdh__bgp_acl_block__s__i__hbe4170621772
        run: |
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          available=$(df -B1 --output=avail "$docker_root" | tail -n 1)
          df -h "$docker_root"
          if [ "$available" -lt 32212254720 ]; then
            echo "::error::NIKA heavy labs require at least 30 GiB free on the Docker filesystem to avoid Kubernetes DiskPressure and pod eviction. Use a runner with more disk space."
            exit 1
          fi
          uv run pytest tests/benchmark/test_engine_container_e2e.py -q -ra
