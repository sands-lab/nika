name: Nightly

on:
  schedule:
    # 05:15 UTC daily (takes effect only after this file is on the default branch)
    - cron: "15 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.8.22"
  GNMIC_VERSION: "0.48.0"
  # Representative ISP subset for GHA wall-clock; full SNDlib matrix remains local default.
  NIKA_CI_ISP_TOPOS: "pdh,polska"

jobs:
  full-scenario-verify:
    name: full evaluate_scenario (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - name: Load lab kernel modules
        run: |
          sudo modprobe wireguard || true
          # Azure GitHub runners often lack vrf.ko; probe create instead of failing.
          if sudo modprobe vrf 2>/dev/null || sudo ip link add nika_vrf_probe type vrf table 110 2>/dev/null; then
            sudo ip link del nika_vrf_probe 2>/dev/null || true
            echo "NIKA_CI_VRF=1" >> "$GITHUB_ENV"
          else
            echo "NIKA_CI_VRF=0" >> "$GITHUB_ENV"
            echo "Linux VRF unavailable on this runner; enterprise_branch VRF cases will skip."
          fi
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --extra labs --group dev
      - name: Kathara scenario E2E (full verify)
        run: >
          uv run pytest
          tests/nika/net_env/test_scenario_e2e.py::KatharaScenarioE2ETest
          -q

  curated-scenario-verify:
    name: curated verify ${{ matrix.scenario }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        scenario:
          - dc_clos
          - campus_lan
          - sdn_l3_clos
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --extra labs --group dev
      - name: Curated evaluate_scenario smoke
        env:
          NIKA_CI_VERIFY_SCENARIO: ${{ matrix.scenario }}
        run: uv run pytest tests/ci/test_scenario_verify.py -q

  failure-inject-contract:
    name: failure inject contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --extra labs --group dev
      - name: Kathara failure inject contract
        run: uv run pytest tests/nika/problems/test_failure_inject_contract.py::test_kathara_failure_inject_contract -q

  clab-failure-inject-contract:
    name: clab failure inject contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install containerlab
        run: bash -c "$(curl -fsSL https://get.containerlab.dev)"
      - name: Install gnmic
        run: curl -fsSL https://get-gnmic.openconfig.net | bash -s -- --version "${GNMIC_VERSION}"
      - name: Install (labs + containerlab)
        run: uv sync --extra labs --extra containerlab --group dev
      - name: Clab failure inject contract
        run: uv run pytest tests/nika/problems/test_failure_inject_contract.py::test_clab_failure_inject_contract -q

  failure-e2e:
    name: failure e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - name: Load lab kernel modules
        run: |
          sudo modprobe wireguard || true
          # Azure GitHub runners often lack vrf.ko; probe create instead of failing.
          if sudo modprobe vrf 2>/dev/null || sudo ip link add nika_vrf_probe type vrf table 110 2>/dev/null; then
            sudo ip link del nika_vrf_probe 2>/dev/null || true
            echo "NIKA_CI_VRF=1" >> "$GITHUB_ENV"
          else
            echo "NIKA_CI_VRF=0" >> "$GITHUB_ENV"
            echo "Linux VRF unavailable on this runner; enterprise_branch VRF cases will skip."
          fi
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --extra labs --group dev
      - name: Broad failure E2E
        run: uv run pytest tests/nika/problems/test_failure_e2e.py -q

  isp-integration:
    name: ISP integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - name: Load lab kernel modules
        run: |
          sudo modprobe wireguard || true
          # Azure GitHub runners often lack vrf.ko; probe create instead of failing.
          if sudo modprobe vrf 2>/dev/null || sudo ip link add nika_vrf_probe type vrf table 110 2>/dev/null; then
            sudo ip link del nika_vrf_probe 2>/dev/null || true
            echo "NIKA_CI_VRF=1" >> "$GITHUB_ENV"
          else
            echo "NIKA_CI_VRF=0" >> "$GITHUB_ENV"
            echo "Linux VRF unavailable on this runner; enterprise_branch VRF cases will skip."
          fi
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install containerlab
        run: bash -c "$(curl -fsSL https://get.containerlab.dev)"
      - name: Install gnmic
        run: curl -fsSL https://get-gnmic.openconfig.net | bash -s -- --version "${GNMIC_VERSION}"
      - name: Install (labs + containerlab)
        run: uv sync --extra labs --extra containerlab --group dev
      - name: ISP integration matrix
        run: uv run pytest tests/nika/net_env/isp/test_isp_integration.py -q

  k8s-llmd-sequential:
    name: k8s + llmd (amd64 sequential)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --extra labs --group dev
      - name: k8s_lab + llmd_lab scenario E2E (serial)
        run: >
          uv run pytest
          tests/nika/net_env/test_scenario_e2e.py::K8sScenarioE2ETest
          -q --maxfail=1
          || uv run pytest
          tests/nika/net_env/test_scenario_e2e.py::K8sScenarioE2ETest
          -q --maxfail=1
