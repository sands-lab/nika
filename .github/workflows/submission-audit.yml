name: Audit submission

on:
  workflow_call:
    inputs:
      artifact_name:
        default: submission-audit
        type: string
      package:
        description: Scores package path within the scores repository
        required: true
        type: string
      scores_repository:
        required: true
        type: string
      scores_ref:
        required: true
        type: string
      nika_ref:
        required: true
        type: string
      trajectories_repository:
        default: nika-bench/nika-trajectories
        type: string
  workflow_dispatch:
    inputs:
      artifact_name:
        default: submission-audit
        type: string
      package:
        description: Scores package path within the scores repository
        required: true
        type: string
      scores_repository:
        default: sands-lab/nika-leaderboard
        type: string
      scores_ref:
        default: main
        type: string
      nika_ref:
        default: dev
        type: string
      trajectories_repository:
        default: nika-bench/nika-trajectories
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: sands-lab/nika
          ref: ${{ inputs.nika_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: nika
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.scores_repository }}
          ref: ${{ inputs.scores_ref }}
          persist-credentials: false
          path: scores
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.8.22"
      - name: Install the auditor
        run: uv sync --project nika --no-dev
      - name: Validate and audit paired trajectories
        env:
          PACKAGE: ${{ inputs.package }}
          TRAJECTORIES_REPO: ${{ inputs.trajectories_repository }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_PATH=$(nika/.venv/bin/python - <<'PYTHON'
          import os
          from pathlib import Path
          root = Path("scores").resolve()
          package = (root / os.environ["PACKAGE"]).resolve()
          if not package.is_relative_to(root) or not package.is_dir():
              raise SystemExit("Scores package must be a directory inside the checked-out scores repository.")
          print(package)
          PYTHON
          )
          mkdir -p "$RUNNER_TEMP/submission-audit"
          nika/.venv/bin/nika leaderboard validate "$PACKAGE_PATH" \
            --fetch-trajectories --traj-repo "$TRAJECTORIES_REPO" \
            --audit-repo "$GITHUB_WORKSPACE/nika" \
            --audit-out "$RUNNER_TEMP/submission-audit/audit.json" \
            2>&1 | tee "$RUNNER_TEMP/submission-audit/summary.md"
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/submission-audit/
          if-no-files-found: warn
      - name: Summarize the audit
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/submission-audit/summary.md" ]; then
            cat "$RUNNER_TEMP/submission-audit/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
