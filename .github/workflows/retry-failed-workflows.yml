name: Retry failed workflows

# GitHub Actions cannot rerun a failed run by itself, so rerun its failed jobs
# once from a workflow_run trigger. Workflows listed here must be idempotent:
# issue triage updates its marked comment instead of posting a new one.
on:
  workflow_run:
    workflows: [Letta Issue Triage]
    types: [completed]

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
