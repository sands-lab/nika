name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.22"
  GNMIC_VERSION: "0.48.0"

# Shared setup notes:
# - ubuntu-24.04-arm needs amd64 binfmt for nika/onos (COPY --from amd64 upstream).
# - No per-job path filters: any matching push runs the full PR job set.
# - Full evaluate_scenario and broad failure inject live in nightly.yml.

jobs:
  unit-contract:
    name: unit+contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (dev + labs import deps)
        run: uv sync --extra labs --extra sade --extra sdk --group dev
      - name: Run unit and contract tests
        # Offline contracts under problems/service/net_env are included;
        # Docker E2E modules stay ignored.
        env:
          COLUMNS: "120"
          NO_COLOR: "1"
          TERM: dumb
        run: >
          uv run pytest
          -m "(unit or contract) and not e2e and not integration and not live and not sandbox and not ci_smoke and not nightly"
          --ignore=tests/ci
          --ignore=tests/nika/net_env/isp
          --ignore=tests/nika/net_env/test_scenario_e2e.py
          --ignore=tests/nika/net_env/test_docker_images.py
          --ignore=tests/nika/net_env/test_kathara_verify.py
          --ignore=tests/nika/net_env/test_clab_min3clos_verify.py
          --ignore=tests/nika/net_env/test_containerlab_mgmt_subnet.py
          --ignore=tests/nika/net_env/test_k8s_lab_verify.py
          --ignore=tests/nika/net_env/test_llmd_lab_verify.py
          --ignore=tests/nika/net_env/test_iosxr_simple_bgp_verify.py
          --ignore=tests/nika/net_env/test_enterprise_branch_wireguard.py
          --ignore=tests/nika/net_env/test_p4_dc_fabric.py
          --ignore=tests/nika/net_env/test_p4_dc_fabric_live.py
          --ignore=tests/nika/net_env/test_p4_dc_gateway.py
          --ignore=tests/nika/net_env/test_sdn_l3_clos.py
          --ignore=tests/nika/net_env/test_k8s_workload_cache.py
          --ignore=tests/nika/net_env/test_k8s_workload_cache_live.py
          --ignore=tests/nika/problems/test_failure_e2e.py
          --ignore=tests/nika/problems/test_failure_inject_contract.py
          --ignore=tests/nika/problems/test_scenario_failure_compat.py
          --ignore=tests/nika/problems/test_bgp_missing_route_advertisement_e2e.py
          --ignore=tests/nika/problems/test_bgp_max_prefix_exceeded_e2e.py
          --ignore=tests/nika/problems/test_bgp_rpki_invalid_route_leak_e2e.py
          --ignore=tests/nika/problems/test_bgp_blackhole_community_leak_e2e.py
          --ignore=tests/nika/problems/test_p4runtime_partial_write_e2e.py
          --ignore=tests/nika/problems/test_p4_table_entry_fabric_e2e.py
          --ignore=tests/nika/problems/test_multi_fault_agent_e2e.py
          --ignore=tests/nika/problems/test_multi_fault_inject.py
          --ignore=tests/nika/problems/test_web_dos_attack.py
          --ignore=tests/nika/problems/test_gateway_nat_failures.py
          --ignore=tests/nika/problems/test_device_forwarding_packet_corruption.py
          --ignore=tests/nika/problems/test_link_packet_corruption.py
          --ignore=tests/nika/problems/test_pmtu_blackhole_combo.py
          --ignore=tests/nika/service/mcp_gateway
          --ignore=tests/nika/service/pingmesh
          --ignore=tests/nika/service/kathara
          --ignore=tests/nika/service/containerlab
          --ignore=tests/nika/service/test_k8s_mcp_gateway_e2e.py
          --ignore=tests/nika/service/test_k8s_mcp_server.py
          --ignore=tests/nika/service/test_mcp_access_e2e.py
          --ignore=tests/nika/service/test_mcp_tools_live.py
          --ignore=tests/nika/service/test_packet_capture.py
          --ignore=tests/nika/validation
          --ignore=tests/nika/workflows/integration
          --ignore=tests/benchmark/test_trials.py
          --ignore=tests/benchmark/test_batch.py
          --ignore=tests/benchmark/test_sandbox_benchmark.py
          --ignore=tests/benchmark/test_curated_release_e2e.py
          --ignore=tests/agent/test_sandbox_agents.py
          --ignore=tests/agent/test_sandbox_security.py
          --ignore=tests/agent/test_sandbox_isolation.py
          -q --tb=line

  images:
    name: image ${{ matrix.image }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        image:
          - nika/base
          - nika/frr
          - nika/nginx
          - nika/wireguard
          - nika/pox
          - nika/onos
          - nika/fabric-controller
          - nika/routinator:v0.14.2
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --extra labs --group dev
      - name: Build and probe image
        env:
          NIKA_CI_IMAGE: ${{ matrix.image }}
        run: uv run pytest tests/ci/test_images.py -q

  scenario-startup:
    name: startup ${{ matrix.scenario }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        scenario:
          - dc_clos
          - campus_lan
          - enterprise_branch
          - sdn_l3_clos
          - p4_dc_fabric
          - p4_dc_gateway
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --extra labs --group dev
      - name: Light scenario startup
        env:
          NIKA_CI_SCENARIO: ${{ matrix.scenario }}
        run: uv run pytest tests/ci/test_scenario_startup.py -q

  failure-inject:
    name: failure ${{ matrix.case }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        case:
          - dc_clos-link_down
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --extra labs --group dev
      - name: Failure inject smoke
        env:
          NIKA_CI_FAILURE_CASE: ${{ matrix.case }}
        run: uv run pytest tests/ci/test_failure_inject_smoke.py -q

  clab-failure-inject:
    name: clab failure ${{ matrix.case }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        case:
          - min3clos-link_down
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install containerlab
        run: bash -c "$(curl -fsSL https://get.containerlab.dev)"
      - name: Install gnmic
        run: curl -fsSL https://get-gnmic.openconfig.net | bash -s -- --version "${GNMIC_VERSION}"
      - name: Install (labs + containerlab)
        run: uv sync --extra labs --extra containerlab --group dev
      - name: Clab failure inject smoke
        env:
          NIKA_CI_FAILURE_CASE: ${{ matrix.case }}
        run: uv run pytest tests/ci/test_failure_inject_smoke.py -q

  pipeline:
    name: pipeline kathara dc_clos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --extra labs --group dev
      - name: Mock-agent pipeline smoke
        run: uv run pytest tests/ci/test_pipeline_smoke.py -q

  benchmark-startup:
    name: benchmark startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --extra labs --group dev
      - name: Mini mock benchmark startup
        run: uv run pytest tests/ci/test_benchmark_startup.py -q

  clab-startup:
    name: clab min3clos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install containerlab
        run: bash -c "$(curl -fsSL https://get.containerlab.dev)"
      - name: Install gnmic
        run: curl -fsSL https://get-gnmic.openconfig.net | bash -s -- --version "${GNMIC_VERSION}"
      - name: Install (labs + containerlab)
        run: uv sync --extra labs --extra containerlab --group dev
      - name: min3clos light startup
        run: uv run pytest tests/ci/test_clab_startup.py -q
