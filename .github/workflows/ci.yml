name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmark/**"
      - "config/**"
      - "scripts/**"
      - "install.sh"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "benchmark/**"
      - "config/**"
      - "scripts/**"
      - "install.sh"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.22"
  GNMIC_VERSION: "0.48.0"

# Shared setup notes:
# - ubuntu-24.04-arm needs amd64 binfmt for nika/onos (COPY --from amd64 upstream).
# - No per-job path filters: any matching push runs the full PR job set.
# - Full evaluate_scenario and broad failure inject live in nightly.yml.

jobs:
  install-benchmark-e2e:
    name: install to benchmark e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Install host prerequisites
        # Runners ship Docker; their Azure kernels keep vrf.ko in linux-modules-extra.
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
      - name: Run one-shot installer
        run: ./scripts/install.sh
      - name: Verify installed user environment
        run: |
          source .venv/bin/activate
          docker info >/dev/null
          uv --version
          nika --help >/dev/null
          python -c 'import Kathara, docker, kubernetes'
          clab version
          gnmic version
          cmp --silent .env .env.example
          cmp --silent config/nika.yaml config/nika.example.yaml
      - name: Run installed benchmark E2E
        run: |
          source .venv/bin/activate
          pytest tests/ci/test_benchmark_startup.py -q

  unit-contract:
    name: unit+contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (dev + labs import deps)
        run: uv sync --group labs --extra sade --extra sdk --group dev
      - name: Run unit and contract tests
        env:
          COLUMNS: "120"
          NO_COLOR: "1"
          TERM: dumb
        run: >
          uv run pytest
          -m "(unit or contract) and not live"
          -q --tb=line

  images:
    name: image ${{ matrix.image }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        image:
          - nika/base
          - nika/frr
          - nika/nginx
          - nika/wireguard
          - nika/pox
          - nika/onos
          - nika/fabric-controller
          - nika/tc-bpf
          - nika/skopeo
          - nika/routinator
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Build and probe image
        env:
          NIKA_CI_IMAGE: ${{ matrix.image }}
        run: uv run pytest tests/ci/test_images.py -q

  scenario-startup:
    name: startup ${{ matrix.scenario }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        scenario:
          - dc_clos
          - campus_lan
          - enterprise_branch
          - sdn_l3_clos
          - p4_dc_fabric
          - p4_dc_gateway
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - name: Load lab kernel modules
        run: |
          sudo modprobe wireguard || true
          # Azure GitHub runners often lack vrf.ko; probe create instead of failing.
          if sudo modprobe vrf 2>/dev/null || sudo ip link add nika_vrf_probe type vrf table 110 2>/dev/null; then
            sudo ip link del nika_vrf_probe 2>/dev/null || true
            echo "NIKA_CI_VRF=1" >> "$GITHUB_ENV"
          else
            echo "NIKA_CI_VRF=0" >> "$GITHUB_ENV"
            echo "Linux VRF unavailable on this runner; enterprise_branch VRF cases will skip."
          fi
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Light scenario startup
        env:
          NIKA_CI_SCENARIO: ${{ matrix.scenario }}
        run: uv run pytest tests/ci/test_scenario_startup.py -q

  failure-inject:
    name: failure ${{ matrix.case }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        case:
          - dc_clos-link_down
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Failure inject smoke
        env:
          NIKA_CI_FAILURE_CASE: ${{ matrix.case }}
        run: uv run pytest tests/ci/test_failure_inject_smoke.py -q

  clab-failure-inject:
    name: clab failure ${{ matrix.case }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        case:
          - min3clos-link_down
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install containerlab
        run: bash -c "$(curl -fsSL https://get.containerlab.dev)"
      - name: Install gnmic
        run: curl -fsSL https://get-gnmic.openconfig.net | bash -s -- --version "${GNMIC_VERSION}"
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Clab failure inject smoke
        env:
          NIKA_CI_FAILURE_CASE: ${{ matrix.case }}
        run: uv run pytest tests/ci/test_failure_inject_smoke.py -q

  pipeline:
    name: pipeline kathara dc_clos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Mock-agent pipeline smoke
        run: uv run pytest tests/ci/test_pipeline_smoke.py -q

  clab-startup:
    name: clab min3clos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install containerlab
        run: bash -c "$(curl -fsSL https://get.containerlab.dev)"
      - name: Install gnmic
        run: curl -fsSL https://get-gnmic.openconfig.net | bash -s -- --version "${GNMIC_VERSION}"
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: min3clos light startup
        run: uv run pytest tests/ci/test_clab_startup.py -q

  clab-pipeline:
    name: pipeline containerlab min3clos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Enable amd64 binfmt (ONOS foreign stage)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: docker run --privileged --rm tonistiigi/binfmt --install amd64
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install containerlab
        run: bash -c "$(curl -fsSL https://get.containerlab.dev)"
      - name: Install gnmic
        run: curl -fsSL https://get-gnmic.openconfig.net | bash -s -- --version "${GNMIC_VERSION}"
      - name: Install (labs)
        run: uv sync --group labs --group dev
      - name: Containerlab mock-agent pipeline
        run: uv run pytest tests/nika/workflows/integration/test_pipeline_clab.py -q
