  problem: link_bandwidth_throttling
  inject:
    host_name: client
    intf_name: eth0
    rate: 30kbit
    burst: 64kb
    limit: 500kb
  root_causes:
  - resource:
      kind: interface
      node: client
      name: eth0
    fault_type: link_bandwidth_throttling
- scenario: p4_dc_gateway
  topo_size: s
  problem: p4_ecn_threshold_misconfiguration
  inject:
    host_name: gateway_1
    intf_name: eth1
    bmv2_port: '2'
    threshold: '1024'
  root_causes:
  - resource:
      kind: interface
      node: gateway_1
      name: eth1
    fault_type: p4_ecn_threshold_misconfiguration
