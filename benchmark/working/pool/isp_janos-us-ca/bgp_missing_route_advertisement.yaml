scenario:
  name: isp_janos-us-ca
failure:
  fault_type: bgp_missing_route_advertisement
  cases:
  - topo_size: l
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: vancouver
      peer_host: pc_vancouver
      prefix: 203.0.113.0/24
      probe_dst_ip: 203.0.113.1
      symptom_host: atlanta
    root_causes:
    - resource:
        kind: node
        node: vancouver
      fault_type: bgp_missing_route_advertisement
  - topo_size: l
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: washingtondc
      peer_host: pc_washingtondc
      prefix: 203.0.114.0/24
      probe_dst_ip: 203.0.114.1
      symptom_host: atlanta
    root_causes:
    - resource:
        kind: node
        node: washingtondc
      fault_type: bgp_missing_route_advertisement
  - topo_size: l
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: winnipeg
      peer_host: pc_winnipeg
      prefix: 203.0.115.0/24
      probe_dst_ip: 203.0.115.1
      symptom_host: atlanta
