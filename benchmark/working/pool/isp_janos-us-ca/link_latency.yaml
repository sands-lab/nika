scenario:
  name: isp_janos-us-ca
failure:
  fault_type: link_latency
  cases:
  - topo_size: l
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: calgary
      intf_name: eth1
      peer_host: pc_vancouver
      probe_dst_ip: 10.254.0.146
      symptom_host: pc_calgary
    root_causes:
    - resource:
        kind: link
        name: calgary:eth1--vancouver:eth1
      fault_type: link_latency
  - topo_size: l
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: calgary
      intf_name: eth0
      peer_host: pc_vancouver
      probe_dst_ip: 10.254.0.146
      symptom_host: pc_calgary
    root_causes:
    - resource:
        kind: link
        name: calgary:eth0--vancouver:eth0
      fault_type: link_latency
