scenario:
  name: k8s_lab
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - inject:
      burst: 64kb
      host_name: as1r1
      intf_name: eth0
      limit: 500kb
      rate: 30kbit
    root_causes:
    - resource:
        kind: link
        name: as1r1:eth0--dc_exit:eth0
      fault_type: link_capacity_bottleneck
