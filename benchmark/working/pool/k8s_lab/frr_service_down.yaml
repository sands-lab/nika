scenario:
  name: k8s_lab
failure:
  fault_type: frr_service_down
  cases:
  - traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: leaf_1_1
    root_causes:
    - resource:
        kind: node
        node: leaf_1_1
      fault_type: frr_service_down
  - traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: leaf_1_2
    root_causes:
    - resource:
        kind: node
        node: leaf_1_2
      fault_type: frr_service_down
  - traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: leaf_2_1
    root_causes:
    - resource:
        kind: node
        node: leaf_2_1
      fault_type: frr_service_down
  - traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: leaf_2_2
    root_causes:
    - resource:
        kind: node
        node: leaf_2_2
      fault_type: frr_service_down
