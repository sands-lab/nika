scenario:
  name: k8s_lab
failure:
  fault_type: lb_advertisement_missing
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      control_node: controller
    root_causes:
    - resource:
        kind: node
        node: controller
      fault_type: lb_advertisement_missing
  - topo_size: m
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      control_node: controller
    root_causes:
    - resource:
        kind: node
        node: controller
      fault_type: lb_advertisement_missing
  - topo_size: l
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      control_node: controller
    root_causes:
    - resource:
        kind: node
        node: controller
      fault_type: lb_advertisement_missing
