scenario:
  name: k8s_lab
failure:
  fault_type: host_incorrect_gateway
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: client
    root_causes:
    - resource:
        kind: node
        node: client
      fault_type: host_incorrect_gateway
  - topo_size: m
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: client
    root_causes:
    - resource:
        kind: node
        node: client
      fault_type: host_incorrect_gateway
  - topo_size: l
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: client
    root_causes:
    - resource:
        kind: node
        node: client
      fault_type: host_incorrect_gateway
