scenario:
  name: k8s_lab
failure:
  fault_type: link_latency
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: client
      intf_name: eth0
    root_causes:
    - resource:
        kind: link
        name: as2r1:eth0--client:eth0
      fault_type: link_latency
  - topo_size: m
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: client
      intf_name: eth0
    root_causes:
    - resource:
        kind: link
        name: as2r1:eth0--client:eth0
      fault_type: link_latency
  - topo_size: l
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: client
      intf_name: eth0
    root_causes:
    - resource:
        kind: link
        name: as2r1:eth0--client:eth0
      fault_type: link_latency
