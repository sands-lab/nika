scenario:
  name: k8s_lab
combination:
  name: selector_masks_readiness
  failures:
  - k8s_readiness_probe_misconfig
  - k8s_service_selector_mismatch
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      k8s_readiness_probe_misconfig:
        control_node: controller
      k8s_service_selector_mismatch:
        control_node: controller
    root_causes:
    - resource:
        kind: node
        node: controller
      fault_type: k8s_readiness_probe_misconfig
    - resource:
        kind: node
        node: controller
      fault_type: k8s_service_selector_mismatch
