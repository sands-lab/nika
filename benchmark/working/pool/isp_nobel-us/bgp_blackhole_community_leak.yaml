scenario:
  name: isp_nobel-us
failure:
  fault_type: bgp_blackhole_community_leak
  cases:
  - topo_size: s
    igp: ospf
    bgp_mode: ebgp
    rpki: true
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: houston
      peer_host: pc_houston
      probe_dst_ip: 198.51.100.1
      symptom_host: boulder
    root_causes:
    - resource:
        kind: node
        node: houston
      fault_type: bgp_blackhole_community_leak
