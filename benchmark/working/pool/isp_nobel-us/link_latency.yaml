scenario:
  name: isp_nobel-us
failure:
  fault_type: link_latency
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: palo_alto
      intf_name: eth1
      peer_host: pc_san_diego
      probe_dst_ip: 10.254.0.42
      symptom_host: pc_palo_alto
    root_causes:
    - resource:
        kind: link
        name: palo_alto:eth1--san_diego:eth1
      fault_type: link_latency
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: palo_alto
      intf_name: eth0
      peer_host: pc_san_diego
      probe_dst_ip: 10.254.0.42
      symptom_host: pc_palo_alto
    root_causes:
    - resource:
        kind: link
        name: palo_alto:eth0--san_diego:eth0
      fault_type: link_latency
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: iosxr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: palo_alto
      intf_name: eth0
      peer_host: pc_san_diego
      probe_dst_ip: 10.254.0.42
      symptom_host: pc_palo_alto
    root_causes:
    - resource:
        kind: link
        name: palo_alto:eth0--san_diego:eth0
      fault_type: link_latency
