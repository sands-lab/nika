      symptom_host: ann_arbor
    root_causes:
    - resource:
        kind: node
        node: urbana_champaign
      fault_type: bgp_missing_route_advertisement
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: washington
