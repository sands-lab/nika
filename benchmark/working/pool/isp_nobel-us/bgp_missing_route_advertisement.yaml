scenario:
  name: isp_nobel-us
failure:
  fault_type: bgp_missing_route_advertisement
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: seattle
      peer_host: pc_seattle
      prefix: 203.0.113.0/24
      probe_dst_ip: 203.0.113.1
      symptom_host: ann_arbor
    root_causes:
    - resource:
        kind: node
        node: seattle
      fault_type: bgp_missing_route_advertisement
