scenario:
  name: isp_nobel-us
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    inject:
      burst: 16kb
      host_name: atlanta
      intf_name: eth1
      limit: 32kb
      peer_host: pc_pittsburgh
      probe_dst_ip: 10.254.0.30
      rate: 512kbit
      symptom_host: pc_atlanta
    root_causes:
    - resource:
        kind: link
        name: atlanta:eth1--pittsburgh:eth1
      fault_type: link_capacity_bottleneck
