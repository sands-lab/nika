scenario:
  name: isp_nobel-us
failure:
  fault_type: mtu_mismatch
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    inject:
      host_name: palo_alto
      intf_name: eth1
      mtu: '500'
    root_causes:
    - resource:
        kind: interface
        node: palo_alto
        name: eth1
      fault_type: mtu_mismatch
