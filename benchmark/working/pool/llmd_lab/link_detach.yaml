scenario:
  name: llmd_lab
failure:
  fault_type: link_detach
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: controller
      intf_name: eth0
    root_causes:
    - resource:
        kind: interface
        node: controller
        name: eth0
      fault_type: link_detach
  - topo_size: m
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: controller
      intf_name: eth0
    root_causes:
    - resource:
        kind: interface
        node: controller
        name: eth0
      fault_type: link_detach
  - topo_size: l
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: controller
      intf_name: eth0
    root_causes:
    - resource:
        kind: interface
        node: controller
        name: eth0
      fault_type: link_detach
