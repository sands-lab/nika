scenario:
  name: isp_germany50
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: l
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: darmstadt
      intf_name: eth1
      limit: 32kb
      peer_host: pc_mannheim
      probe_dst_ip: 10.254.0.134
      rate: 512kbit
      symptom_host: pc_darmstadt
    root_causes:
    - resource:
        kind: link
        name: darmstadt:eth1--mannheim:eth0
