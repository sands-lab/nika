scenario:
  name: isp_dfn-gwin
failure:
  fault_type: bgp_address_family_not_activated
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: routeros
    traffic:
      pattern: gravity
      load_mbps: 1.0
    inject:
      host_name: leipzig
    root_causes:
    - resource:
        kind: node
        node: leipzig
      fault_type: bgp_address_family_not_activated
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: routeros
    traffic:
      pattern: gravity
      load_mbps: 1.0
    inject:
      host_name: muenchen
    root_causes:
    - resource:
        kind: node
        node: muenchen
      fault_type: bgp_address_family_not_activated
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: routeros
    traffic:
      pattern: gravity
      load_mbps: 1.0
    inject:
      host_name: stuttgart
    root_causes:
    - resource:
        kind: node
        node: stuttgart
      fault_type: bgp_address_family_not_activated
