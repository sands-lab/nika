scenario:
  name: isp_dfn-gwin
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: nokia_srlinux
    inject:
      burst: 16kb
      host_name: frankfurt
      intf_name: e1-3
      limit: 32kb
      peer_host: pc_essen
      probe_dst_ip: 10.254.0.10
      rate: 512kbit
      symptom_host: pc_frankfurt
    root_causes:
    - resource:
        kind: link
        name: essen:e1-3--frankfurt:e1-3
      fault_type: link_capacity_bottleneck
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: nokia_srlinux
    inject:
      burst: 16kb
      host_name: koeln
      intf_name: e1-4
      limit: 32kb
      peer_host: pc_frankfurt
      probe_dst_ip: 10.254.0.14
      rate: 512kbit
      symptom_host: pc_koeln
    root_causes:
    - resource:
        kind: link
        name: frankfurt:e1-7--koeln:e1-4
      fault_type: link_capacity_bottleneck
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: frankfurt
      intf_name: eth2
      limit: 32kb
      peer_host: pc_essen
      probe_dst_ip: 10.254.0.10
      rate: 512kbit
      symptom_host: pc_frankfurt
    root_causes:
    - resource:
        kind: link
        name: essen:eth2--frankfurt:eth2
      fault_type: link_capacity_bottleneck
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: koeln
      intf_name: eth3
      limit: 32kb
      peer_host: pc_frankfurt
      probe_dst_ip: 10.254.0.14
      rate: 512kbit
      symptom_host: pc_koeln
    root_causes:
    - resource:
        kind: link
        name: frankfurt:eth6--koeln:eth3
      fault_type: link_capacity_bottleneck
