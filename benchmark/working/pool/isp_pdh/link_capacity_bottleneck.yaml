scenario:
  name: isp_pdh
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: nokia_srlinux
    inject:
      burst: 16kb
      host_name: n10
      intf_name: e1-3
      limit: 32kb
      peer_host: pc_n11
      probe_dst_ip: 10.254.0.10
      rate: 512kbit
      symptom_host: pc_n10
    root_causes:
    - resource:
        kind: link
        name: n10:e1-3--n11:e1-3
      fault_type: link_capacity_bottleneck
