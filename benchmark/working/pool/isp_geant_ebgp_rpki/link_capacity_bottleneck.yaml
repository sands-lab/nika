scenario:
  name: isp_geant_ebgp_rpki
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: m
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: at1_at
      intf_name: eth3
      limit: 32kb
      peer_host: pc_ny1_ny
      probe_dst_ip: 10.254.0.62
      rate: 512kbit
      symptom_host: pc_at1_at
    root_causes:
    - resource:
        kind: link
        name: at1_at:eth3--ny1_ny:eth0
      fault_type: link_capacity_bottleneck
