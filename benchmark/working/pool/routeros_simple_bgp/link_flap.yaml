scenario:
  name: routeros_simple_bgp
failure:
  fault_type: link_flap
  cases:
  - traffic: &id001
      pattern: uniform
    inject:
      down_time: '1'
      host_name: pc1
      intf_name: eth0
      up_time: '1'
    root_causes:
    - resource:
        kind: link
        name: pc1:eth0--router1:eth2
      fault_type: link_flap
  - traffic: *id001
    inject:
      down_time: '1'
      host_name: pc2
      intf_name: eth0
      up_time: '1'
    root_causes:
    - resource:
        kind: link
        name: pc2:eth0--router2:eth2
      fault_type: link_flap
