scenario:
  name: routeros_simple_bgp
failure:
  fault_type: link_detach
  cases:
  - inject:
      host_name: pc1
      intf_name: eth0
    root_causes:
    - resource:
        kind: interface
        node: pc1
        name: eth0
      fault_type: link_detach
  - inject:
      host_name: pc2
      intf_name: eth0
    root_causes:
    - resource:
        kind: interface
        node: pc2
        name: eth0
      fault_type: link_detach
