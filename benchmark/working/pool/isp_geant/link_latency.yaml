scenario:
  name: isp_geant
failure:
  fault_type: link_latency
  cases:
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: at1_at
      intf_name: eth1
      peer_host: pc_ch1_ch
      probe_dst_ip: 10.254.0.10
      symptom_host: pc_at1_at
    root_causes:
    - resource:
        kind: link
        name: at1_at:eth1--ch1_ch:eth1
      fault_type: link_latency
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: at1_at
      intf_name: eth0
      peer_host: pc_ch1_ch
      probe_dst_ip: 10.254.0.10
      symptom_host: pc_at1_at
    root_causes:
    - resource:
        kind: link
        name: at1_at:eth0--ch1_ch:eth0
      fault_type: link_latency
