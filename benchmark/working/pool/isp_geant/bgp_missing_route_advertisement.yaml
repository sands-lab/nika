scenario:
  name: isp_geant
failure:
  fault_type: bgp_missing_route_advertisement
  cases:
  - topo_size: m
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: si1_si
      peer_host: pc_si1_si
      prefix: 203.0.113.0/24
      probe_dst_ip: 203.0.113.1
      symptom_host: at1_at
