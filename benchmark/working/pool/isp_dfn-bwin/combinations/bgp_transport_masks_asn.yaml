scenario:
  name: isp_dfn-bwin
combination:
  name: bgp_transport_masks_asn
  failures:
  - bgp_asn_misconfig
  - bgp_acl_block
  cases:
  - igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: containerlab
    device_profile: nokia_srlinux
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      bgp_asn_misconfig:
        host_name: berlin
      bgp_acl_block:
        host_name: berlin
    root_causes:
    - resource:
        kind: node
        node: berlin
      fault_type: bgp_asn_misconfig
    - resource:
        kind: node
        node: berlin
      fault_type: bgp_acl_block
