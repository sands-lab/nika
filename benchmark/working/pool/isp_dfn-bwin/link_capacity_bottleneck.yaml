scenario:
  name: isp_dfn-bwin
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: nokia_srlinux
    inject:
      burst: 16kb
      host_name: frankfurt
      intf_name: e1-4
      limit: 32kb
      peer_host: pc_koeln
      probe_dst_ip: 10.254.0.22
      rate: 512kbit
      symptom_host: pc_frankfurt
    root_causes:
    - resource:
        kind: link
        name: frankfurt:e1-4--koeln:e1-2
      fault_type: link_capacity_bottleneck
