scenario:
  name: isp_dfn-bwin
failure:
  fault_type: bgp_route_leak
  cases:
  - topo_size: s
    igp: ospf
    bgp_mode: ebgp
    rpki: true
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: frankfurt
      peer: 10.0.0.19
    root_causes:
    - resource:
        kind: node
        node: frankfurt
      fault_type: bgp_route_leak
