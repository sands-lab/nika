    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: berlin
      intf_name: eth0
      peer_host: pc_frankfurt
      probe_dst_ip: 10.254.0.6
      symptom_host: pc_berlin
    root_causes:
