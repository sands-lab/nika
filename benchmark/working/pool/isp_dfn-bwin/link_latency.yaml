      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: berlin
      intf_name: eth1
      peer_host: pc_frankfurt
      probe_dst_ip: 10.254.0.6
      symptom_host: pc_berlin
    root_causes:
    - resource:
        kind: link
        name: berlin:eth1--frankfurt:eth1
      fault_type: link_latency
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
