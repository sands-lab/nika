scenario:
  name: isp_dfn-bwin
failure:
  fault_type: bgp_address_family_not_activated
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: routeros
    inject:
      host_name: muenchen
    root_causes:
    - resource:
        kind: node
        node: muenchen
      fault_type: bgp_address_family_not_activated
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: routeros
    inject:
      host_name: nuernberg
    root_causes:
    - resource:
        kind: node
        node: nuernberg
      fault_type: bgp_address_family_not_activated
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: routeros
    inject:
      host_name: stuttgart
    root_causes:
    - resource:
        kind: node
        node: stuttgart
      fault_type: bgp_address_family_not_activated
