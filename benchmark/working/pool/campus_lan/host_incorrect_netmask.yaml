scenario:
  name: campus_lan
failure:
  fault_type: host_incorrect_netmask
  cases:
  - topo_size: s
    inject:
      host_name: pc_1_1_1_1
      netmask_prefix: '8'
    root_causes:
    - resource:
        kind: interface
        node: pc_1_1_1_1
        name: eth0
      fault_type: host_incorrect_netmask
  - topo_size: m
    inject:
      host_name: pc_2_2_2_1
      netmask_prefix: '8'
    root_causes:
    - resource:
        kind: interface
        node: pc_2_2_2_1
        name: eth0
      fault_type: host_incorrect_netmask
  - topo_size: l
    inject:
      host_name: pc_1_4_1_1
      netmask_prefix: '8'
    root_causes:
    - resource:
        kind: interface
        node: pc_1_4_1_1
        name: eth0
      fault_type: host_incorrect_netmask
