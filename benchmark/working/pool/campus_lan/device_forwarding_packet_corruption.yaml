scenario:
  name: campus_lan
failure:
  fault_type: device_forwarding_packet_corruption
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      forwarding_device: server_access_router
      intf_name: eth1
      observer_device: pc_1_1_1_1
      probe_dst_ip: 10.200.0.3
      seed: '42'
    root_causes:
    - resource:
        kind: node
