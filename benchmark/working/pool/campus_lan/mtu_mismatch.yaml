scenario:
  name: campus_lan
failure:
  fault_type: mtu_mismatch
  cases:
  - topo_size: s
    inject:
      host_name: router_core_2
      intf_name: eth0
      mtu: '500'
    root_causes:
    - resource:
        kind: interface
        node: router_core_2
        name: eth0
      fault_type: mtu_mismatch
  - topo_size: m
    inject:
      host_name: router_dist_1_1
      intf_name: eth0
      mtu: '500'
    root_causes:
    - resource:
        kind: interface
        node: router_dist_1_1
        name: eth0
      fault_type: mtu_mismatch
  - topo_size: l
    inject:
      host_name: router_core_2
      intf_name: eth0
      mtu: '500'
    root_causes:
    - resource:
        kind: interface
        node: router_core_2
        name: eth0
      fault_type: mtu_mismatch
