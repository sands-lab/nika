scenario:
  name: campus_lan
failure:
  fault_type: ospf_network_type_mismatch
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: router_dist_1_1
      intf_name: eth0
    root_causes:
    - resource:
        kind: interface
        node: router_dist_1_1
        name: eth0
      fault_type: ospf_network_type_mismatch
  - topo_size: s
    device_profile: routeros
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: server_access_router
      intf_name: eth7
    root_causes:
    - resource:
        kind: interface
        node: server_access_router
        name: eth7
      fault_type: ospf_network_type_mismatch
  - topo_size: m
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: router_dist_2_1
      intf_name: eth0
    root_causes:
    - resource:
        kind: interface
        node: router_dist_2_1
        name: eth0
      fault_type: ospf_network_type_mismatch
  - topo_size: l
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: router_core_1
      intf_name: eth2
    root_causes:
    - resource:
        kind: interface
        node: router_core_1
        name: eth2
      fault_type: ospf_network_type_mismatch
