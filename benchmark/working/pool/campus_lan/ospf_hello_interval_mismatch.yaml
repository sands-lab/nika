scenario:
  name: campus_lan
failure:
  fault_type: ospf_hello_interval_mismatch
  cases:
  - topo_size: s
    inject:
      host_name: server_access_router
      intf_name: eth7
    root_causes:
    - resource:
        kind: node
        node: server_access_router
      fault_type: ospf_hello_interval_mismatch
  - topo_size: s
    device_profile: iosxr
    inject:
      host_name: router_core_2
      intf_name: eth2
    root_causes:
    - resource:
        kind: node
        node: router_core_2
      fault_type: ospf_hello_interval_mismatch
  - topo_size: s
    device_profile: routeros
    inject:
      host_name: router_dist_1_1
      intf_name: eth0
    root_causes:
    - resource:
        kind: node
        node: router_dist_1_1
      fault_type: ospf_hello_interval_mismatch
  - topo_size: m
    inject:
      host_name: router_dist_2_2
      intf_name: eth0
    root_causes:
    - resource:
        kind: node
        node: router_dist_2_2
      fault_type: ospf_hello_interval_mismatch
  - topo_size: l
    inject:
      host_name: router_dist_2_3
      intf_name: eth0
    root_causes:
    - resource:
        kind: node
        node: router_dist_2_3
      fault_type: ospf_hello_interval_mismatch
