scenario:
  name: campus_lan
failure:
  fault_type: host_ip_conflict
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: web_server_0
      host_name_2: dns_server
    root_causes:
    - resource:
        kind: interface
        node: dns_server
        name: eth0
      fault_type: host_ip_conflict
  - topo_size: s
    device_profile: iosxr
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: web_server_0
      host_name_2: load_balancer
    root_causes:
    - resource:
        kind: interface
        node: load_balancer
        name: eth0
      fault_type: host_ip_conflict
  - topo_size: s
    device_profile: routeros
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: web_server_0
      host_name_2: web_server_1
    root_causes:
    - resource:
        kind: interface
        node: web_server_1
        name: eth0
      fault_type: host_ip_conflict
  - topo_size: m
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: pc_1_1_1_1
      host_name_2: pc_1_1_2_1
    root_causes:
    - resource:
        kind: interface
        node: pc_1_1_2_1
        name: eth0
      fault_type: host_ip_conflict
  - topo_size: l
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: pc_1_3_4_1
      host_name_2: pc_1_3_4_2
    root_causes:
    - resource:
        kind: interface
        node: pc_1_3_4_2
        name: eth0
      fault_type: host_ip_conflict
