scenario:
  name: isp_newyork
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: n1
      intf_name: eth0
      limit: 32kb
      peer_host: pc_n2
      probe_dst_ip: 10.254.0.34
      rate: 512kbit
      symptom_host: pc_n1
    root_causes:
    - resource:
        kind: link
        name: n1:eth0--n2:eth0
      fault_type: link_capacity_bottleneck
