scenario:
  name: isp_ta1
failure:
  fault_type: bgp_route_leak
  cases:
  - topo_size: m
    igp: ospf
    bgp_mode: ebgp
    rpki: true
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: n16
      peer: 10.0.0.69
    root_causes:
    - resource:
        kind: node
        node: n16
      fault_type: bgp_route_leak
