scenario:
  name: isp_ta1
failure:
  fault_type: link_latency
  cases:
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: n14
      intf_name: eth1
      peer_host: pc_n23
      probe_dst_ip: 10.254.0.62
      symptom_host: pc_n14
    root_causes:
    - resource:
        kind: link
        name: n14:eth1--n23:eth1
      fault_type: link_latency
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: n14
      intf_name: eth0
      peer_host: pc_n23
      probe_dst_ip: 10.254.0.62
      symptom_host: pc_n14
    root_causes:
    - resource:
        kind: link
        name: n14:eth0--n23:eth0
      fault_type: link_latency
