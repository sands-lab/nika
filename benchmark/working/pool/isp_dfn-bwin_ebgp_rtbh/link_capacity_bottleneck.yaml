scenario:
  name: isp_dfn-bwin_ebgp_rtbh
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: s
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: nuernberg
      intf_name: eth6
      limit: 32kb
      peer_host: pc_leipzig
      probe_dst_ip: 10.254.0.26
      rate: 512kbit
      symptom_host: pc_nuernberg
    root_causes:
    - resource:
        kind: link
        name: leipzig:eth8--nuernberg:eth6
      fault_type: link_capacity_bottleneck
  - topo_size: s
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: nuernberg
      intf_name: eth7
      limit: 32kb
      peer_host: pc_muenchen
      probe_dst_ip: 10.254.0.30
      rate: 512kbit
      symptom_host: pc_nuernberg
    root_causes:
    - resource:
        kind: link
        name: muenchen:eth8--nuernberg:eth7
      fault_type: link_capacity_bottleneck
