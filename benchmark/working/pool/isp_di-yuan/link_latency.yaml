    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: nokia_srlinux
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: n_7
      intf_name: e1-1
      peer_host: pc_n_8
      probe_dst_ip: 10.254.0.38
