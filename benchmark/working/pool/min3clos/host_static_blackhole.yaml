  - traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: leaf1
    root_causes:
    - resource:
        kind: node
        node: leaf1
      fault_type: host_static_blackhole
  - traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: leaf2
    root_causes:
    - resource:
        kind: node
        node: leaf2
      fault_type: host_static_blackhole
  - device_profile: sonic
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: leaf1
    root_causes:
    - resource:
        kind: node
        node: leaf1
      fault_type: host_static_blackhole
  - device_profile: sonic
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: leaf2
    root_causes:
    - resource:
        kind: node
        node: leaf2
      fault_type: host_static_blackhole
