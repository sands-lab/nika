scenario:
  name: min3clos
failure:
  fault_type: link_detach
  cases:
  - inject:
      host_name: client1
      intf_name: eth1
    root_causes:
    - resource:
        kind: interface
        node: client1
        name: eth1
      fault_type: link_detach
  - inject:
      host_name: client2
      intf_name: eth1
    root_causes:
    - resource:
        kind: interface
        node: client2
        name: eth1
      fault_type: link_detach
  - inject:
      host_name: leaf1
      intf_name: e1-1
    root_causes:
    - resource:
        kind: interface
        node: leaf1
        name: e1-1
      fault_type: link_detach
  - inject:
      host_name: leaf2
      intf_name: e1-1
    root_causes:
    - resource:
        kind: interface
        node: leaf2
        name: e1-1
      fault_type: link_detach
