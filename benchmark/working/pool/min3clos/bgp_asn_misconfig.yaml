scenario:
  name: min3clos
failure:
  fault_type: bgp_asn_misconfig
  cases:
  - traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: leaf1
    root_causes:
    - resource:
        kind: node
        node: leaf1
      fault_type: bgp_asn_misconfig
  - traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: leaf2
    root_causes:
    - resource:
        kind: node
        node: leaf2
      fault_type: bgp_asn_misconfig
  - traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: spine
    root_causes:
    - resource:
        kind: node
        node: spine
      fault_type: bgp_asn_misconfig
