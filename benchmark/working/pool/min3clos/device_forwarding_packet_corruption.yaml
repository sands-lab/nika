      pattern: uniform
      load_mbps: 1.0
    inject:
      forwarding_device: leaf2
      intf_name: eth2
      observer_device: client1
      probe_dst_ip: 10.0.0.27
      seed: '42'
    root_causes:
    - resource:
        kind: node
        node: leaf2
      fault_type: device_forwarding_packet_corruption
