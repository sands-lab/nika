scenario:
  name: min3clos
failure:
  fault_type: link_packet_corruption
  cases:
  - inject:
      corruption_percentage: '8'
      host_name: client1
      intf_name: eth1
      observer_device: client1
      probe_dst_ip: 10.0.0.27
    root_causes:
    - resource:
        kind: link
        name: client1:eth1--leaf1:e1-2
      fault_type: link_packet_corruption
  - inject:
      corruption_percentage: '8'
      host_name: client2
      intf_name: eth1
      observer_device: client1
      probe_dst_ip: 10.0.0.27
    root_causes:
    - resource:
        kind: link
        name: client2:eth1--leaf2:e1-2
      fault_type: link_packet_corruption
  - inject:
      corruption_percentage: '8'
      host_name: leaf1
      intf_name: e1-1
      observer_device: client1
      probe_dst_ip: 10.0.0.27
    root_causes:
    - resource:
        kind: link
        name: leaf1:e1-1--spine:e1-1
      fault_type: link_packet_corruption
  - inject:
      corruption_percentage: '8'
      host_name: leaf2
      intf_name: e1-1
      observer_device: client1
      probe_dst_ip: 10.0.0.27
    root_causes:
    - resource:
        kind: link
        name: leaf2:e1-1--spine:e1-2
      fault_type: link_packet_corruption
