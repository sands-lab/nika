scenario:
  name: isp_polska
failure:
  fault_type: bgp_missing_route_advertisement
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: szczecin
      peer_host: pc_szczecin
      prefix: 203.0.113.0/24
      probe_dst_ip: 203.0.113.1
      symptom_host: bialystok
    root_causes:
    - resource:
        kind: node
        node: szczecin
      fault_type: bgp_missing_route_advertisement
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: warsaw
      peer_host: pc_warsaw
      prefix: 203.0.114.0/24
      probe_dst_ip: 203.0.114.1
      symptom_host: bialystok
    root_causes:
    - resource:
        kind: node
        node: warsaw
      fault_type: bgp_missing_route_advertisement
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: wroclaw
      peer_host: pc_wroclaw
      prefix: 203.0.115.0/24
      probe_dst_ip: 203.0.115.1
      symptom_host: bialystok
    root_causes:
    - resource:
        kind: node
        node: wroclaw
      fault_type: bgp_missing_route_advertisement
