    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: bialystok
      peer_host: pc_bialystok
      probe_dst_ip: 198.18.0.1
      symptom_host: bydgoszcz
