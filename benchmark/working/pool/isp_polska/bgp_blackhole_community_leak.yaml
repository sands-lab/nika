scenario:
  name: isp_polska
failure:
  fault_type: bgp_blackhole_community_leak
  cases:
  - topo_size: s
    igp: ospf
    bgp_mode: ebgp
    rpki: true
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: wroclaw
      peer_host: pc_wroclaw
      probe_dst_ip: 198.51.100.1
      symptom_host: poznan
    root_causes:
    - resource:
        kind: node
        node: wroclaw
      fault_type: bgp_blackhole_community_leak
