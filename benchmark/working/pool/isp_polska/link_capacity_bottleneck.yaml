scenario:
  name: isp_polska
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: bialystok
      intf_name: eth0
      limit: 32kb
      peer_host: pc_gdansk
      probe_dst_ip: 10.254.0.10
      rate: 512kbit
      symptom_host: pc_bialystok
    root_causes:
    - resource:
        kind: link
        name: bialystok:eth0--gdansk:eth2
      fault_type: link_capacity_bottleneck
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
