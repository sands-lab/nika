    root_causes:
    - resource:
        kind: link
        name: leaf_2:eth0--web_2:eth0
      fault_type: link_latency
  - topo_size: l
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
