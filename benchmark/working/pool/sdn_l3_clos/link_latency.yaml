scenario:
  name: sdn_l3_clos
failure:
  fault_type: link_latency
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: leaf_2
      intf_name: eth0
      observer_device: client_1_1
      probe_dst_ip: 10.0.2.11
    root_causes:
    - resource:
        kind: link
        name: leaf_2:eth0--web_2:eth0
      fault_type: link_latency
