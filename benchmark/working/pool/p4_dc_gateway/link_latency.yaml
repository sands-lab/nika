scenario:
  name: p4_dc_gateway
failure:
  fault_type: link_latency
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: client_1
      intf_name: eth0
      observer_device: client_1
      probe_dst_ip: 10.0.1.11
    root_causes:
    - resource:
        kind: link
        name: client_1:eth0--gateway_1:eth0
      fault_type: link_latency
  - topo_size: m
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: client_1
      intf_name: eth0
      observer_device: client_1
      probe_dst_ip: 10.0.1.11
    root_causes:
    - resource:
        kind: link
        name: client_1:eth0--gateway_1:eth0
      fault_type: link_latency
  - topo_size: l
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
