    inject:
      host_name: client_4
      intf_name: eth0
    root_causes:
    - resource:
        kind: interface
        node: client_4
        name: eth0
      fault_type: host_missing_ip
  - topo_size: l
    inject:
      host_name: client_3
      intf_name: eth0
    root_causes:
    - resource:
        kind: interface
        node: client_3
        name: eth0
      fault_type: host_missing_ip
