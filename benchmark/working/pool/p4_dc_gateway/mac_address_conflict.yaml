  cases:
  - topo_size: s
    inject:
      host_name: service_1_2
      host_name_2: client_1
    root_causes:
    - resource:
        kind: interface
        node: service_1_2
        name: eth0
      fault_type: mac_address_conflict
  - topo_size: m
    inject:
      host_name: client_3
      host_name_2: service_2_2
    root_causes:
    - resource:
        kind: interface
        node: client_3
        name: eth0
      fault_type: mac_address_conflict
  - topo_size: l
    inject:
      host_name: service_8_1
      host_name_2: client_8
    root_causes:
    - resource:
        kind: interface
        node: service_8_1
        name: eth0
      fault_type: mac_address_conflict
