scenario:
  name: isp_abilene
failure:
  fault_type: ospf_hello_interval_mismatch
  cases:
  - topo_size: s
    igp: ospf
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    traffic:
      pattern: gravity
      load_mbps: 1.0
    inject:
      host_name: atlang
      intf_name: eth1
    root_causes:
    - resource:
        kind: node
        node: atlang
      fault_type: ospf_hello_interval_mismatch
  - topo_size: s
    igp: ospf
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    inject:
      host_name: atlam5
      intf_name: eth0
    root_causes:
    - resource:
        kind: node
        node: atlam5
      fault_type: ospf_hello_interval_mismatch
  - topo_size: s
    igp: ospf
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: iosxr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    inject:
      host_name: atlam5
      intf_name: eth0
    root_causes:
    - resource:
        kind: node
        node: atlam5
      fault_type: ospf_hello_interval_mismatch
  - topo_size: s
    igp: ospf
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: routeros
    traffic:
      pattern: gravity
      load_mbps: 1.0
    inject:
      host_name: atlam5
      intf_name: eth1
    root_causes:
    - resource:
        kind: node
        node: atlam5
      fault_type: ospf_hello_interval_mismatch
