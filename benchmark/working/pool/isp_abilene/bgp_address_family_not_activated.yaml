scenario:
  name: isp_abilene
failure:
  fault_type: bgp_address_family_not_activated
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: routeros
    inject:
      host_name: snvang
    root_causes:
    - resource:
        kind: node
        node: snvang
      fault_type: bgp_address_family_not_activated
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: routeros
    inject:
      host_name: sttlng
    root_causes:
    - resource:
        kind: node
        node: sttlng
      fault_type: bgp_address_family_not_activated
  - topo_size: s
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: routeros
    inject:
      host_name: washng
    root_causes:
    - resource:
        kind: node
        node: washng
      fault_type: bgp_address_family_not_activated
