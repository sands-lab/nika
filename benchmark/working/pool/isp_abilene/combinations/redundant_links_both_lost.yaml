scenario:
  name: isp_abilene
combination:
  name: redundant_links_both_lost
  failures:
  - link_down
  - link_down
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      link_down[1]:
        host_name: iplsng
        intf_name: eth3
        peer_host: pc_kscyng
        probe_dst_ip: 10.254.0.26
        symptom_host: pc_iplsng
      link_down[2]:
        host_name: atlang
        intf_name: eth2
        peer_host: pc_hstnng
        probe_dst_ip: 10.254.0.18
        symptom_host: pc_atlang
    root_causes:
    - resource:
        kind: link
        name: iplsng:eth3--kscyng:eth3
      fault_type: link_down
    - resource:
        kind: link
        name: atlang:eth2--hstnng:eth1
      fault_type: link_down
