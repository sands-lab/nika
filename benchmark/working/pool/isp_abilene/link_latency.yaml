scenario:
  name: isp_abilene
failure:
  fault_type: link_latency
  cases:
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: atlam5
      intf_name: eth1
      peer_host: pc_atlang
      probe_dst_ip: 10.254.0.6
      symptom_host: pc_atlam5
    root_causes:
    - resource:
        kind: link
        name: atlam5:eth1--atlang:eth1
      fault_type: link_latency
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: atlam5
      intf_name: eth0
      peer_host: pc_atlang
      probe_dst_ip: 10.254.0.6
      symptom_host: pc_atlam5
    root_causes:
    - resource:
        kind: link
        name: atlam5:eth0--atlang:eth0
      fault_type: link_latency
  - topo_size: s
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: iosxr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: atlam5
      intf_name: eth0
      peer_host: pc_atlang
      probe_dst_ip: 10.254.0.6
      symptom_host: pc_atlam5
    root_causes:
    - resource:
        kind: link
        name: atlam5:eth0--atlang:eth0
      fault_type: link_latency
