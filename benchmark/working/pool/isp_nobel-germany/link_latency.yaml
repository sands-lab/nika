scenario:
  name: isp_nobel-germany
failure:
  fault_type: link_latency
  cases:
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: berlin
      intf_name: eth1
      peer_host: pc_hamburg
      probe_dst_ip: 10.254.0.26
      symptom_host: pc_berlin
    root_causes:
    - resource:
        kind: link
        name: berlin:eth1--hamburg:eth1
      fault_type: link_latency
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: berlin
      intf_name: eth0
      peer_host: pc_hamburg
      probe_dst_ip: 10.254.0.26
      symptom_host: pc_berlin
    root_causes:
    - resource:
        kind: link
        name: berlin:eth0--hamburg:eth0
      fault_type: link_latency
