scenario:
  name: isp_nobel-germany
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: frankfurt
      intf_name: eth0
      limit: 32kb
      peer_host: pc_hannover
      probe_dst_ip: 10.254.0.30
      rate: 512kbit
      symptom_host: pc_frankfurt
    root_causes:
    - resource:
        kind: link
        name: frankfurt:eth0--hannover:eth0
      fault_type: link_capacity_bottleneck
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: frankfurt
      intf_name: eth2
      limit: 32kb
      peer_host: pc_leipzig
      probe_dst_ip: 10.254.0.42
      rate: 512kbit
      symptom_host: pc_frankfurt
    root_causes:
    - resource:
        kind: link
        name: frankfurt:eth2--leipzig:eth0
      fault_type: link_capacity_bottleneck
