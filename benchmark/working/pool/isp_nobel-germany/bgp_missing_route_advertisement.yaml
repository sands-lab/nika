scenario:
  name: isp_nobel-germany
failure:
  fault_type: bgp_missing_route_advertisement
  cases:
  - topo_size: m
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: nuernberg
      peer_host: pc_nuernberg
      prefix: 203.0.113.0/24
      probe_dst_ip: 203.0.113.1
      symptom_host: berlin
    root_causes:
    - resource:
        kind: node
        node: nuernberg
      fault_type: bgp_missing_route_advertisement
  - topo_size: m
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: stuttgart
      peer_host: pc_stuttgart
      prefix: 203.0.114.0/24
      probe_dst_ip: 203.0.114.1
      symptom_host: berlin
    root_causes:
    - resource:
        kind: node
        node: stuttgart
      fault_type: bgp_missing_route_advertisement
  - topo_size: m
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: ulm
      peer_host: pc_ulm
      prefix: 203.0.115.0/24
      probe_dst_ip: 203.0.115.1
      symptom_host: berlin
    root_causes:
    - resource:
        kind: node
        node: ulm
      fault_type: bgp_missing_route_advertisement
