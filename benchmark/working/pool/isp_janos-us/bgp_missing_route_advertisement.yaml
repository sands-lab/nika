scenario:
  name: isp_janos-us
failure:
  fault_type: bgp_missing_route_advertisement
  cases:
  - topo_size: m
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: stlouis
      peer_host: pc_stlouis
      prefix: 203.0.113.0/24
      probe_dst_ip: 203.0.113.1
      symptom_host: albany
    root_causes:
    - resource:
        kind: node
        node: stlouis
      fault_type: bgp_missing_route_advertisement
  - topo_size: m
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: tulsa
      peer_host: pc_tulsa
      prefix: 203.0.114.0/24
      probe_dst_ip: 203.0.114.1
      symptom_host: albany
    root_causes:
    - resource:
        kind: node
        node: tulsa
      fault_type: bgp_missing_route_advertisement
  - topo_size: m
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: kathara
    device_profile: frr
    inject:
      host_name: washingtondc
      peer_host: pc_washingtondc
      prefix: 203.0.115.0/24
      probe_dst_ip: 203.0.115.1
      symptom_host: albany
    root_causes:
    - resource:
        kind: node
        node: washingtondc
      fault_type: bgp_missing_route_advertisement
