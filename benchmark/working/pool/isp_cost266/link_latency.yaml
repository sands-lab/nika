scenario:
  name: isp_cost266
failure:
  fault_type: link_latency
  cases:
  - topo_size: l
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: amsterdam
      intf_name: eth1
      peer_host: pc_brussels
      probe_dst_ip: 10.254.0.30
      symptom_host: pc_amsterdam
    root_causes:
    - resource:
        kind: link
        name: amsterdam:eth1--brussels:eth1
      fault_type: link_latency
  - topo_size: l
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: amsterdam
      intf_name: eth0
      peer_host: pc_brussels
      probe_dst_ip: 10.254.0.30
      symptom_host: pc_amsterdam
    root_causes:
    - resource:
        kind: link
        name: amsterdam:eth0--brussels:eth0
      fault_type: link_latency
