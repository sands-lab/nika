scenario:
  name: isp_cost266
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: l
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    inject:
      burst: 16kb
      host_name: birmingham
      intf_name: eth1
      limit: 32kb
      peer_host: pc_glasgow
      probe_dst_ip: 10.254.0.54
      rate: 512kbit
      symptom_host: pc_birmingham
    root_causes:
