scenario:
  name: dc_clos
combination:
  name: policy_gap_exposed_by_uplink_loss
  failures:
  - bgp_session_policy_missing
  - link_down
  cases:
  - topo_size: s
    device_profile: iosxr
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    schedule:
      agent_start: 30s
      events:
      - problem: bgp_session_policy_missing
        inject:
          host_name: spine_1
          peer: 172.16.0.0
        at: 0s
      - problem: link_down
        inject:
          host_name: leaf_1
          intf_name: eth4
          observer_device: client_1_1
          probe_dst_ip: 10.0.2.11
        at: 30s
    root_causes:
    - resource:
        kind: interface
        node: spine_1
        name: eth0
      fault_type: bgp_session_policy_missing
    - resource:
        kind: link
        name: leaf_1:eth4--spine_2:eth0
      fault_type: link_down
  - topo_size: s
    device_profile: routeros
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    schedule:
      agent_start: 30s
      events:
      - problem: bgp_session_policy_missing
        inject:
          host_name: leaf_1
          peer: 172.16.0.1
        at: 0s
      - problem: link_down
        inject:
          host_name: leaf_1
          intf_name: eth4
          observer_device: client_1_1
          probe_dst_ip: 10.0.2.11
        at: 30s
    root_causes:
    - resource:
        kind: interface
        node: leaf_1
        name: eth3
      fault_type: bgp_session_policy_missing
    - resource:
        kind: link
        name: leaf_1:eth4--spine_2:eth0
      fault_type: link_down
