scenario:
  name: dc_clos
combination:
  name: pmtud_black_hole
  failures:
  - mtu_mismatch
  - icmp_frag_needed_filter_misconfiguration
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      mtu_mismatch:
        host_name: leaf_1
        intf_name: eth3
        mtu: '1400'
      icmp_frag_needed_filter_misconfiguration:
        host_name: leaf_1
    root_causes:
    - resource:
        kind: interface
        node: leaf_1
        name: eth3
      fault_type: mtu_mismatch
    - resource:
        kind: node
        node: leaf_1
      fault_type: icmp_frag_needed_filter_misconfiguration
  - topo_size: s
    device_profile: routeros
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      mtu_mismatch:
        host_name: leaf_1
        intf_name: eth3
        mtu: '1400'
      icmp_frag_needed_filter_misconfiguration:
        host_name: leaf_1
    root_causes:
    - resource:
        kind: interface
        node: leaf_1
        name: eth3
      fault_type: mtu_mismatch
    - resource:
        kind: node
        node: leaf_1
      fault_type: icmp_frag_needed_filter_misconfiguration
