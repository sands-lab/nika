    - resource:
        kind: interface
        node: leaf_router_0_1
        name: eth4
      fault_type: mtu_mismatch
  - topo_size: l
    inject:
      host_name: leaf_router_0_1
      intf_name: eth8
      mtu: '500'
    root_causes:
    - resource:
        kind: interface
        node: leaf_router_0_1
        name: eth8
      fault_type: mtu_mismatch
