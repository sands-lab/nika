scenario:
  name: isp_france
failure:
  fault_type: mtu_mismatch
  cases:
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    inject:
      host_name: n01
      intf_name: eth1
      mtu: '500'
    root_causes:
    - resource:
        kind: interface
        node: n01
        name: eth1
      fault_type: mtu_mismatch
