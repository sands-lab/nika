scenario:
  name: isp_france
failure:
  fault_type: link_latency
  cases:
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: containerlab
    device_profile: sonic
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: n01
      intf_name: eth1
      peer_host: pc_n02
      probe_dst_ip: 10.254.0.6
      symptom_host: pc_n01
    root_causes:
    - resource:
        kind: link
        name: n01:eth1--n02:eth1
      fault_type: link_latency
  - topo_size: m
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: n01
      intf_name: eth0
      peer_host: pc_n02
      probe_dst_ip: 10.254.0.6
      symptom_host: pc_n01
    root_causes:
    - resource:
        kind: link
        name: n01:eth0--n02:eth0
      fault_type: link_latency
