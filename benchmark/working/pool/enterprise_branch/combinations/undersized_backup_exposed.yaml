scenario:
  name: enterprise_branch
combination:
  name: undersized_backup_exposed
  failures:
  - link_capacity_bottleneck
  - link_down
  cases:
  - topo_size: s
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    schedule:
      agent_start: 210s
      events:
      - problem: link_capacity_bottleneck
        inject:
          burst: 16kb
          host_name: isp2_core
          intf_name: eth2
          limit: 32kb
          rate: 512kbit
        at: 0s
      - problem: link_down
        inject:
          host_name: isp1_core
          intf_name: eth2
        at: 30s
    root_causes:
    - resource:
        kind: link
        name: br1_edge:eth3--isp2_core:eth2
      fault_type: link_capacity_bottleneck
    - resource:
        kind: link
        name: br1_edge:eth2--isp1_core:eth2
      fault_type: link_down
  - topo_size: s
    device_profile: iosxr
    traffic:
      pattern: uniform
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    schedule:
      agent_start: 210s
      events:
      - problem: link_capacity_bottleneck
        inject:
          burst: 16kb
          host_name: isp2_core
          intf_name: eth2
          limit: 32kb
          rate: 512kbit
        at: 0s
      - problem: link_down
        inject:
          host_name: isp1_core
          intf_name: eth2
        at: 30s
    root_causes:
    - resource:
        kind: link
        name: br1_edge:eth3--isp2_core:eth2
      fault_type: link_capacity_bottleneck
    - resource:
        kind: link
        name: br1_edge:eth2--isp1_core:eth2
      fault_type: link_down
