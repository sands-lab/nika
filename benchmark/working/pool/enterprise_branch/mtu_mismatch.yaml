scenario:
  name: enterprise_branch
failure:
  fault_type: mtu_mismatch
  cases:
  - topo_size: s
    inject:
      host_name: br1_edge
      intf_name: eth2
      mtu: '500'
    root_causes:
    - resource:
        kind: interface
        node: br1_edge
        name: eth2
      fault_type: mtu_mismatch
  - topo_size: m
    inject:
      host_name: br1_edge
      intf_name: eth2
      mtu: '500'
    root_causes:
    - resource:
        kind: interface
        node: br1_edge
        name: eth2
      fault_type: mtu_mismatch
  - topo_size: l
    inject:
      host_name: br1_edge
      intf_name: eth2
      mtu: '500'
    root_causes:
    - resource:
        kind: interface
        node: br1_edge
        name: eth2
      fault_type: mtu_mismatch
