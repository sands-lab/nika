scenario:
  name: enterprise_branch
failure:
  fault_type: bgp_session_policy_missing
  cases:
  - topo_size: s
    device_profile: routeros
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: br1_edge
    root_causes:
    - resource:
        kind: node
        node: br1_edge
      fault_type: bgp_session_policy_missing
  - topo_size: s
    device_profile: routeros
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: br2_edge
    root_causes:
    - resource:
        kind: node
        node: br2_edge
      fault_type: bgp_session_policy_missing
  - topo_size: s
    device_profile: routeros
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: dc2_edge
    root_causes:
    - resource:
        kind: node
        node: dc2_edge
      fault_type: bgp_session_policy_missing
  - topo_size: s
    device_profile: routeros
    traffic:
      pattern: uniform
      load_mbps: 1.0
    inject:
      host_name: hq_edge
    root_causes:
