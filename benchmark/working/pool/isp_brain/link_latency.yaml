scenario:
  name: isp_brain
failure:
  fault_type: link_latency
  cases:
  - topo_size: l
    igp: isis
    bgp_mode: none
    rpki: false
    backend: kathara
    device_profile: frr
    traffic:
      pattern: gravity
      load_mbps: 1.0
    telemetry:
    - netflow
    - pingmesh
    - prometheus
    - syslog
    inject:
      host_name: adh
      intf_name: eth0
      peer_host: pc_adh10
      probe_dst_ip: 10.254.0.6
      symptom_host: pc_adh
    root_causes:
    - resource:
        kind: link
        name: adh10:eth0--adh:eth0
      fault_type: link_latency
