scenario:
  name: isp_abilene_ebgp_rpki
failure:
  fault_type: link_capacity_bottleneck
  cases:
  - topo_size: s
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: atlang
      intf_name: eth1
      limit: 32kb
      peer_host: pc_hstnng
      probe_dst_ip: 10.254.0.18
      rate: 512kbit
      symptom_host: pc_atlang
    root_causes:
    - resource:
        kind: link
        name: atlang:eth1--hstnng:eth0
      fault_type: link_capacity_bottleneck
  - topo_size: s
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: nycmng
      intf_name: eth0
      limit: 32kb
      peer_host: pc_chinng
      probe_dst_ip: 10.254.0.10
      rate: 512kbit
      symptom_host: pc_nycmng
    root_causes:
    - resource:
        kind: link
        name: chinng:eth1--nycmng:eth0
      fault_type: link_capacity_bottleneck
  - topo_size: s
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: snvang
      intf_name: eth1
      limit: 32kb
      peer_host: pc_losang
      probe_dst_ip: 10.254.0.30
      rate: 512kbit
      symptom_host: pc_snvang
    root_causes:
    - resource:
        kind: link
        name: losang:eth1--snvang:eth1
      fault_type: link_capacity_bottleneck
  - topo_size: s
    backend: kathara
    device_profile: frr
    inject:
      burst: 16kb
      host_name: sttlng
      intf_name: eth1
      limit: 32kb
      peer_host: pc_snvang
      probe_dst_ip: 10.254.0.38
      rate: 512kbit
      symptom_host: pc_sttlng
    root_causes:
    - resource:
        kind: link
        name: snvang:eth2--sttlng:eth1
      fault_type: link_capacity_bottleneck
