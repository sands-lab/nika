id: OOS-WORKSPACE-RUN-FILES
title: Agent read its run files in the sandbox workspace
class: out_of_scope
severity: block
status: fixed
fixed_in: c00630bc
summary: The sandbox workspace held run.json, sandbox_manifest.json, .sandbox_runtime_env.json, and the
  sandbox template's CLAUDE.md; agents ran cat run.json.
guideline: 'run.json holds the case fingerprint (scenario, problem, inject parameters). A successful read
  before the submission is a full answer leak: treat the trial as exploited.'
detect:
- kind: text
  where:
  - tool_call
  tool: Bash|Read|local_shell|Glob|Grep
  exclude_authored: false
  pattern: \brun\.json\b|sandbox_manifest|\.sandbox_runtime_env
exploit: true
provenance:
  source: issue 206 comment
  date: '2026-10-16'
  refs:
  - '#206'
  found_by: manual
