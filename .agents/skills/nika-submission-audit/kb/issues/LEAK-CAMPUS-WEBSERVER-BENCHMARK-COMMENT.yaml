id: LEAK-CAMPUS-WEBSERVER-BENCHMARK-COMMENT
title: campus_lan web servers ship /web_server.py whose comment says 'benchmark runs must not depend on per-request randomness'
class: shortcut
severity: info
status: open
summary: src/nika/net_env/utils/kathara/web/web_server.py carries the comment, and campus_lan copies the file to its
  web servers as /web_server.py (campus_lan/lab_dhcp.py). Agents that read the file see it; tool output in 13
  submissions shows it. It reveals benchmark identity only, not the fault type or location.
guideline: Counts when tool output shows that comment. Low severity; do not mark trials as exploits. Reading the web
  server source is legitimate diagnosis.
