id: GRADE-INCONSISTENT-SUBMITTED-METRICS
title: Submitted F1 does not follow from submitted precision and recall
class: grading_error
role: known
severity: block
status: open
summary: A trial reports an F1 that differs from 2PR/(P+R) of its own precision and recall, which scoring
  never produces; the result file was edited.
guideline: Compare with the re-graded value. Any hit means the per-trial result was not produced by NIKA
  scoring.
