  found_by: agentic
evidence:
- 'p4_dc_gateway__tcp_syn_flood__hc408eaaa9f62__t02 (20261010_claude_code_qwen3_8_27b_fp8) step 448: client_1''s
  startup is just network configuration — no generator. So the HTTP traffic generator is being launched externally
  (by the scenario harness), temporarily, and then terminated.'
- 'dc_clos__receiver_resource_c__ha2be5b357067__t01 (20261007_claude_code_qwen3_6_35b_a3b_fp8) nika.jsonl:13: Fault
  artifact absent: phase=before_cleanup fault=receiver_resource_contention'
