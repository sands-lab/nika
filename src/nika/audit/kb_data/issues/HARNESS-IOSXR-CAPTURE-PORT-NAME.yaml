id: HARNESS-IOSXR-CAPTURE-PORT-NAME
title: Capture rejects a live native IOS XR data port
summary: The actual IOS XR spine lists its native data port Up/Up, but capture rejects both long and abbreviated native names. Linux eth0 on the same node captures packets.
guideline: Verify the actual node declares IOS XR capability and that its live native inventory lists the requested data port. Do not use a native name on an FRR leaf in a mixed variant. Compare the corresponding Linux interface, and preserve missing-port and other-capability negative controls.
