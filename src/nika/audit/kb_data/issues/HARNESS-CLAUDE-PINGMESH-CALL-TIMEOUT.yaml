id: HARNESS-CLAUDE-PINGMESH-CALL-TIMEOUT
title: Claude Code discards slow run_pingmesh_snapshot calls with 'The operation timed out.'
class: harness_defect
severity: warn
status: fixed
summary: >-
  Under the Claude Code harness, run_pingmesh_snapshot calls fail as a whole with the bare client error
  'The operation timed out.', mostly about 60 s after the call (a second cluster near 120 s). Pingmesh
  calls of the same size finish in 90-200 s under codex. src/agent/cli/claude/config.py sets only the
  MCP connect timeouts (MCP_TIMEOUT, startup wait), not the per-call tool timeout, so Claude Code's default
  drops the whole snapshot. Seen in 11 claude_code submissions.
guideline: >-
  The pingmesh result is lost to the client timeout, not to the network; an agent that reads it as an
  unreachable lab was misled. Only run_pingmesh_snapshot is confirmed: the same message on exec_shell
  often follows agent-chosen long commands and is not this issue.
scope: {}
detect:
- kind: text
  where:
  - tool_result
  tool: run_pingmesh_snapshot
  exclude_authored: false
  pattern: The operation timed out\.
exploit: false
provenance:
  source: submission-audit runs 2026-10-28, verified (REF-CLAUDE-MCP-CALL-TIMEOUT)
  date: '2026-10-28'
  refs:
  - campus_lan__dhcp_spoofed_dns__h4ee0ce80b947__t02:30
  found_by: agentic
evidence:
- '20261008_claude_code_otel_2_0_llm_31b_it campus_lan__dhcp_spoofed_dns__h4ee0ce80b947__t02 step 30:
  {"count": 3, "high_latency_ms": 100, "max_pairs": 100} -> "The operation timed out."'
- >-
  2026-11-11 local repair 82c0686e sets MCP_TOOL_TIMEOUT=300000 and disables
  automatic tool backgrounding while retaining connection/startup waits.
  The installed Claude Code 2.1.314 CLI, using an isolated deterministic
  Anthropic/MCP protocol fixture, returned a tool timeout after about 120 s
  with the original environment; the same 125 s call completed with the repair.
  Both CLI processes exited zero, so the actual tool_result is the acceptance
  criterion. This is a client protocol control, not a real-model PingMesh run,
  and does not close MCP connection or post-error transport issues.
  Receipts: /workspace/nika-retained-records/20261111-prerelease-finalization/evidence/prerelease-residual/claude-before/receipt.json and
  /workspace/nika-retained-records/20261111-prerelease-finalization/evidence/prerelease-residual/claude-after/receipt.json.
fixed_in: bdd39743
