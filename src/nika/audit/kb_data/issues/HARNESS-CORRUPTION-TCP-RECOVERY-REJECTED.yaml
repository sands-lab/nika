evidence:
- Original live reference step6 returns ok=24 failed=0 local_errors=0. hq_srv TcpInCsumErrors grows60->78 and the scoped capture reports16 invalid probe packets. The disjoint internet_web path grows50->328 with176 invalid probe packets. Only the first timeout predicate fails.
- 'ADM native repair66a666ba adds sender retransmission growth and retains complete probes, receiver checksum/capture attribution and independent paths. The exact native verification receipt is recorded below; AUD own-case restore is pending.'
- 'Exact-case native full matrix passes at clean66a666ba; all stages, both sender retransmission checks, receiver deltas and filtered packet attribution pass. Cleanup confirms zero sessions, containers and networks. AUD own-case snapshot restore remains pending.'
