id: HARNESS-CORRUPTION-TCP-RECOVERY-REJECTED
title: Reference diagnosis rejects TCP recovery during a realized fault
class: harness_defect
severity: warn
status: fixed
summary: The device_forwarding_packet_corruption reference required some of 24 TCP requests to time out. A fresh snapshot completed all 24 requests while receiver checksum counters grew and filtered probe captures contained invalid TCP checksums. TCP recovered the affected data, so the timeout predicate rejected the realized fault.
guideline: A successful request is not proof that no packets were corrupted. Require the authored reference call, positive receiver checksum deltas and invalid-checksum packets attributed to its fresh probe tuples on both disjoint paths. Confirm TCP retransmissions through sender counter growth. Keep complete probe counts, zero local-bind errors, receiver deltas, filtered captures, independent paths and healthy/recovered controls; an all-success response alone does not establish this issue.
scope:
  fault_types:
  - device_forwarding_packet_corruption
  agent_types:
  - oracle
  healthy: false
