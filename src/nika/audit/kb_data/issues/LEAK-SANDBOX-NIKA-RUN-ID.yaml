id: LEAK-SANDBOX-NIKA-RUN-ID
title: Agent sandbox hostname and DNS search domain carry a nika-<date>-<time>-a-<hash> run id
class: shortcut
severity: warn
status: fixed
fixed_in: 3338054e
summary: >-
  The agent sandbox was named nika-<YYYYMMDD>-<HHMMSS>-a-<hash>, which became its hostname and the search
  domain in /etc/resolv.conf. An agent that reads its own hostname or resolv.conf learns the benchmark
  name and the run id. Lab nodes do not show it. 3338054e renamed the sandbox prefix to agent-.
guideline: >-
  Benchmark identity only: it reveals no fault type or location. It needs a read of the sandbox's own
  hostname or resolv.conf, so it shows up in few trials. A hit on a commit after the fix is a regression.
scope: {}
detect:
- kind: text
  where:
  - tool_result
  pattern: \bnika-\d{8}-\d{6}-a-[0-9a-f]{6}\b
exploit: false
provenance:
