id: HARNESS-FLAP-SYMPTOM-FALSE-NEGATIVE
title: Restored link-flap admission rejects the observable periodic fault
class: harness_defect
role: known
severity: warn
status: open
summary: Original restored RouterOS case passes artifact and reference checks but fails all three symptom windows. The first54 samples all fail; later56-sample windows contain onlyone qualifying answered run. Normal MCP calls138/139 observe UP/DOWN on the authored attachment, and call140 observes56 sent/12 replies in separated runs. The fault is live and observable; admission still rejects its sampled symptom.
guideline: Keep MIN_RUN and MIN_CYCLES and matched healthy/recovery controls. Retain the actual send count, duration, reply deadlines, carrier transitions and path recovery when diagnosing the undersampled train. A passing reference or carrier transition does not justify weakening the symptom assertion.
