id: LEAK-CONTROLLER-HELPER-FILES
title: Controller helper files keep the injected request
class: shortcut
severity: info
status: fixed
summary: Helpers left the last P4 or ONOS request body in /tmp.
scope: {}
detect:
- kind: text
  where:
  - tool_result
  pattern: /tmp/p4_fabric/last\.json|/tmp/onos_body\.json
exploit: false
provenance:
  source: red-team qwen38 run
  date: '2026-10-20'
  refs:
  - red-team/qwen38/report.md
  found_by: agentic
guideline: The fabric manager keeps intent.json, observed.json, and last.json under /tmp/p4_fabric; diffing
  intent against runtime is legitimate diagnosis. A leak only if last.json records the injected request
  itself; unconfirmed, needs a live check.
fixed_in: 0f3a80fb
evidence:
- >-
  2026-11-11 recheck: 7edc92aa still wrote every ONOS request body to /tmp/onos_body.json on
  fabric_mgr, so southbound_port_mismatch left the injected openflowPorts there. 0f3a80fb streams
  the body to curl on stdin; a live sdn_l3_clos injection left no file.
