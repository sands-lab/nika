id: HARNESS-PROCESS-CHECK-TIMEOUT-AS-ZERO
title: Artifact verification converts process-query timeouts into zero processes
class: harness_defect
severity: warn
status: fixed
fixed_in: 22fd3aa28e50cda89269511ae69868bd8e37048b
fixed_in_equivalent: a310a899777c7de1398b95237e88f322c92614f4
summary: The fault artifact verifier parses a process count from an unchecked ten-second runtime observation. A timeout is nonnumeric and becomes zero, rejecting a live snapshot even though the same process query returns100 with a longer budget.
guideline: Preserve the exact runtime command, timeout text and timing, then repeat the same read with an adequate bounded budget. Compare actual processes before treating a failed observation as fault absence. Check command status before parsing the count, and propagate malformed or unavailable observations. Keep the traffic profile and realization predicates unchanged.
