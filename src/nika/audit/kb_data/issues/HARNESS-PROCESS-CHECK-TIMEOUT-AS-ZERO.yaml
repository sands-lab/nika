evidence:
- The exact same NIKA runtime process query returns a TIMEOUT at budget10seconds after16.378seconds, then100 at budget60 after10.219seconds. After attach, repeat reads return100 after14.974seconds and10.122seconds. The original verifier reports flows_running0 with a fresh live collector; normal AUD case restore and lab-image injection both fail the artifact check.
- All diagnostic trial copies close. ADM ab397909 uses existing checked_exec with a60secondbudget and preserves invalid or failed observations instead of reporting zero.21focused regressions and Ruff pass; matching4vCPU/8GiB native verification is pending. This evidence is administrative; no original agent-tool output is claimed.
- Exact native source2d705acc includes checked observation ab397909 and the declared large-fabric CPU floor. At8CPU/13GiB, the selected task passes full admission and the reference Oracle. Its guest closes with empty sessions/containers and unchanged base. Originalc42 restored admission remains blocked until integration.
