id: LEAK-DHCP-LEASES-BACKUP
title: dhcpd.leases~ keeps leases of a removed subnet
class: shortcut
role: known
severity: warn
status: fixed
summary: After dhcp_missing_subnet, dhcpd.leases~ still holds leases of the subnet that is gone from the
  live config.
guideline: A 0-byte leases~ exists on healthy labs. A leak only when it holds leases for a subnet missing
  from dhcpd.conf.
scope:
  fault_types:
  - dhcp_missing_subnet
detect:
- kind: text
  exclude_authored: false
  pattern: dhcpd\.leases~
provenance:
  source: red-team trace audit (qwen38, full, postfix reports)
  date: '2026-10-20'
  refs:
  - red-team/postfix/report.md
  - tests/nika/problems/test_dhcp_address_renewal.py::test_missing_subnet_removes_stale_lease_backup_and_recovers
  - https://github.com/sands-lab/nika/pull/330
  found_by: live_audit
fixed_in: 0f3a80fb
evidence:
- >-
  2026-11-11 recheck: the dhcp_spoofed_* faults restarted isc-dhcp-server through a path that
  left dhcpd.leases~ after sealing had removed it. 0f3a80fb restarts dhcpd through one helper that
  removes the backup; live campus_lan checks found no backup after all three faults and recovery.
