id: SIG-INT-TELEMETRY-OUTPUT-OVER-LIMIT
title: INT telemetry output cut by the tool output limit
class: signal_invisible
role: known
severity: info
status: open
summary: int_query_telemetry outputs exceed the tool output limit in a large share of calls, so later
  hops or records are cut.
guideline: A skeptic found no lost signal in the sampled trial; count it only when the cut part held the
  anomaly.
detect:
- kind: text
  tool: int_query_telemetry
  exclude_authored: false
  pattern: output of your last command was too long
