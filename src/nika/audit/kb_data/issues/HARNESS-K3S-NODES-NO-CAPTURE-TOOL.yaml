id: HARNESS-K3S-NODES-NO-CAPTURE-TOOL
title: packet_capture_start fails on the k3s controller and worker nodes of llmd_lab and k8s_lab (no dumpcap or tcpdump)
class: harness_defect
severity: warn
status: open
summary: The k3s node image has neither dumpcap nor tcpdump, so packet_capture_start raises "Node '<node>' has
  neither dumpcap nor tcpdump installed for packet capture" (src/nika/service/packet_capture/capture_backend.py)
  on controller and worker nodes. In release 0.2.0 this hit 45 llmd_lab calls and 25 k8s_lab calls, while
  captures on llmd client and web succeeded. Several k8s faults live on these nodes, and the agent cannot install
  a capture tool there.
guideline: Counts on that error from packet_capture_start on a k8s_lab or llmd_lab controller or worker. Does not
  count for the tshark-missing error of SIG-TSHARK-MISSING (OVS and BMv2 nodes, fixed) or for captures that
  start and return 0 packets.
scope:
  scenarios:
  - llmd_lab
  - k8s_lab
detect:
- kind: text
  where:
  - tool_result
  tool: packet_capture_start
  pattern: has neither dumpcap nor tcpdump installed
provenance:
  source: submission-audit runs 2026-10-28, verified (REF-K3S-NODES-NO-CAPTURE-TOOL)
  date: '2026-10-28'
  refs:
  - llmd_lab__sender_resource_co__h1bbe56e6f9c3__t01:142
  found_by: agentic
evidence:
- 'llmd_lab__sender_resource_co__h1bbe56e6f9c3__t01 (20261007_claude_code_qwen3_6_35b_a3b_fp8) step 142: Error
  executing tool packet_capture_start: Node ''controller'' has neither dumpcap nor tcpdump installed for packet
  capture'
