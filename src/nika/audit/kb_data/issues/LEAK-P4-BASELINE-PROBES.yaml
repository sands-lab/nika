- Pending-LB call32 returns a persistent Python HTTP client naming /tmp/probe-lb-flows.status, and call30 returns its345-byte file. The healthy control has neither. Other LB case scope must be confirmed against its retained calls.
- Candidate50f216f9 bounds silent-loss receivers to each counted round and returns packet identities in memory. Target/control thresholds, pacing and counts are unchanged. The exact large native lifecycle is verified below.
- 'Silent-loss instance is fixed by50f216f9 and natively verified at immutableee4c0009 on the exactlargeenvironment. The actual baseline API receives4096datagrams; a measured healthy negative and recovery each show0%on both paths, with repeated target-onlyfaultloss1.276%and1.658%. All30normalgateway process/file/listener checks reject fixture remnants. Owned resources are absent, guest closed/base unchanged. LB proof follows below.'
- Native LB source 81098949 includes ordinary VIP sessions from18601cdf and preserves nominal aggregate cadence. Both exact large admissions pass in an 8-CPU/13-GiB cold guest. Two measured healthy controls update the actual pool with16original sessions progressing and zero of eight trial sessions broken. Twelve native runtime process and file reads across the baseline and measured rounds return no retained fixture. The guest closes with empty sessions and containers, and the base remains unchanged. Final combined-source snapshot reruns remain required.
