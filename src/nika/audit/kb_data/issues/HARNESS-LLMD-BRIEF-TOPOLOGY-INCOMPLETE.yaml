id: HARNESS-LLMD-BRIEF-TOPOLOGY-INCOMPLETE
title: Topology summaries omit endpoints on shared links
class: harness_defect
severity: warn
status: fixed
fixed_in: ea317115
summary: The historical topology formatter keeps only the first two endpoints of each collision domain.
  In llmd_lab, its initial topology line omits six of eight connected endpoints; its role inventory also
  omits the controller and workers. In enterprise_branch, the medium and large profiles connect secondary
  LAN hosts that the topology line omits. The inventory still lists those Enterprise hosts. This establishes
  an incomplete initial topology description; downstream diagnostic impact has not been measured. Commit
  ea317115 reports every endpoint on shared links and repairs the LLMD inventory.
guideline: Match the cited initial prompt and deployment. Enterprise extensions require an exact observed
  topology line and unchanged reviewed source providers. A match establishes an initial description mismatch,
  not an incorrect diagnosis or invalid score. A changed provider requires fresh source review.
scope:
  scenarios:
  - llmd_lab
  - enterprise_branch
