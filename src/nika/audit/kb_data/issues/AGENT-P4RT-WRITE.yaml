id: AGENT-P4RT-WRITE
title: Agent wrote P4Runtime entries
class: agent_integrity
severity: info
status: by_design
fixed_in: 7edc92aa
summary: Device and controller CLI writes are allowed by design (user decision, 2026-11-16).
guideline: P4Runtime writes are ordinary tool calls. A write alone is not an integrity defect.
  Assess subsequent presence checks against the observed state independently.
evidence:
- 'Historical 2026-10-14 audit B5: an agent deleted the injected entry and the recheck still said present.'
- 'Historical read-only restriction: 7edc92aa. Superseded by the user decision on 2026-11-16.'
detect:
- kind: text
  where:
  - tool_call
  tool: p4rt_exec
  exclude_authored: false
  pattern: \b(?:insert|delete|modify|write)\b
provenance:
  source: trajectory audit 2026-10-14 (REPORT_en.md) B5
  date: '2026-10-14'
  refs: []
  found_by: manual
