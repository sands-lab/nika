id: FNR-K8S-CLIENT-NETMASK-INERT
title: k8s_lab host_incorrect_netmask on client/eth0 is inert
class: fault_not_realized
severity: warn
status: fixed
fixed_in: 6c8ab721
summary: >-
  Case h5b4decc91a36 widens the k8s_lab client from 3.0.0.2/24 to /8. The only other 3.x address is as2r1
  3.0.0.1, so /8 versus /24 changes no path: client traffic to every node still works. All 18 trials of
  the case in the six submissions that ran it scored rca_f1=0, several after seeing 3.0.0.2/8 and correctly
  not flagging it. The release case was replaced by a solvable one on worker3 (hd97786be63fb) in 6c8ab721.
guideline: >-
  Applies only to the client/eth0 case (the agent sees 3.0.0.2/8 on client). The worker3 case is a different,
  realised fault and is not this issue. Do not count a miss on the client case as an agent error.
scope:
  fault_types:
  - host_incorrect_netmask
  scenarios:
  - k8s_lab
detect:
- kind: text
  where:
  - tool_result
  pattern: 3\.0\.0\.2/8\b
exploit: false
