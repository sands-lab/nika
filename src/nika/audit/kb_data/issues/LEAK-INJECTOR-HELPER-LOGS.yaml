id: LEAK-INJECTOR-HELPER-LOGS
title: Load and attack helpers leave named logs
class: shortcut
role: known
severity: warn
status: fixed
summary: 'Traffic and attack helpers leave files whose names point at the fault: /var/tmp/http-load-N.log,
  http-hold.py, iperf3_s_5201.log, burst-server-*.log, /tmp/iperf_c_*.sh.'
guideline: The running process is the fault mechanism; a leftover file on one device, absent from its
  peers, is the leak. Files the agent created itself (its own iperf runs) are excluded; scenario workload
  servers (iperf3_s_* for business traffic since 7edc92aa) are design, not leaks.
detect:
- kind: text
  exclude_authored: true
  pattern: http-load-\d+\.log|http-hold\.py|iperf3_s_\d+\.log|burst-server-\S*\.log|iperf_c_\S+\.sh
provenance:
  source: red-team trace audit (qwen38, full, postfix reports)
  date: '2026-10-20'
  refs:
  - red-team/qwen38/report.md
  found_by: live_audit
evidence:
- >-
  2026-11-11 throughput-probe subcase: the shared one-shot iperf3 helper overwrote
  /tmp/iperf3_s_<port>.log and could measure an existing listener instead of its own.
  Repair fd4c829c redirects output to /dev/null, checks listener ownership, and
  returns unavailable on an occupied port. Real simple_bgp controls preserve an
  existing file and listener, create no fresh log, and clean up a failed client.
  See tests/nika/net_env/test_throughput_probe_live.py and
  the repair integration https://github.com/sands-lab/nika/pull/330.
  This does not close other helper-file subcases; web DoS still uses
  /var/tmp/http-client.py and per-worker http-client logs.
- >-
  2026-11-11: 0f3a80fb discards ApacheBench worker output, runs the slow HTTP client from memory
  under a neutral name, and stages the archive batch and the static file service on every
  endpoint or web host at deployment. Live web DoS, load-balancer, contention, and OD-traffic
  checks found no files added to the faulted node relative to its peers.
fixed_in: 0f3a80fb
