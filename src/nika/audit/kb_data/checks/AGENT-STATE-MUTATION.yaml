id: AGENT-STATE-MUTATION
title: Agent sent a state-changing command to a lab node
class: agent_integrity
role: lead
severity: info
status: by_design
summary: Device and controller CLI commands may change configuration, routes, rules, processes, or services.
  Agent writes are allowed by design (user decision, 2026-11-16).
guideline: 'Use mutation records to interpret observations after an agent changes device state.
  A CLI write, repair, or high mutation rate alone is not an integrity defect.
  Evaluate presence checks and scoring against their independent contracts and the observed state.'
evidence:
- 'Historical policy treated agent repairs that erased a fault as invalid. Superseded on 2026-11-16.'
detect:
- kind: mutation
- kind: metric
  metric: mutation_rate
  threshold: 0.2
  min_trials: 10
provenance:
  source: built-in generic check
  date: '2026-10-26'
  refs: []
  found_by: manual
