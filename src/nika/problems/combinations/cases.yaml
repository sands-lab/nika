- name: pmtud_black_hole
  description: A router's lowered MTU on a routed link and its filter on ICMP Fragmentation
    Needed together silently drop large DF packets.
  failures:
  - mtu_mismatch
  - icmp_frag_needed_filter_misconfiguration
  sources:
  - source_type: rfc
    title: RFC 2923, TCP Problems with Path MTU Discovery
    url: https://www.rfc-editor.org/rfc/rfc2923.html#section-2.1
    locator: Section 2.1, Black Hole Detection
    excerpt: Its packets are disappearing into a PMTUD black hole.
    supports: interaction
    correspondence: NIKA lowers a routed interface MTU and filters ICMP Fragmentation Needed
      on the same router, so large DF packets vanish without feedback.
    limitation: RFC 2923 describes the filter on any device on the path; NIKA places both
      faults on one router.
    accessed: '2026-11-12'
  - source_type: incident_report
    title: Path MTU discovery in practice (Cloudflare)
    url: https://blog.cloudflare.com/path-mtu-discovery-in-practice/
    locator: Section Do-not-fragment bit
    excerpt: The most common problems are caused by misconfigured firewalls that drop ICMP
      packets.
    supports: co_occurrence
    correspondence: An operator reports filtered ICMP combined with a smaller path MTU as
      the common cause of stalled transfers.
    limitation: The post describes production patterns rather than one incident.
    accessed: '2026-11-12'
  tasks:
  - scenario: dc_clos
    topo_size: s
    inject:
      mtu_mismatch:
        host_name: leaf_1
        intf_name: eth3
        mtu: '1400'
      icmp_frag_needed_filter_misconfiguration:
        host_name: leaf_1
  - scenario: dc_clos
    topo_size: s
    device_profile: routeros
    inject:
      mtu_mismatch:
        host_name: leaf_1
        intf_name: eth3
        mtu: '1400'
      icmp_frag_needed_filter_misconfiguration:
        host_name: leaf_1
- name: policy_gap_exposed_by_uplink_loss
  description: A leaf's eBGP session without usable policy stays hidden until its other uplink
    fails.
  failures:
  - bgp_session_policy_missing
  - link_down
  trigger_at: 30s
  sources:
  - source_type: rfc
    title: RFC 8212, Default External BGP Route Propagation Behavior without Policies
    url: https://datatracker.ietf.org/doc/html/rfc8212#section-3
    locator: Section 3, Changes to RFC 4271
    excerpt: Routes SHALL NOT be added to an Adj-RIB-Out associated with an EBGP peer if no
      explicit Export Policy has been applied.
    supports: interaction
    correspondence: A leaf's session without import and export policy carries no routes. Its
      other session carries rack traffic until that uplink fails.
    limitation: The RFC specifies per-session route rejection; the redundant uplink placement
      and latent outage are the NIKA reproduction. RouterOS reproduces rejection with undefined
      filter chains.
    accessed: '2026-11-12'
  - source_type: paper
    title: 'Evolve or Die: High-Availability Design Principles Drawn from Google''s Network
      Infrastructure (SIGCOMM 2016)'
    url: https://cs538.github.io/readings/govindan16.pdf
    locator: Section 5, Analysis of Failure Events
    excerpt: if a link failure coincided with planned network maintenance operation that should
      have been safe due to redundancy
    supports: co_occurrence
    correspondence: A configuration error removes one usable routing path; a later link failure
      removes the remaining redundancy.
    limitation: The paper describes maintenance coinciding with link loss and congestive loss,
      not this eBGP policy fault or a complete rack partition.
    accessed: '2026-11-12'
  - source_type: vendor_documentation
    title: Cisco IOS XR, Implementing BGP
    url: https://www.cisco.com/c/en/us/td/docs/iosxr/ncs5500/bgp/710x/b-bgp-cg-ncs5500-710x/implementing-bgp.html
    locator: Enable BGP Routing, Before you begin
    excerpt: allow all eBGP neighbors to pass routes using the bgp unsafe-ebgp-policy command.
    supports: interaction
    correspondence: The healthy IOS XR rendering uses explicit pass policies and disables
      the global unsafe bypass, so removing one session's policies invokes default rejection.
    limitation: This documents the policy prerequisite, not the later redundant-uplink outage.
    accessed: '2026-11-12'
  tasks:
  - scenario: dc_clos
    topo_size: s
    device_profile: iosxr
    inject:
      bgp_session_policy_missing:
        host_name: spine_1
        peer: 172.16.0.0
      link_down:
        host_name: leaf_1
        intf_name: eth4
        observer_device: client_1_1
        probe_dst_ip: 10.0.2.11
  - scenario: dc_clos
    topo_size: s
    device_profile: routeros
    inject:
      bgp_session_policy_missing:
        host_name: leaf_1
        peer: 172.16.0.1
      link_down:
        host_name: leaf_1
        intf_name: eth4
        observer_device: client_1_1
        probe_dst_ip: 10.0.2.11
- name: prefix_surge_trips_low_limit
  description: A peer's prefix surge exceeds a session's latent low maximum-prefix limit and
    disconnects its customer route.
  failures:
  - bgp_max_prefix_limit_low
  - bgp_prefix_surge
  trigger_at: 30s
  sources:
  - source_type: incident_report
    title: 'Australian Senate, Chapter 2: The Optus network outage'
    url: https://www.aph.gov.au/Parliamentary_Business/Committees/Senate/Environment_and_Communications/OptusNetworkOutage/Report/Chapter_2_-_The_Optus_network_outage
    locator: Paragraphs 2.21 and 2.27
    excerpt: a preset safety limit on these routers was reached or exceeded
    supports: co_occurrence
    correspondence: Routing changes from an interconnected network exceeded configured safety
      limits and disconnected routers. NIKA separates the extra advertisements from the low
      terminating limit.
    limitation: The report does not publish router configuration or prefix counts. NIKA models
      the mechanism with FRR sessions and an isolated additional-prefix block, not the national
      outage scale or the upgrade.
    accessed: '2026-11-12'
  - source_type: rfc
    title: RFC 7454, BGP Operations and Security
    url: https://www.rfc-editor.org/rfc/rfc7454.html#section-8
    locator: Section 8, Maximum Prefixes on a Peering
    excerpt: It is important to regularly review the limits that are configured
    supports: interaction
    correspondence: The terminating limit needs headroom for expected route growth. NIKA sets
      it one prefix above the normal received count.
    limitation: The RFC recommends limit management; it does not specify the Optus configuration
      or its actual headroom.
    accessed: '2026-11-12'
