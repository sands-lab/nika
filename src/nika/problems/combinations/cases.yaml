# Multi-fault tasks admitted into benchmark releases. Each task fixes its
# deployment and every failure's parameters, and passed the live combination
# test (each failure alone, both together, recovery of each, and the Oracle).
# ``sources`` documents why the failures occur together and renders into
# docs/operations/failures.md. Failures are listed in injection order;
# ``trigger_at`` delays every failure after the first, and ``settle`` delays
# diagnosis after the last.
- name: bgp_transport_masks_asn
  description: A router's BGP TCP filter keeps its sessions from reaching the OPEN exchange
    that would reveal its misconfigured local AS.
  failures:
  - bgp_asn_misconfig
  - bgp_acl_block
  sources:
  - source_type: rfc
    title: RFC 4271, A Border Gateway Protocol 4 (BGP-4)
    url: https://www.rfc-editor.org/rfc/rfc4271.html#section-8.2.2
    locator: Section 8.2.2, Connect state
    excerpt: If the TCP connection succeeds (Event 16 or Event 17), the local system checks
      the DelayOpen attribute prior to processing.
    supports: interaction
    correspondence: A speaker sends OPEN only after its TCP connection succeeds, so a filter
      on TCP port 179 keeps every session of the router before the OPEN exchange.
    limitation: The RFC describes the state machine, not a filter combined with an AS error.
    accessed: '2026-11-12'
  - source_type: rfc
    title: RFC 4271, A Border Gateway Protocol 4 (BGP-4)
    url: https://www.rfc-editor.org/rfc/rfc4271.html#section-6.2
    locator: Section 6.2, OPEN Message Error Handling
    excerpt: If the Autonomous System field of the OPEN message is unacceptable, then the
      Error Subcode MUST be set to Bad Peer AS.
    supports: interaction
    correspondence: The misconfigured local AS is reported only as an OPEN error, which the
      transport filter prevents.
    limitation: Same document as the state machine excerpt.
    accessed: '2026-11-12'
  tasks:
  - scenario: dc_clos
    topo_size: s
    inject:
      bgp_asn_misconfig:
        host_name: spine_1
      bgp_acl_block:
        host_name: spine_1
  - scenario: dc_clos
    topo_size: s
    device_profile: routeros
    inject:
      bgp_asn_misconfig:
        host_name: spine_1
      bgp_acl_block:
        host_name: spine_1
  - scenario: isp_dfn-bwin
    igp: isis
    bgp_mode: ibgp_rr
    rpki: false
    backend: containerlab
    device_profile: nokia_srlinux
    inject:
      bgp_asn_misconfig:
        host_name: berlin
      bgp_acl_block:
        host_name: berlin
- name: bottleneck_masks_receive_window
  description: A bottleneck on the sender's link caps a transfer below the rate the receiver's
    small TCP window allows.
  failures:
  - tcp_receive_window_limited
  - link_capacity_bottleneck
  sources:
  - source_type: rfc
    title: RFC 6349, Framework for TCP Throughput Testing
    url: https://www.rfc-editor.org/rfc/rfc6349.html#section-3.3.1
    locator: Section 3.3.1, Minimum TCP RWND
    excerpt: If a smaller TCP RWND size is used, then the TCP Throughput cannot be optimal.
    supports: interaction
    correspondence: 'The tighter of the two limits sets throughput: the shaper on the sender''s
      link keeps the transfer below what the receiver''s window allows, so the window never
      fills until the shaper is removed.'
    limitation: RFC 6349 is a test methodology; it does not report incidents with both conditions.
    accessed: '2026-11-12'
  - source_type: rfc
    title: RFC 6349, Framework for TCP Throughput Testing
    url: https://www.rfc-editor.org/rfc/rfc6349.html#section-3.2.2
    locator: Section 3.2.2, Measuring the bottleneck bandwidth
    excerpt: Before any TCP Throughput test can be conducted, bandwidth measurement tests
      SHOULD be run with stateless IP streams.
    supports: interaction
    correspondence: The method measures the bottleneck separately from TCP, which separates
      the two limits.
    limitation: Same methodology document as the window guidance.
    accessed: '2026-11-12'
  tasks:
  - scenario: enterprise_branch
    topo_size: s
    inject:
      tcp_receive_window_limited:
        host_name: br1_corp_pc
        large_url: http://10.0.20.2/large.bin
        sender_host: hq_srv
        sender_ip: 10.0.20.2
        small_url: http://10.0.20.2/small.bin
      link_capacity_bottleneck:
        burst: 16kb
        host_name: hq_srv
        intf_name: eth0
        limit: 32kb
        rate: 128kbit
- name: ingress_class_masks_target_port
  description: An Ingress claimed by no controller answers 404 before its Service's wrong
    target port can show as a gateway error.
  failures:
  - k8s_service_target_port_mismatch
  - k8s_ingress_class_mismatch
  sources:
  - source_type: vendor_documentation
    title: Kubernetes, Ingress
    url: https://kubernetes.io/docs/concepts/services-networking/ingress/
    locator: Prerequisites
    excerpt: You must have an Ingress controller to satisfy an Ingress. Only creating an Ingress
      resource has no effect.
    supports: interaction
    correspondence: An Ingress whose class no controller handles is not served, so clients
      never reach the Service whose target port is wrong.
    limitation: The page describes the missing controller, not an Ingress class that names
      no installed controller; both leave the Ingress unserved.
    accessed: '2026-11-12'
  - source_type: vendor_documentation
    title: Kubernetes, Debug Services
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/
    locator: Is the Service defined correctly?
    excerpt: Is the `targetPort` correct for your Pods (some Pods use a different port than
      the Service)?
    supports: co_occurrence
    correspondence: A wrong target port is a separate check from the Ingress path in the same
      debugging procedure.
    limitation: Checklist guidance, not an incident report.
    accessed: '2026-11-12'
  tasks:
  - scenario: k8s_lab
    topo_size: s
    inject:
      k8s_service_target_port_mismatch:
        control_node: controller
      k8s_ingress_class_mismatch:
        control_node: controller
- name: latent_adjacency_cut
  description: An OSPF adjacency lost to a hello timer mismatch stays hidden until the other
    link of the same cut fails.
  failures:
  - ospf_hello_interval_mismatch
  - link_down
  trigger_at: 60s
  sources:
  - source_type: paper
    title: Why Does the Cloud Stop Computing? Lessons from Hundreds of Service Outages (SoCC
      2016)
    url: https://www.ece.iastate.edu/~mai/docs/papers/2016_SoCC_COS.pdf
    locator: Section 4.3, Backups that also Fail
    excerpt: simultaneous multiple failures of primary and backup components such as double
      failures of power [5, 17], network [52, 87]
    supports: co_occurrence
    correspondence: The OSPF adjacency on one link of a two-link cut is the failed backup;
      the later link loss is the primary failure that exposes it.
    limitation: The study classifies outages by category; it does not describe an IGP timer
      mismatch on a backup link.
    accessed: '2026-11-12'
  - source_type: paper
    title: 'Evolve or Die: High-Availability Design Principles Drawn from Google''s Network
      Infrastructure (SIGCOMM 2016)'
    url: https://homepages.dcc.ufmg.br/~cunha/teaching/20221/cloudcomp/readings/03-readings/govindan16evolve.pdf
    locator: Section 5, root-cause categories
    excerpt: A single failure event can have more than one root cause
    supports: co_occurrence
    correspondence: 'Each fault is a counterfactual root cause: without either, the cut keeps
      one working link and the network stays connected.'
    limitation: The paper does not count multi-root-cause events or name this pair.
    accessed: '2026-11-12'
  tasks:
  - scenario: campus_lan
    topo_size: s
    inject:
      ospf_hello_interval_mismatch:
        host_name: router_core_1
        intf_name: eth1
      link_down:
        host_name: router_core_1
        intf_name: eth0
  - scenario: campus_lan
    topo_size: s
