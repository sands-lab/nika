- name: undersized_backup_exposed
  description: A branch's standby provider link is provisioned far below the branch's traffic,
    which shows only after the primary link fails.
  failures:
  - link_capacity_bottleneck
  - link_down
  trigger_at: 30s
  settle: 180s
  sources:
  - source_type: incident_report
    title: Summary of the Amazon EC2 and Amazon RDS Service Disruption in the US East Region
      (AWS, April 2011)
    url: https://aws.amazon.com/message/65648/
    locator: Primary Outage
    excerpt: the traffic was routed onto the lower capacity redundant EBS network
    supports: co_occurrence
    correspondence: Traffic moved onto a backup network too small for it; NIKA shapes a branch's
      standby provider link and then fails the primary.
    limitation: In the AWS event a configuration change shifted the traffic; NIKA uses a primary
      link failure as the trigger.
    accessed: '2026-11-12'
  - source_type: incident_report
    title: Summary of the Amazon EC2 and Amazon RDS Service Disruption in the US East Region
      (AWS, April 2011)
    url: https://aws.amazon.com/message/65648/
    locator: Overview of EBS System
    excerpt: This network is not designed to handle all traffic from the primary network
    supports: interaction
    correspondence: The backup's capacity is a standing condition that matters only when the
      primary's traffic moves onto it.
    limitation: Same report.
    accessed: '2026-11-12'
