- name: rov_gap_admits_hijack
  description: A router whose import policy no longer rejects RPKI-invalid routes installs
    routes a peer originates with an unauthorized origin.
  failures:
  - bgp_rov_not_enforced
  - bgp_hijacking
  trigger_at: 30s
  sources:
  - source_type: incident_report
    title: How Verizon and a BGP Optimizer Knocked Large Parts of the Internet Offline Today
      (Cloudflare)
    url: https://blog.cloudflare.com/how-verizon-and-a-bgp-optimizer-knocked-large-parts-of-the-internet-offline-today/
    locator: Section What happened?
    excerpt: Verizon’s lack of filtering turned this into a major incident
    supports: co_occurrence
    correspondence: A peer leaks routes it should not originate, and an upstream that does
      not filter them installs and propagates them; NIKA leaks RPKI-invalid routes toward
      a router whose invalid-route rejection is missing.
    limitation: The 2019 leak consisted of more-specific prefixes and Verizon lacked several
      filters; NIKA reproduces the missing filter with RPKI origin validation and an unauthorized-origin
      leak.
    accessed: '2026-11-12'
  - source_type: rfc
    title: RFC 6811, BGP Prefix Origin Validation
    url: https://www.rfc-editor.org/rfc/rfc6811.html#section-2
    locator: Section 2, validation states
    excerpt: 'Invalid: At least one VRP Covers the Route Prefix, but no VRP Matches it.'
    supports: interaction
    correspondence: The leaked routes are Invalid; only a router whose import policy acts
      on that state rejects them, so the missing rejection matters only once invalid routes
      arrive.
    limitation: RFC 6811 leaves the policy for Invalid routes to the operator.
    accessed: '2026-11-12'
  tasks:
  - scenario: isp_abilene
    topo_size: s
    igp: ospf
    bgp_mode: ebgp
    rpki: true
    backend: kathara
    device_profile: frr
    inject:
      bgp_rov_not_enforced:
        host_name: iplsng
      bgp_hijacking:
        variant: rpki_invalid_origin
        host_name: kscyng
