hostname br7_edge
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface wg_hq
 no shutdown
 description br7_edge -> hq_edge [WireGuard tunnel] [external]
 ip address 172.30.0.82/30
!
interface wg_hq_b
 no shutdown
 description br7_edge -> hq_edge [WireGuard tunnel] [external]
 ip address 172.30.0.86/30
!
interface wg_dc2
 no shutdown
 description br7_edge -> dc2_edge [WireGuard tunnel] [external]
 ip address 172.30.0.90/30
!
interface eth3
 no shutdown
 description br7_edge -> isp1_core
 ip address 100.64.0.65/30
!
interface eth4
 no shutdown
 description br7_edge -> isp2_core
 ip address 100.64.0.69/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map RM-OUT-LOCAL-ipv4 permit 10
  match ip address prefix-list LOCAL-ADV-ipv4

!
route-map RM-OUT-TRANSIT-ipv4 permit 10
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_hq-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_hq_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_dc2-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
ip prefix-list ENTERPRISE-ipv4 seq 100 permit 10.0.0.0/8 le 24
!
ip prefix-list LOCAL-ADV-ipv4 seq 100 permit 10.7.10.0/24
!
!
#!/usr/bin/vtysh -f
!
router bgp 65007
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 100.64.0.65
!
  neighbor 172.30.0.81 remote-as 65000
  neighbor 172.30.0.81 description hq_edge
!
  neighbor 172.30.0.85 remote-as 65000
  neighbor 172.30.0.85 description hq_edge
!
  neighbor 172.30.0.89 remote-as 65010
  neighbor 172.30.0.89 description dc2_edge
!
 address-family ipv4 unicast
!

!
  neighbor 172.30.0.81 activate
  no neighbor 172.30.0.81 send-community all
  neighbor 172.30.0.81 send-community standard
  neighbor 172.30.0.81 send-community large
!
  neighbor 172.30.0.85 activate
  no neighbor 172.30.0.85 send-community all
  neighbor 172.30.0.85 send-community standard
  neighbor 172.30.0.85 send-community large
!
  neighbor 172.30.0.89 activate
  no neighbor 172.30.0.89 send-community all
  neighbor 172.30.0.89 send-community standard
  neighbor 172.30.0.89 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65007
!
! Global address families
  address-family ipv4

    neighbor 172.30.0.81 route-map RM-IN-wg_hq-ipv4 in
    neighbor 172.30.0.81 route-map RM-OUT-LOCAL-ipv4 out

    neighbor 172.30.0.85 route-map RM-IN-wg_hq_b-ipv4 in
    neighbor 172.30.0.85 route-map RM-OUT-LOCAL-ipv4 out

    neighbor 172.30.0.89 route-map RM-IN-wg_dc2-ipv4 in
    neighbor 172.30.0.89 route-map RM-OUT-LOCAL-ipv4 out

!
!
vrf vrf_corp
exit-vrf

router bgp 65007
 address-family ipv4 unicast
  import vrf vrf_corp
 exit-address-family
!
router bgp 65007 vrf vrf_corp
 bgp router-id 100.64.0.65
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf default
 exit-address-family
!
!
