!
route-map RM-IN-wg_br3_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br4-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br4_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br5-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br5_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br6-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br6_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br7-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

