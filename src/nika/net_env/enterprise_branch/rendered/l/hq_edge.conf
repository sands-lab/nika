#!/usr/bin/vtysh -f

!
router bgp 65000
!
! Global address families
  address-family ipv4

    neighbor 172.30.0.1 route-map RM-IN-wg_dc2-ipv4 in
    neighbor 172.30.0.1 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.5 route-map RM-IN-wg_dc2_b-ipv4 in
    neighbor 172.30.0.5 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.10 route-map RM-IN-wg_br1-ipv4 in
    neighbor 172.30.0.10 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.14 route-map RM-IN-wg_br1_b-ipv4 in
    neighbor 172.30.0.14 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.22 route-map RM-IN-wg_br2-ipv4 in
    neighbor 172.30.0.22 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.26 route-map RM-IN-wg_br2_b-ipv4 in
    neighbor 172.30.0.26 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.34 route-map RM-IN-wg_br3-ipv4 in
    neighbor 172.30.0.34 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.38 route-map RM-IN-wg_br3_b-ipv4 in
    neighbor 172.30.0.38 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.46 route-map RM-IN-wg_br4-ipv4 in
    neighbor 172.30.0.46 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.50 route-map RM-IN-wg_br4_b-ipv4 in
    neighbor 172.30.0.50 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.58 route-map RM-IN-wg_br5-ipv4 in
    neighbor 172.30.0.58 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.62 route-map RM-IN-wg_br5_b-ipv4 in
    neighbor 172.30.0.62 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.70 route-map RM-IN-wg_br6-ipv4 in
    neighbor 172.30.0.70 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.74 route-map RM-IN-wg_br6_b-ipv4 in
    neighbor 172.30.0.74 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.82 route-map RM-IN-wg_br7-ipv4 in
    neighbor 172.30.0.82 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.86 route-map RM-IN-wg_br7_b-ipv4 in
    neighbor 172.30.0.86 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.94 route-map RM-IN-wg_br8-ipv4 in
    neighbor 172.30.0.94 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.98 route-map RM-IN-wg_br8_b-ipv4 in
    neighbor 172.30.0.98 route-map RM-OUT-TRANSIT-ipv4 out

!
!
vrf vrf_corp
exit-vrf

vrf vrf_server
exit-vrf

router bgp 65000
 address-family ipv4 unicast
  import vrf vrf_corp
  import vrf vrf_server
 exit-address-family
!
router bgp 65000 vrf vrf_corp
 bgp router-id 100.64.0.1
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf default
  import vrf vrf_server
 exit-address-family
!
!

router bgp 65000 vrf vrf_server
 bgp router-id 100.64.0.1
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf default
  import vrf vrf_corp
 exit-address-family
!
!
