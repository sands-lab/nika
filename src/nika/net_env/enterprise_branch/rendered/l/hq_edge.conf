  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br2-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br2_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br3-ipv4 permit 10
