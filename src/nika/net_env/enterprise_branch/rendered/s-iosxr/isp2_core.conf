hostname isp2_core
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host hq_edge 100.64.0.1
domain ipv4 host dc2_edge 172.30.0.1
domain ipv4 host br1_edge 172.30.0.10
domain ipv4 host br2_edge 172.30.0.22
domain ipv4 host isp1_core 100.64.0.2
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description isp2_core -> hq_edge
 ipv4 address 100.64.0.6 255.255.255.252
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description isp2_core -> dc2_edge
 ipv4 address 100.64.0.14 255.255.255.252
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description isp2_core -> br1_edge
 ipv4 address 100.64.0.22 255.255.255.252
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description isp2_core -> br2_edge
 ipv4 address 100.64.0.30 255.255.255.252
!
