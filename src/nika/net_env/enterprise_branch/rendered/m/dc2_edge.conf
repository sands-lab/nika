hostname dc2_edge
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface wg_hq
 no shutdown
 description dc2_edge -> hq_edge [WireGuard tunnel] [external]
 ip address 172.30.0.1/30
!
interface wg_hq_b
 no shutdown
 description dc2_edge -> hq_edge [WireGuard tunnel] [external]
 ip address 172.30.0.5/30
!
interface eth4
 no shutdown
 description dc2_edge -> isp1_core
 ip address 100.64.0.9/30
!
interface eth5
 no shutdown
 description dc2_edge -> isp2_core
 ip address 100.64.0.13/30
!
interface wg_br1_b
 no shutdown
 description dc2_edge -> br1_edge [WireGuard tunnel] [external]
 ip address 172.30.0.17/30
!
interface wg_br2_b
 no shutdown
 description dc2_edge -> br2_edge [WireGuard tunnel] [external]
 ip address 172.30.0.29/30
!
interface wg_br3_b
 no shutdown
 description dc2_edge -> br3_edge [WireGuard tunnel] [external]
 ip address 172.30.0.41/30
!
interface wg_br4_b
 no shutdown
 description dc2_edge -> br4_edge [WireGuard tunnel] [external]
 ip address 172.30.0.53/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map RM-OUT-LOCAL-ipv4 permit 10
  match ip address prefix-list LOCAL-ADV-ipv4

!
route-map RM-OUT-TRANSIT-ipv4 permit 10
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_hq-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_hq_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br1_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br2_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br3_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br4_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
ip prefix-list ENTERPRISE-ipv4 seq 100 permit 10.0.0.0/8 le 24
!
ip prefix-list LOCAL-ADV-ipv4 seq 100 permit 10.10.10.0/24
ip prefix-list LOCAL-ADV-ipv4 seq 110 permit 10.10.20.0/24
!
!
#!/usr/bin/vtysh -f
!
router bgp 65010
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 100.64.0.9
!
  neighbor 172.30.0.2 remote-as 65000
  neighbor 172.30.0.2 description hq_edge
!
  neighbor 172.30.0.6 remote-as 65000
  neighbor 172.30.0.6 description hq_edge
!
  neighbor 172.30.0.18 remote-as 65001
  neighbor 172.30.0.18 description br1_edge
!
  neighbor 172.30.0.30 remote-as 65002
  neighbor 172.30.0.30 description br2_edge
!
  neighbor 172.30.0.42 remote-as 65003
  neighbor 172.30.0.42 description br3_edge
!
  neighbor 172.30.0.54 remote-as 65004
  neighbor 172.30.0.54 description br4_edge
!
 address-family ipv4 unicast
!

!
  neighbor 172.30.0.2 activate
  no neighbor 172.30.0.2 send-community all
  neighbor 172.30.0.2 send-community standard
  neighbor 172.30.0.2 send-community large
!
  neighbor 172.30.0.6 activate
  no neighbor 172.30.0.6 send-community all
  neighbor 172.30.0.6 send-community standard
  neighbor 172.30.0.6 send-community large
!
  neighbor 172.30.0.18 activate
  no neighbor 172.30.0.18 send-community all
  neighbor 172.30.0.18 send-community standard
  neighbor 172.30.0.18 send-community large
!
  neighbor 172.30.0.30 activate
  no neighbor 172.30.0.30 send-community all
  neighbor 172.30.0.30 send-community standard
  neighbor 172.30.0.30 send-community large
!
  neighbor 172.30.0.42 activate
  no neighbor 172.30.0.42 send-community all
  neighbor 172.30.0.42 send-community standard
  neighbor 172.30.0.42 send-community large
!
  neighbor 172.30.0.54 activate
  no neighbor 172.30.0.54 send-community all
  neighbor 172.30.0.54 send-community standard
  neighbor 172.30.0.54 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65010
!
! Global address families
  address-family ipv4

    neighbor 172.30.0.2 route-map RM-IN-wg_hq-ipv4 in
    neighbor 172.30.0.2 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.6 route-map RM-IN-wg_hq_b-ipv4 in
    neighbor 172.30.0.6 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.18 route-map RM-IN-wg_br1_b-ipv4 in
    neighbor 172.30.0.18 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.30 route-map RM-IN-wg_br2_b-ipv4 in
    neighbor 172.30.0.30 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.42 route-map RM-IN-wg_br3_b-ipv4 in
    neighbor 172.30.0.42 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.54 route-map RM-IN-wg_br4_b-ipv4 in
    neighbor 172.30.0.54 route-map RM-OUT-TRANSIT-ipv4 out

!
!
vrf vrf_corp
exit-vrf

vrf vrf_server
exit-vrf

router bgp 65010
 address-family ipv4 unicast
  import vrf vrf_corp
  import vrf vrf_server
 exit-address-family
!
router bgp 65010 vrf vrf_corp
 bgp router-id 100.64.0.9
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf default
 exit-address-family
!
!

router bgp 65010 vrf vrf_server
 bgp router-id 100.64.0.9
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf default
 exit-address-family
!
!
