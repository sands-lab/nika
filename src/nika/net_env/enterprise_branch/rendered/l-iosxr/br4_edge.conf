hostname br4_edge
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface wg_hq
 no shutdown
 description br4_edge -> hq_edge [WireGuard tunnel] [external]
 ip address 172.30.0.46/30
!
interface wg_hq_b
 no shutdown
 description br4_edge -> hq_edge [WireGuard tunnel] [external]
 ip address 172.30.0.50/30
!
interface wg_dc2
 no shutdown
 description br4_edge -> dc2_edge [WireGuard tunnel] [external]
 ip address 172.30.0.54/30
!
interface eth3
 no shutdown
 description br4_edge -> isp1_core
 ip address 100.64.0.41/30
!
interface eth4
 no shutdown
 description br4_edge -> isp2_core
 ip address 100.64.0.45/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map RM-OUT-LOCAL-ipv4 permit 10
  match ip address prefix-list LOCAL-ADV-ipv4

!
route-map RM-OUT-TRANSIT-ipv4 permit 10
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_hq-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_hq_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_dc2-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
ip prefix-list ENTERPRISE-ipv4 seq 100 permit 10.0.0.0/8 le 24
!
ip prefix-list LOCAL-ADV-ipv4 seq 100 permit 10.4.10.0/24
!
!
#!/usr/bin/vtysh -f
!
router bgp 65004
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 100.64.0.41
!
  neighbor 172.30.0.45 remote-as 65000
  neighbor 172.30.0.45 description hq_edge
!
  neighbor 172.30.0.49 remote-as 65000
  neighbor 172.30.0.49 description hq_edge
!
  neighbor 172.30.0.53 remote-as 65010
  neighbor 172.30.0.53 description dc2_edge
!
 address-family ipv4 unicast
!

!
  neighbor 172.30.0.45 activate
  no neighbor 172.30.0.45 send-community all
  neighbor 172.30.0.45 send-community standard
  neighbor 172.30.0.45 send-community large
!
  neighbor 172.30.0.49 activate
  no neighbor 172.30.0.49 send-community all
  neighbor 172.30.0.49 send-community standard
  neighbor 172.30.0.49 send-community large
!
  neighbor 172.30.0.53 activate
  no neighbor 172.30.0.53 send-community all
  neighbor 172.30.0.53 send-community standard
  neighbor 172.30.0.53 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65004
!
! Global address families
  address-family ipv4

    neighbor 172.30.0.45 route-map RM-IN-wg_hq-ipv4 in
    neighbor 172.30.0.45 route-map RM-OUT-LOCAL-ipv4 out

    neighbor 172.30.0.49 route-map RM-IN-wg_hq_b-ipv4 in
    neighbor 172.30.0.49 route-map RM-OUT-LOCAL-ipv4 out

    neighbor 172.30.0.53 route-map RM-IN-wg_dc2-ipv4 in
    neighbor 172.30.0.53 route-map RM-OUT-LOCAL-ipv4 out

!
!
vrf vrf_corp
exit-vrf

router bgp 65004
 address-family ipv4 unicast
  import vrf vrf_corp
 exit-address-family
!
router bgp 65004 vrf vrf_corp
 bgp router-id 100.64.0.41
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf default
 exit-address-family
!
!
