hostname hq_edge
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface eth3
 no shutdown
 description hq_edge -> isp1_core
 ip address 100.64.0.1/30
!
interface eth4
 no shutdown
 description hq_edge -> isp2_core
 ip address 100.64.0.5/30
!
interface wg_dc2
 no shutdown
 description hq_edge -> dc2_edge [WireGuard tunnel] [external]
 ip address 172.30.0.2/30
!
interface wg_dc2_b
 no shutdown
 description hq_edge -> dc2_edge [WireGuard tunnel] [external]
 ip address 172.30.0.6/30
!
interface wg_br1
 no shutdown
 description hq_edge -> br1_edge [WireGuard tunnel] [external]
 ip address 172.30.0.9/30
!
interface wg_br1_b
 no shutdown
 description hq_edge -> br1_edge [WireGuard tunnel] [external]
 ip address 172.30.0.13/30
!
interface wg_br2
 no shutdown
 description hq_edge -> br2_edge [WireGuard tunnel] [external]
 ip address 172.30.0.21/30
!
interface wg_br2_b
 no shutdown
 description hq_edge -> br2_edge [WireGuard tunnel] [external]
 ip address 172.30.0.25/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map RM-OUT-LOCAL-ipv4 permit 10
  match ip address prefix-list LOCAL-ADV-ipv4

!
route-map RM-OUT-TRANSIT-ipv4 permit 10
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_dc2-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_dc2_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br1-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br1_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br2-ipv4 permit 10
  set local-preference 200
  match ip address prefix-list ENTERPRISE-ipv4

!
route-map RM-IN-wg_br2_b-ipv4 permit 10
  set local-preference 100
  match ip address prefix-list ENTERPRISE-ipv4

!
ip prefix-list ENTERPRISE-ipv4 seq 100 permit 10.0.0.0/8 le 24
!
ip prefix-list LOCAL-ADV-ipv4 seq 100 permit 10.0.10.0/24
ip prefix-list LOCAL-ADV-ipv4 seq 110 permit 10.0.20.0/24
!
!
#!/usr/bin/vtysh -f
!
router bgp 65000
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 100.64.0.1
!
  neighbor 172.30.0.1 remote-as 65010
  neighbor 172.30.0.1 description dc2_edge
!
  neighbor 172.30.0.5 remote-as 65010
  neighbor 172.30.0.5 description dc2_edge
!
  neighbor 172.30.0.10 remote-as 65001
  neighbor 172.30.0.10 description br1_edge
!
  neighbor 172.30.0.14 remote-as 65001
  neighbor 172.30.0.14 description br1_edge
!
  neighbor 172.30.0.22 remote-as 65002
  neighbor 172.30.0.22 description br2_edge
!
  neighbor 172.30.0.26 remote-as 65002
  neighbor 172.30.0.26 description br2_edge
!
 address-family ipv4 unicast
!

!
  neighbor 172.30.0.1 activate
  no neighbor 172.30.0.1 send-community all
  neighbor 172.30.0.1 send-community standard
  neighbor 172.30.0.1 send-community large
!
  neighbor 172.30.0.5 activate
  no neighbor 172.30.0.5 send-community all
  neighbor 172.30.0.5 send-community standard
  neighbor 172.30.0.5 send-community large
!
  neighbor 172.30.0.10 activate
  no neighbor 172.30.0.10 send-community all
  neighbor 172.30.0.10 send-community standard
  neighbor 172.30.0.10 send-community large
!
  neighbor 172.30.0.14 activate
  no neighbor 172.30.0.14 send-community all
  neighbor 172.30.0.14 send-community standard
  neighbor 172.30.0.14 send-community large
!
  neighbor 172.30.0.22 activate
  no neighbor 172.30.0.22 send-community all
  neighbor 172.30.0.22 send-community standard
  neighbor 172.30.0.22 send-community large
!
  neighbor 172.30.0.26 activate
  no neighbor 172.30.0.26 send-community all
  neighbor 172.30.0.26 send-community standard
  neighbor 172.30.0.26 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65000
!
! Global address families
  address-family ipv4

    neighbor 172.30.0.1 route-map RM-IN-wg_dc2-ipv4 in
    neighbor 172.30.0.1 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.5 route-map RM-IN-wg_dc2_b-ipv4 in
    neighbor 172.30.0.5 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.10 route-map RM-IN-wg_br1-ipv4 in
    neighbor 172.30.0.10 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.14 route-map RM-IN-wg_br1_b-ipv4 in
    neighbor 172.30.0.14 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.22 route-map RM-IN-wg_br2-ipv4 in
    neighbor 172.30.0.22 route-map RM-OUT-TRANSIT-ipv4 out

    neighbor 172.30.0.26 route-map RM-IN-wg_br2_b-ipv4 in
    neighbor 172.30.0.26 route-map RM-OUT-TRANSIT-ipv4 out

!
!
vrf vrf_corp
exit-vrf

vrf vrf_server
exit-vrf

router bgp 65000
 address-family ipv4 unicast
  import vrf vrf_corp
  import vrf vrf_server
 exit-address-family
!
router bgp 65000 vrf vrf_corp
 bgp router-id 100.64.0.1
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf default
  import vrf vrf_server
 exit-address-family
!
!

router bgp 65000 vrf vrf_server
 bgp router-id 100.64.0.1
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf default
  import vrf vrf_corp
 exit-address-family
!
!
