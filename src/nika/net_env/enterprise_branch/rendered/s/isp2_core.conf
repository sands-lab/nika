hostname isp2_core
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description isp2_core -> hq_edge
 ip address 100.64.0.6/30
!
interface eth1
 no shutdown
 description isp2_core -> dc2_edge
 ip address 100.64.0.14/30
!
interface eth2
 no shutdown
 description isp2_core -> br1_edge
 ip address 100.64.0.22/30
!
interface eth3
 no shutdown
 description isp2_core -> br2_edge
 ip address 100.64.0.30/30
!
