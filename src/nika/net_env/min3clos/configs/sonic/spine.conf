! SONiC (FRR) rendering of configs/spine.yaml: the same addressing, OSPFv2 and IS-IS
! instances and eBGP sessions. The sessions carry no routes, as SR Linux's
! default eBGP policy rejects routes without an export policy.
frr defaults traditional
hostname spine
!
interface lo
 ip address 30.0.0.3/32
 ipv6 address 3000:30::3/128
 ip router isis default
 ipv6 router isis default
 isis passive
!
interface eth1
 ip address 10.0.0.1/31
 ipv6 address 1000:10::1/127
 ip ospf network point-to-point
 ip router isis default
 ipv6 router isis default
 isis network point-to-point
!
interface eth2
 ip address 10.0.0.5/31
 ipv6 address 1000:10::5/127
 ip ospf network point-to-point
 ip router isis default
 ipv6 router isis default
 isis network point-to-point
!
router ospf
 ospf router-id 30.0.0.3
 network 10.0.0.1/31 area 0.0.0.0
 network 10.0.0.5/31 area 0.0.0.0
 network 30.0.0.3/32 area 0.0.0.0
!
router isis default
 net 49.0001.3000.0000.0003.00
 is-type level-2-only
 metric-style wide
!
router bgp 65056
 bgp router-id 30.0.0.3
 neighbor 10.0.0.0 remote-as 65001
 neighbor 10.0.0.4 remote-as 65002
 !
 address-family ipv6 unicast
  neighbor 10.0.0.0 activate
  neighbor 10.0.0.4 activate
 exit-address-family
!
