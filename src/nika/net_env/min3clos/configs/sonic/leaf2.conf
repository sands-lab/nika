! SONiC (FRR) rendering of configs/leaf2.yaml: the same addressing, OSPFv2 and IS-IS
! instances and eBGP sessions. The sessions carry no routes, as SR Linux's
! default eBGP policy rejects routes without an export policy.
! Fabric links set their OSPF cost, which FRR would otherwise derive from the
! virtual port speed.
frr defaults traditional
hostname leaf2
!
interface lo
 ip address 30.0.0.2/32
 ipv6 address 3000:30::2/128
 ip router isis default
 ipv6 router isis default
 isis passive
!
interface eth1
 ip address 10.0.0.4/31
 ipv6 address 1000:10::4/127
 ip ospf network point-to-point
 ip ospf cost 10
 ip router isis default
 ipv6 router isis default
 isis network point-to-point
!
interface eth2
 ip address 10.0.0.26/31
 ipv6 address 1000:10::26/127
 ip ospf network point-to-point
 ip ospf cost 10
 ip router isis default
 ipv6 router isis default
 isis network point-to-point
!
router ospf
 ospf router-id 30.0.0.2
 network 10.0.0.4/31 area 0.0.0.0
 network 10.0.0.26/31 area 0.0.0.0
 network 30.0.0.2/32 area 0.0.0.0
!
router isis default
 net 49.0001.3000.0000.0002.00
 is-type level-2-only
 metric-style wide
!
router bgp 65002
 bgp router-id 30.0.0.2
 neighbor 10.0.0.5 remote-as 65056
 !
 address-family ipv6 unicast
  neighbor 10.0.0.5 activate
 exit-address-family
!
