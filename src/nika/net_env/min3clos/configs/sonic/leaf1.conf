! SONiC (FRR) rendering of configs/leaf1.yaml: the same addressing, OSPFv2 and IS-IS
! instances and eBGP sessions. The sessions carry no routes, as SR Linux's
! default eBGP policy rejects routes without an export policy.
! Fabric links set their OSPF cost, which FRR would otherwise derive from the
! virtual port speed.
frr defaults traditional
hostname leaf1
!
interface lo
 ip address 30.0.0.1/32
 ipv6 address 3000:30::1/128
 ip router isis default
 ipv6 router isis default
 isis passive
!
interface eth1
 ip address 10.0.0.0/31
 ipv6 address 1000:10::/127
 ip ospf network point-to-point
 ip ospf cost 10
 ip router isis default
 ipv6 router isis default
 isis network point-to-point
!
interface eth2
 ip address 10.0.0.24/31
 ipv6 address 1000:10::24/127
 ip ospf network point-to-point
 ip ospf cost 10
 ip router isis default
 ipv6 router isis default
 isis network point-to-point
!
router ospf
 ospf router-id 30.0.0.1
 network 10.0.0.0/31 area 0.0.0.0
 network 10.0.0.24/31 area 0.0.0.0
 network 30.0.0.1/32 area 0.0.0.0
!
router isis default
 net 49.0001.3000.0000.0001.00
 is-type level-2-only
 metric-style wide
!
router bgp 65001
 bgp router-id 30.0.0.1
 neighbor 10.0.0.1 remote-as 65056
 !
 address-family ipv6 unicast
  neighbor 10.0.0.1 activate
 exit-address-family
!
