hostname server_access_router
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface eth7
 no shutdown
 description server_access_router -> router_core_3
 ip address 172.16.0.15/31
!
interface br0
 no shutdown
 description server_access_router -> stub [stub]
 ip address 10.200.0.1/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 172.16.0.15
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface eth7
! server_access_router -> router_core_3
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface br0
! server_access_router -> stub
 ip ospf area 0.0.0.0
!

!
