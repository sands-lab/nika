hostname router_core_3
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description router_core_3 -> router_core_1
 ip address 172.16.0.3/31
!
interface eth1
 no shutdown
 description router_core_3 -> router_core_2
 ip address 172.16.0.5/31
!
interface eth2
 no shutdown
 description router_core_3 -> server_access_router
 ip address 172.16.0.14/31
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 172.16.0.3
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface eth0
! router_core_3 -> router_core_1
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface eth1
! router_core_3 -> router_core_2
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface eth2
! router_core_3 -> server_access_router
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!

!
