hostname router_dist_2_1
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description router_dist_2_1 -> router_core_2
 ip address 172.16.0.11/31
!
interface br0
 no shutdown
 description router_dist_2_1 -> stub [stub]
 ip address 10.2.1.1/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 172.16.0.11
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface eth0
! router_dist_2_1 -> router_core_2
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
!
interface br0
! router_dist_2_1 -> stub
 ip ospf area 0.0.0.1
!

!
