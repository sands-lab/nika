hostname router_core_2
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description router_core_2 -> router_core_1
 ip address 172.16.0.1/31
!
interface eth1
 no shutdown
 description router_core_2 -> router_core_3
 ip address 172.16.0.4/31
!
interface eth2
 no shutdown
 description router_core_2 -> router_dist_2_1
 ip address 172.16.0.8/31
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 172.16.0.1
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface eth0
! router_core_2 -> router_core_1
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface eth1
! router_core_2 -> router_core_3
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface eth2
! router_core_2 -> router_dist_2_1
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
!

!
