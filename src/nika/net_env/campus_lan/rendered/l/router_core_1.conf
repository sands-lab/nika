hostname router_core_1
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description router_core_1 -> router_core_2
 ip address 172.16.0.0/31
!
interface eth1
 no shutdown
 description router_core_1 -> router_core_3
 ip address 172.16.0.2/31
!
interface eth2
 no shutdown
 description router_core_1 -> router_dist_1_1
 ip address 172.16.0.6/31
!
interface eth3
 no shutdown
 description router_core_1 -> router_dist_1_2
 ip address 172.16.0.8/31
!
interface eth4
 no shutdown
 description router_core_1 -> router_dist_1_3
 ip address 172.16.0.10/31
!
interface eth5
 no shutdown
 description router_core_1 -> router_dist_1_4
 ip address 172.16.0.12/31
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 172.16.0.0
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface eth0
! router_core_1 -> router_core_2
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface eth1
! router_core_1 -> router_core_3
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
!
interface eth2
! router_core_1 -> router_dist_1_1
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
!
interface eth3
! router_core_1 -> router_dist_1_2
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
!
interface eth4
! router_core_1 -> router_dist_1_3
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
!
interface eth5
! router_core_1 -> router_dist_1_4
 ip ospf area 0.0.0.1
 ip ospf network point-to-point
!

!
