hostname router_core_1
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host router_core_2 172.16.0.1
domain ipv4 host router_core_3 172.16.0.3
domain ipv4 host router_dist_1_1 172.16.0.7
domain ipv4 host router_dist_2_1 172.16.0.9
domain ipv4 host server_access_router 172.16.0.11
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description router_core_1 -> router_core_2
 ipv4 address 172.16.0.0 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description router_core_1 -> router_core_3
 ipv4 address 172.16.0.2 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description router_core_1 -> router_dist_1_1
 ipv4 address 172.16.0.6 255.255.255.254
!
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 172.16.0.0

 loopback stub-network enable
 area 0.0.0.0
  interface GigabitEthernet0/0/0/0
   network point-to-point
  interface GigabitEthernet0/0/0/1
   network point-to-point
 area 0.0.0.1
  interface GigabitEthernet0/0/0/2
   network point-to-point

