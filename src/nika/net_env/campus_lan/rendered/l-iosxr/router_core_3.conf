hostname router_core_3
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host router_core_1 172.16.0.0
domain ipv4 host router_core_2 172.16.0.1
domain ipv4 host router_dist_1_1 172.16.0.7
domain ipv4 host router_dist_1_2 172.16.0.9
domain ipv4 host router_dist_1_3 172.16.0.11
domain ipv4 host router_dist_1_4 172.16.0.13
domain ipv4 host router_dist_2_1 172.16.0.15
domain ipv4 host router_dist_2_2 172.16.0.17
domain ipv4 host router_dist_2_3 172.16.0.19
domain ipv4 host router_dist_2_4 172.16.0.21
domain ipv4 host server_access_router 172.16.0.23
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description router_core_3 -> router_core_1
 ipv4 address 172.16.0.3 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description router_core_3 -> router_core_2
 ipv4 address 172.16.0.5 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description router_core_3 -> server_access_router
 ipv4 address 172.16.0.22 255.255.255.254
!
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 172.16.0.3

 loopback stub-network enable
 area 0.0.0.0
  interface GigabitEthernet0/0/0/0
   network point-to-point
  interface GigabitEthernet0/0/0/1
   network point-to-point
  interface GigabitEthernet0/0/0/2
   network point-to-point

