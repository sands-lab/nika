events {}
http {
    access_log /var/log/nginx/access.log;
    sendfile on;
    gzip off;
    server {
        listen 80;
        listen 443 ssl;
        server_name web0.local web1.local web2.local web3.local;
        ssl_certificate /etc/ssl/certs/campus-repository.crt;
        ssl_certificate_key /etc/ssl/private/campus-repository.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /packages/catalog.txt {
            root /var/www;
            default_type text/plain;
            gzip_static on;
        }
        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
