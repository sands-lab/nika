hostname spine_router_1_1
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description spine_router_1_1 -> super_spine_router_0 [external]
 ip address 172.16.0.11/31
!
interface eth1
 no shutdown
 description spine_router_1_1 -> super_spine_router_1 [external]
 ip address 172.16.0.27/31
!
interface eth2
 no shutdown
 description spine_router_1_1 -> leaf_router_1_0 [external]
 ip address 172.16.0.72/31
!
interface eth3
 no shutdown
 description spine_router_1_1 -> leaf_router_1_1 [external]
 ip address 172.16.0.74/31
!
interface eth4
 no shutdown
 description spine_router_1_1 -> leaf_router_1_2 [external]
 ip address 172.16.0.76/31
!
interface eth5
 no shutdown
 description spine_router_1_1 -> leaf_router_1_3 [external]
 ip address 172.16.0.78/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65111
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.11
!
  neighbor 172.16.0.10 remote-as 65000
  neighbor 172.16.0.10 description super_spine_router_0
!
  neighbor 172.16.0.26 remote-as 65001
  neighbor 172.16.0.26 description super_spine_router_1
!
  neighbor 172.16.0.73 remote-as 65210
  neighbor 172.16.0.73 description leaf_router_1_0
!
  neighbor 172.16.0.75 remote-as 65211
  neighbor 172.16.0.75 description leaf_router_1_1
!
  neighbor 172.16.0.77 remote-as 65212
  neighbor 172.16.0.77 description leaf_router_1_2
!
  neighbor 172.16.0.79 remote-as 65213
  neighbor 172.16.0.79 description leaf_router_1_3
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.10 activate
  no neighbor 172.16.0.10 send-community all
  neighbor 172.16.0.10 send-community standard
  neighbor 172.16.0.10 send-community large
!
  neighbor 172.16.0.26 activate
  no neighbor 172.16.0.26 send-community all
  neighbor 172.16.0.26 send-community standard
  neighbor 172.16.0.26 send-community large
!
  neighbor 172.16.0.73 activate
  no neighbor 172.16.0.73 send-community all
  neighbor 172.16.0.73 send-community standard
  neighbor 172.16.0.73 send-community large
!
  neighbor 172.16.0.75 activate
  no neighbor 172.16.0.75 send-community all
  neighbor 172.16.0.75 send-community standard
  neighbor 172.16.0.75 send-community large
!
  neighbor 172.16.0.77 activate
  no neighbor 172.16.0.77 send-community all
  neighbor 172.16.0.77 send-community standard
  neighbor 172.16.0.77 send-community large
!
  neighbor 172.16.0.79 activate
  no neighbor 172.16.0.79 send-community all
  neighbor 172.16.0.79 send-community standard
  neighbor 172.16.0.79 send-community large
!
!
router bgp 65111
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
