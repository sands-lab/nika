hostname spine_router_1_0
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description spine_router_1_0 -> super_spine_router_0 [external]
 ip address 172.16.0.9/31
!
interface eth1
 no shutdown
 description spine_router_1_0 -> super_spine_router_1 [external]
 ip address 172.16.0.25/31
!
interface eth2
 no shutdown
 description spine_router_1_0 -> leaf_router_1_0 [external]
 ip address 172.16.0.64/31
!
interface eth3
 no shutdown
 description spine_router_1_0 -> leaf_router_1_1 [external]
 ip address 172.16.0.66/31
!
interface eth4
 no shutdown
 description spine_router_1_0 -> leaf_router_1_2 [external]
 ip address 172.16.0.68/31
!
interface eth5
 no shutdown
 description spine_router_1_0 -> leaf_router_1_3 [external]
 ip address 172.16.0.70/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65110
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.9
!
  neighbor 172.16.0.8 remote-as 65000
  neighbor 172.16.0.8 description super_spine_router_0
!
  neighbor 172.16.0.24 remote-as 65001
  neighbor 172.16.0.24 description super_spine_router_1
!
  neighbor 172.16.0.65 remote-as 65210
  neighbor 172.16.0.65 description leaf_router_1_0
!
  neighbor 172.16.0.67 remote-as 65211
  neighbor 172.16.0.67 description leaf_router_1_1
!
  neighbor 172.16.0.69 remote-as 65212
  neighbor 172.16.0.69 description leaf_router_1_2
!
  neighbor 172.16.0.71 remote-as 65213
  neighbor 172.16.0.71 description leaf_router_1_3
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.8 activate
  no neighbor 172.16.0.8 send-community all
  neighbor 172.16.0.8 send-community standard
  neighbor 172.16.0.8 send-community large
!
  neighbor 172.16.0.24 activate
  no neighbor 172.16.0.24 send-community all
  neighbor 172.16.0.24 send-community standard
  neighbor 172.16.0.24 send-community large
!
  neighbor 172.16.0.65 activate
  no neighbor 172.16.0.65 send-community all
  neighbor 172.16.0.65 send-community standard
  neighbor 172.16.0.65 send-community large
!
  neighbor 172.16.0.67 activate
  no neighbor 172.16.0.67 send-community all
  neighbor 172.16.0.67 send-community standard
  neighbor 172.16.0.67 send-community large
!
  neighbor 172.16.0.69 activate
  no neighbor 172.16.0.69 send-community all
  neighbor 172.16.0.69 send-community standard
  neighbor 172.16.0.69 send-community large
!
  neighbor 172.16.0.71 activate
  no neighbor 172.16.0.71 send-community all
  neighbor 172.16.0.71 send-community standard
  neighbor 172.16.0.71 send-community large
!
!
router bgp 65110
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
