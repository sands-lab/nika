hostname leaf_router_1_3
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description leaf_router_1_3 -> spine_router_1_0 [external]
 ip address 172.16.0.71/31
!
interface eth1
 no shutdown
 description leaf_router_1_3 -> spine_router_1_1 [external]
 ip address 172.16.0.79/31
!
interface eth2
 no shutdown
 description leaf_router_1_3 -> spine_router_1_2 [external]
 ip address 172.16.0.87/31
!
interface eth3
 no shutdown
 description leaf_router_1_3 -> spine_router_1_3 [external]
 ip address 172.16.0.95/31
!
interface eth4
 no shutdown
 description leaf_router_1_3 -> stub [stub]
 ip address 10.1.3.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65213
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.71
!
  neighbor 172.16.0.70 remote-as 65110
  neighbor 172.16.0.70 description spine_router_1_0
!
  neighbor 172.16.0.78 remote-as 65111
  neighbor 172.16.0.78 description spine_router_1_1
!
  neighbor 172.16.0.86 remote-as 65112
  neighbor 172.16.0.86 description spine_router_1_2
!
  neighbor 172.16.0.94 remote-as 65113
  neighbor 172.16.0.94 description spine_router_1_3
!
 address-family ipv4 unicast
!

  network 10.1.3.0/24
!
  neighbor 172.16.0.70 activate
  no neighbor 172.16.0.70 send-community all
  neighbor 172.16.0.70 send-community standard
  neighbor 172.16.0.70 send-community large
!
  neighbor 172.16.0.78 activate
  no neighbor 172.16.0.78 send-community all
  neighbor 172.16.0.78 send-community standard
  neighbor 172.16.0.78 send-community large
!
  neighbor 172.16.0.86 activate
  no neighbor 172.16.0.86 send-community all
  neighbor 172.16.0.86 send-community standard
  neighbor 172.16.0.86 send-community large
!
  neighbor 172.16.0.94 activate
  no neighbor 172.16.0.94 send-community all
  neighbor 172.16.0.94 send-community standard
  neighbor 172.16.0.94 send-community large
!
!
router bgp 65213
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
