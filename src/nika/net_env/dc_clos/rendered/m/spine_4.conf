hostname spine_4
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description spine_4 -> leaf_1 [external]
 ip address 172.16.0.7/31
!
interface eth1
 no shutdown
 description spine_4 -> leaf_2 [external]
 ip address 172.16.0.15/31
!
interface eth2
 no shutdown
 description spine_4 -> leaf_3 [external]
 ip address 172.16.0.23/31
!
interface eth3
 no shutdown
 description spine_4 -> leaf_4 [external]
 ip address 172.16.0.31/31
!
interface eth4
 no shutdown
 description spine_4 -> leaf_5 [external]
 ip address 172.16.0.39/31
!
interface eth5
 no shutdown
 description spine_4 -> leaf_6 [external]
 ip address 172.16.0.47/31
!
interface eth6
 no shutdown
 description spine_4 -> leaf_7 [external]
 ip address 172.16.0.55/31
!
interface eth7
 no shutdown
 description spine_4 -> leaf_8 [external]
 ip address 172.16.0.63/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65004
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.7
!
  neighbor 172.16.0.6 remote-as 65005
  neighbor 172.16.0.6 description leaf_1
!
  neighbor 172.16.0.14 remote-as 65006
  neighbor 172.16.0.14 description leaf_2
!
  neighbor 172.16.0.22 remote-as 65007
  neighbor 172.16.0.22 description leaf_3
!
  neighbor 172.16.0.30 remote-as 65008
  neighbor 172.16.0.30 description leaf_4
!
  neighbor 172.16.0.38 remote-as 65009
  neighbor 172.16.0.38 description leaf_5
!
  neighbor 172.16.0.46 remote-as 65010
  neighbor 172.16.0.46 description leaf_6
!
  neighbor 172.16.0.54 remote-as 65011
  neighbor 172.16.0.54 description leaf_7
!
  neighbor 172.16.0.62 remote-as 65012
  neighbor 172.16.0.62 description leaf_8
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.6 activate
  no neighbor 172.16.0.6 send-community all
  neighbor 172.16.0.6 send-community standard
  neighbor 172.16.0.6 send-community large
!
  neighbor 172.16.0.14 activate
  no neighbor 172.16.0.14 send-community all
  neighbor 172.16.0.14 send-community standard
  neighbor 172.16.0.14 send-community large
!
  neighbor 172.16.0.22 activate
  no neighbor 172.16.0.22 send-community all
  neighbor 172.16.0.22 send-community standard
  neighbor 172.16.0.22 send-community large
!
  neighbor 172.16.0.30 activate
  no neighbor 172.16.0.30 send-community all
  neighbor 172.16.0.30 send-community standard
  neighbor 172.16.0.30 send-community large
!
  neighbor 172.16.0.38 activate
  no neighbor 172.16.0.38 send-community all
  neighbor 172.16.0.38 send-community standard
  neighbor 172.16.0.38 send-community large
!
  neighbor 172.16.0.46 activate
  no neighbor 172.16.0.46 send-community all
  neighbor 172.16.0.46 send-community standard
  neighbor 172.16.0.46 send-community large
!
  neighbor 172.16.0.54 activate
  no neighbor 172.16.0.54 send-community all
  neighbor 172.16.0.54 send-community standard
  neighbor 172.16.0.54 send-community large
!
  neighbor 172.16.0.62 activate
  no neighbor 172.16.0.62 send-community all
  neighbor 172.16.0.62 send-community standard
  neighbor 172.16.0.62 send-community large
!
!
router bgp 65004
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
