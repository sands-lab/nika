hostname leaf_router_0_3
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description leaf_router_0_3 -> spine_router_0_0 [external]
 ip address 172.16.0.39/31
!
interface eth1
 no shutdown
 description leaf_router_0_3 -> spine_router_0_1 [external]
 ip address 172.16.0.47/31
!
interface eth2
 no shutdown
 description leaf_router_0_3 -> spine_router_0_2 [external]
 ip address 172.16.0.55/31
!
interface eth3
 no shutdown
 description leaf_router_0_3 -> spine_router_0_3 [external]
 ip address 172.16.0.63/31
!
interface eth4
 no shutdown
 description leaf_router_0_3 -> stub [stub]
 ip address 10.0.3.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65203
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.39
!
  neighbor 172.16.0.38 remote-as 65100
  neighbor 172.16.0.38 description spine_router_0_0
!
  neighbor 172.16.0.46 remote-as 65101
  neighbor 172.16.0.46 description spine_router_0_1
!
  neighbor 172.16.0.54 remote-as 65102
  neighbor 172.16.0.54 description spine_router_0_2
!
  neighbor 172.16.0.62 remote-as 65103
  neighbor 172.16.0.62 description spine_router_0_3
!
 address-family ipv4 unicast
!

  network 10.0.3.0/24
!
  neighbor 172.16.0.38 activate
  no neighbor 172.16.0.38 send-community all
  neighbor 172.16.0.38 send-community standard
  neighbor 172.16.0.38 send-community large
!
  neighbor 172.16.0.46 activate
  no neighbor 172.16.0.46 send-community all
  neighbor 172.16.0.46 send-community standard
  neighbor 172.16.0.46 send-community large
!
  neighbor 172.16.0.54 activate
  no neighbor 172.16.0.54 send-community all
  neighbor 172.16.0.54 send-community standard
  neighbor 172.16.0.54 send-community large
!
  neighbor 172.16.0.62 activate
  no neighbor 172.16.0.62 send-community all
  neighbor 172.16.0.62 send-community standard
  neighbor 172.16.0.62 send-community large
!
!
router bgp 65203
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
