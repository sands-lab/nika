hostname super_spine_router_1
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description super_spine_router_1 -> spine_router_0_0 [external]
 ip address 172.16.0.16/31
!
interface eth1
 no shutdown
 description super_spine_router_1 -> spine_router_0_1 [external]
 ip address 172.16.0.18/31
!
interface eth2
 no shutdown
 description super_spine_router_1 -> spine_router_0_2 [external]
 ip address 172.16.0.20/31
!
interface eth3
 no shutdown
 description super_spine_router_1 -> spine_router_0_3 [external]
 ip address 172.16.0.22/31
!
interface eth4
 no shutdown
 description super_spine_router_1 -> spine_router_1_0 [external]
 ip address 172.16.0.24/31
!
interface eth5
 no shutdown
 description super_spine_router_1 -> spine_router_1_1 [external]
 ip address 172.16.0.26/31
!
interface eth6
 no shutdown
 description super_spine_router_1 -> spine_router_1_2 [external]
 ip address 172.16.0.28/31
!
interface eth7
 no shutdown
 description super_spine_router_1 -> spine_router_1_3 [external]
 ip address 172.16.0.30/31
!
interface eth8
 no shutdown
 description super_spine_router_1 -> stub [stub]
 ip address 192.168.1.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.16
!
  neighbor 172.16.0.17 remote-as 65100
  neighbor 172.16.0.17 description spine_router_0_0
!
  neighbor 172.16.0.19 remote-as 65101
  neighbor 172.16.0.19 description spine_router_0_1
!
  neighbor 172.16.0.21 remote-as 65102
  neighbor 172.16.0.21 description spine_router_0_2
!
  neighbor 172.16.0.23 remote-as 65103
  neighbor 172.16.0.23 description spine_router_0_3
!
  neighbor 172.16.0.25 remote-as 65110
  neighbor 172.16.0.25 description spine_router_1_0
!
  neighbor 172.16.0.27 remote-as 65111
  neighbor 172.16.0.27 description spine_router_1_1
!
  neighbor 172.16.0.29 remote-as 65112
  neighbor 172.16.0.29 description spine_router_1_2
!
  neighbor 172.16.0.31 remote-as 65113
  neighbor 172.16.0.31 description spine_router_1_3
!
 address-family ipv4 unicast
!

  network 192.168.1.0/24
!
  neighbor 172.16.0.17 activate
  no neighbor 172.16.0.17 send-community all
  neighbor 172.16.0.17 send-community standard
  neighbor 172.16.0.17 send-community large
!
  neighbor 172.16.0.19 activate
  no neighbor 172.16.0.19 send-community all
  neighbor 172.16.0.19 send-community standard
  neighbor 172.16.0.19 send-community large
!
  neighbor 172.16.0.21 activate
  no neighbor 172.16.0.21 send-community all
  neighbor 172.16.0.21 send-community standard
  neighbor 172.16.0.21 send-community large
!
  neighbor 172.16.0.23 activate
  no neighbor 172.16.0.23 send-community all
  neighbor 172.16.0.23 send-community standard
  neighbor 172.16.0.23 send-community large
!
  neighbor 172.16.0.25 activate
  no neighbor 172.16.0.25 send-community all
  neighbor 172.16.0.25 send-community standard
  neighbor 172.16.0.25 send-community large
!
  neighbor 172.16.0.27 activate
  no neighbor 172.16.0.27 send-community all
  neighbor 172.16.0.27 send-community standard
  neighbor 172.16.0.27 send-community large
!
  neighbor 172.16.0.29 activate
  no neighbor 172.16.0.29 send-community all
  neighbor 172.16.0.29 send-community standard
  neighbor 172.16.0.29 send-community large
!
  neighbor 172.16.0.31 activate
  no neighbor 172.16.0.31 send-community all
  neighbor 172.16.0.31 send-community standard
  neighbor 172.16.0.31 send-community large
!
!
router bgp 65001
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
