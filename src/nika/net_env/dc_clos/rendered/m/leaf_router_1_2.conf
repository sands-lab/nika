hostname leaf_router_1_2
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description leaf_router_1_2 -> spine_router_1_0 [external]
 ip address 172.16.0.69/31
!
interface eth1
 no shutdown
 description leaf_router_1_2 -> spine_router_1_1 [external]
 ip address 172.16.0.77/31
!
interface eth2
 no shutdown
 description leaf_router_1_2 -> spine_router_1_2 [external]
 ip address 172.16.0.85/31
!
interface eth3
 no shutdown
 description leaf_router_1_2 -> spine_router_1_3 [external]
 ip address 172.16.0.93/31
!
interface eth4
 no shutdown
 description leaf_router_1_2 -> stub [stub]
 ip address 10.1.2.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65212
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.69
!
  neighbor 172.16.0.68 remote-as 65110
  neighbor 172.16.0.68 description spine_router_1_0
!
  neighbor 172.16.0.76 remote-as 65111
  neighbor 172.16.0.76 description spine_router_1_1
!
  neighbor 172.16.0.84 remote-as 65112
  neighbor 172.16.0.84 description spine_router_1_2
!
  neighbor 172.16.0.92 remote-as 65113
  neighbor 172.16.0.92 description spine_router_1_3
!
 address-family ipv4 unicast
!

  network 10.1.2.0/24
!
  neighbor 172.16.0.68 activate
  no neighbor 172.16.0.68 send-community all
  neighbor 172.16.0.68 send-community standard
  neighbor 172.16.0.68 send-community large
!
  neighbor 172.16.0.76 activate
  no neighbor 172.16.0.76 send-community all
  neighbor 172.16.0.76 send-community standard
  neighbor 172.16.0.76 send-community large
!
  neighbor 172.16.0.84 activate
  no neighbor 172.16.0.84 send-community all
  neighbor 172.16.0.84 send-community standard
  neighbor 172.16.0.84 send-community large
!
  neighbor 172.16.0.92 activate
  no neighbor 172.16.0.92 send-community all
  neighbor 172.16.0.92 send-community standard
  neighbor 172.16.0.92 send-community large
!
!
router bgp 65212
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
