hostname spine_router_1_3
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description spine_router_1_3 -> super_spine_router_0 [external]
 ip address 172.16.0.15/31
!
interface eth1
 no shutdown
 description spine_router_1_3 -> super_spine_router_1 [external]
 ip address 172.16.0.31/31
!
interface eth2
 no shutdown
 description spine_router_1_3 -> leaf_router_1_0 [external]
 ip address 172.16.0.88/31
!
interface eth3
 no shutdown
 description spine_router_1_3 -> leaf_router_1_1 [external]
 ip address 172.16.0.90/31
!
interface eth4
 no shutdown
 description spine_router_1_3 -> leaf_router_1_2 [external]
 ip address 172.16.0.92/31
!
interface eth5
 no shutdown
 description spine_router_1_3 -> leaf_router_1_3 [external]
 ip address 172.16.0.94/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65113
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.15
!
  neighbor 172.16.0.14 remote-as 65000
  neighbor 172.16.0.14 description super_spine_router_0
!
  neighbor 172.16.0.30 remote-as 65001
  neighbor 172.16.0.30 description super_spine_router_1
!
  neighbor 172.16.0.89 remote-as 65210
  neighbor 172.16.0.89 description leaf_router_1_0
!
  neighbor 172.16.0.91 remote-as 65211
  neighbor 172.16.0.91 description leaf_router_1_1
!
  neighbor 172.16.0.93 remote-as 65212
  neighbor 172.16.0.93 description leaf_router_1_2
!
  neighbor 172.16.0.95 remote-as 65213
  neighbor 172.16.0.95 description leaf_router_1_3
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.14 activate
  no neighbor 172.16.0.14 send-community all
  neighbor 172.16.0.14 send-community standard
  neighbor 172.16.0.14 send-community large
!
  neighbor 172.16.0.30 activate
  no neighbor 172.16.0.30 send-community all
  neighbor 172.16.0.30 send-community standard
  neighbor 172.16.0.30 send-community large
!
  neighbor 172.16.0.89 activate
  no neighbor 172.16.0.89 send-community all
  neighbor 172.16.0.89 send-community standard
  neighbor 172.16.0.89 send-community large
!
  neighbor 172.16.0.91 activate
  no neighbor 172.16.0.91 send-community all
  neighbor 172.16.0.91 send-community standard
  neighbor 172.16.0.91 send-community large
!
  neighbor 172.16.0.93 activate
  no neighbor 172.16.0.93 send-community all
  neighbor 172.16.0.93 send-community standard
  neighbor 172.16.0.93 send-community large
!
  neighbor 172.16.0.95 activate
  no neighbor 172.16.0.95 send-community all
  neighbor 172.16.0.95 send-community standard
  neighbor 172.16.0.95 send-community large
!
!
router bgp 65113
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
