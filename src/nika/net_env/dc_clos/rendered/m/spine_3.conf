hostname spine_3
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description spine_3 -> leaf_1 [external]
 ip address 172.16.0.5/31
!
interface eth1
 no shutdown
 description spine_3 -> leaf_2 [external]
 ip address 172.16.0.13/31
!
interface eth2
 no shutdown
 description spine_3 -> leaf_3 [external]
 ip address 172.16.0.21/31
!
interface eth3
 no shutdown
 description spine_3 -> leaf_4 [external]
 ip address 172.16.0.29/31
!
interface eth4
 no shutdown
 description spine_3 -> leaf_5 [external]
 ip address 172.16.0.37/31
!
interface eth5
 no shutdown
 description spine_3 -> leaf_6 [external]
 ip address 172.16.0.45/31
!
interface eth6
 no shutdown
 description spine_3 -> leaf_7 [external]
 ip address 172.16.0.53/31
!
interface eth7
 no shutdown
 description spine_3 -> leaf_8 [external]
 ip address 172.16.0.61/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.5
!
  neighbor 172.16.0.4 remote-as 65005
  neighbor 172.16.0.4 description leaf_1
!
  neighbor 172.16.0.12 remote-as 65006
  neighbor 172.16.0.12 description leaf_2
!
  neighbor 172.16.0.20 remote-as 65007
  neighbor 172.16.0.20 description leaf_3
!
  neighbor 172.16.0.28 remote-as 65008
  neighbor 172.16.0.28 description leaf_4
!
  neighbor 172.16.0.36 remote-as 65009
  neighbor 172.16.0.36 description leaf_5
!
  neighbor 172.16.0.44 remote-as 65010
  neighbor 172.16.0.44 description leaf_6
!
  neighbor 172.16.0.52 remote-as 65011
  neighbor 172.16.0.52 description leaf_7
!
  neighbor 172.16.0.60 remote-as 65012
  neighbor 172.16.0.60 description leaf_8
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.4 activate
  no neighbor 172.16.0.4 send-community all
  neighbor 172.16.0.4 send-community standard
  neighbor 172.16.0.4 send-community large
!
  neighbor 172.16.0.12 activate
  no neighbor 172.16.0.12 send-community all
  neighbor 172.16.0.12 send-community standard
  neighbor 172.16.0.12 send-community large
!
  neighbor 172.16.0.20 activate
  no neighbor 172.16.0.20 send-community all
  neighbor 172.16.0.20 send-community standard
  neighbor 172.16.0.20 send-community large
!
  neighbor 172.16.0.28 activate
  no neighbor 172.16.0.28 send-community all
  neighbor 172.16.0.28 send-community standard
  neighbor 172.16.0.28 send-community large
!
  neighbor 172.16.0.36 activate
  no neighbor 172.16.0.36 send-community all
  neighbor 172.16.0.36 send-community standard
  neighbor 172.16.0.36 send-community large
!
  neighbor 172.16.0.44 activate
  no neighbor 172.16.0.44 send-community all
  neighbor 172.16.0.44 send-community standard
  neighbor 172.16.0.44 send-community large
!
  neighbor 172.16.0.52 activate
  no neighbor 172.16.0.52 send-community all
  neighbor 172.16.0.52 send-community standard
  neighbor 172.16.0.52 send-community large
!
  neighbor 172.16.0.60 activate
  no neighbor 172.16.0.60 send-community all
  neighbor 172.16.0.60 send-community standard
  neighbor 172.16.0.60 send-community large
!
!
router bgp 65003
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
