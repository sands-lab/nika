hostname spine_router_0_3
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description spine_router_0_3 -> super_spine_router_0 [external]
 ip address 172.16.0.7/31
!
interface eth1
 no shutdown
 description spine_router_0_3 -> super_spine_router_1 [external]
 ip address 172.16.0.23/31
!
interface eth2
 no shutdown
 description spine_router_0_3 -> leaf_router_0_0 [external]
 ip address 172.16.0.56/31
!
interface eth3
 no shutdown
 description spine_router_0_3 -> leaf_router_0_1 [external]
 ip address 172.16.0.58/31
!
interface eth4
 no shutdown
 description spine_router_0_3 -> leaf_router_0_2 [external]
 ip address 172.16.0.60/31
!
interface eth5
 no shutdown
 description spine_router_0_3 -> leaf_router_0_3 [external]
 ip address 172.16.0.62/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65103
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.7
!
  neighbor 172.16.0.6 remote-as 65000
  neighbor 172.16.0.6 description super_spine_router_0
!
  neighbor 172.16.0.22 remote-as 65001
  neighbor 172.16.0.22 description super_spine_router_1
!
  neighbor 172.16.0.57 remote-as 65200
  neighbor 172.16.0.57 description leaf_router_0_0
!
  neighbor 172.16.0.59 remote-as 65201
  neighbor 172.16.0.59 description leaf_router_0_1
!
  neighbor 172.16.0.61 remote-as 65202
  neighbor 172.16.0.61 description leaf_router_0_2
!
  neighbor 172.16.0.63 remote-as 65203
  neighbor 172.16.0.63 description leaf_router_0_3
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.6 activate
  no neighbor 172.16.0.6 send-community all
  neighbor 172.16.0.6 send-community standard
  neighbor 172.16.0.6 send-community large
!
  neighbor 172.16.0.22 activate
  no neighbor 172.16.0.22 send-community all
  neighbor 172.16.0.22 send-community standard
  neighbor 172.16.0.22 send-community large
!
  neighbor 172.16.0.57 activate
  no neighbor 172.16.0.57 send-community all
  neighbor 172.16.0.57 send-community standard
  neighbor 172.16.0.57 send-community large
!
  neighbor 172.16.0.59 activate
  no neighbor 172.16.0.59 send-community all
  neighbor 172.16.0.59 send-community standard
  neighbor 172.16.0.59 send-community large
!
  neighbor 172.16.0.61 activate
  no neighbor 172.16.0.61 send-community all
  neighbor 172.16.0.61 send-community standard
  neighbor 172.16.0.61 send-community large
!
  neighbor 172.16.0.63 activate
  no neighbor 172.16.0.63 send-community all
  neighbor 172.16.0.63 send-community standard
  neighbor 172.16.0.63 send-community large
!
!
router bgp 65103
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
