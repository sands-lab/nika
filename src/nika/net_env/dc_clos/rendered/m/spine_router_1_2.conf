hostname spine_router_1_2
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description spine_router_1_2 -> super_spine_router_0 [external]
 ip address 172.16.0.13/31
!
interface eth1
 no shutdown
 description spine_router_1_2 -> super_spine_router_1 [external]
 ip address 172.16.0.29/31
!
interface eth2
 no shutdown
 description spine_router_1_2 -> leaf_router_1_0 [external]
 ip address 172.16.0.80/31
!
interface eth3
 no shutdown
 description spine_router_1_2 -> leaf_router_1_1 [external]
 ip address 172.16.0.82/31
!
interface eth4
 no shutdown
 description spine_router_1_2 -> leaf_router_1_2 [external]
 ip address 172.16.0.84/31
!
interface eth5
 no shutdown
 description spine_router_1_2 -> leaf_router_1_3 [external]
 ip address 172.16.0.86/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65112
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.13
!
  neighbor 172.16.0.12 remote-as 65000
  neighbor 172.16.0.12 description super_spine_router_0
!
  neighbor 172.16.0.28 remote-as 65001
  neighbor 172.16.0.28 description super_spine_router_1
!
  neighbor 172.16.0.81 remote-as 65210
  neighbor 172.16.0.81 description leaf_router_1_0
!
  neighbor 172.16.0.83 remote-as 65211
  neighbor 172.16.0.83 description leaf_router_1_1
!
  neighbor 172.16.0.85 remote-as 65212
  neighbor 172.16.0.85 description leaf_router_1_2
!
  neighbor 172.16.0.87 remote-as 65213
  neighbor 172.16.0.87 description leaf_router_1_3
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.12 activate
  no neighbor 172.16.0.12 send-community all
  neighbor 172.16.0.12 send-community standard
  neighbor 172.16.0.12 send-community large
!
  neighbor 172.16.0.28 activate
  no neighbor 172.16.0.28 send-community all
  neighbor 172.16.0.28 send-community standard
  neighbor 172.16.0.28 send-community large
!
  neighbor 172.16.0.81 activate
  no neighbor 172.16.0.81 send-community all
  neighbor 172.16.0.81 send-community standard
  neighbor 172.16.0.81 send-community large
!
  neighbor 172.16.0.83 activate
  no neighbor 172.16.0.83 send-community all
  neighbor 172.16.0.83 send-community standard
  neighbor 172.16.0.83 send-community large
!
  neighbor 172.16.0.85 activate
  no neighbor 172.16.0.85 send-community all
  neighbor 172.16.0.85 send-community standard
  neighbor 172.16.0.85 send-community large
!
  neighbor 172.16.0.87 activate
  no neighbor 172.16.0.87 send-community all
  neighbor 172.16.0.87 send-community standard
  neighbor 172.16.0.87 send-community large
!
!
router bgp 65112
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
