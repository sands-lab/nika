hostname spine_router_0_0
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description spine_router_0_0 -> super_spine_router_0 [external]
 ip address 172.16.0.1/31
!
interface eth1
 no shutdown
 description spine_router_0_0 -> super_spine_router_1 [external]
 ip address 172.16.0.17/31
!
interface eth2
 no shutdown
 description spine_router_0_0 -> leaf_router_0_0 [external]
 ip address 172.16.0.32/31
!
interface eth3
 no shutdown
 description spine_router_0_0 -> leaf_router_0_1 [external]
 ip address 172.16.0.34/31
!
interface eth4
 no shutdown
 description spine_router_0_0 -> leaf_router_0_2 [external]
 ip address 172.16.0.36/31
!
interface eth5
 no shutdown
 description spine_router_0_0 -> leaf_router_0_3 [external]
 ip address 172.16.0.38/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65100
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.1
!
  neighbor 172.16.0.0 remote-as 65000
  neighbor 172.16.0.0 description super_spine_router_0
!
  neighbor 172.16.0.16 remote-as 65001
  neighbor 172.16.0.16 description super_spine_router_1
!
  neighbor 172.16.0.33 remote-as 65200
  neighbor 172.16.0.33 description leaf_router_0_0
!
  neighbor 172.16.0.35 remote-as 65201
  neighbor 172.16.0.35 description leaf_router_0_1
!
  neighbor 172.16.0.37 remote-as 65202
  neighbor 172.16.0.37 description leaf_router_0_2
!
  neighbor 172.16.0.39 remote-as 65203
  neighbor 172.16.0.39 description leaf_router_0_3
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.0 activate
  no neighbor 172.16.0.0 send-community all
  neighbor 172.16.0.0 send-community standard
  neighbor 172.16.0.0 send-community large
!
  neighbor 172.16.0.16 activate
  no neighbor 172.16.0.16 send-community all
  neighbor 172.16.0.16 send-community standard
  neighbor 172.16.0.16 send-community large
!
  neighbor 172.16.0.33 activate
  no neighbor 172.16.0.33 send-community all
  neighbor 172.16.0.33 send-community standard
  neighbor 172.16.0.33 send-community large
!
  neighbor 172.16.0.35 activate
  no neighbor 172.16.0.35 send-community all
  neighbor 172.16.0.35 send-community standard
  neighbor 172.16.0.35 send-community large
!
  neighbor 172.16.0.37 activate
  no neighbor 172.16.0.37 send-community all
  neighbor 172.16.0.37 send-community standard
  neighbor 172.16.0.37 send-community large
!
  neighbor 172.16.0.39 activate
  no neighbor 172.16.0.39 send-community all
  neighbor 172.16.0.39 send-community standard
  neighbor 172.16.0.39 send-community large
!
!
router bgp 65100
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
