hostname leaf_router_0_1
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description leaf_router_0_1 -> spine_router_0_0 [external]
 ip address 172.16.0.35/31
!
interface eth1
 no shutdown
 description leaf_router_0_1 -> spine_router_0_1 [external]
 ip address 172.16.0.43/31
!
interface eth2
 no shutdown
 description leaf_router_0_1 -> spine_router_0_2 [external]
 ip address 172.16.0.51/31
!
interface eth3
 no shutdown
 description leaf_router_0_1 -> spine_router_0_3 [external]
 ip address 172.16.0.59/31
!
interface eth4
 no shutdown
 description leaf_router_0_1 -> stub [stub]
 ip address 10.0.1.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65201
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.35
!
  neighbor 172.16.0.34 remote-as 65100
  neighbor 172.16.0.34 description spine_router_0_0
!
  neighbor 172.16.0.42 remote-as 65101
  neighbor 172.16.0.42 description spine_router_0_1
!
  neighbor 172.16.0.50 remote-as 65102
  neighbor 172.16.0.50 description spine_router_0_2
!
  neighbor 172.16.0.58 remote-as 65103
  neighbor 172.16.0.58 description spine_router_0_3
!
 address-family ipv4 unicast
!

  network 10.0.1.0/24
!
  neighbor 172.16.0.34 activate
  no neighbor 172.16.0.34 send-community all
  neighbor 172.16.0.34 send-community standard
  neighbor 172.16.0.34 send-community large
!
  neighbor 172.16.0.42 activate
  no neighbor 172.16.0.42 send-community all
  neighbor 172.16.0.42 send-community standard
  neighbor 172.16.0.42 send-community large
!
  neighbor 172.16.0.50 activate
  no neighbor 172.16.0.50 send-community all
  neighbor 172.16.0.50 send-community standard
  neighbor 172.16.0.50 send-community large
!
  neighbor 172.16.0.58 activate
  no neighbor 172.16.0.58 send-community all
  neighbor 172.16.0.58 send-community standard
  neighbor 172.16.0.58 send-community large
!
!
router bgp 65201
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
