hostname leaf_7
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth4
 no shutdown
 description leaf_7 -> spine_1 [external]
 ip address 172.16.0.48/31
!
interface eth5
 no shutdown
 description leaf_7 -> spine_2 [external]
 ip address 172.16.0.50/31
!
interface eth6
 no shutdown
 description leaf_7 -> spine_3 [external]
 ip address 172.16.0.52/31
!
interface eth7
 no shutdown
 description leaf_7 -> spine_4 [external]
 ip address 172.16.0.54/31
!
interface br0
 no shutdown
 description leaf_7 -> stub [stub]
 ip address 10.0.7.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65011
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.48
!
  neighbor 172.16.0.49 remote-as 65001
  neighbor 172.16.0.49 description spine_1
!
  neighbor 172.16.0.51 remote-as 65002
  neighbor 172.16.0.51 description spine_2
!
  neighbor 172.16.0.53 remote-as 65003
  neighbor 172.16.0.53 description spine_3
!
  neighbor 172.16.0.55 remote-as 65004
  neighbor 172.16.0.55 description spine_4
!
 address-family ipv4 unicast
!

  network 10.0.7.0/24
!
  neighbor 172.16.0.49 activate
  no neighbor 172.16.0.49 send-community all
  neighbor 172.16.0.49 send-community standard
  neighbor 172.16.0.49 send-community large
!
  neighbor 172.16.0.51 activate
  no neighbor 172.16.0.51 send-community all
  neighbor 172.16.0.51 send-community standard
  neighbor 172.16.0.51 send-community large
!
  neighbor 172.16.0.53 activate
  no neighbor 172.16.0.53 send-community all
  neighbor 172.16.0.53 send-community standard
  neighbor 172.16.0.53 send-community large
!
  neighbor 172.16.0.55 activate
  no neighbor 172.16.0.55 send-community all
  neighbor 172.16.0.55 send-community standard
  neighbor 172.16.0.55 send-community large
!
!
router bgp 65011
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
