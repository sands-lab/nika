hostname spine_router_0_2
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description spine_router_0_2 -> super_spine_router_0 [external]
 ip address 172.16.0.5/31
!
interface eth1
 no shutdown
 description spine_router_0_2 -> super_spine_router_1 [external]
 ip address 172.16.0.21/31
!
interface eth2
 no shutdown
 description spine_router_0_2 -> leaf_router_0_0 [external]
 ip address 172.16.0.48/31
!
interface eth3
 no shutdown
 description spine_router_0_2 -> leaf_router_0_1 [external]
 ip address 172.16.0.50/31
!
interface eth4
 no shutdown
 description spine_router_0_2 -> leaf_router_0_2 [external]
 ip address 172.16.0.52/31
!
interface eth5
 no shutdown
 description spine_router_0_2 -> leaf_router_0_3 [external]
 ip address 172.16.0.54/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65102
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.5
!
  neighbor 172.16.0.4 remote-as 65000
  neighbor 172.16.0.4 description super_spine_router_0
!
  neighbor 172.16.0.20 remote-as 65001
  neighbor 172.16.0.20 description super_spine_router_1
!
  neighbor 172.16.0.49 remote-as 65200
  neighbor 172.16.0.49 description leaf_router_0_0
!
  neighbor 172.16.0.51 remote-as 65201
  neighbor 172.16.0.51 description leaf_router_0_1
!
  neighbor 172.16.0.53 remote-as 65202
  neighbor 172.16.0.53 description leaf_router_0_2
!
  neighbor 172.16.0.55 remote-as 65203
  neighbor 172.16.0.55 description leaf_router_0_3
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.4 activate
  no neighbor 172.16.0.4 send-community all
  neighbor 172.16.0.4 send-community standard
  neighbor 172.16.0.4 send-community large
!
  neighbor 172.16.0.20 activate
  no neighbor 172.16.0.20 send-community all
  neighbor 172.16.0.20 send-community standard
  neighbor 172.16.0.20 send-community large
!
  neighbor 172.16.0.49 activate
  no neighbor 172.16.0.49 send-community all
  neighbor 172.16.0.49 send-community standard
  neighbor 172.16.0.49 send-community large
!
  neighbor 172.16.0.51 activate
  no neighbor 172.16.0.51 send-community all
  neighbor 172.16.0.51 send-community standard
  neighbor 172.16.0.51 send-community large
!
  neighbor 172.16.0.53 activate
  no neighbor 172.16.0.53 send-community all
  neighbor 172.16.0.53 send-community standard
  neighbor 172.16.0.53 send-community large
!
  neighbor 172.16.0.55 activate
  no neighbor 172.16.0.55 send-community all
  neighbor 172.16.0.55 send-community standard
  neighbor 172.16.0.55 send-community large
!
!
router bgp 65102
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
