hostname leaf_router_0_2
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description leaf_router_0_2 -> spine_router_0_0 [external]
 ip address 172.16.0.37/31
!
interface eth1
 no shutdown
 description leaf_router_0_2 -> spine_router_0_1 [external]
 ip address 172.16.0.45/31
!
interface eth2
 no shutdown
 description leaf_router_0_2 -> spine_router_0_2 [external]
 ip address 172.16.0.53/31
!
interface eth3
 no shutdown
 description leaf_router_0_2 -> spine_router_0_3 [external]
 ip address 172.16.0.61/31
!
interface eth4
 no shutdown
 description leaf_router_0_2 -> stub [stub]
 ip address 10.0.2.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65202
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.37
!
  neighbor 172.16.0.36 remote-as 65100
  neighbor 172.16.0.36 description spine_router_0_0
!
  neighbor 172.16.0.44 remote-as 65101
  neighbor 172.16.0.44 description spine_router_0_1
!
  neighbor 172.16.0.52 remote-as 65102
  neighbor 172.16.0.52 description spine_router_0_2
!
  neighbor 172.16.0.60 remote-as 65103
  neighbor 172.16.0.60 description spine_router_0_3
!
 address-family ipv4 unicast
!

  network 10.0.2.0/24
!
  neighbor 172.16.0.36 activate
  no neighbor 172.16.0.36 send-community all
  neighbor 172.16.0.36 send-community standard
  neighbor 172.16.0.36 send-community large
!
  neighbor 172.16.0.44 activate
  no neighbor 172.16.0.44 send-community all
  neighbor 172.16.0.44 send-community standard
  neighbor 172.16.0.44 send-community large
!
  neighbor 172.16.0.52 activate
  no neighbor 172.16.0.52 send-community all
  neighbor 172.16.0.52 send-community standard
  neighbor 172.16.0.52 send-community large
!
  neighbor 172.16.0.60 activate
  no neighbor 172.16.0.60 send-community all
  neighbor 172.16.0.60 send-community standard
  neighbor 172.16.0.60 send-community large
!
!
router bgp 65202
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
