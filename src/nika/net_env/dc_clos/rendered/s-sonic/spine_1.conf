hostname spine_1
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth1
 no shutdown
 description spine_1 -> leaf_1 [external]
 ip address 172.16.0.1/31
!
interface eth2
 no shutdown
 description spine_1 -> leaf_2 [external]
 ip address 172.16.0.5/31
!
interface eth3
 no shutdown
 description spine_1 -> leaf_3 [external]
 ip address 172.16.0.9/31
!
interface eth4
 no shutdown
 description spine_1 -> leaf_4 [external]
 ip address 172.16.0.13/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.1
!
  neighbor 172.16.0.0 remote-as 65003
  neighbor 172.16.0.0 description leaf_1
!
  neighbor 172.16.0.4 remote-as 65004
  neighbor 172.16.0.4 description leaf_2
!
  neighbor 172.16.0.8 remote-as 65005
  neighbor 172.16.0.8 description leaf_3
!
  neighbor 172.16.0.12 remote-as 65006
  neighbor 172.16.0.12 description leaf_4
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.0 activate
  no neighbor 172.16.0.0 send-community all
  neighbor 172.16.0.0 send-community standard
  neighbor 172.16.0.0 send-community large
!
  neighbor 172.16.0.4 activate
  no neighbor 172.16.0.4 send-community all
  neighbor 172.16.0.4 send-community standard
  neighbor 172.16.0.4 send-community large
!
  neighbor 172.16.0.8 activate
  no neighbor 172.16.0.8 send-community all
  neighbor 172.16.0.8 send-community standard
  neighbor 172.16.0.8 send-community large
!
  neighbor 172.16.0.12 activate
  no neighbor 172.16.0.12 send-community all
  neighbor 172.16.0.12 send-community standard
  neighbor 172.16.0.12 send-community large
!
!
router bgp 65001
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
