hostname spine_2
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth1
 no shutdown
 description spine_2 -> leaf_1 [external]
 ip address 172.16.0.3/31
!
interface eth2
 no shutdown
 description spine_2 -> leaf_2 [external]
 ip address 172.16.0.7/31
!
interface eth3
 no shutdown
 description spine_2 -> leaf_3 [external]
 ip address 172.16.0.11/31
!
interface eth4
 no shutdown
 description spine_2 -> leaf_4 [external]
 ip address 172.16.0.15/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.3
!
  neighbor 172.16.0.2 remote-as 65003
  neighbor 172.16.0.2 description leaf_1
!
  neighbor 172.16.0.6 remote-as 65004
  neighbor 172.16.0.6 description leaf_2
!
  neighbor 172.16.0.10 remote-as 65005
  neighbor 172.16.0.10 description leaf_3
!
  neighbor 172.16.0.14 remote-as 65006
  neighbor 172.16.0.14 description leaf_4
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.2 activate
  no neighbor 172.16.0.2 send-community all
  neighbor 172.16.0.2 send-community standard
  neighbor 172.16.0.2 send-community large
!
  neighbor 172.16.0.6 activate
  no neighbor 172.16.0.6 send-community all
  neighbor 172.16.0.6 send-community standard
  neighbor 172.16.0.6 send-community large
!
  neighbor 172.16.0.10 activate
  no neighbor 172.16.0.10 send-community all
  neighbor 172.16.0.10 send-community standard
  neighbor 172.16.0.10 send-community large
!
  neighbor 172.16.0.14 activate
  no neighbor 172.16.0.14 send-community all
  neighbor 172.16.0.14 send-community standard
  neighbor 172.16.0.14 send-community large
!
!
router bgp 65002
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
