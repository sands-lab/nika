hostname spine_2
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host spine_1 172.16.0.1
domain ipv4 host leaf_1 172.16.0.0
domain ipv4 host leaf_2 172.16.0.4
domain ipv4 host leaf_3 172.16.0.8
domain ipv4 host leaf_4 172.16.0.12
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description spine_2 -> leaf_1 [external]
 ipv4 address 172.16.0.3 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description spine_2 -> leaf_2 [external]
 ipv4 address 172.16.0.7 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description spine_2 -> leaf_3 [external]
 ipv4 address 172.16.0.11 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description spine_2 -> leaf_4 [external]
 ipv4 address 172.16.0.15 255.255.255.254
!
!

!
!
router bgp 65002
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 172.16.0.3

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 172.16.0.2
  remote-as 65003
  description leaf_1
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 172.16.0.6
  remote-as 65004
  description leaf_2
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 172.16.0.10
  remote-as 65005
  description leaf_3
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 172.16.0.14
  remote-as 65006
  description leaf_4
  address-family ipv4 unicast
   send-community-ebgp

route-policy PASS
 pass
end-policy
!
router bgp 65002
 bgp bestpath as-path multipath-relax
 address-family ipv4 unicast
  maximum-paths ebgp 32
 !
 neighbor 172.16.0.2
  address-family ipv4 unicast
   route-policy PASS in
   route-policy PASS out
  !
 !
 neighbor 172.16.0.6
  address-family ipv4 unicast
   route-policy PASS in
   route-policy PASS out
  !
 !
 neighbor 172.16.0.10
  address-family ipv4 unicast
   route-policy PASS in
   route-policy PASS out
  !
 !
 neighbor 172.16.0.14
  address-family ipv4 unicast
   route-policy PASS in
   route-policy PASS out
  !
 !
!
