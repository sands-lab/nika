hostname spine_router_0_1
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host super_spine_router_0 172.16.0.0
domain ipv4 host spine_router_0_0 172.16.0.1
domain ipv4 host leaf_router_0_0 172.16.0.5
domain ipv4 host leaf_router_0_1 172.16.0.7
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description spine_router_0_1 -> super_spine_router_0 [external]
 ipv4 address 172.16.0.3 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description spine_router_0_1 -> leaf_router_0_0 [external]
 ipv4 address 172.16.0.8 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description spine_router_0_1 -> leaf_router_0_1 [external]
 ipv4 address 172.16.0.10 255.255.255.254
!
!

!
!
router bgp 65101
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 172.16.0.3

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 172.16.0.2
  remote-as 65000
  description super_spine_router_0
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 172.16.0.9
  remote-as 65200
  description leaf_router_0_0
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 172.16.0.11
  remote-as 65201
  description leaf_router_0_1
  address-family ipv4 unicast
   send-community-ebgp

route-policy PASS
 pass
end-policy
!
router bgp 65101
 bgp bestpath as-path multipath-relax
 address-family ipv4 unicast
  maximum-paths ebgp 32
 !
 neighbor 172.16.0.2
  address-family ipv4 unicast
   route-policy PASS in
   route-policy PASS out
  !
 !
 neighbor 172.16.0.9
  address-family ipv4 unicast
   route-policy PASS in
   route-policy PASS out
  !
 !
 neighbor 172.16.0.11
  address-family ipv4 unicast
   route-policy PASS in
   route-policy PASS out
  !
 !
!
