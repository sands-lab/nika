hostname leaf_router_0_0
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host super_spine_router_0 172.16.0.0
domain ipv4 host spine_router_0_0 172.16.0.1
domain ipv4 host spine_router_0_1 172.16.0.3
domain ipv4 host leaf_router_0_1 172.16.0.7
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description leaf_router_0_0 -> spine_router_0_0 [external]
 ipv4 address 172.16.0.5 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description leaf_router_0_0 -> spine_router_0_1 [external]
 ipv4 address 172.16.0.9 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description leaf_router_0_0 -> stub [stub]
 ipv4 address 10.0.0.1 255.255.255.0
!
!

!
!
router bgp 65200
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 172.16.0.5

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
  network 10.0.0.0/24
!
 neighbor 172.16.0.4
  remote-as 65100
  description spine_router_0_0
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 172.16.0.8
  remote-as 65101
  description spine_router_0_1
  address-family ipv4 unicast
   send-community-ebgp

route-policy PASS
 pass
end-policy
!
router bgp 65200
 bgp bestpath as-path multipath-relax
 address-family ipv4 unicast
  maximum-paths ebgp 32
 !
 neighbor 172.16.0.4
  address-family ipv4 unicast
   route-policy PASS in
   route-policy PASS out
  !
 !
 neighbor 172.16.0.8
  address-family ipv4 unicast
   route-policy PASS in
   route-policy PASS out
  !
 !
!
