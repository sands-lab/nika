srl_nokia-network-instance:network-instance:
- name: default
  type: default
  interface:
  - name: ethernet-1/5.0
  - name: ethernet-1/6.0
  - name: ethernet-1/7.0
  - name: ethernet-1/8.0
  - name: ethernet-1/9.0
  - name: ethernet-1/10.0
  - name: ethernet-1/11.0
  - name: ethernet-1/12.0
  - name: irb0.0
  protocols:
    srl_nokia-bgp:bgp:
      admin-state: enable
      autonomous-system: 65019
      router-id: 172.16.0.160
      ebgp-default-policy:
        export-reject-all: false
        import-reject-all: false
      afi-safi:
      - afi-safi-name: ipv4-unicast
        admin-state: enable
        multipath:
          allow-multiple-as: true
          maximum-paths: 32
      group:
      - group-name: ebgp
        admin-state: enable
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
          import-policy:
          - accept_all
          export-policy:
          - default_bgp_export
          - accept_all
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        timers:
          connect-retry: 10
          minimum-advertisement-interval: 1
        send-community:
          standard: true
          large: true
      neighbor:
      - peer-address: 172.16.0.161
        description: spine_1
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65001
      - peer-address: 172.16.0.163
        description: spine_2
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65002
      - peer-address: 172.16.0.165
        description: spine_3
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65003
      - peer-address: 172.16.0.167
        description: spine_4
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65004
      - peer-address: 172.16.0.169
        description: spine_5
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65005
      - peer-address: 172.16.0.171
        description: spine_6
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65006
      - peer-address: 172.16.0.173
        description: spine_7
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65007
      - peer-address: 172.16.0.175
        description: spine_8
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65008
  admin-state: enable
- name: rack
  type: mac-vrf
  admin-state: enable
  interface:
  - name: ethernet-1/1.0
  - name: ethernet-1/2.0
  - name: ethernet-1/3.0
  - name: ethernet-1/4.0
  - name: irb0.0
srl_nokia-routing-policy:routing-policy:
  policy:
  - name: accept_all
    default-action:
      policy-result: accept
  - name: ibgp-mark
    default-action:
      policy-result: reject
    statement:
    - name: mark-ibgp-routes
      action:
        bgp:
          communities:
            add: ibgp-mark
        policy-result: accept
  - name: default_bgp_export
    default-action:
      policy-result: reject
    statement:
    - name: prefixes
      match:
        prefix-set: default_bgp_advertise
      action:
        policy-result: next-policy
    - name: bgp
      match:
        protocol: bgp
      action:
        policy-result: next-policy
        bgp:
          communities:
            remove: ibgp-mark
  community-set:
  - name: ibgp-mark
    member:
    - 65536:0:65536
  prefix-set:
  - name: default_bgp_advertise
    prefix:
    - ip-prefix: 10.0.11.0/24
      mask-length-range: exact
