srl_nokia-network-instance:network-instance:
- name: default
  type: default
  interface:
  - name: ethernet-1/1.0
  - name: ethernet-1/2.0
  - name: ethernet-1/3.0
  - name: ethernet-1/4.0
  - name: ethernet-1/5.0
  - name: ethernet-1/6.0
  - name: ethernet-1/7.0
