  - name: ethernet-1/13.0
  - name: ethernet-1/14.0
  - name: ethernet-1/15.0
  - name: ethernet-1/16.0
  protocols:
    srl_nokia-bgp:bgp:
      admin-state: enable
      autonomous-system: 65008
      router-id: 172.16.0.15
      ebgp-default-policy:
        export-reject-all: false
        import-reject-all: false
      afi-safi:
      - afi-safi-name: ipv4-unicast
        admin-state: enable
        multipath:
          allow-multiple-as: true
          maximum-paths: 32
      group:
      - group-name: ebgp
        admin-state: enable
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
          import-policy:
          - accept_all
          export-policy:
          - default_bgp_export
          - accept_all
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        timers:
          connect-retry: 10
          minimum-advertisement-interval: 1
        send-community:
          standard: true
          large: true
      neighbor:
      - peer-address: 172.16.0.14
        description: leaf_1
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65009
      - peer-address: 172.16.0.30
        description: leaf_2
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65010
