srl_nokia-routing-policy:routing-policy:
  policy:
  - name: accept_all
    default-action:
      policy-result: accept
  - name: ibgp-mark
    default-action:
      policy-result: reject
    statement:
    - name: mark-ibgp-routes
      action:
        bgp:
          communities:
            add: ibgp-mark
        policy-result: accept
  - name: default_bgp_export
    default-action:
      policy-result: reject
    statement:
    - name: prefixes
      match:
        prefix-set: default_bgp_advertise
      action:
        policy-result: next-policy
    - name: bgp
      match:
        protocol: bgp
      action:
        policy-result: next-policy
        bgp:
          communities:
            remove: ibgp-mark
  community-set:
  - name: ibgp-mark
    member:
    - 65536:0:65536
  prefix-set:
  - name: default_bgp_advertise
    prefix: []
