!
  neighbor 172.16.1.86 remote-as 65105
  neighbor 172.16.1.86 description spine_router_0_5
!
  neighbor 172.16.1.102 remote-as 65106
  neighbor 172.16.1.102 description spine_router_0_6
!
  neighbor 172.16.1.118 remote-as 65107
  neighbor 172.16.1.118 description spine_router_0_7
!
 address-family ipv4 unicast
!

  network 10.0.3.0/24
!
  neighbor 172.16.1.6 activate
  no neighbor 172.16.1.6 send-community all
