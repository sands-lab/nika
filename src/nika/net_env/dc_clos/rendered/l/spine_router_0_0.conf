#!/usr/bin/vtysh -f
!
router bgp 65100
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.1
!
  neighbor 172.16.0.0 remote-as 65000
  neighbor 172.16.0.0 description super_spine_router_0
!
  neighbor 172.16.0.64 remote-as 65001
  neighbor 172.16.0.64 description super_spine_router_1
!
  neighbor 172.16.0.128 remote-as 65002
  neighbor 172.16.0.128 description super_spine_router_2
!
