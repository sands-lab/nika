  neighbor 172.16.0.89 remote-as 65005
  neighbor 172.16.0.89 description spine_5
!
  neighbor 172.16.0.91 remote-as 65006
  neighbor 172.16.0.91 description spine_6
!
  neighbor 172.16.0.93 remote-as 65007
  neighbor 172.16.0.93 description spine_7
!
  neighbor 172.16.0.95 remote-as 65008
  neighbor 172.16.0.95 description spine_8
!
 address-family ipv4 unicast
!

  network 10.0.6.0/24
!
  neighbor 172.16.0.81 activate
  no neighbor 172.16.0.81 send-community all
  neighbor 172.16.0.81 send-community standard
