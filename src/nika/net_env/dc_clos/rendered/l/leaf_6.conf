#!/usr/bin/vtysh -f
!
router bgp 65014
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.80
!
  neighbor 172.16.0.81 remote-as 65001
  neighbor 172.16.0.81 description spine_1
!
  neighbor 172.16.0.83 remote-as 65002
  neighbor 172.16.0.83 description spine_2
!
  neighbor 172.16.0.85 remote-as 65003
  neighbor 172.16.0.85 description spine_3
!
  neighbor 172.16.0.87 remote-as 65004
