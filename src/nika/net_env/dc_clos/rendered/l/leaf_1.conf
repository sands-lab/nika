hostname leaf_1
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth4
 no shutdown
 description leaf_1 -> spine_1 [external]
 ip address 172.16.0.0/31
!
interface eth5
 no shutdown
 description leaf_1 -> spine_2 [external]
 ip address 172.16.0.2/31
!
interface eth6
 no shutdown
 description leaf_1 -> spine_3 [external]
 ip address 172.16.0.4/31
!
interface eth7
 no shutdown
 description leaf_1 -> spine_4 [external]
 ip address 172.16.0.6/31
!
interface eth8
 no shutdown
 description leaf_1 -> spine_5 [external]
 ip address 172.16.0.8/31
!
interface eth9
 no shutdown
 description leaf_1 -> spine_6 [external]
 ip address 172.16.0.10/31
!
interface eth10
 no shutdown
 description leaf_1 -> spine_7 [external]
 ip address 172.16.0.12/31
!
interface eth11
 no shutdown
 description leaf_1 -> spine_8 [external]
 ip address 172.16.0.14/31
!
interface br0
 no shutdown
 description leaf_1 -> stub [stub]
 ip address 10.0.1.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65009
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.0
!
  neighbor 172.16.0.1 remote-as 65001
  neighbor 172.16.0.1 description spine_1
!
  neighbor 172.16.0.3 remote-as 65002
  neighbor 172.16.0.3 description spine_2
!
  neighbor 172.16.0.5 remote-as 65003
  neighbor 172.16.0.5 description spine_3
!
  neighbor 172.16.0.7 remote-as 65004
  neighbor 172.16.0.7 description spine_4
!
  neighbor 172.16.0.9 remote-as 65005
  neighbor 172.16.0.9 description spine_5
!
  neighbor 172.16.0.11 remote-as 65006
  neighbor 172.16.0.11 description spine_6
!
  neighbor 172.16.0.13 remote-as 65007
  neighbor 172.16.0.13 description spine_7
!
  neighbor 172.16.0.15 remote-as 65008
  neighbor 172.16.0.15 description spine_8
!
 address-family ipv4 unicast
!

  network 10.0.1.0/24
!
  neighbor 172.16.0.1 activate
  no neighbor 172.16.0.1 send-community all
  neighbor 172.16.0.1 send-community standard
  neighbor 172.16.0.1 send-community large
!
  neighbor 172.16.0.3 activate
  no neighbor 172.16.0.3 send-community all
  neighbor 172.16.0.3 send-community standard
  neighbor 172.16.0.3 send-community large
!
  neighbor 172.16.0.5 activate
  no neighbor 172.16.0.5 send-community all
  neighbor 172.16.0.5 send-community standard
  neighbor 172.16.0.5 send-community large
!
  neighbor 172.16.0.7 activate
  no neighbor 172.16.0.7 send-community all
  neighbor 172.16.0.7 send-community standard
  neighbor 172.16.0.7 send-community large
!
  neighbor 172.16.0.9 activate
  no neighbor 172.16.0.9 send-community all
  neighbor 172.16.0.9 send-community standard
  neighbor 172.16.0.9 send-community large
!
  neighbor 172.16.0.11 activate
  no neighbor 172.16.0.11 send-community all
  neighbor 172.16.0.11 send-community standard
  neighbor 172.16.0.11 send-community large
!
  neighbor 172.16.0.13 activate
  no neighbor 172.16.0.13 send-community all
  neighbor 172.16.0.13 send-community standard
  neighbor 172.16.0.13 send-community large
!
  neighbor 172.16.0.15 activate
  no neighbor 172.16.0.15 send-community all
  neighbor 172.16.0.15 send-community standard
  neighbor 172.16.0.15 send-community large
!
!
router bgp 65009
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
