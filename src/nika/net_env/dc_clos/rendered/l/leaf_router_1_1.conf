#!/usr/bin/vtysh -f
!
router bgp 65211
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.1.131
!
  neighbor 172.16.1.130 remote-as 65110
  neighbor 172.16.1.130 description spine_router_1_0
!
  neighbor 172.16.1.146 remote-as 65111
  neighbor 172.16.1.146 description spine_router_1_1
!
  neighbor 172.16.1.162 remote-as 65112
  neighbor 172.16.1.162 description spine_router_1_2
!
  neighbor 172.16.1.178 remote-as 65113
  neighbor 172.16.1.178 description spine_router_1_3
!
  neighbor 172.16.1.194 remote-as 65114
  neighbor 172.16.1.194 description spine_router_1_4
!
  neighbor 172.16.1.210 remote-as 65115
  neighbor 172.16.1.210 description spine_router_1_5
!
  neighbor 172.16.1.226 remote-as 65116
  neighbor 172.16.1.226 description spine_router_1_6
!
  neighbor 172.16.1.242 remote-as 65117
  neighbor 172.16.1.242 description spine_router_1_7
!
 address-family ipv4 unicast
!

  network 10.1.1.0/24
!
  neighbor 172.16.1.130 activate
  no neighbor 172.16.1.130 send-community all
  neighbor 172.16.1.130 send-community standard
  neighbor 172.16.1.130 send-community large
!
  neighbor 172.16.1.146 activate
  no neighbor 172.16.1.146 send-community all
  neighbor 172.16.1.146 send-community standard
  neighbor 172.16.1.146 send-community large
!
  neighbor 172.16.1.162 activate
  no neighbor 172.16.1.162 send-community all
  neighbor 172.16.1.162 send-community standard
  neighbor 172.16.1.162 send-community large
!
  neighbor 172.16.1.178 activate
  no neighbor 172.16.1.178 send-community all
  neighbor 172.16.1.178 send-community standard
  neighbor 172.16.1.178 send-community large
!
  neighbor 172.16.1.194 activate
  no neighbor 172.16.1.194 send-community all
  neighbor 172.16.1.194 send-community standard
  neighbor 172.16.1.194 send-community large
!
  neighbor 172.16.1.210 activate
  no neighbor 172.16.1.210 send-community all
  neighbor 172.16.1.210 send-community standard
  neighbor 172.16.1.210 send-community large
!
  neighbor 172.16.1.226 activate
