  neighbor 172.16.1.226 send-community standard
  neighbor 172.16.1.226 send-community large
!
  neighbor 172.16.1.242 activate
  no neighbor 172.16.1.242 send-community all
  neighbor 172.16.1.242 send-community standard
  neighbor 172.16.1.242 send-community large
!
!
router bgp 65211
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
