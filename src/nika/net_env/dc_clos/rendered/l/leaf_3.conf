#!/usr/bin/vtysh -f
!
router bgp 65011
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.32
!
  neighbor 172.16.0.33 remote-as 65001
  neighbor 172.16.0.33 description spine_1
!
  neighbor 172.16.0.35 remote-as 65002
  neighbor 172.16.0.35 description spine_2
!
  neighbor 172.16.0.37 remote-as 65003
  neighbor 172.16.0.37 description spine_3
!
  neighbor 172.16.0.39 remote-as 65004
  neighbor 172.16.0.39 description spine_4
!
  neighbor 172.16.0.41 remote-as 65005
  neighbor 172.16.0.41 description spine_5
!
  neighbor 172.16.0.43 remote-as 65006
  neighbor 172.16.0.43 description spine_6
!
  neighbor 172.16.0.45 remote-as 65007
  neighbor 172.16.0.45 description spine_7
!
  neighbor 172.16.0.47 remote-as 65008
  neighbor 172.16.0.47 description spine_8
!
 address-family ipv4 unicast
!

  network 10.0.3.0/24
!
  neighbor 172.16.0.33 activate
  no neighbor 172.16.0.33 send-community all
  neighbor 172.16.0.33 send-community standard
  neighbor 172.16.0.33 send-community large
!
  neighbor 172.16.0.35 activate
  no neighbor 172.16.0.35 send-community all
  neighbor 172.16.0.35 send-community standard
  neighbor 172.16.0.35 send-community large
!
  neighbor 172.16.0.37 activate
  no neighbor 172.16.0.37 send-community all
  neighbor 172.16.0.37 send-community standard
  neighbor 172.16.0.37 send-community large
!
  neighbor 172.16.0.39 activate
  no neighbor 172.16.0.39 send-community all
  neighbor 172.16.0.39 send-community standard
  neighbor 172.16.0.39 send-community large
!
  neighbor 172.16.0.41 activate
  no neighbor 172.16.0.41 send-community all
  neighbor 172.16.0.41 send-community standard
  neighbor 172.16.0.41 send-community large
!
  neighbor 172.16.0.43 activate
  no neighbor 172.16.0.43 send-community all
  neighbor 172.16.0.43 send-community standard
  neighbor 172.16.0.43 send-community large
!
  neighbor 172.16.0.45 activate
  no neighbor 172.16.0.45 send-community all
  neighbor 172.16.0.45 send-community standard
  neighbor 172.16.0.45 send-community large
!
  neighbor 172.16.0.47 activate
  no neighbor 172.16.0.47 send-community all
  neighbor 172.16.0.47 send-community standard
  neighbor 172.16.0.47 send-community large
!
!
router bgp 65011
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
