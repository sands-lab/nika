!
interface eth6
 no shutdown
 description leaf_3 -> spine_3 [external]
 ip address 172.16.0.36/31
!
interface eth7
 no shutdown
 description leaf_3 -> spine_4 [external]
 ip address 172.16.0.38/31
!
interface eth8
 no shutdown
 description leaf_3 -> spine_5 [external]
 ip address 172.16.0.40/31
!
