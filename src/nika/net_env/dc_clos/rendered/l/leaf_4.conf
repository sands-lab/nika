 no shutdown
 description leaf_4 -> spine_3 [external]
 ip address 172.16.0.52/31
!
interface eth7
 no shutdown
 description leaf_4 -> spine_4 [external]
 ip address 172.16.0.54/31
!
interface eth8
 no shutdown
 description leaf_4 -> spine_5 [external]
 ip address 172.16.0.56/31
!
interface eth9
 no shutdown
 description leaf_4 -> spine_6 [external]
