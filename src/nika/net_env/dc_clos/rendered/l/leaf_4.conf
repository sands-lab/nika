  neighbor 172.16.0.53 send-community standard
  neighbor 172.16.0.53 send-community large
!
  neighbor 172.16.0.55 activate
  no neighbor 172.16.0.55 send-community all
  neighbor 172.16.0.55 send-community standard
  neighbor 172.16.0.55 send-community large
!
  neighbor 172.16.0.57 activate
  no neighbor 172.16.0.57 send-community all
  neighbor 172.16.0.57 send-community standard
  neighbor 172.16.0.57 send-community large
!
  neighbor 172.16.0.59 activate
  no neighbor 172.16.0.59 send-community all
  neighbor 172.16.0.59 send-community standard
  neighbor 172.16.0.59 send-community large
!
  neighbor 172.16.0.61 activate
  no neighbor 172.16.0.61 send-community all
  neighbor 172.16.0.61 send-community standard
  neighbor 172.16.0.61 send-community large
!
  neighbor 172.16.0.63 activate
  no neighbor 172.16.0.63 send-community all
  neighbor 172.16.0.63 send-community standard
  neighbor 172.16.0.63 send-community large
