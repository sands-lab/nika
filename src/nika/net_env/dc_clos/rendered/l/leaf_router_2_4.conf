#!/usr/bin/vtysh -f
!
router bgp 65224
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.2.9
!
  neighbor 172.16.2.8 remote-as 65120
  neighbor 172.16.2.8 description spine_router_2_0
!
  neighbor 172.16.2.24 remote-as 65121
  neighbor 172.16.2.24 description spine_router_2_1
!
  neighbor 172.16.2.40 remote-as 65122
  neighbor 172.16.2.40 description spine_router_2_2
!
  neighbor 172.16.2.56 remote-as 65123
  neighbor 172.16.2.56 description spine_router_2_3
!
  neighbor 172.16.2.72 remote-as 65124
  neighbor 172.16.2.72 description spine_router_2_4
!
  neighbor 172.16.2.88 remote-as 65125
  neighbor 172.16.2.88 description spine_router_2_5
!
  neighbor 172.16.2.104 remote-as 65126
  neighbor 172.16.2.104 description spine_router_2_6
!
  neighbor 172.16.2.120 remote-as 65127
  neighbor 172.16.2.120 description spine_router_2_7
!
 address-family ipv4 unicast
!

  network 10.2.4.0/24
!
  neighbor 172.16.2.8 activate
  no neighbor 172.16.2.8 send-community all
  neighbor 172.16.2.8 send-community standard
  neighbor 172.16.2.8 send-community large
!
  neighbor 172.16.2.24 activate
  no neighbor 172.16.2.24 send-community all
  neighbor 172.16.2.24 send-community standard
  neighbor 172.16.2.24 send-community large
!
  neighbor 172.16.2.40 activate
