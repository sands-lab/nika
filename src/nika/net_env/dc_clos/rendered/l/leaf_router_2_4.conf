  neighbor 172.16.2.56 send-community standard
  neighbor 172.16.2.56 send-community large
!
  neighbor 172.16.2.72 activate
  no neighbor 172.16.2.72 send-community all
  neighbor 172.16.2.72 send-community standard
  neighbor 172.16.2.72 send-community large
!
  neighbor 172.16.2.88 activate
