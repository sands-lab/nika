#!/usr/bin/vtysh -f
!
router bgp 65013
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.64
!
  neighbor 172.16.0.65 remote-as 65001
  neighbor 172.16.0.65 description spine_1
!
  neighbor 172.16.0.67 remote-as 65002
  neighbor 172.16.0.67 description spine_2
!
  neighbor 172.16.0.69 remote-as 65003
  neighbor 172.16.0.69 description spine_3
!
  neighbor 172.16.0.71 remote-as 65004
  neighbor 172.16.0.71 description spine_4
!
  neighbor 172.16.0.73 remote-as 65005
  neighbor 172.16.0.73 description spine_5
!
  neighbor 172.16.0.75 remote-as 65006
  neighbor 172.16.0.75 description spine_6
!
  neighbor 172.16.0.77 remote-as 65007
  neighbor 172.16.0.77 description spine_7
!
  neighbor 172.16.0.79 remote-as 65008
  neighbor 172.16.0.79 description spine_8
!
 address-family ipv4 unicast
!

  network 10.0.5.0/24
!
  neighbor 172.16.0.65 activate
  no neighbor 172.16.0.65 send-community all
  neighbor 172.16.0.65 send-community standard
