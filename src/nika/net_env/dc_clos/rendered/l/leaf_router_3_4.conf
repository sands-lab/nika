  neighbor 172.16.2.232 description spine_router_3_6
!
  neighbor 172.16.2.248 remote-as 65137
  neighbor 172.16.2.248 description spine_router_3_7
!
 address-family ipv4 unicast
!

  network 10.3.4.0/24
