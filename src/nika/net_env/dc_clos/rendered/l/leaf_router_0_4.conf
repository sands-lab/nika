#!/usr/bin/vtysh -f
!
router bgp 65204
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.1.9
!
  neighbor 172.16.1.8 remote-as 65100
  neighbor 172.16.1.8 description spine_router_0_0
!
  neighbor 172.16.1.24 remote-as 65101
  neighbor 172.16.1.24 description spine_router_0_1
!
  neighbor 172.16.1.40 remote-as 65102
  neighbor 172.16.1.40 description spine_router_0_2
!
