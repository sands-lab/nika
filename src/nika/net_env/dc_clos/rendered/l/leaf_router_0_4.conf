!
  neighbor 172.16.1.88 remote-as 65105
  neighbor 172.16.1.88 description spine_router_0_5
!
  neighbor 172.16.1.104 remote-as 65106
  neighbor 172.16.1.104 description spine_router_0_6
!
  neighbor 172.16.1.120 remote-as 65107
  neighbor 172.16.1.120 description spine_router_0_7
!
 address-family ipv4 unicast
!

  network 10.0.4.0/24
!
  neighbor 172.16.1.8 activate
  no neighbor 172.16.1.8 send-community all
