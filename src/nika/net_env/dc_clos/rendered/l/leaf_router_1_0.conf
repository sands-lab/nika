#!/usr/bin/vtysh -f
!
router bgp 65210
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.1.129
!
  neighbor 172.16.1.128 remote-as 65110
  neighbor 172.16.1.128 description spine_router_1_0
!
  neighbor 172.16.1.144 remote-as 65111
  neighbor 172.16.1.144 description spine_router_1_1
!
  neighbor 172.16.1.160 remote-as 65112
  neighbor 172.16.1.160 description spine_router_1_2
!
  neighbor 172.16.1.176 remote-as 65113
  neighbor 172.16.1.176 description spine_router_1_3
!
  neighbor 172.16.1.192 remote-as 65114
  neighbor 172.16.1.192 description spine_router_1_4
!
  neighbor 172.16.1.208 remote-as 65115
  neighbor 172.16.1.208 description spine_router_1_5
!
  neighbor 172.16.1.224 remote-as 65116
  neighbor 172.16.1.224 description spine_router_1_6
!
  neighbor 172.16.1.240 remote-as 65117
  neighbor 172.16.1.240 description spine_router_1_7
!
 address-family ipv4 unicast
!

  network 10.1.0.0/24
!
  neighbor 172.16.1.128 activate
  no neighbor 172.16.1.128 send-community all
  neighbor 172.16.1.128 send-community standard
  neighbor 172.16.1.128 send-community large
!
  neighbor 172.16.1.144 activate
  no neighbor 172.16.1.144 send-community all
  neighbor 172.16.1.144 send-community standard
  neighbor 172.16.1.144 send-community large
!
  neighbor 172.16.1.160 activate
  no neighbor 172.16.1.160 send-community all
  neighbor 172.16.1.160 send-community standard
  neighbor 172.16.1.160 send-community large
!
  neighbor 172.16.1.176 activate
  no neighbor 172.16.1.176 send-community all
  neighbor 172.16.1.176 send-community standard
  neighbor 172.16.1.176 send-community large
!
  neighbor 172.16.1.192 activate
  no neighbor 172.16.1.192 send-community all
  neighbor 172.16.1.192 send-community standard
  neighbor 172.16.1.192 send-community large
!
  neighbor 172.16.1.208 activate
  no neighbor 172.16.1.208 send-community all
  neighbor 172.16.1.208 send-community standard
  neighbor 172.16.1.208 send-community large
!
  neighbor 172.16.1.224 activate
  no neighbor 172.16.1.224 send-community all
  neighbor 172.16.1.224 send-community standard
  neighbor 172.16.1.224 send-community large
!
  neighbor 172.16.1.240 activate
  no neighbor 172.16.1.240 send-community all
  neighbor 172.16.1.240 send-community standard
  neighbor 172.16.1.240 send-community large
!
!
router bgp 65210
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
