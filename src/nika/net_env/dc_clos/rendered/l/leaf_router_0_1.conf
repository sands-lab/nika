#!/usr/bin/vtysh -f
!
router bgp 65201
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.1.3
!
  neighbor 172.16.1.2 remote-as 65100
  neighbor 172.16.1.2 description spine_router_0_0
!
  neighbor 172.16.1.18 remote-as 65101
  neighbor 172.16.1.18 description spine_router_0_1
!
  neighbor 172.16.1.34 remote-as 65102
  neighbor 172.16.1.34 description spine_router_0_2
!
  neighbor 172.16.1.50 remote-as 65103
  neighbor 172.16.1.50 description spine_router_0_3
!
  neighbor 172.16.1.66 remote-as 65104
  neighbor 172.16.1.66 description spine_router_0_4
!
  neighbor 172.16.1.82 remote-as 65105
  neighbor 172.16.1.82 description spine_router_0_5
!
  neighbor 172.16.1.98 remote-as 65106
  neighbor 172.16.1.98 description spine_router_0_6
!
  neighbor 172.16.1.114 remote-as 65107
  neighbor 172.16.1.114 description spine_router_0_7
!
 address-family ipv4 unicast
!

  network 10.0.1.0/24
!
  neighbor 172.16.1.2 activate
  no neighbor 172.16.1.2 send-community all
  neighbor 172.16.1.2 send-community standard
  neighbor 172.16.1.2 send-community large
!
  neighbor 172.16.1.18 activate
  no neighbor 172.16.1.18 send-community all
  neighbor 172.16.1.18 send-community standard
  neighbor 172.16.1.18 send-community large
!
  neighbor 172.16.1.34 activate
  no neighbor 172.16.1.34 send-community all
  neighbor 172.16.1.34 send-community standard
  neighbor 172.16.1.34 send-community large
!
  neighbor 172.16.1.50 activate
  no neighbor 172.16.1.50 send-community all
  neighbor 172.16.1.50 send-community standard
  neighbor 172.16.1.50 send-community large
!
  neighbor 172.16.1.66 activate
  no neighbor 172.16.1.66 send-community all
  neighbor 172.16.1.66 send-community standard
  neighbor 172.16.1.66 send-community large
!
  neighbor 172.16.1.82 activate
  no neighbor 172.16.1.82 send-community all
  neighbor 172.16.1.82 send-community standard
  neighbor 172.16.1.82 send-community large
!
  neighbor 172.16.1.98 activate
  no neighbor 172.16.1.98 send-community all
  neighbor 172.16.1.98 send-community standard
  neighbor 172.16.1.98 send-community large
!
  neighbor 172.16.1.114 activate
  no neighbor 172.16.1.114 send-community all
  neighbor 172.16.1.114 send-community standard
  neighbor 172.16.1.114 send-community large
!
!
router bgp 65201
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
