#!/usr/bin/vtysh -f
!
router bgp 65231
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.2.131
!
  neighbor 172.16.2.130 remote-as 65130
  neighbor 172.16.2.130 description spine_router_3_0
!
  neighbor 172.16.2.146 remote-as 65131
  neighbor 172.16.2.146 description spine_router_3_1
!
  neighbor 172.16.2.162 remote-as 65132
  neighbor 172.16.2.162 description spine_router_3_2
!
  neighbor 172.16.2.178 remote-as 65133
  neighbor 172.16.2.178 description spine_router_3_3
!
  neighbor 172.16.2.194 remote-as 65134
  neighbor 172.16.2.194 description spine_router_3_4
!
  neighbor 172.16.2.210 remote-as 65135
  neighbor 172.16.2.210 description spine_router_3_5
!
  neighbor 172.16.2.226 remote-as 65136
  neighbor 172.16.2.226 description spine_router_3_6
!
  neighbor 172.16.2.242 remote-as 65137
  neighbor 172.16.2.242 description spine_router_3_7
!
 address-family ipv4 unicast
!

  network 10.3.1.0/24
!
  neighbor 172.16.2.130 activate
  no neighbor 172.16.2.130 send-community all
  neighbor 172.16.2.130 send-community standard
  neighbor 172.16.2.130 send-community large
!
  neighbor 172.16.2.146 activate
