#!/usr/bin/vtysh -f
!
router bgp 65230
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.2.129
!
  neighbor 172.16.2.128 remote-as 65130
  neighbor 172.16.2.128 description spine_router_3_0
!
  neighbor 172.16.2.144 remote-as 65131
  neighbor 172.16.2.144 description spine_router_3_1
!
  neighbor 172.16.2.160 remote-as 65132
  neighbor 172.16.2.160 description spine_router_3_2
!
  neighbor 172.16.2.176 remote-as 65133
