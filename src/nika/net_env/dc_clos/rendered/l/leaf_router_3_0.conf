!
  neighbor 172.16.2.192 remote-as 65134
  neighbor 172.16.2.192 description spine_router_3_4
!
  neighbor 172.16.2.208 remote-as 65135
  neighbor 172.16.2.208 description spine_router_3_5
!
  neighbor 172.16.2.224 remote-as 65136
  neighbor 172.16.2.224 description spine_router_3_6
!
  neighbor 172.16.2.240 remote-as 65137
  neighbor 172.16.2.240 description spine_router_3_7
!
 address-family ipv4 unicast
!

  network 10.3.0.0/24
!
  neighbor 172.16.2.128 activate
  no neighbor 172.16.2.128 send-community all
  neighbor 172.16.2.128 send-community standard
  neighbor 172.16.2.128 send-community large
!
  neighbor 172.16.2.144 activate
  no neighbor 172.16.2.144 send-community all
  neighbor 172.16.2.144 send-community standard
  neighbor 172.16.2.144 send-community large
!
