#!/usr/bin/vtysh -f
!
router bgp 65200
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.1.1
!
  neighbor 172.16.1.0 remote-as 65100
  neighbor 172.16.1.0 description spine_router_0_0
!
  neighbor 172.16.1.16 remote-as 65101
  neighbor 172.16.1.16 description spine_router_0_1
!
  neighbor 172.16.1.32 remote-as 65102
  neighbor 172.16.1.32 description spine_router_0_2
!
  neighbor 172.16.1.48 remote-as 65103
  neighbor 172.16.1.48 description spine_router_0_3
!
  neighbor 172.16.1.64 remote-as 65104
  neighbor 172.16.1.64 description spine_router_0_4
!
  neighbor 172.16.1.80 remote-as 65105
  neighbor 172.16.1.80 description spine_router_0_5
!
  neighbor 172.16.1.96 remote-as 65106
  neighbor 172.16.1.96 description spine_router_0_6
!
  neighbor 172.16.1.112 remote-as 65107
  neighbor 172.16.1.112 description spine_router_0_7
!
 address-family ipv4 unicast
!

  network 10.0.0.0/24
!
  neighbor 172.16.1.0 activate
  no neighbor 172.16.1.0 send-community all
  neighbor 172.16.1.0 send-community standard
  neighbor 172.16.1.0 send-community large
!
  neighbor 172.16.1.16 activate
  no neighbor 172.16.1.16 send-community all
  neighbor 172.16.1.16 send-community standard
  neighbor 172.16.1.16 send-community large
!
  neighbor 172.16.1.32 activate
  no neighbor 172.16.1.32 send-community all
  neighbor 172.16.1.32 send-community standard
  neighbor 172.16.1.32 send-community large
!
  neighbor 172.16.1.48 activate
  no neighbor 172.16.1.48 send-community all
  neighbor 172.16.1.48 send-community standard
  neighbor 172.16.1.48 send-community large
!
  neighbor 172.16.1.64 activate
  no neighbor 172.16.1.64 send-community all
  neighbor 172.16.1.64 send-community standard
  neighbor 172.16.1.64 send-community large
!
  neighbor 172.16.1.80 activate
  no neighbor 172.16.1.80 send-community all
  neighbor 172.16.1.80 send-community standard
  neighbor 172.16.1.80 send-community large
!
  neighbor 172.16.1.96 activate
  no neighbor 172.16.1.96 send-community all
  neighbor 172.16.1.96 send-community standard
  neighbor 172.16.1.96 send-community large
!
  neighbor 172.16.1.112 activate
  no neighbor 172.16.1.112 send-community all
  neighbor 172.16.1.112 send-community standard
  neighbor 172.16.1.112 send-community large
!
!
router bgp 65200
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
