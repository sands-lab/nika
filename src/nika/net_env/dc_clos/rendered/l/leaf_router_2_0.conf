#!/usr/bin/vtysh -f
!
router bgp 65220
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.2.1
!
  neighbor 172.16.2.0 remote-as 65120
  neighbor 172.16.2.0 description spine_router_2_0
!
  neighbor 172.16.2.16 remote-as 65121
  neighbor 172.16.2.16 description spine_router_2_1
!
  neighbor 172.16.2.32 remote-as 65122
  neighbor 172.16.2.32 description spine_router_2_2
!
  neighbor 172.16.2.48 remote-as 65123
  neighbor 172.16.2.48 description spine_router_2_3
!
  neighbor 172.16.2.64 remote-as 65124
  neighbor 172.16.2.64 description spine_router_2_4
!
  neighbor 172.16.2.80 remote-as 65125
  neighbor 172.16.2.80 description spine_router_2_5
!
  neighbor 172.16.2.96 remote-as 65126
  neighbor 172.16.2.96 description spine_router_2_6
!
  neighbor 172.16.2.112 remote-as 65127
  neighbor 172.16.2.112 description spine_router_2_7
!
 address-family ipv4 unicast
!

  network 10.2.0.0/24
!
  neighbor 172.16.2.0 activate
  no neighbor 172.16.2.0 send-community all
  neighbor 172.16.2.0 send-community standard
  neighbor 172.16.2.0 send-community large
!
  neighbor 172.16.2.16 activate
  no neighbor 172.16.2.16 send-community all
  neighbor 172.16.2.16 send-community standard
  neighbor 172.16.2.16 send-community large
!
  neighbor 172.16.2.32 activate
  no neighbor 172.16.2.32 send-community all
  neighbor 172.16.2.32 send-community standard
  neighbor 172.16.2.32 send-community large
!
  neighbor 172.16.2.48 activate
  no neighbor 172.16.2.48 send-community all
  neighbor 172.16.2.48 send-community standard
  neighbor 172.16.2.48 send-community large
!
  neighbor 172.16.2.64 activate
  no neighbor 172.16.2.64 send-community all
  neighbor 172.16.2.64 send-community standard
  neighbor 172.16.2.64 send-community large
!
  neighbor 172.16.2.80 activate
  no neighbor 172.16.2.80 send-community all
  neighbor 172.16.2.80 send-community standard
  neighbor 172.16.2.80 send-community large
!
  neighbor 172.16.2.96 activate
  no neighbor 172.16.2.96 send-community all
  neighbor 172.16.2.96 send-community standard
  neighbor 172.16.2.96 send-community large
!
  neighbor 172.16.2.112 activate
  no neighbor 172.16.2.112 send-community all
  neighbor 172.16.2.112 send-community standard
  neighbor 172.16.2.112 send-community large
!
!
router bgp 65220
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
