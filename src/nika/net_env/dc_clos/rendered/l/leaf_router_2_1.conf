#!/usr/bin/vtysh -f
!
router bgp 65221
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.2.3
!
  neighbor 172.16.2.2 remote-as 65120
  neighbor 172.16.2.2 description spine_router_2_0
!
  neighbor 172.16.2.18 remote-as 65121
  neighbor 172.16.2.18 description spine_router_2_1
!
  neighbor 172.16.2.34 remote-as 65122
  neighbor 172.16.2.34 description spine_router_2_2
!
  neighbor 172.16.2.50 remote-as 65123
  neighbor 172.16.2.50 description spine_router_2_3
!
  neighbor 172.16.2.66 remote-as 65124
  neighbor 172.16.2.66 description spine_router_2_4
!
  neighbor 172.16.2.82 remote-as 65125
  neighbor 172.16.2.82 description spine_router_2_5
!
  neighbor 172.16.2.98 remote-as 65126
  neighbor 172.16.2.98 description spine_router_2_6
!
  neighbor 172.16.2.114 remote-as 65127
  neighbor 172.16.2.114 description spine_router_2_7
!
 address-family ipv4 unicast
!

  network 10.2.1.0/24
!
  neighbor 172.16.2.2 activate
  no neighbor 172.16.2.2 send-community all
  neighbor 172.16.2.2 send-community standard
  neighbor 172.16.2.2 send-community large
!
  neighbor 172.16.2.18 activate
  no neighbor 172.16.2.18 send-community all
  neighbor 172.16.2.18 send-community standard
  neighbor 172.16.2.18 send-community large
!
  neighbor 172.16.2.34 activate
  no neighbor 172.16.2.34 send-community all
  neighbor 172.16.2.34 send-community standard
  neighbor 172.16.2.34 send-community large
!
  neighbor 172.16.2.50 activate
  no neighbor 172.16.2.50 send-community all
  neighbor 172.16.2.50 send-community standard
  neighbor 172.16.2.50 send-community large
!
  neighbor 172.16.2.66 activate
  no neighbor 172.16.2.66 send-community all
  neighbor 172.16.2.66 send-community standard
  neighbor 172.16.2.66 send-community large
!
  neighbor 172.16.2.82 activate
  no neighbor 172.16.2.82 send-community all
  neighbor 172.16.2.82 send-community standard
  neighbor 172.16.2.82 send-community large
!
  neighbor 172.16.2.98 activate
  no neighbor 172.16.2.98 send-community all
  neighbor 172.16.2.98 send-community standard
  neighbor 172.16.2.98 send-community large
!
  neighbor 172.16.2.114 activate
  no neighbor 172.16.2.114 send-community all
  neighbor 172.16.2.114 send-community standard
  neighbor 172.16.2.114 send-community large
!
!
router bgp 65221
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
