#!/usr/bin/vtysh -f
!
router bgp 65023
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.224
!
  neighbor 172.16.0.225 remote-as 65001
  neighbor 172.16.0.225 description spine_1
!
  neighbor 172.16.0.227 remote-as 65002
  neighbor 172.16.0.227 description spine_2
!
  neighbor 172.16.0.229 remote-as 65003
  neighbor 172.16.0.229 description spine_3
!
  neighbor 172.16.0.231 remote-as 65004
  neighbor 172.16.0.231 description spine_4
!
  neighbor 172.16.0.233 remote-as 65005
  neighbor 172.16.0.233 description spine_5
!
  neighbor 172.16.0.235 remote-as 65006
  neighbor 172.16.0.235 description spine_6
!
  neighbor 172.16.0.237 remote-as 65007
  neighbor 172.16.0.237 description spine_7
!
  neighbor 172.16.0.239 remote-as 65008
  neighbor 172.16.0.239 description spine_8
!
 address-family ipv4 unicast
!

  network 10.0.15.0/24
!
  neighbor 172.16.0.225 activate
  no neighbor 172.16.0.225 send-community all
  neighbor 172.16.0.225 send-community standard
  neighbor 172.16.0.225 send-community large
!
  neighbor 172.16.0.227 activate
  no neighbor 172.16.0.227 send-community all
  neighbor 172.16.0.227 send-community standard
  neighbor 172.16.0.227 send-community large
!
  neighbor 172.16.0.229 activate
