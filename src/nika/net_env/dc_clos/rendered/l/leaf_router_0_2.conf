#!/usr/bin/vtysh -f
!
router bgp 65202
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.1.5
!
  neighbor 172.16.1.4 remote-as 65100
  neighbor 172.16.1.4 description spine_router_0_0
!
  neighbor 172.16.1.20 remote-as 65101
  neighbor 172.16.1.20 description spine_router_0_1
!
  neighbor 172.16.1.36 remote-as 65102
  neighbor 172.16.1.36 description spine_router_0_2
!
  neighbor 172.16.1.52 remote-as 65103
  neighbor 172.16.1.52 description spine_router_0_3
!
  neighbor 172.16.1.68 remote-as 65104
  neighbor 172.16.1.68 description spine_router_0_4
!
  neighbor 172.16.1.84 remote-as 65105
  neighbor 172.16.1.84 description spine_router_0_5
!
  neighbor 172.16.1.100 remote-as 65106
  neighbor 172.16.1.100 description spine_router_0_6
!
  neighbor 172.16.1.116 remote-as 65107
  neighbor 172.16.1.116 description spine_router_0_7
!
 address-family ipv4 unicast
!

  network 10.0.2.0/24
!
  neighbor 172.16.1.4 activate
  no neighbor 172.16.1.4 send-community all
  neighbor 172.16.1.4 send-community standard
  neighbor 172.16.1.4 send-community large
!
  neighbor 172.16.1.20 activate
  no neighbor 172.16.1.20 send-community all
  neighbor 172.16.1.20 send-community standard
  neighbor 172.16.1.20 send-community large
!
  neighbor 172.16.1.36 activate
