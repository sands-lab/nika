  neighbor 172.16.2.102 send-community standard
  neighbor 172.16.2.102 send-community large
!
  neighbor 172.16.2.118 activate
  no neighbor 172.16.2.118 send-community all
  neighbor 172.16.2.118 send-community standard
  neighbor 172.16.2.118 send-community large
!
!
router bgp 65223
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
