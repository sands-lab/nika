#!/usr/bin/vtysh -f
!
router bgp 65223
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.2.7
!
  neighbor 172.16.2.6 remote-as 65120
  neighbor 172.16.2.6 description spine_router_2_0
!
  neighbor 172.16.2.22 remote-as 65121
  neighbor 172.16.2.22 description spine_router_2_1
!
  neighbor 172.16.2.38 remote-as 65122
  neighbor 172.16.2.38 description spine_router_2_2
!
  neighbor 172.16.2.54 remote-as 65123
  neighbor 172.16.2.54 description spine_router_2_3
!
  neighbor 172.16.2.70 remote-as 65124
  neighbor 172.16.2.70 description spine_router_2_4
!
  neighbor 172.16.2.86 remote-as 65125
  neighbor 172.16.2.86 description spine_router_2_5
!
  neighbor 172.16.2.102 remote-as 65126
  neighbor 172.16.2.102 description spine_router_2_6
!
  neighbor 172.16.2.118 remote-as 65127
  neighbor 172.16.2.118 description spine_router_2_7
!
 address-family ipv4 unicast
!

  network 10.2.3.0/24
!
  neighbor 172.16.2.6 activate
  no neighbor 172.16.2.6 send-community all
  neighbor 172.16.2.6 send-community standard
  neighbor 172.16.2.6 send-community large
!
  neighbor 172.16.2.22 activate
  no neighbor 172.16.2.22 send-community all
  neighbor 172.16.2.22 send-community standard
  neighbor 172.16.2.22 send-community large
!
  neighbor 172.16.2.38 activate
  no neighbor 172.16.2.38 send-community all
  neighbor 172.16.2.38 send-community standard
  neighbor 172.16.2.38 send-community large
!
  neighbor 172.16.2.54 activate
  no neighbor 172.16.2.54 send-community all
  neighbor 172.16.2.54 send-community standard
  neighbor 172.16.2.54 send-community large
!
  neighbor 172.16.2.70 activate
  no neighbor 172.16.2.70 send-community all
  neighbor 172.16.2.70 send-community standard
  neighbor 172.16.2.70 send-community large
!
  neighbor 172.16.2.86 activate
  no neighbor 172.16.2.86 send-community all
  neighbor 172.16.2.86 send-community standard
  neighbor 172.16.2.86 send-community large
!
  neighbor 172.16.2.102 activate
