#!/usr/bin/vtysh -f
!
router bgp 65222
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.2.5
!
  neighbor 172.16.2.4 remote-as 65120
  neighbor 172.16.2.4 description spine_router_2_0
!
  neighbor 172.16.2.20 remote-as 65121
  neighbor 172.16.2.20 description spine_router_2_1
!
  neighbor 172.16.2.36 remote-as 65122
  neighbor 172.16.2.36 description spine_router_2_2
!
  neighbor 172.16.2.52 remote-as 65123
  neighbor 172.16.2.52 description spine_router_2_3
!
  neighbor 172.16.2.68 remote-as 65124
  neighbor 172.16.2.68 description spine_router_2_4
!
  neighbor 172.16.2.84 remote-as 65125
  neighbor 172.16.2.84 description spine_router_2_5
!
  neighbor 172.16.2.100 remote-as 65126
  neighbor 172.16.2.100 description spine_router_2_6
!
  neighbor 172.16.2.116 remote-as 65127
  neighbor 172.16.2.116 description spine_router_2_7
!
 address-family ipv4 unicast
!

  network 10.2.2.0/24
!
  neighbor 172.16.2.4 activate
  no neighbor 172.16.2.4 send-community all
  neighbor 172.16.2.4 send-community standard
  neighbor 172.16.2.4 send-community large
!
  neighbor 172.16.2.20 activate
  no neighbor 172.16.2.20 send-community all
  neighbor 172.16.2.20 send-community standard
  neighbor 172.16.2.20 send-community large
!
  neighbor 172.16.2.36 activate
  no neighbor 172.16.2.36 send-community all
  neighbor 172.16.2.36 send-community standard
  neighbor 172.16.2.36 send-community large
!
  neighbor 172.16.2.52 activate
  no neighbor 172.16.2.52 send-community all
  neighbor 172.16.2.52 send-community standard
  neighbor 172.16.2.52 send-community large
!
  neighbor 172.16.2.68 activate
  no neighbor 172.16.2.68 send-community all
  neighbor 172.16.2.68 send-community standard
  neighbor 172.16.2.68 send-community large
!
  neighbor 172.16.2.84 activate
  no neighbor 172.16.2.84 send-community all
  neighbor 172.16.2.84 send-community standard
  neighbor 172.16.2.84 send-community large
!
  neighbor 172.16.2.100 activate
  no neighbor 172.16.2.100 send-community all
  neighbor 172.16.2.100 send-community standard
  neighbor 172.16.2.100 send-community large
!
  neighbor 172.16.2.116 activate
  no neighbor 172.16.2.116 send-community all
  neighbor 172.16.2.116 send-community standard
  neighbor 172.16.2.116 send-community large
!
!
router bgp 65222
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
