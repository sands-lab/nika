#!/usr/bin/vtysh -f
!
router bgp 65019
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.160
!
  neighbor 172.16.0.161 remote-as 65001
  neighbor 172.16.0.161 description spine_1
!
  neighbor 172.16.0.163 remote-as 65002
  neighbor 172.16.0.163 description spine_2
!
  neighbor 172.16.0.165 remote-as 65003
  neighbor 172.16.0.165 description spine_3
!
  neighbor 172.16.0.167 remote-as 65004
