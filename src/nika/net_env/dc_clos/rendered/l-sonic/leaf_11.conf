!
  neighbor 172.16.0.169 remote-as 65005
  neighbor 172.16.0.169 description spine_5
!
  neighbor 172.16.0.171 remote-as 65006
  neighbor 172.16.0.171 description spine_6
!
  neighbor 172.16.0.173 remote-as 65007
  neighbor 172.16.0.173 description spine_7
!
  neighbor 172.16.0.175 remote-as 65008
  neighbor 172.16.0.175 description spine_8
!
 address-family ipv4 unicast
!

  network 10.0.11.0/24
!
