#!/usr/bin/vtysh -f
!
router bgp 65015
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.96
!
  neighbor 172.16.0.97 remote-as 65001
  neighbor 172.16.0.97 description spine_1
!
  neighbor 172.16.0.99 remote-as 65002
  neighbor 172.16.0.99 description spine_2
!
  neighbor 172.16.0.101 remote-as 65003
