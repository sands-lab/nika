!
  neighbor 172.16.0.109 remote-as 65007
  neighbor 172.16.0.109 description spine_7
!
  neighbor 172.16.0.111 remote-as 65008
  neighbor 172.16.0.111 description spine_8
!
 address-family ipv4 unicast
!

  network 10.0.7.0/24
