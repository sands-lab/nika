#!/usr/bin/vtysh -f
!
router bgp 65018
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.144
!
  neighbor 172.16.0.145 remote-as 65001
  neighbor 172.16.0.145 description spine_1
!
  neighbor 172.16.0.147 remote-as 65002
  neighbor 172.16.0.147 description spine_2
!
  neighbor 172.16.0.149 remote-as 65003
  neighbor 172.16.0.149 description spine_3
!
  neighbor 172.16.0.151 remote-as 65004
  neighbor 172.16.0.151 description spine_4
!
  neighbor 172.16.0.153 remote-as 65005
  neighbor 172.16.0.153 description spine_5
!
  neighbor 172.16.0.155 remote-as 65006
  neighbor 172.16.0.155 description spine_6
!
  neighbor 172.16.0.157 remote-as 65007
  neighbor 172.16.0.157 description spine_7
!
  neighbor 172.16.0.159 remote-as 65008
  neighbor 172.16.0.159 description spine_8
!
 address-family ipv4 unicast
!

  network 10.0.10.0/24
!
  neighbor 172.16.0.145 activate
  no neighbor 172.16.0.145 send-community all
  neighbor 172.16.0.145 send-community standard
