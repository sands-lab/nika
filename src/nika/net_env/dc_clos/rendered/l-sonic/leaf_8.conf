#!/usr/bin/vtysh -f
!
router bgp 65016
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.112
!
  neighbor 172.16.0.113 remote-as 65001
  neighbor 172.16.0.113 description spine_1
!
  neighbor 172.16.0.115 remote-as 65002
  neighbor 172.16.0.115 description spine_2
!
  neighbor 172.16.0.117 remote-as 65003
  neighbor 172.16.0.117 description spine_3
!
  neighbor 172.16.0.119 remote-as 65004
  neighbor 172.16.0.119 description spine_4
!
  neighbor 172.16.0.121 remote-as 65005
  neighbor 172.16.0.121 description spine_5
!
  neighbor 172.16.0.123 remote-as 65006
  neighbor 172.16.0.123 description spine_6
!
  neighbor 172.16.0.125 remote-as 65007
  neighbor 172.16.0.125 description spine_7
!
  neighbor 172.16.0.127 remote-as 65008
  neighbor 172.16.0.127 description spine_8
!
 address-family ipv4 unicast
!

  network 10.0.8.0/24
!
  neighbor 172.16.0.113 activate
  no neighbor 172.16.0.113 send-community all
  neighbor 172.16.0.113 send-community standard
