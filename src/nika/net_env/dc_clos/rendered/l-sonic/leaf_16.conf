!
  neighbor 172.16.0.249 remote-as 65005
  neighbor 172.16.0.249 description spine_5
!
  neighbor 172.16.0.251 remote-as 65006
  neighbor 172.16.0.251 description spine_6
!
  neighbor 172.16.0.253 remote-as 65007
  neighbor 172.16.0.253 description spine_7
!
  neighbor 172.16.0.255 remote-as 65008
  neighbor 172.16.0.255 description spine_8
!
 address-family ipv4 unicast
!

  network 10.0.16.0/24
!
  neighbor 172.16.0.241 activate
  no neighbor 172.16.0.241 send-community all
