#!/usr/bin/vtysh -f
!
router bgp 65024
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.240
!
  neighbor 172.16.0.241 remote-as 65001
  neighbor 172.16.0.241 description spine_1
!
  neighbor 172.16.0.243 remote-as 65002
  neighbor 172.16.0.243 description spine_2
!
  neighbor 172.16.0.245 remote-as 65003
  neighbor 172.16.0.245 description spine_3
!
  neighbor 172.16.0.247 remote-as 65004
