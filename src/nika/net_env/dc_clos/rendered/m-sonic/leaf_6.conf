hostname leaf_6
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth5
 no shutdown
 description leaf_6 -> spine_1 [external]
 ip address 172.16.0.40/31
!
interface eth6
 no shutdown
 description leaf_6 -> spine_2 [external]
 ip address 172.16.0.42/31
!
interface eth7
 no shutdown
 description leaf_6 -> spine_3 [external]
 ip address 172.16.0.44/31
!
interface eth8
 no shutdown
 description leaf_6 -> spine_4 [external]
 ip address 172.16.0.46/31
!
interface eth0
 no shutdown
 description leaf_6 -> stub [stub]
 ip address 10.0.6.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65010
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.40
!
  neighbor 172.16.0.41 remote-as 65001
  neighbor 172.16.0.41 description spine_1
!
  neighbor 172.16.0.43 remote-as 65002
  neighbor 172.16.0.43 description spine_2
!
  neighbor 172.16.0.45 remote-as 65003
  neighbor 172.16.0.45 description spine_3
!
  neighbor 172.16.0.47 remote-as 65004
  neighbor 172.16.0.47 description spine_4
!
 address-family ipv4 unicast
!

  network 10.0.6.0/24
!
  neighbor 172.16.0.41 activate
  no neighbor 172.16.0.41 send-community all
  neighbor 172.16.0.41 send-community standard
  neighbor 172.16.0.41 send-community large
!
  neighbor 172.16.0.43 activate
  no neighbor 172.16.0.43 send-community all
  neighbor 172.16.0.43 send-community standard
  neighbor 172.16.0.43 send-community large
!
  neighbor 172.16.0.45 activate
  no neighbor 172.16.0.45 send-community all
  neighbor 172.16.0.45 send-community standard
  neighbor 172.16.0.45 send-community large
!
  neighbor 172.16.0.47 activate
  no neighbor 172.16.0.47 send-community all
  neighbor 172.16.0.47 send-community standard
  neighbor 172.16.0.47 send-community large
!
!
router bgp 65010
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
