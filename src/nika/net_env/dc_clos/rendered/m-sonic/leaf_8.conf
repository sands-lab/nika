hostname leaf_8
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth5
 no shutdown
 description leaf_8 -> spine_1 [external]
 ip address 172.16.0.56/31
!
interface eth6
 no shutdown
 description leaf_8 -> spine_2 [external]
 ip address 172.16.0.58/31
!
interface eth7
 no shutdown
 description leaf_8 -> spine_3 [external]
 ip address 172.16.0.60/31
!
interface eth8
 no shutdown
 description leaf_8 -> spine_4 [external]
 ip address 172.16.0.62/31
!
interface eth0
 no shutdown
 description leaf_8 -> stub [stub]
 ip address 10.0.8.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65012
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.56
!
  neighbor 172.16.0.57 remote-as 65001
  neighbor 172.16.0.57 description spine_1
!
  neighbor 172.16.0.59 remote-as 65002
  neighbor 172.16.0.59 description spine_2
!
  neighbor 172.16.0.61 remote-as 65003
  neighbor 172.16.0.61 description spine_3
!
  neighbor 172.16.0.63 remote-as 65004
  neighbor 172.16.0.63 description spine_4
!
 address-family ipv4 unicast
!

  network 10.0.8.0/24
!
  neighbor 172.16.0.57 activate
  no neighbor 172.16.0.57 send-community all
  neighbor 172.16.0.57 send-community standard
  neighbor 172.16.0.57 send-community large
!
  neighbor 172.16.0.59 activate
  no neighbor 172.16.0.59 send-community all
  neighbor 172.16.0.59 send-community standard
  neighbor 172.16.0.59 send-community large
!
  neighbor 172.16.0.61 activate
  no neighbor 172.16.0.61 send-community all
  neighbor 172.16.0.61 send-community standard
  neighbor 172.16.0.61 send-community large
!
  neighbor 172.16.0.63 activate
  no neighbor 172.16.0.63 send-community all
  neighbor 172.16.0.63 send-community standard
  neighbor 172.16.0.63 send-community large
!
!
router bgp 65012
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
