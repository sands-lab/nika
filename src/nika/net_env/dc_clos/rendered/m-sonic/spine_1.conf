hostname spine_1
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth1
 no shutdown
 description spine_1 -> leaf_1 [external]
 ip address 172.16.0.1/31
!
interface eth2
 no shutdown
 description spine_1 -> leaf_2 [external]
 ip address 172.16.0.9/31
!
interface eth3
 no shutdown
 description spine_1 -> leaf_3 [external]
 ip address 172.16.0.17/31
!
interface eth4
 no shutdown
 description spine_1 -> leaf_4 [external]
 ip address 172.16.0.25/31
!
interface eth5
 no shutdown
 description spine_1 -> leaf_5 [external]
 ip address 172.16.0.33/31
!
interface eth6
 no shutdown
 description spine_1 -> leaf_6 [external]
 ip address 172.16.0.41/31
!
interface eth7
 no shutdown
 description spine_1 -> leaf_7 [external]
 ip address 172.16.0.49/31
!
interface eth8
 no shutdown
 description spine_1 -> leaf_8 [external]
 ip address 172.16.0.57/31
!
!
#!/usr/bin/vtysh -f
!
!
