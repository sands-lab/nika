#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.1
!
  neighbor 172.16.0.0 remote-as 65005
  neighbor 172.16.0.0 description leaf_1
!
  neighbor 172.16.0.8 remote-as 65006
  neighbor 172.16.0.8 description leaf_2
!
  neighbor 172.16.0.16 remote-as 65007
  neighbor 172.16.0.16 description leaf_3
!
  neighbor 172.16.0.24 remote-as 65008
  neighbor 172.16.0.24 description leaf_4
!
  neighbor 172.16.0.32 remote-as 65009
  neighbor 172.16.0.32 description leaf_5
!
  neighbor 172.16.0.40 remote-as 65010
  neighbor 172.16.0.40 description leaf_6
!
  neighbor 172.16.0.48 remote-as 65011
  neighbor 172.16.0.48 description leaf_7
!
  neighbor 172.16.0.56 remote-as 65012
  neighbor 172.16.0.56 description leaf_8
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.0 activate
  no neighbor 172.16.0.0 send-community all
  neighbor 172.16.0.0 send-community standard
  neighbor 172.16.0.0 send-community large
!
  neighbor 172.16.0.8 activate
  no neighbor 172.16.0.8 send-community all
  neighbor 172.16.0.8 send-community standard
  neighbor 172.16.0.8 send-community large
!
  neighbor 172.16.0.16 activate
  no neighbor 172.16.0.16 send-community all
  neighbor 172.16.0.16 send-community standard
  neighbor 172.16.0.16 send-community large
!
  neighbor 172.16.0.24 activate
  no neighbor 172.16.0.24 send-community all
  neighbor 172.16.0.24 send-community standard
  neighbor 172.16.0.24 send-community large
!
  neighbor 172.16.0.32 activate
  no neighbor 172.16.0.32 send-community all
  neighbor 172.16.0.32 send-community standard
  neighbor 172.16.0.32 send-community large
!
  neighbor 172.16.0.40 activate
  no neighbor 172.16.0.40 send-community all
  neighbor 172.16.0.40 send-community standard
  neighbor 172.16.0.40 send-community large
!
  neighbor 172.16.0.48 activate
  no neighbor 172.16.0.48 send-community all
  neighbor 172.16.0.48 send-community standard
  neighbor 172.16.0.48 send-community large
!
  neighbor 172.16.0.56 activate
  no neighbor 172.16.0.56 send-community all
  neighbor 172.16.0.56 send-community standard
  neighbor 172.16.0.56 send-community large
!
!
router bgp 65001
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
