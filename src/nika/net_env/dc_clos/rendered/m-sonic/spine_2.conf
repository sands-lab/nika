  neighbor 172.16.0.50 send-community standard
  neighbor 172.16.0.50 send-community large
!
  neighbor 172.16.0.58 activate
  no neighbor 172.16.0.58 send-community all
  neighbor 172.16.0.58 send-community standard
  neighbor 172.16.0.58 send-community large
