#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.3
!
  neighbor 172.16.0.2 remote-as 65005
  neighbor 172.16.0.2 description leaf_1
!
  neighbor 172.16.0.10 remote-as 65006
  neighbor 172.16.0.10 description leaf_2
!
  neighbor 172.16.0.18 remote-as 65007
  neighbor 172.16.0.18 description leaf_3
!
  neighbor 172.16.0.26 remote-as 65008
  neighbor 172.16.0.26 description leaf_4
!
  neighbor 172.16.0.34 remote-as 65009
  neighbor 172.16.0.34 description leaf_5
!
  neighbor 172.16.0.42 remote-as 65010
  neighbor 172.16.0.42 description leaf_6
!
  neighbor 172.16.0.50 remote-as 65011
  neighbor 172.16.0.50 description leaf_7
!
  neighbor 172.16.0.58 remote-as 65012
  neighbor 172.16.0.58 description leaf_8
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.2 activate
  no neighbor 172.16.0.2 send-community all
  neighbor 172.16.0.2 send-community standard
  neighbor 172.16.0.2 send-community large
!
  neighbor 172.16.0.10 activate
  no neighbor 172.16.0.10 send-community all
  neighbor 172.16.0.10 send-community standard
  neighbor 172.16.0.10 send-community large
!
  neighbor 172.16.0.18 activate
