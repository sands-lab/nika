srl_nokia-interfaces:interface:
- name: ethernet-1/1
  description: spine_1 ~ leaf_1
  subinterface:
  - index: 0
    description: spine_1 ~ leaf_1
    admin-state: enable
    ipv4:
      admin-state: enable
      address:
      - ip-prefix: 172.16.0.1/31
        primary:
        - null
  admin-state: enable
- name: ethernet-1/2
  description: spine_1 ~ leaf_2
  subinterface:
  - index: 0
    description: spine_1 ~ leaf_2
    admin-state: enable
    ipv4:
      admin-state: enable
      address:
      - ip-prefix: 172.16.0.5/31
        primary:
        - null
  admin-state: enable
- name: ethernet-1/3
  description: spine_1 ~ leaf_3
  subinterface:
  - index: 0
    description: spine_1 ~ leaf_3
    admin-state: enable
    ipv4:
      admin-state: enable
      address:
      - ip-prefix: 172.16.0.9/31
        primary:
        - null
  admin-state: enable
- name: ethernet-1/4
  description: spine_1 ~ leaf_4
  subinterface:
  - index: 0
    description: spine_1 ~ leaf_4
    admin-state: enable
    ipv4:
      admin-state: enable
      address:
      - ip-prefix: 172.16.0.13/31
        primary:
        - null
  admin-state: enable
srl_nokia-network-instance:network-instance:
- name: default
  type: default
  interface:
  - name: ethernet-1/1.0
  - name: ethernet-1/2.0
  - name: ethernet-1/3.0
  - name: ethernet-1/4.0
  protocols:
    srl_nokia-bgp:bgp:
      admin-state: enable
      autonomous-system: 65001
      router-id: 172.16.0.1
      ebgp-default-policy:
        export-reject-all: false
        import-reject-all: false
      afi-safi:
      - afi-safi-name: ipv4-unicast
        admin-state: enable
        multipath:
          allow-multiple-as: true
          maximum-paths: 32
      group:
      - group-name: ebgp
        admin-state: enable
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
          import-policy:
          - accept_all
          export-policy:
          - default_bgp_export
          - accept_all
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        timers:
          connect-retry: 10
          minimum-advertisement-interval: 1
        send-community:
          standard: true
          large: true
      neighbor:
      - peer-address: 172.16.0.0
        description: leaf_1
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65003
      - peer-address: 172.16.0.4
        description: leaf_2
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65004
      - peer-address: 172.16.0.8
        description: leaf_3
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65005
      - peer-address: 172.16.0.12
        description: leaf_4
        peer-group: ebgp
        afi-safi:
        - afi-safi-name: ipv4-unicast
          admin-state: enable
        - afi-safi-name: ipv6-unicast
          admin-state: disable
        peer-as: 65006
  admin-state: enable
srl_nokia-routing-policy:routing-policy:
  policy:
  - name: accept_all
    default-action:
      policy-result: accept
  - name: ibgp-mark
    default-action:
      policy-result: reject
    statement:
    - name: mark-ibgp-routes
      action:
        bgp:
          communities:
            add: ibgp-mark
        policy-result: accept
  - name: default_bgp_export
    default-action:
      policy-result: reject
    statement:
    - name: prefixes
      match:
        prefix-set: default_bgp_advertise
      action:
        policy-result: next-policy
    - name: bgp
      match:
        protocol: bgp
      action:
        policy-result: next-policy
        bgp:
          communities:
            remove: ibgp-mark
  community-set:
  - name: ibgp-mark
    member:
    - 65536:0:65536
  prefix-set:
  - name: default_bgp_advertise
    prefix: []
