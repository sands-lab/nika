hostname spine_router_0_1
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description spine_router_0_1 -> super_spine_router_0 [external]
 ip address 172.16.0.3/31
!
interface eth1
 no shutdown
 description spine_router_0_1 -> leaf_router_0_0 [external]
 ip address 172.16.0.8/31
!
interface eth2
 no shutdown
 description spine_router_0_1 -> leaf_router_0_1 [external]
 ip address 172.16.0.10/31
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65101
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.3
!
  neighbor 172.16.0.2 remote-as 65000
  neighbor 172.16.0.2 description super_spine_router_0
!
  neighbor 172.16.0.9 remote-as 65200
  neighbor 172.16.0.9 description leaf_router_0_0
!
  neighbor 172.16.0.11 remote-as 65201
  neighbor 172.16.0.11 description leaf_router_0_1
!
 address-family ipv4 unicast
!

!
  neighbor 172.16.0.2 activate
  no neighbor 172.16.0.2 send-community all
  neighbor 172.16.0.2 send-community standard
  neighbor 172.16.0.2 send-community large
!
  neighbor 172.16.0.9 activate
  no neighbor 172.16.0.9 send-community all
  neighbor 172.16.0.9 send-community standard
  neighbor 172.16.0.9 send-community large
!
  neighbor 172.16.0.11 activate
  no neighbor 172.16.0.11 send-community all
  neighbor 172.16.0.11 send-community standard
  neighbor 172.16.0.11 send-community large
!
!
router bgp 65101
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
