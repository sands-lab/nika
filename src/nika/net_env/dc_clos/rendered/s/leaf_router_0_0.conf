hostname leaf_router_0_0
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description leaf_router_0_0 -> spine_router_0_0 [external]
 ip address 172.16.0.5/31
!
interface eth1
 no shutdown
 description leaf_router_0_0 -> spine_router_0_1 [external]
 ip address 172.16.0.9/31
!
interface eth2
 no shutdown
 description leaf_router_0_0 -> stub [stub]
 ip address 10.0.0.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65200
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.5
!
  neighbor 172.16.0.4 remote-as 65100
  neighbor 172.16.0.4 description spine_router_0_0
!
  neighbor 172.16.0.8 remote-as 65101
  neighbor 172.16.0.8 description spine_router_0_1
!
 address-family ipv4 unicast
!

  network 10.0.0.0/24
!
  neighbor 172.16.0.4 activate
  no neighbor 172.16.0.4 send-community all
  neighbor 172.16.0.4 send-community standard
  neighbor 172.16.0.4 send-community large
!
  neighbor 172.16.0.8 activate
  no neighbor 172.16.0.8 send-community all
  neighbor 172.16.0.8 send-community standard
  neighbor 172.16.0.8 send-community large
!
!
router bgp 65200
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
