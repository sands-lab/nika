hostname leaf_router_0_1
!
log file /var/log/frr/frr.log debugging
!
! Enable debugging
debug bgp keepalives
debug bgp updates in
debug bgp updates out

!
ip forwarding
frr defaults traditional
!
interface eth0
 no shutdown
 description leaf_router_0_1 -> spine_router_0_0 [external]
 ip address 172.16.0.7/31
!
interface eth1
 no shutdown
 description leaf_router_0_1 -> spine_router_0_1 [external]
 ip address 172.16.0.11/31
!
interface eth2
 no shutdown
 description leaf_router_0_1 -> stub [stub]
 ip address 10.0.1.1/24
!
!
#!/usr/bin/vtysh -f
!
!
!
#!/usr/bin/vtysh -f
!
router bgp 65201
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 172.16.0.7
!
  neighbor 172.16.0.6 remote-as 65100
  neighbor 172.16.0.6 description spine_router_0_0
!
  neighbor 172.16.0.10 remote-as 65101
  neighbor 172.16.0.10 description spine_router_0_1
!
 address-family ipv4 unicast
!

  network 10.0.1.0/24
!
  neighbor 172.16.0.6 activate
  no neighbor 172.16.0.6 send-community all
  neighbor 172.16.0.6 send-community standard
  neighbor 172.16.0.6 send-community large
!
  neighbor 172.16.0.10 activate
  no neighbor 172.16.0.10 send-community all
  neighbor 172.16.0.10 send-community standard
  neighbor 172.16.0.10 send-community large
!
!
router bgp 65201
 address-family ipv4 unicast
  maximum-paths 32
 exit-address-family
!
