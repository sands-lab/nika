    neighbor 10.0.0.128 route-map BGP-OUT out

    neighbor 10.0.0.130 route-map BGP-IN in
    neighbor 10.0.0.130 route-map BGP-OUT out

    neighbor 10.0.0.132 route-map BGP-IN in
    neighbor 10.0.0.132 route-map BGP-OUT out

    neighbor 10.0.0.134 route-map BGP-IN in
    neighbor 10.0.0.134 route-map BGP-OUT out

    neighbor 10.0.0.137 route-map BGP-IN in
    neighbor 10.0.0.137 route-map BGP-OUT out

    neighbor 10.0.0.141 route-map BGP-IN in
    neighbor 10.0.0.141 route-map BGP-OUT out

