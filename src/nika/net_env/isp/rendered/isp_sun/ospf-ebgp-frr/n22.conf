#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.15
!
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 description n1
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.0.0.67 remote-as 65003
  neighbor 10.0.0.67 description n24
!
  neighbor 10.0.0.69 remote-as 65003
  neighbor 10.0.0.69 description n24
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.0.0.67 activate
  no neighbor 10.0.0.67 send-community all
  neighbor 10.0.0.67 send-community standard
  neighbor 10.0.0.67 send-community large
!
  neighbor 10.0.0.69 activate
  no neighbor 10.0.0.69 send-community all
  neighbor 10.0.0.69 send-community standard
  neighbor 10.0.0.69 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65001
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.67 route-map BGP-IN in
    neighbor 10.0.0.67 route-map BGP-OUT out

    neighbor 10.0.0.69 route-map BGP-IN in
    neighbor 10.0.0.69 route-map BGP-OUT out

!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
 exit-address-family
!
