!
interface eth2
 no shutdown
 description n10 -> n12 [internal]
 ip address 10.0.0.32/31
!
interface eth3
 no shutdown
 description n10 -> n12 [internal]
 ip address 10.0.0.34/31
!
interface eth4
 no shutdown
 description n10 -> n11 [passive]
 ip address 10.0.0.40/31
!
interface eth5
 no shutdown
 description n10 -> n11 [passive]
