#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.4
!
  neighbor 10.255.0.2 remote-as 65002
  neighbor 10.255.0.2 description n10
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.0.0.5 remote-as 65003
  neighbor 10.0.0.5 description n13
!
  neighbor 10.0.0.36 remote-as 65003
  neighbor 10.0.0.36 description n11
!
  neighbor 10.0.0.38 remote-as 65003
  neighbor 10.0.0.38 description n11
!
  neighbor 10.0.0.203 remote-as 65003
  neighbor 10.0.0.203 description n13
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
  neighbor 10.0.0.5 activate
  no neighbor 10.0.0.5 send-community all
  neighbor 10.0.0.5 send-community standard
  neighbor 10.0.0.5 send-community large
!
  neighbor 10.0.0.36 activate
  no neighbor 10.0.0.36 send-community all
  neighbor 10.0.0.36 send-community standard
  neighbor 10.0.0.36 send-community large
!
  neighbor 10.0.0.38 activate
  no neighbor 10.0.0.38 send-community all
  neighbor 10.0.0.38 send-community standard
  neighbor 10.0.0.38 send-community large
!
  neighbor 10.0.0.203 activate
  no neighbor 10.0.0.203 send-community all
  neighbor 10.0.0.203 send-community standard
  neighbor 10.0.0.203 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.5 route-map BGP-IN in
    neighbor 10.0.0.5 route-map BGP-OUT out

    neighbor 10.0.0.36 route-map BGP-IN in
    neighbor 10.0.0.36 route-map BGP-OUT out

    neighbor 10.0.0.38 route-map BGP-IN in
    neighbor 10.0.0.38 route-map BGP-OUT out

    neighbor 10.0.0.203 route-map BGP-IN in
    neighbor 10.0.0.203 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
 exit-address-family
!
