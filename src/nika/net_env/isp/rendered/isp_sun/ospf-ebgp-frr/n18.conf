#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.129 route-map BGP-IN in
    neighbor 10.0.0.129 route-map BGP-OUT out

    neighbor 10.0.0.131 route-map BGP-IN in
    neighbor 10.0.0.131 route-map BGP-OUT out

    neighbor 10.0.0.177 route-map BGP-IN in
    neighbor 10.0.0.177 route-map BGP-OUT out

    neighbor 10.0.0.179 route-map BGP-IN in
    neighbor 10.0.0.179 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.3 route-map BGP-IN in
 exit-address-family
!
