#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.8
!
  neighbor 10.255.0.3 remote-as 65003
  neighbor 10.255.0.3 description n11
  neighbor 10.255.0.3 update-source lo
!
  neighbor 10.0.0.133 remote-as 65001
  neighbor 10.0.0.133 description n19
!
  neighbor 10.0.0.135 remote-as 65001
  neighbor 10.0.0.135 description n19
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.3 next-hop-self
  no neighbor 10.255.0.3 send-community all
  neighbor 10.255.0.3 send-community standard
  neighbor 10.255.0.3 send-community large
  neighbor 10.255.0.3 send-community extended
!
  neighbor 10.0.0.133 activate
  no neighbor 10.0.0.133 send-community all
  neighbor 10.0.0.133 send-community standard
  neighbor 10.0.0.133 send-community large
!
  neighbor 10.0.0.135 activate
  no neighbor 10.0.0.135 send-community all
  neighbor 10.0.0.135 send-community standard
  neighbor 10.0.0.135 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.133 route-map BGP-IN in
    neighbor 10.0.0.133 route-map BGP-OUT out

    neighbor 10.0.0.135 route-map BGP-IN in
    neighbor 10.0.0.135 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.3 route-map BGP-IN in
 exit-address-family
!
