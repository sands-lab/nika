#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.6
!
  neighbor 10.255.0.2 remote-as 65002
  neighbor 10.255.0.2 description n10
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.0.0.181 remote-as 65003
  neighbor 10.0.0.181 description n17
!
  neighbor 10.0.0.185 remote-as 65003
  neighbor 10.0.0.185 description n17
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
  neighbor 10.0.0.181 activate
  no neighbor 10.0.0.181 send-community all
  neighbor 10.0.0.181 send-community standard
  neighbor 10.0.0.181 send-community large
!
  neighbor 10.0.0.185 activate
  no neighbor 10.0.0.185 send-community all
  neighbor 10.0.0.185 send-community standard
  neighbor 10.0.0.185 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.181 route-map BGP-IN in
    neighbor 10.0.0.181 route-map BGP-OUT out

    neighbor 10.0.0.185 route-map BGP-IN in
    neighbor 10.0.0.185 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
 exit-address-family
!
