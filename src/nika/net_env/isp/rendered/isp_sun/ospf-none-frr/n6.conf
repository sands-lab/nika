hostname n6
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.24/32
!
interface eth0
 no shutdown
 description n6 -> n5 [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description n6 -> n7 [internal]
 ip address 10.0.0.10/31
!
interface eth2
 no shutdown
 description n6 -> n7 [internal]
 ip address 10.0.0.12/31
!
interface eth3
 no shutdown
 description n6 -> n5 [internal]
 ip address 10.0.0.183/31
!
interface eth4
 no shutdown
 description n6 -> n14 [internal]
 ip address 10.0.0.191/31
!
interface eth5
 no shutdown
 description n6 -> n14 [internal]
 ip address 10.0.0.193/31
!
interface eth6
 no shutdown
 description n6 -> stub [stub]
 ip address 10.254.0.93/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.24
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n6 -> n5
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n6 -> n7
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n6 -> n7
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n6 -> n5
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n6 -> n14
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n6 -> n14
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n6 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
