!
interface eth3
 no shutdown
 description n6 -> n5 [internal]
 ip address 10.0.0.183/31
!
interface eth4
 no shutdown
 description n6 -> n14 [internal]
 ip address 10.0.0.191/31
!
interface eth5
 no shutdown
 description n6 -> n14 [internal]
 ip address 10.0.0.193/31
!
interface eth6
 no shutdown
 description n6 -> stub [stub]
 ip address 10.254.0.93/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0018.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n6 -> n5
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n6 -> n7
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n6 -> n7
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
