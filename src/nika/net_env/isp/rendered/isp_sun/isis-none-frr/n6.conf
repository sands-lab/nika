hostname n6
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.24/32
!
interface eth0
 no shutdown
 description n6 -> n5 [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description n6 -> n7 [internal]
 ip address 10.0.0.10/31
!
interface eth2
 no shutdown
 description n6 -> n7 [internal]
