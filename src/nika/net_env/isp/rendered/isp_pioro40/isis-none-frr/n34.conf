hostname n34
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.29/32
!
interface eth0
 no shutdown
 description n34 -> n20 [internal]
 ip address 10.0.0.67/31
!
interface eth1
 no shutdown
 description n34 -> n26 [internal]
 ip address 10.0.0.93/31
!
interface eth2
 no shutdown
 description n34 -> n30 [internal]
 ip address 10.0.0.113/31
!
interface eth3
 no shutdown
 description n34 -> n32 [internal]
 ip address 10.0.0.119/31
!
interface eth4
 no shutdown
 description n34 -> stub [stub]
 ip address 10.254.0.113/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001d.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n34 -> n20
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n34 -> n26
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n34 -> n30
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n34 -> n32
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n34 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
