hostname n17
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description n17 -> n21 [internal]
 ip address 10.0.0.40/31
!
interface eth1
 no shutdown
 description n17 -> n23 [internal]
 ip address 10.0.0.42/31
!
interface eth2
 no shutdown
 description n17 -> n25 [internal]
 ip address 10.0.0.44/31
!
interface eth3
 no shutdown
 description n17 -> n2 [internal]
 ip address 10.0.0.104/31
!
interface eth4
 no shutdown
 description n17 -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000a.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n17 -> n21
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n17 -> n23
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n17 -> n25
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n17 -> n2
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n17 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
