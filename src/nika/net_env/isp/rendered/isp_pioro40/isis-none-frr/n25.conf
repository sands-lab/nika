hostname n25
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.19/32
!
interface eth0
 no shutdown
 description n25 -> n17 [internal]
 ip address 10.0.0.45/31
!
interface eth1
 no shutdown
 description n25 -> n18 [internal]
 ip address 10.0.0.47/31
!
interface eth2
 no shutdown
 description n25 -> n23 [internal]
 ip address 10.0.0.79/31
!
interface eth3
 no shutdown
 description n25 -> n26 [internal]
 ip address 10.0.0.88/31
!
interface eth4
 no shutdown
 description n25 -> n2 [internal]
 ip address 10.0.0.111/31
!
interface eth5
 no shutdown
 description n25 -> stub [stub]
 ip address 10.254.0.73/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0013.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n25 -> n17
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n25 -> n18
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n25 -> n23
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n25 -> n26
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n25 -> n2
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n25 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
