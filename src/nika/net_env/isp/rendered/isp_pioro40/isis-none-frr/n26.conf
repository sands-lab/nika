hostname n26
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description n26 -> n18 [internal]
 ip address 10.0.0.49/31
!
interface eth1
 no shutdown
 description n26 -> n25 [internal]
 ip address 10.0.0.89/31
!
interface eth2
 no shutdown
 description n26 -> n30 [internal]
 ip address 10.0.0.90/31
!
interface eth3
 no shutdown
 description n26 -> n34 [internal]
 ip address 10.0.0.92/31
!
interface eth4
 no shutdown
 description n26 -> n39 [internal]
 ip address 10.0.0.94/31
!
interface eth5
 no shutdown
 description n26 -> stub [stub]
 ip address 10.254.0.77/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0014.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n26 -> n18
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n26 -> n25
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n26 -> n30
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n26 -> n34
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n26 -> n39
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n26 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
