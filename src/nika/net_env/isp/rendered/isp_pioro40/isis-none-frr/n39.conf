hostname n39
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.34/32
!
interface eth0
 no shutdown
 description n39 -> n1 [internal]
 ip address 10.0.0.59/31
!
interface eth1
 no shutdown
 description n39 -> n22 [internal]
 ip address 10.0.0.77/31
!
interface eth2
 no shutdown
 description n39 -> n26 [internal]
 ip address 10.0.0.95/31
!
interface eth3
 no shutdown
 description n39 -> n9 [internal]
 ip address 10.0.0.176/31
!
interface eth4
 no shutdown
 description n39 -> stub [stub]
 ip address 10.254.0.133/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0022.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n39 -> n1
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n39 -> n22
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n39 -> n26
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n39 -> n9
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n39 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
