hostname n1
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description n1 -> n3 [internal]
 ip address 10.0.0.54/31
!
interface eth1
 no shutdown
 description n1 -> n31 [internal]
 ip address 10.0.0.56/31
!
interface eth2
 no shutdown
 description n1 -> n39 [internal]
 ip address 10.0.0.58/31
!
interface eth3
 no shutdown
 description n1 -> n4 [internal]
 ip address 10.0.0.60/31
!
interface eth4
 no shutdown
 description n1 -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0002.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n1 -> n3
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n1 -> n31
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n1 -> n39
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n1 -> n4
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n1 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
