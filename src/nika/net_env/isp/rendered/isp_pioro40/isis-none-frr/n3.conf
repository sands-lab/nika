hostname n3
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.24/32
!
interface eth0
 no shutdown
 description n3 -> n1 [internal]
 ip address 10.0.0.55/31
!
interface eth1
 no shutdown
 description n3 -> n10 [internal]
 ip address 10.0.0.125/31
!
interface eth2
 no shutdown
 description n3 -> n13 [internal]
 ip address 10.0.0.127/31
!
interface eth3
 no shutdown
 description n3 -> n36 [internal]
 ip address 10.0.0.128/31
!
interface eth4
 no shutdown
 description n3 -> n5 [internal]
 ip address 10.0.0.130/31
!
interface eth5
 no shutdown
 description n3 -> stub [stub]
 ip address 10.254.0.93/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0018.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n3 -> n1
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n3 -> n10
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n3 -> n13
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n3 -> n36
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n3 -> n5
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n3 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
