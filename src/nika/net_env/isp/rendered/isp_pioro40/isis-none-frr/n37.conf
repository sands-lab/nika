hostname n37
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.32/32
!
interface eth0
 no shutdown
 description n37 -> n24 [internal]
 ip address 10.0.0.87/31
!
interface eth1
 no shutdown
 description n37 -> n28 [internal]
 ip address 10.0.0.99/31
!
interface eth2
 no shutdown
 description n37 -> n33 [internal]
 ip address 10.0.0.121/31
!
interface eth3
 no shutdown
 description n37 -> n4 [internal]
 ip address 10.0.0.136/31
!
interface eth4
 no shutdown
 description n37 -> stub [stub]
 ip address 10.254.0.125/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0020.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n37 -> n24
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n37 -> n28
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n37 -> n33
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n37 -> n4
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n37 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
