hostname n35
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.30/32
!
interface eth0
 no shutdown
 description n35 -> n24 [internal]
 ip address 10.0.0.83/31
!
interface eth1
 no shutdown
 description n35 -> n29 [internal]
 ip address 10.0.0.101/31
!
interface eth2
 no shutdown
 description n35 -> n30 [internal]
 ip address 10.0.0.115/31
!
interface eth3
 no shutdown
 description n35 -> n6 [internal]
 ip address 10.0.0.150/31
!
interface eth4
 no shutdown
 description n35 -> n9 [internal]
 ip address 10.0.0.174/31
!
interface eth5
 no shutdown
 description n35 -> stub [stub]
 ip address 10.254.0.117/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001e.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n35 -> n24
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n35 -> n29
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n35 -> n30
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n35 -> n6
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n35 -> n9
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n35 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
