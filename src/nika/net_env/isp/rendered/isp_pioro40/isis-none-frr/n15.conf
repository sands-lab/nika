hostname n15
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.8/32
!
interface eth0
 no shutdown
 description n15 -> n11 [internal]
 ip address 10.0.0.17/31
!
interface eth1
 no shutdown
 description n15 -> n14 [internal]
 ip address 10.0.0.31/31
!
interface eth2
 no shutdown
 description n15 -> n27 [internal]
 ip address 10.0.0.32/31
!
interface eth3
 no shutdown
 description n15 -> n7 [internal]
 ip address 10.0.0.156/31
!
interface eth4
 no shutdown
 description n15 -> n8 [internal]
 ip address 10.0.0.164/31
!
interface eth5
 no shutdown
 description n15 -> stub [stub]
 ip address 10.254.0.29/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0008.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n15 -> n11
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n15 -> n14
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n15 -> n27
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n15 -> n7
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n15 -> n8
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n15 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

