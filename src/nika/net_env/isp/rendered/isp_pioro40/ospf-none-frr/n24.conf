hostname n24
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.18/32
!
interface eth0
 no shutdown
 description n24 -> n31 [internal]
 ip address 10.0.0.80/31
!
interface eth1
 no shutdown
 description n24 -> n35 [internal]
 ip address 10.0.0.82/31
!
interface eth2
 no shutdown
 description n24 -> n36 [internal]
 ip address 10.0.0.84/31
!
interface eth3
 no shutdown
 description n24 -> n37 [internal]
 ip address 10.0.0.86/31
!
interface eth4
 no shutdown
 description n24 -> n6 [internal]
 ip address 10.0.0.146/31
!
interface eth5
 no shutdown
 description n24 -> stub [stub]
 ip address 10.254.0.69/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.18
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n24 -> n31
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n24 -> n35
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n24 -> n36
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n24 -> n37
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n24 -> n6
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n24 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
