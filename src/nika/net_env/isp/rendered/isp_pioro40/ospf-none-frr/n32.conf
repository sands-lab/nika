hostname n32
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.27/32
!
interface eth0
 no shutdown
 description n32 -> n11 [internal]
 ip address 10.0.0.19/31
!
interface eth1
 no shutdown
 description n32 -> n34 [internal]
 ip address 10.0.0.118/31
!
interface eth2
 no shutdown
 description n32 -> n7 [internal]
 ip address 10.0.0.158/31
!
interface eth3
 no shutdown
 description n32 -> n8 [internal]
 ip address 10.0.0.168/31
!
interface eth4
 no shutdown
 description n32 -> stub [stub]
 ip address 10.254.0.105/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.27
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n32 -> n11
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n32 -> n34
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n32 -> n7
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n32 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n32 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
