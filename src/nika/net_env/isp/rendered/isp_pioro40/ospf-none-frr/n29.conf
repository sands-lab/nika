hostname n29
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.23/32
!
interface eth0
 no shutdown
 description n29 -> n35 [internal]
 ip address 10.0.0.100/31
!
interface eth1
 no shutdown
 description n29 -> n38 [internal]
 ip address 10.0.0.102/31
!
interface eth2
 no shutdown
 description n29 -> n5 [internal]
 ip address 10.0.0.142/31
!
interface eth3
 no shutdown
 description n29 -> n6 [internal]
 ip address 10.0.0.148/31
!
interface eth4
 no shutdown
 description n29 -> n9 [internal]
 ip address 10.0.0.172/31
!
interface eth5
 no shutdown
 description n29 -> stub [stub]
 ip address 10.254.0.89/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.23
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n29 -> n35
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n29 -> n38
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n29 -> n5
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n29 -> n6
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n29 -> n9
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n29 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
