hostname n35
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.30/32
!
interface eth0
 no shutdown
 description n35 -> n24 [internal]
 ip address 10.0.0.83/31
!
interface eth1
 no shutdown
 description n35 -> n29 [internal]
 ip address 10.0.0.101/31
!
interface eth2
 no shutdown
 description n35 -> n30 [internal]
 ip address 10.0.0.115/31
!
interface eth3
 no shutdown
 description n35 -> n6 [internal]
 ip address 10.0.0.150/31
!
interface eth4
 no shutdown
 description n35 -> n9 [internal]
 ip address 10.0.0.174/31
!
interface eth5
 no shutdown
 description n35 -> stub [stub]
 ip address 10.254.0.117/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.30
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n35 -> n24
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n35 -> n29
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n35 -> n30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n35 -> n6
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n35 -> n9
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n35 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
