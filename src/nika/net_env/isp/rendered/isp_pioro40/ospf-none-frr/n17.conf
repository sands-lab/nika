hostname n17
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description n17 -> n21 [internal]
 ip address 10.0.0.40/31
!
interface eth1
 no shutdown
 description n17 -> n23 [internal]
 ip address 10.0.0.42/31
!
interface eth2
 no shutdown
 description n17 -> n25 [internal]
 ip address 10.0.0.44/31
!
interface eth3
 no shutdown
 description n17 -> n2 [internal]
 ip address 10.0.0.104/31
!
interface eth4
 no shutdown
 description n17 -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.10
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n17 -> n21
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n17 -> n23
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n17 -> n25
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n17 -> n2
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n17 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
