hostname n38
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.33/32
!
interface eth0
 no shutdown
 description n38 -> n11 [internal]
 ip address 10.0.0.21/31
!
interface eth1
 no shutdown
 description n38 -> n20 [internal]
 ip address 10.0.0.69/31
!
interface eth2
 no shutdown
 description n38 -> n27 [internal]
 ip address 10.0.0.97/31
!
interface eth3
 no shutdown
 description n38 -> n29 [internal]
 ip address 10.0.0.103/31
!
interface eth4
 no shutdown
 description n38 -> n33 [internal]
 ip address 10.0.0.123/31
!
interface eth5
 no shutdown
 description n38 -> stub [stub]
 ip address 10.254.0.129/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.33
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n38 -> n11
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n38 -> n20
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n38 -> n27
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n38 -> n29
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n38 -> n33
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n38 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
