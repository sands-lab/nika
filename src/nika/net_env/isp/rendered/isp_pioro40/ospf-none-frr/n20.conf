hostname n20
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.14/32
!
interface eth0
 no shutdown
 description n20 -> n27 [internal]
 ip address 10.0.0.62/31
!
interface eth1
 no shutdown
 description n20 -> n33 [internal]
 ip address 10.0.0.64/31
!
interface eth2
 no shutdown
 description n20 -> n34 [internal]
 ip address 10.0.0.66/31
!
interface eth3
 no shutdown
 description n20 -> n38 [internal]
 ip address 10.0.0.68/31
!
interface eth4
 no shutdown
 description n20 -> stub [stub]
 ip address 10.254.0.53/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.14
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n20 -> n27
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n20 -> n33
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n20 -> n34
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n20 -> n38
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n20 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
