hostname n28
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.22/32
!
interface eth0
 no shutdown
 description n28 -> n0 [internal]
 ip address 10.0.0.9/31
!
interface eth1
 no shutdown
 description n28 -> n12 [internal]
 ip address 10.0.0.25/31
!
interface eth2
 no shutdown
 description n28 -> n13 [internal]
 ip address 10.0.0.27/31
!
interface eth3
 no shutdown
 description n28 -> n16 [internal]
 ip address 10.0.0.37/31
!
interface eth4
 no shutdown
 description n28 -> n37 [internal]
 ip address 10.0.0.98/31
!
interface eth5
 no shutdown
 description n28 -> stub [stub]
 ip address 10.254.0.85/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.22
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n28 -> n0
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n28 -> n12
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n28 -> n13
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n28 -> n16
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n28 -> n37
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n28 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
