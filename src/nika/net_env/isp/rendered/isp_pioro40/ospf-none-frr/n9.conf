 ip address 10.0.0.153/31
!
interface eth1
 no shutdown
 description n9 -> n22 [internal]
 ip address 10.0.0.171/31
!
interface eth2
 no shutdown
 description n9 -> n29 [internal]
 ip address 10.0.0.173/31
!
interface eth3
 no shutdown
 description n9 -> n35 [internal]
 ip address 10.0.0.175/31
!
interface eth4
 no shutdown
 description n9 -> n39 [internal]
 ip address 10.0.0.177/31
