hostname n26
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description n26 -> n18 [internal]
 ip address 10.0.0.49/31
!
interface eth1
 no shutdown
 description n26 -> n25 [internal]
 ip address 10.0.0.89/31
!
interface eth2
 no shutdown
 description n26 -> n30 [internal]
 ip address 10.0.0.90/31
!
interface eth3
 no shutdown
 description n26 -> n34 [internal]
 ip address 10.0.0.92/31
!
interface eth4
 no shutdown
 description n26 -> n39 [internal]
 ip address 10.0.0.94/31
!
interface eth5
 no shutdown
 description n26 -> stub [stub]
 ip address 10.254.0.77/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.20
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n26 -> n18
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n26 -> n25
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n26 -> n30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n26 -> n34
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n26 -> n39
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n26 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
