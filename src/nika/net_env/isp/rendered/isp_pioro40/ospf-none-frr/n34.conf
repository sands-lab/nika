hostname n34
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.29/32
!
interface eth0
 no shutdown
 description n34 -> n20 [internal]
 ip address 10.0.0.67/31
!
interface eth1
 no shutdown
 description n34 -> n26 [internal]
 ip address 10.0.0.93/31
!
interface eth2
 no shutdown
 description n34 -> n30 [internal]
 ip address 10.0.0.113/31
!
interface eth3
 no shutdown
 description n34 -> n32 [internal]
 ip address 10.0.0.119/31
!
interface eth4
 no shutdown
 description n34 -> stub [stub]
 ip address 10.254.0.113/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.29
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n34 -> n20
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n34 -> n26
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n34 -> n30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n34 -> n32
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n34 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
