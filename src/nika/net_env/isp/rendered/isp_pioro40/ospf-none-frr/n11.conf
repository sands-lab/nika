hostname n11
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description n11 -> n14 [internal]
 ip address 10.0.0.14/31
!
interface eth1
 no shutdown
 description n11 -> n15 [internal]
 ip address 10.0.0.16/31
!
interface eth2
 no shutdown
 description n11 -> n32 [internal]
 ip address 10.0.0.18/31
!
interface eth3
 no shutdown
 description n11 -> n38 [internal]
 ip address 10.0.0.20/31
!
interface eth4
 no shutdown
 description n11 -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.4
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n11 -> n14
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n11 -> n15
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n11 -> n32
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n11 -> n38
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n11 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
