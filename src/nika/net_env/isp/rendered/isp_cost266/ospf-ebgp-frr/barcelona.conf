hostname barcelona
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.3/32
!
interface eth0
 no shutdown
 description barcelona -> seville [internal]
 ip address 10.0.0.2/31
!
interface eth1
 no shutdown
 description barcelona -> madrid [internal]
 ip address 10.0.0.110/31
!
interface eth2
 no shutdown
 description barcelona -> marseille [internal]
 ip address 10.0.0.112/31
!
interface eth3
 no shutdown
 description barcelona -> stub [stub]
 ip address 10.254.0.9/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.3
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! barcelona -> seville
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! barcelona -> madrid
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! barcelona -> marseille
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! barcelona -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.3
  bgp cluster-id 10.255.0.3
!
  neighbor 10.255.0.7 remote-as 65003
  neighbor 10.255.0.7 description bordeaux
  neighbor 10.255.0.7 update-source lo
!
  neighbor 10.255.0.20 remote-as 65003
  neighbor 10.255.0.20 description lyon
  neighbor 10.255.0.20 update-source lo
!
  neighbor 10.255.0.21 remote-as 65003
  neighbor 10.255.0.21 description madrid
  neighbor 10.255.0.21 update-source lo
!
  neighbor 10.255.0.22 remote-as 65003
  neighbor 10.255.0.22 description marseille
  neighbor 10.255.0.22 update-source lo
!
  neighbor 10.255.0.30 remote-as 65003
  neighbor 10.255.0.30 description seville
  neighbor 10.255.0.30 update-source lo
!
  neighbor 10.255.0.37 remote-as 65003
  neighbor 10.255.0.37 description zurich
  neighbor 10.255.0.37 update-source lo
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.7 next-hop-self
  neighbor 10.255.0.7 route-reflector-client
  no neighbor 10.255.0.7 send-community all
  neighbor 10.255.0.7 send-community standard
  neighbor 10.255.0.7 send-community large
  neighbor 10.255.0.7 send-community extended
!
  neighbor 10.255.0.20 activate
  neighbor 10.255.0.20 next-hop-self
  neighbor 10.255.0.20 route-reflector-client
  no neighbor 10.255.0.20 send-community all
  neighbor 10.255.0.20 send-community standard
  neighbor 10.255.0.20 send-community large
  neighbor 10.255.0.20 send-community extended
!
  neighbor 10.255.0.21 activate
  neighbor 10.255.0.21 next-hop-self
  neighbor 10.255.0.21 route-reflector-client
  no neighbor 10.255.0.21 send-community all
  neighbor 10.255.0.21 send-community standard
  neighbor 10.255.0.21 send-community large
  neighbor 10.255.0.21 send-community extended
!
  neighbor 10.255.0.22 activate
  neighbor 10.255.0.22 next-hop-self
  neighbor 10.255.0.22 route-reflector-client
  no neighbor 10.255.0.22 send-community all
  neighbor 10.255.0.22 send-community standard
  neighbor 10.255.0.22 send-community large
  neighbor 10.255.0.22 send-community extended
!
  neighbor 10.255.0.30 activate
  neighbor 10.255.0.30 next-hop-self
  neighbor 10.255.0.30 route-reflector-client
  no neighbor 10.255.0.30 send-community all
  neighbor 10.255.0.30 send-community standard
  neighbor 10.255.0.30 send-community large
  neighbor 10.255.0.30 send-community extended
!
  neighbor 10.255.0.37 activate
  neighbor 10.255.0.37 next-hop-self
  neighbor 10.255.0.37 route-reflector-client
  no neighbor 10.255.0.37 send-community all
  neighbor 10.255.0.37 send-community standard
  neighbor 10.255.0.37 send-community large
  neighbor 10.255.0.37 send-community extended
!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.7 route-map BGP-IN in
  neighbor 10.255.0.20 route-map BGP-IN in
  neighbor 10.255.0.21 route-map BGP-IN in
  neighbor 10.255.0.22 route-map BGP-IN in
  neighbor 10.255.0.30 route-map BGP-IN in
  neighbor 10.255.0.37 route-map BGP-IN in
 exit-address-family
!
