hostname vienna
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.34/32
!
interface eth0
 no shutdown
 description vienna -> munich [passive]
 ip address 10.0.0.93/31
!
interface eth1
 no shutdown
 description vienna -> prague [passive]
 ip address 10.0.0.99/31
!
interface eth2
 no shutdown
 description vienna -> zagreb [internal]
 ip address 10.0.0.104/31
!
interface eth3
 no shutdown
 description vienna -> stub [stub]
 ip address 10.254.0.133/30
!
interface lo1
 no shutdown
 description vienna -> stub
 ip address 198.51.101.1/24
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.34
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! vienna -> munich
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth1
! vienna -> prague
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! vienna -> zagreb
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! vienna -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.34
!
  neighbor 10.255.0.2 remote-as 65002
  neighbor 10.255.0.2 description athens
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.0.0.92 remote-as 65001
  neighbor 10.0.0.92 description munich
!
  neighbor 10.0.0.98 remote-as 65001
  neighbor 10.0.0.98 description prague
!
 address-family ipv4 unicast
!

  network 198.51.101.0/24
!
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
  neighbor 10.0.0.92 activate
  no neighbor 10.0.0.92 send-community all
  neighbor 10.0.0.92 send-community standard
  neighbor 10.0.0.92 send-community large
!
  neighbor 10.0.0.98 activate
  no neighbor 10.0.0.98 send-community all
  neighbor 10.0.0.98 send-community standard
  neighbor 10.0.0.98 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.92 route-map BGP-IN in
    neighbor 10.0.0.92 route-map BGP-OUT out

    neighbor 10.0.0.98 route-map BGP-IN in
    neighbor 10.0.0.98 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
 exit-address-family
!
