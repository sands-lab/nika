hostname budapest
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.9/32
!
interface eth0
 no shutdown
 description budapest -> belgrade [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description budapest -> krakow [internal]
 ip address 10.0.0.36/31
!
interface eth2
 no shutdown
 description budapest -> prague [internal]
 ip address 10.0.0.38/31
!
interface eth3
 no shutdown
 description budapest -> stub [stub]
 ip address 10.254.0.33/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.9
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! budapest -> belgrade
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! budapest -> krakow
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! budapest -> prague
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! budapest -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
