hostname rome
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.29/32
!
interface eth0
 no shutdown
 description rome -> marseille [internal]
 ip address 10.0.0.83/31
!
interface eth1
 no shutdown
 description rome -> milan [internal]
 ip address 10.0.0.87/31
!
interface eth2
 no shutdown
 description rome -> palermo [internal]
 ip address 10.0.0.95/31
!
interface eth3
 no shutdown
 description rome -> zagreb [internal]
 ip address 10.0.0.100/31
!
interface eth4
 no shutdown
 description rome -> stub [stub]
 ip address 10.254.0.113/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.29
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! rome -> marseille
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! rome -> milan
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! rome -> palermo
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! rome -> zagreb
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! rome -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
