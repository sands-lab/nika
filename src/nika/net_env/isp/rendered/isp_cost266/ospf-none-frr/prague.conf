hostname prague
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.28/32
!
interface eth0
 no shutdown
 description prague -> berlin [internal]
 ip address 10.0.0.17/31
!
interface eth1
 no shutdown
 description prague -> budapest [internal]
 ip address 10.0.0.39/31
!
interface eth2
 no shutdown
 description prague -> vienna [internal]
 ip address 10.0.0.98/31
!
interface eth3
 no shutdown
 description prague -> stub [stub]
 ip address 10.254.0.109/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.28
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! prague -> berlin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! prague -> budapest
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! prague -> vienna
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! prague -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
