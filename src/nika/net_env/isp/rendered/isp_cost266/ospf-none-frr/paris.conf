hostname paris
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.27/32
!
interface eth0
 no shutdown
 description paris -> bordeaux [internal]
 ip address 10.0.0.31/31
!
interface eth1
 no shutdown
 description paris -> brussels [internal]
 ip address 10.0.0.35/31
!
interface eth2
 no shutdown
 description paris -> london [internal]
 ip address 10.0.0.75/31
!
interface eth3
 no shutdown
 description paris -> lyon [internal]
 ip address 10.0.0.79/31
!
interface eth4
 no shutdown
 description paris -> strasbourg [internal]
 ip address 10.0.0.96/31
!
interface eth5
 no shutdown
 description paris -> stub [stub]
 ip address 10.254.0.105/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.27
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! paris -> bordeaux
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! paris -> brussels
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! paris -> london
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! paris -> lyon
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! paris -> strasbourg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! paris -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
