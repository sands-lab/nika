hostname copenhagen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description copenhagen -> berlin [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description copenhagen -> oslo [internal]
 ip address 10.0.0.40/31
!
interface eth2
 no shutdown
 description copenhagen -> stockholm [internal]
 ip address 10.0.0.42/31
!
interface eth3
 no shutdown
 description copenhagen -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.10
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! copenhagen -> berlin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! copenhagen -> oslo
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! copenhagen -> stockholm
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! copenhagen -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
