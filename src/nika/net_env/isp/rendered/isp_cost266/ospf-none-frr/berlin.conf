hostname berlin
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.5/32
!
interface eth0
 no shutdown
 description berlin -> copenhagen [internal]
 ip address 10.0.0.10/31
!
interface eth1
 no shutdown
 description berlin -> hamburg [internal]
 ip address 10.0.0.12/31
!
interface eth2
 no shutdown
 description berlin -> munich [internal]
 ip address 10.0.0.14/31
!
interface eth3
 no shutdown
 description berlin -> prague [internal]
 ip address 10.0.0.16/31
!
interface eth4
 no shutdown
 description berlin -> warsaw [internal]
 ip address 10.0.0.18/31
!
interface eth5
 no shutdown
 description berlin -> stub [stub]
 ip address 10.254.0.17/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.5
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! berlin -> copenhagen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! berlin -> hamburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! berlin -> munich
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! berlin -> prague
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! berlin -> warsaw
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! berlin -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
