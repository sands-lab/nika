hostname dublin
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description dublin -> glasgow [internal]
 ip address 10.0.0.46/31
!
interface eth1
 no shutdown
 description dublin -> london [internal]
 ip address 10.0.0.48/31
!
interface eth2
 no shutdown
 description dublin -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.11
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! dublin -> glasgow
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! dublin -> london
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! dublin -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
