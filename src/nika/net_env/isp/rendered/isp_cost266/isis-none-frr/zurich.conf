hostname zurich
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.37/32
!
interface eth0
 no shutdown
 description zurich -> lyon [internal]
 ip address 10.0.0.81/31
!
interface eth1
 no shutdown
 description zurich -> milan [internal]
 ip address 10.0.0.91/31
!
interface eth2
 no shutdown
 description zurich -> strasbourg [internal]
 ip address 10.0.0.103/31
!
interface eth3
 no shutdown
 description zurich -> stub [stub]
 ip address 10.254.0.145/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0025.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! zurich -> lyon
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! zurich -> milan
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! zurich -> strasbourg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! zurich -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
