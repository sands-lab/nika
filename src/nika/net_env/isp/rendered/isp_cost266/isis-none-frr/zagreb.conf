hostname zagreb
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.36/32
!
interface eth0
 no shutdown
 description zagreb -> belgrade [internal]
 ip address 10.0.0.9/31
!
interface eth1
 no shutdown
 description zagreb -> rome [internal]
 ip address 10.0.0.101/31
!
interface eth2
 no shutdown
 description zagreb -> vienna [internal]
 ip address 10.0.0.105/31
!
interface eth3
 no shutdown
 description zagreb -> athens [internal]
 ip address 10.0.0.109/31
!
interface eth4
 no shutdown
 description zagreb -> stub [stub]
 ip address 10.254.0.141/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0024.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! zagreb -> belgrade
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! zagreb -> rome
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! zagreb -> vienna
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! zagreb -> athens
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! zagreb -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
