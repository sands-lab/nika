hostname warsaw
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.35/32
!
interface eth0
 no shutdown
 description warsaw -> berlin [internal]
 ip address 10.0.0.19/31
!
interface eth1
 no shutdown
 description warsaw -> helsinki [internal]
 ip address 10.0.0.63/31
!
interface eth2
 no shutdown
 description warsaw -> krakow [internal]
 ip address 10.0.0.65/31
!
interface eth3
 no shutdown
 description warsaw -> stub [stub]
 ip address 10.254.0.137/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0023.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! warsaw -> berlin
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! warsaw -> helsinki
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! warsaw -> krakow
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! warsaw -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
