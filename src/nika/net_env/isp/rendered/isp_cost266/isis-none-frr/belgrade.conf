hostname belgrade
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description belgrade -> budapest [internal]
 ip address 10.0.0.4/31
!
interface eth1
 no shutdown
 description belgrade -> sofia [internal]
 ip address 10.0.0.6/31
!
interface eth2
 no shutdown
 description belgrade -> zagreb [internal]
 ip address 10.0.0.8/31
!
interface eth3
 no shutdown
 description belgrade -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0004.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! belgrade -> budapest
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! belgrade -> sofia
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! belgrade -> zagreb
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! belgrade -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
