hostname milan
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.23/32
!
interface eth0
 no shutdown
 description milan -> munich [internal]
 ip address 10.0.0.84/31
!
interface eth1
 no shutdown
 description milan -> rome [internal]
 ip address 10.0.0.86/31
!
interface eth2
 no shutdown
 description milan -> zurich [internal]
 ip address 10.0.0.90/31
!
interface eth3
 no shutdown
 description milan -> stub [stub]
 ip address 10.254.0.89/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0017.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! milan -> munich
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! milan -> rome
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! milan -> zurich
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! milan -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
