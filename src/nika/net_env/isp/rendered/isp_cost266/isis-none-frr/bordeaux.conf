hostname bordeaux
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description bordeaux -> madrid [internal]
 ip address 10.0.0.26/31
!
interface eth1
 no shutdown
 description bordeaux -> marseille [internal]
 ip address 10.0.0.28/31
!
interface eth2
 no shutdown
 description bordeaux -> paris [internal]
 ip address 10.0.0.30/31
!
interface eth3
 no shutdown
 description bordeaux -> stub [stub]
 ip address 10.254.0.25/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0007.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! bordeaux -> madrid
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! bordeaux -> marseille
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! bordeaux -> paris
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! bordeaux -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
