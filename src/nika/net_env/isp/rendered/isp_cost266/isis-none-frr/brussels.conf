hostname brussels
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.8/32
!
interface eth0
 no shutdown
 description brussels -> amsterdam [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description brussels -> dusseldorf [internal]
 ip address 10.0.0.32/31
!
interface eth2
 no shutdown
 description brussels -> paris [internal]
 ip address 10.0.0.34/31
!
interface eth3
 no shutdown
 description brussels -> stub [stub]
 ip address 10.254.0.29/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0008.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! brussels -> amsterdam
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! brussels -> dusseldorf
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! brussels -> paris
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! brussels -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
