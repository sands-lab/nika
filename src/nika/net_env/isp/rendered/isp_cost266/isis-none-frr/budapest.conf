hostname budapest
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.9/32
!
interface eth0
 no shutdown
 description budapest -> belgrade [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description budapest -> krakow [internal]
 ip address 10.0.0.36/31
!
interface eth2
 no shutdown
 description budapest -> prague [internal]
 ip address 10.0.0.38/31
!
interface eth3
 no shutdown
 description budapest -> stub [stub]
 ip address 10.254.0.33/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0009.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! budapest -> belgrade
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! budapest -> krakow
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! budapest -> prague
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! budapest -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
