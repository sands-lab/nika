hostname berlin
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.5/32
!
interface eth0
 no shutdown
 description berlin -> copenhagen [internal]
 ip address 10.0.0.10/31
!
interface eth1
 no shutdown
 description berlin -> hamburg [internal]
 ip address 10.0.0.12/31
!
interface eth2
 no shutdown
 description berlin -> munich [internal]
 ip address 10.0.0.14/31
!
interface eth3
 no shutdown
 description berlin -> prague [internal]
 ip address 10.0.0.16/31
!
interface eth4
 no shutdown
 description berlin -> warsaw [internal]
 ip address 10.0.0.18/31
!
interface eth5
 no shutdown
 description berlin -> stub [stub]
 ip address 10.254.0.17/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0005.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! berlin -> copenhagen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! berlin -> hamburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! berlin -> munich
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! berlin -> prague
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! berlin -> warsaw
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! berlin -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
