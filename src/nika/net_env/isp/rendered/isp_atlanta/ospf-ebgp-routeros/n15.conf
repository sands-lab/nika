/ip/dns/static add name=n5 address=10.255.0.11
/ip/dns/static add name=n6 address=10.255.0.12
/ip/dns/static add name=n7 address=10.255.0.13
/ip/dns/static add name=n8 address=10.255.0.14
/ip/dns/static add name=n9 address=10.255.0.15

