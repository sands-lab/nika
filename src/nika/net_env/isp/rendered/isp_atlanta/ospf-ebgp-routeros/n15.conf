/interface/ethernet set comment="n15 -> n9 [passive]" ether3
/ip/address add interface=ether3 address=10.0.0.18/31
/ip/address set [find where interface=ether3] comment="n15 -> n9 [passive]"

/interface/ethernet set comment="n15 -> stub [stub]" ether4
/ip/address add interface=ether4 address=10.254.0.25/30
/ip/address set [find where interface=ether4] comment="n15 -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.7 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 passive type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 passive cost=1


/routing/bgp/template add name=main as=65001 output.network=bgp-networks
/routing/bgp/instance add name=main as=65001

/routing/bgp/instance set [/routing/bgp/instance find name=main] router-id=10.255.0.7


/routing/filter/rule add chain=filter_rr_self_ebgp rule="if ( bgp-input-remote-addr == 10.0.0.19 ) { set gw 10.255.0.7;}"
/routing/filter/rule add chain=filter_rr_self_ebgp rule="return;"

/routing/filter/rule/add chain=rm_extended_communities rule="delete bgp-ext-communities rt; delete bgp-ext-communities soo; delete bgp-ext-communities other;"
/routing/filter/rule/add chain=rm_extended_communities rule="return;"
/routing/filter/rule/add chain=rm_large_communities rule="delete bgp-large-communities all;"
/routing/filter/rule/add chain=rm_large_communities rule="return;"
/routing/filter/rule/add chain=rm_standard_communities rule="delete bgp-communities other; delete bgp-communities wk;"
/routing/filter/rule/add chain=rm_standard_communities rule="jump rm_large_communities;"
/routing/filter/rule/add chain=rm_standard_communities rule="return;"


/routing/bgp/connection add template=main instance=main name=10_255_0_1 remote.address=10.255.0.1 remote.as=65001 comment="n1" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_1] afi=ip
/routing/filter/rule add chain=filter_10_255_0_1 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_1] output.filter-chain=filter_10_255_0_1
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_1] local.role=ibgp local.address=10.255.0.7

/routing/filter/rule/add chain=filter_10_255_0_1 rule="jump rm_large_communities;" place-before=0

/routing/bgp/connection add template=main instance=main name=10_0_0_19 remote.address=10.0.0.19 remote.as=65003 comment="n9" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_19] afi=ip
/routing/filter/rule add chain=filter_10_0_0_19 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_19] output.filter-chain=filter_10_0_0_19

/routing/filter/rule/add chain=filter_10_0_0_19 rule="jump rm_large_communities;" place-before=0
/routing/filter/rule/add chain=filter_10_0_0_19 rule="jump rm_extended_communities;" place-before=0







