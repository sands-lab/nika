hostname n9
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.15/32
!
interface eth0
 no shutdown
 description n9 -> n8 [passive]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description n9 -> n10 [internal]
 ip address 10.0.0.15/31
!
interface eth2
 no shutdown
 description n9 -> n12 [internal]
 ip address 10.0.0.17/31
!
interface eth3
 no shutdown
 description n9 -> n15 [passive]
 ip address 10.0.0.19/31
!
interface eth5
 no shutdown
 description n9 -> stub [stub]
 ip address 198.51.110.1/24
!
interface eth4
 no shutdown
 description n9 -> stub [stub]
 ip address 10.254.0.57/30
!
interface lo1
 no shutdown
 description n9 -> stub
 ip address 198.51.102.1/24
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT-AS65001 permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT-AS65001 permit 20
  match ip address prefix-list CUSTOMERS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.15
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n9 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth1
! n9 -> n10
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n9 -> n12
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n9 -> n15
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth4
! n9 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.15
!
  neighbor 10.255.0.2 remote-as 65003
  neighbor 10.255.0.2 description n10
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.0.0.10 remote-as 65001
  neighbor 10.0.0.10 description n8
!
  neighbor 10.0.0.18 remote-as 65001
  neighbor 10.0.0.18 description n15
!
 address-family ipv4 unicast
!

  network 198.51.110.0/24
  network 198.51.102.0/24
!
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
  neighbor 10.0.0.10 activate
  no neighbor 10.0.0.10 send-community all
  neighbor 10.0.0.10 send-community standard
  neighbor 10.0.0.10 send-community large
!
  neighbor 10.0.0.18 activate
  no neighbor 10.0.0.18 send-community all
  neighbor 10.0.0.18 send-community standard
  neighbor 10.0.0.18 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.10 route-map BGP-IN in
    neighbor 10.0.0.10 route-map BGP-OUT out

    neighbor 10.0.0.18 route-map BGP-IN in
    neighbor 10.0.0.18 route-map BGP-OUT-AS65001 out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
 exit-address-family
!
