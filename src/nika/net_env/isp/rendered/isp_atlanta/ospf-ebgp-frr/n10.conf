hostname n10
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description n10 -> n7 [passive]
 ip address 10.0.0.6/31
!
interface eth1
 no shutdown
 description n10 -> n9 [internal]
 ip address 10.0.0.14/31
!
interface eth2
 no shutdown
 description n10 -> n12 [internal]
 ip address 10.0.0.20/31
!
interface eth3
 no shutdown
 description n10 -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n10 -> n7
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth1
! n10 -> n9
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n10 -> n12
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n10 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.2
  bgp cluster-id 10.255.0.2
!
  neighbor 10.255.0.4 remote-as 65003
  neighbor 10.255.0.4 description n12
  neighbor 10.255.0.4 update-source lo
!
  neighbor 10.255.0.15 remote-as 65003
  neighbor 10.255.0.15 description n9
  neighbor 10.255.0.15 update-source lo
!
  neighbor 10.0.0.7 remote-as 65001
  neighbor 10.0.0.7 description n7
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.4 next-hop-self
  neighbor 10.255.0.4 route-reflector-client
  no neighbor 10.255.0.4 send-community all
  neighbor 10.255.0.4 send-community standard
  neighbor 10.255.0.4 send-community large
  neighbor 10.255.0.4 send-community extended
!
  neighbor 10.255.0.15 activate
  neighbor 10.255.0.15 next-hop-self
  neighbor 10.255.0.15 route-reflector-client
  no neighbor 10.255.0.15 send-community all
  neighbor 10.255.0.15 send-community standard
  neighbor 10.255.0.15 send-community large
  neighbor 10.255.0.15 send-community extended
!
  neighbor 10.0.0.7 activate
  no neighbor 10.0.0.7 send-community all
  neighbor 10.0.0.7 send-community standard
  neighbor 10.0.0.7 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4



    neighbor 10.0.0.7 route-map BGP-IN in
    neighbor 10.0.0.7 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.4 route-map BGP-IN in
  neighbor 10.255.0.15 route-map BGP-IN in
 exit-address-family
!
