/interface/ethernet set comment="n15 -> n9 [internal]" ether3
/ip/address add interface=ether3 address=10.0.0.18/31
/ip/address set [find where interface=ether3] comment="n15 -> n9 [internal]"

/interface/ethernet set comment="n15 -> stub [stub]" ether4
/ip/address add interface=ether4 address=10.254.0.25/30
/ip/address set [find where interface=ether4] comment="n15 -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.7 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 passive cost=1

