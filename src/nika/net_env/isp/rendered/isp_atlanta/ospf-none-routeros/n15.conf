/ip/dns/static add name=n13 address=10.255.0.5
/ip/dns/static add name=n14 address=10.255.0.6
/ip/dns/static add name=n2 address=10.255.0.8
/ip/dns/static add name=n3 address=10.255.0.9
/ip/dns/static add name=n4 address=10.255.0.10
/ip/dns/static add name=n5 address=10.255.0.11
/ip/dns/static add name=n6 address=10.255.0.12
