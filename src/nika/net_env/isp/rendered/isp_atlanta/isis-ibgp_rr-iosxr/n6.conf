hostname n6
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host n1 10.255.0.1
domain ipv4 host n10 10.255.0.2
domain ipv4 host n11 10.255.0.3
domain ipv4 host n12 10.255.0.4
domain ipv4 host n13 10.255.0.5
domain ipv4 host n14 10.255.0.6
domain ipv4 host n15 10.255.0.7
domain ipv4 host n2 10.255.0.8
domain ipv4 host n3 10.255.0.9
domain ipv4 host n4 10.255.0.10
domain ipv4 host n5 10.255.0.11
domain ipv4 host n7 10.255.0.13
domain ipv4 host n8 10.255.0.14
domain ipv4 host n9 10.255.0.15
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.12 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description n6 -> n1 [internal]
 ipv4 address 10.0.0.1 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description n6 -> n4 [internal]
 ipv4 address 10.0.0.3 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description n6 -> n13 [internal]
 ipv4 address 10.0.0.5 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description n6 -> n2 [internal]
 ipv4 address 10.0.0.37 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description n6 -> stub [stub]
 ipv4 address 10.254.0.45 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
!
router isis CORE

 log adjacency changes
 lsp-gen-interval initial-wait 50 secondary-wait 100 maximum-wait 500
 is-type level-2-only
 net 49.0001.0000.0aff.000c.00
!
 address-family ipv4 unicast
  metric-style wide
  spf-interval initial-wait 50 secondary-wait 100 maximum-wait 500
!
!
 interface Loopback0
  passive
  address-family ipv4
!
 interface GigabitEthernet0/0/0/0
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/1
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/2
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/3
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/4
  passive
  circuit-type level-2
  address-family ipv4
    metric 1

!
!
router bgp 65000
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.12

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.1
  remote-as 65000
  description n1
  update-source Loopback0
  address-family ipv4 unicast

!
 neighbor 10.255.0.2
  remote-as 65000
  description n10
  update-source Loopback0
  address-family ipv4 unicast


router bgp 65000
 neighbor 10.255.0.1
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.2
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
