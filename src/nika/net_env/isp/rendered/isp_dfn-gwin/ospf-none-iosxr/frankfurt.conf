hostname frankfurt
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host berlin 10.255.0.1
domain ipv4 host erlangen 10.255.0.2
domain ipv4 host essen 10.255.0.3
domain ipv4 host hamburg 10.255.0.5
domain ipv4 host hannover 10.255.0.6
domain ipv4 host ip 10.255.0.7
domain ipv4 host koeln 10.255.0.8
domain ipv4 host leipzig 10.255.0.9
domain ipv4 host muenchen 10.255.0.10
domain ipv4 host stuttgart 10.255.0.11
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.4 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description frankfurt -> berlin [internal]
 ipv4 address 10.0.0.5 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description frankfurt -> erlangen [internal]
 ipv4 address 10.0.0.21 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description frankfurt -> essen [internal]
 ipv4 address 10.0.0.35 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description frankfurt -> hamburg [internal]
 ipv4 address 10.0.0.48 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description frankfurt -> hannover [internal]
 ipv4 address 10.0.0.50 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description frankfurt -> ip [internal]
 ipv4 address 10.0.0.52 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description frankfurt -> koeln [internal]
 ipv4 address 10.0.0.54 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description frankfurt -> leipzig [internal]
 ipv4 address 10.0.0.56 255.255.255.254
!
interface GigabitEthernet0/0/0/8
 no shutdown
 description frankfurt -> muenchen [internal]
 ipv4 address 10.0.0.58 255.255.255.254
!
interface GigabitEthernet0/0/0/9
 no shutdown
 description frankfurt -> stuttgart [internal]
 ipv4 address 10.0.0.60 255.255.255.254
!
interface GigabitEthernet0/0/0/10
 no shutdown
 description frankfurt -> stub [stub]
 ipv4 address 10.254.0.13 255.255.255.252
!
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.4

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
