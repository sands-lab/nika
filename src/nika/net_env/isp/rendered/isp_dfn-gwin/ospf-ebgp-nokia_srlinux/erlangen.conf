              passive: true
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/9.0
              passive: true
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/10.0
              passive: true
              failure-detection:
                enable-bfd: false
              metric: 1
- operation: update
  path: /routing-policy/policy[name=accept_all]
  value:
    default-action:
      policy-result: accept
- operation: update
  path: /routing-policy/community-set[name=ibgp-mark]
  value:
    member:
    - 65536:0:65536
- operation: update
  path: /routing-policy/policy[name=ibgp-mark]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: mark-ibgp-routes
      action:
        bgp:
          communities:
            add: ibgp-mark
        policy-result: accept
- operation: update
  path: /routing-policy/prefix-set[name=default_bgp_advertise]
  value:
    prefix: []
- operation: update
  path: /routing-policy/policy[name=default_bgp_export]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: prefixes
      match:
        prefix-set: default_bgp_advertise
      action:
        policy-result: next-policy
    - name: bgp
      match:
        protocol: bgp
      action:
        policy-result: next-policy
        bgp:
          communities:
            remove: ibgp-mark
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    admin-state: enable
    autonomous-system: 65003
    router-id: 10.255.0.2
    ebgp-default-policy:
      export-reject-all: false
      import-reject-all: false
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
- operation: update
  path: /routing-policy/prefix-set[name=default_bgp_advertise]
  value:
    prefix:
    - ip-prefix: 198.51.102.0/24
      mask-length-range: exact
- operation: update
  path: /network-instance[name=default]/protocols/bgp/group[group-name=ebgp]
  value:
    admin-state: enable
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
      import-policy:
      - accept_all
      export-policy:
      - default_bgp_export
      - accept_all
    - afi-safi-name: ipv6-unicast
      admin-state: disable
    timers:
      connect-retry: 10
      _annotate_connect-retry: Reduce default 120s to 10s
      minimum-advertisement-interval: 1
    send-community:
      standard: true
      large: true
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    neighbor:
    - peer-address: 10.0.0.0
      description: berlin
      peer-group: ebgp
      afi-safi:
      - afi-safi-name: ipv4-unicast
        admin-state: enable
        export-policy:
        - default_bgp_export
        - accept_all
      - afi-safi-name: ipv6-unicast
        admin-state: disable
      peer-as: 65001
- operation: update
  path: /network-instance[name=default]/protocols/bgp/group[group-name=ebgp]
