- operation: update
  path: /network-instance[name=default]
  value:
    router-id: 10.255.0.2
    protocols:
      ospf:
        instance:
        - name: '1'
          version: ospf-v2
          admin-state: enable
          max-ecmp-paths: 64
          area:
          - area-id: 0.0.0.0
            interface:
            - interface-name: system0.0
              passive: true
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/1.0
              passive: true
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/2.0
              passive: true
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
