          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/2.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/3.0
        circuit-type: broadcast
        passive: true
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 1
