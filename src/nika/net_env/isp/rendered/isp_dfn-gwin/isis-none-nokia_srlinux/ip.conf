- operation: update
  path: /network-instance[name=default]/protocols/isis
  value:
    instance:
    - name: default
      admin-state: enable
      net:
      - 49.0001.0000.0aff.0007.00
      level-capability: L2
      interface:
      - interface-name: system0.0
        passive: true
        ipv4-unicast:
          admin-state: enable
        ipv6-unicast:
          admin-state: disable
      - interface-name: ethernet-1/1.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
