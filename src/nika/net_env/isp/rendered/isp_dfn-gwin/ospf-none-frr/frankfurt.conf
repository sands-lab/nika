hostname frankfurt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description frankfurt -> berlin [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description frankfurt -> erlangen [internal]
 ip address 10.0.0.21/31
!
interface eth2
 no shutdown
 description frankfurt -> essen [internal]
 ip address 10.0.0.35/31
!
interface eth3
 no shutdown
 description frankfurt -> hamburg [internal]
 ip address 10.0.0.48/31
!
interface eth4
 no shutdown
 description frankfurt -> hannover [internal]
 ip address 10.0.0.50/31
!
interface eth5
 no shutdown
 description frankfurt -> ip [internal]
 ip address 10.0.0.52/31
!
interface eth6
 no shutdown
 description frankfurt -> koeln [internal]
 ip address 10.0.0.54/31
!
interface eth7
 no shutdown
 description frankfurt -> leipzig [internal]
 ip address 10.0.0.56/31
!
interface eth8
 no shutdown
 description frankfurt -> muenchen [internal]
 ip address 10.0.0.58/31
!
interface eth9
 no shutdown
 description frankfurt -> stuttgart [internal]
 ip address 10.0.0.60/31
!
interface eth10
 no shutdown
 description frankfurt -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.4
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! frankfurt -> berlin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
