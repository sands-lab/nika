
/system/identity set name="ip"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=berlin address=10.255.0.1
/ip/dns/static add name=erlangen address=10.255.0.2
/ip/dns/static add name=essen address=10.255.0.3
/ip/dns/static add name=frankfurt address=10.255.0.4
/ip/dns/static add name=hamburg address=10.255.0.5
/ip/dns/static add name=hannover address=10.255.0.6
/ip/dns/static add name=koeln address=10.255.0.8
/ip/dns/static add name=leipzig address=10.255.0.9
/ip/dns/static add name=muenchen address=10.255.0.10
/ip/dns/static add name=stuttgart address=10.255.0.11

/ip/address add interface=loopback address=10.255.0.7/32




/interface/ethernet set comment="ip -> frankfurt [internal]" ether2
/ip/address add interface=ether2 address=10.0.0.53/31
/ip/address set [find where interface=ether2] comment="ip -> frankfurt [internal]"

/interface/ethernet set comment="ip -> hannover [internal]" ether3
/ip/address add interface=ether3 address=10.0.0.73/31
/ip/address set [find where interface=ether3] comment="ip -> hannover [internal]"

/interface/ethernet set comment="ip -> stub [stub]" ether4
/ip/address add interface=ether4 address=10.254.0.25/30
/ip/address set [find where interface=ether4] comment="ip -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.7 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 passive cost=1

