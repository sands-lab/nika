
/system/identity set name="koeln"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=berlin address=10.255.0.1
/ip/dns/static add name=erlangen address=10.255.0.2
/ip/dns/static add name=essen address=10.255.0.3
