hostname koeln
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host berlin 10.255.0.1
domain ipv4 host erlangen 10.255.0.2
domain ipv4 host essen 10.255.0.3
domain ipv4 host frankfurt 10.255.0.4
domain ipv4 host hamburg 10.255.0.5
domain ipv4 host hannover 10.255.0.6
domain ipv4 host ip 10.255.0.7
domain ipv4 host leipzig 10.255.0.9
domain ipv4 host muenchen 10.255.0.10
domain ipv4 host stuttgart 10.255.0.11
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.8 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description koeln -> berlin [internal]
 ipv4 address 10.0.0.11 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description koeln -> erlangen [internal]
 ipv4 address 10.0.0.27 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description koeln -> essen [internal]
 ipv4 address 10.0.0.41 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description koeln -> frankfurt [internal]
 ipv4 address 10.0.0.55 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description koeln -> hamburg [internal]
 ipv4 address 10.0.0.65 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description koeln -> hannover [internal]
 ipv4 address 10.0.0.75 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description koeln -> leipzig [internal]
 ipv4 address 10.0.0.82 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description koeln -> muenchen [internal]
 ipv4 address 10.0.0.84 255.255.255.254
!
interface GigabitEthernet0/0/0/8
 no shutdown
 description koeln -> stuttgart [internal]
 ipv4 address 10.0.0.86 255.255.255.254
!
interface GigabitEthernet0/0/0/9
 no shutdown
 description koeln -> stub [stub]
 ipv4 address 10.254.0.29 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
!
router isis CORE

 log adjacency changes
 lsp-gen-interval initial-wait 50 secondary-wait 100 maximum-wait 500
 is-type level-2-only
 net 49.0001.0000.0aff.0008.00
!
 address-family ipv4 unicast
  metric-style wide
  spf-interval initial-wait 50 secondary-wait 100 maximum-wait 500
!
!
 interface Loopback0
  passive
  address-family ipv4
!
 interface GigabitEthernet0/0/0/0
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/1
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/2
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/3
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/4
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/5
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/6
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/7
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/8
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/9
  passive
  circuit-type level-2
  address-family ipv4
    metric 1

!
!
router bgp 65000
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.8

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.1
  remote-as 65000
  description berlin
  update-source Loopback0
  address-family ipv4 unicast

!
 neighbor 10.255.0.2
  remote-as 65000
  description erlangen
  update-source Loopback0
  address-family ipv4 unicast


router bgp 65000
 neighbor 10.255.0.1
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.2
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
