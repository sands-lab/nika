operations:
- operation: update
  path: /interface[name=system0]/subinterface[index=0]
  value:
    description: No description
    admin-state: enable
    ipv4:
      admin-state: enable
      address:
      - ip-prefix: 10.255.0.7/32
- operation: update
  path: /interface[name=ethernet-1/1]
  value:
    description: ip ~ frankfurt
    subinterface:
      index: 0
      description: ip ~ frankfurt
- operation: update
  path: /interface[name=ethernet-1/1]/subinterface[index=0]
  value:
    description: ip ~ frankfurt
    admin-state: enable
    ipv4:
      admin-state: enable
      address:
      - ip-prefix: 10.0.0.53/31
        primary:
        - null
- operation: update
  path: /interface[name=ethernet-1/2]
  value:
    description: ip ~ hannover
    subinterface:
      index: 0
      description: ip ~ hannover
- operation: update
  path: /interface[name=ethernet-1/2]/subinterface[index=0]
  value:
    description: ip ~ hannover
    admin-state: enable
    ipv4:
      admin-state: enable
      address:
      - ip-prefix: 10.0.0.73/31
        primary:
        - null
- operation: update
  path: /interface[name=ethernet-1/3]
  value:
    description: ip ~ stub
    subinterface:
      index: 0
      description: ip ~ stub
- operation: update
  path: /interface[name=ethernet-1/3]/subinterface[index=0]
  value:
    description: ip ~ stub
    admin-state: enable
    ipv4:
      admin-state: enable
      address:
      - ip-prefix: 10.254.0.25/30
        primary:
        - null
- operation: update
  path: /network-instance[name=default]
  value:
    type: default
    interface:
    - name: system0.0
- operation: update
  path: /network-instance[name=default]
  value:
    type: default
    interface:
    - name: ethernet-1/1.0
- operation: update
  path: /network-instance[name=default]
  value:
    type: default
    interface:
    - name: ethernet-1/2.0
- operation: update
  path: /network-instance[name=default]
  value:
    type: default
    interface:
    - name: ethernet-1/3.0
- operation: update
  path: /routing-policy/prefix-set[name=BUSINESS]
  value:
    prefix:
    - ip-prefix: 203.0.113.0/24
      mask-length-range: exact
    - ip-prefix: 203.0.114.0/24
      mask-length-range: exact
    - ip-prefix: 203.0.115.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.100.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.101.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.102.0/24
      mask-length-range: exact
- operation: update
  path: /routing-policy/policy[name=BGP-IN]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: rpe_10
      match:
        prefix-set: BUSINESS
      action:
        policy-result: accept
- operation: update
  path: /routing-policy/policy[name=BGP-OUT]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: rpe_10
      match:
        prefix-set: BUSINESS
      action:
        policy-result: accept
- operation: update
  path: /network-instance[name=default]/protocols/isis
  value:
    instance:
    - name: default
      admin-state: enable
      net:
      - 49.0001.0000.0aff.0007.00
      level-capability: L2
      interface:
      - interface-name: system0.0
        passive: true
        ipv4-unicast:
          admin-state: enable
        ipv6-unicast:
          admin-state: disable
      - interface-name: ethernet-1/1.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/2.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/3.0
        circuit-type: broadcast
        passive: true
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 1
- operation: update
  path: /routing-policy/policy[name=accept_all]
  value:
    default-action:
      policy-result: accept
- operation: update
  path: /routing-policy/community-set[name=ibgp-mark]
  value:
    member:
    - 65536:0:65536
- operation: update
  path: /routing-policy/policy[name=ibgp-mark]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: mark-ibgp-routes
      action:
        bgp:
          communities:
            add: ibgp-mark
        policy-result: accept
- operation: update
  path: /routing-policy/prefix-set[name=default_bgp_advertise]
  value:
    prefix: []
- operation: update
  path: /routing-policy/policy[name=default_bgp_export]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: prefixes
      match:
        prefix-set: default_bgp_advertise
      action:
        policy-result: next-policy
    - name: bgp
      match:
        protocol: bgp
      action:
        policy-result: next-policy
        bgp:
          communities:
            remove: ibgp-mark
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    admin-state: enable
    autonomous-system: 65000
    router-id: 10.255.0.7
    ebgp-default-policy:
      export-reject-all: false
      import-reject-all: false
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
- operation: update
  path: /network-instance[name=default]/protocols/bgp/group[group-name=ibgp-ipv4]
  value:
    admin-state: enable
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
      import-policy:
      - ibgp-mark
      export-policy:
      - default_bgp_export
      - accept_all
    - afi-safi-name: ipv6-unicast
      admin-state: disable
    timers:
      connect-retry: 10
      _annotate_connect-retry: Reduce default 120s to 10s
      minimum-advertisement-interval: 1
    send-community:
      standard: true
      large: true
    peer-as: 65000
    transport:
      local-address: 10.255.0.7
    next-hop-self: false
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    neighbor:
    - peer-address: 10.255.0.1
      description: berlin
      peer-group: ibgp-ipv4
      afi-safi:
      - afi-safi-name: ipv4-unicast
        admin-state: enable
      - afi-safi-name: ipv6-unicast
        admin-state: disable
- operation: update
  path: /network-instance[name=default]/protocols/bgp/group[group-name=ibgp-ipv4]
  value:
    admin-state: enable
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
      import-policy:
      - ibgp-mark
      export-policy:
      - default_bgp_export
      - accept_all
    - afi-safi-name: ipv6-unicast
      admin-state: disable
    timers:
      connect-retry: 10
      _annotate_connect-retry: Reduce default 120s to 10s
      minimum-advertisement-interval: 1
    send-community:
      standard: true
      large: true
    peer-as: 65000
    transport:
      local-address: 10.255.0.7
    next-hop-self: false
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    neighbor:
    - peer-address: 10.255.0.2
      description: erlangen
      peer-group: ibgp-ipv4
      afi-safi:
      - afi-safi-name: ipv4-unicast
        admin-state: enable
      - afi-safi-name: ipv6-unicast
        admin-state: disable
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.1]/afi-safi[afi-safi-name=ipv4-unicast]/import-policy
  value:
  - BGP-IN
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.1]/afi-safi[afi-safi-name=ipv4-unicast]/export-policy
  value:
  - default_bgp_export
  - BGP-OUT
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.2]/afi-safi[afi-safi-name=ipv4-unicast]/import-policy
  value:
  - BGP-IN
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.2]/afi-safi[afi-safi-name=ipv4-unicast]/export-policy
  value:
  - default_bgp_export
  - BGP-OUT
