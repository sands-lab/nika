hostname stuttgart
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host berlin 10.255.0.1
domain ipv4 host erlangen 10.255.0.2
domain ipv4 host essen 10.255.0.3
domain ipv4 host frankfurt 10.255.0.4
domain ipv4 host hamburg 10.255.0.5
domain ipv4 host hannover 10.255.0.6
domain ipv4 host ip 10.255.0.7
domain ipv4 host koeln 10.255.0.8
domain ipv4 host leipzig 10.255.0.9
domain ipv4 host muenchen 10.255.0.10
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.11 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description stuttgart -> berlin [internal]
 ipv4 address 10.0.0.17 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description stuttgart -> erlangen [passive]
 ipv4 address 10.0.0.33 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description stuttgart -> essen [internal]
 ipv4 address 10.0.0.47 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description stuttgart -> frankfurt [internal]
 ipv4 address 10.0.0.61 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description stuttgart -> hamburg [internal]
 ipv4 address 10.0.0.71 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description stuttgart -> hannover [internal]
 ipv4 address 10.0.0.81 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description stuttgart -> koeln [internal]
 ipv4 address 10.0.0.87 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description stuttgart -> leipzig [internal]
 ipv4 address 10.0.0.91 255.255.255.254
!
interface GigabitEthernet0/0/0/8
 no shutdown
 description stuttgart -> muenchen [internal]
 ipv4 address 10.0.0.93 255.255.255.254
!
interface GigabitEthernet0/0/0/9
 no shutdown
 description stuttgart -> stub [stub]
 ipv4 address 10.254.0.41 255.255.255.252
!
interface Loopback1
 no shutdown
 description stuttgart -> stub
 ipv4 address 198.51.100.1 255.255.255.0
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.11

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/7
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/8
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/9
   passive enable
   cost 1

!
!
router bgp 65001
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.11

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
  network 198.51.100.0/24
!
 neighbor 10.255.0.1
  remote-as 65001
  description berlin
  update-source Loopback0
  address-family ipv4 unicast

!
 neighbor 10.0.0.32
  remote-as 65003
  description erlangen
  address-family ipv4 unicast
   send-community-ebgp

!
!
!
router bgp 65001
!
  neighbor 10.255.0.1
    address-family ipv4 unicast

  neighbor 10.0.0.32
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out


router bgp 65001
 neighbor 10.255.0.1
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
