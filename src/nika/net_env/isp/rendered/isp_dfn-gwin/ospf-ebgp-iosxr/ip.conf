hostname ip
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host berlin 10.255.0.1
domain ipv4 host erlangen 10.255.0.2
domain ipv4 host essen 10.255.0.3
domain ipv4 host frankfurt 10.255.0.4
domain ipv4 host hamburg 10.255.0.5
domain ipv4 host hannover 10.255.0.6
domain ipv4 host koeln 10.255.0.8
domain ipv4 host leipzig 10.255.0.9
domain ipv4 host muenchen 10.255.0.10
domain ipv4 host stuttgart 10.255.0.11
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.7 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description ip -> frankfurt [passive]
 ipv4 address 10.0.0.53 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description ip -> hannover [passive]
 ipv4 address 10.0.0.73 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description ip -> stub [stub]
 ipv4 address 10.254.0.25 255.255.255.252
!
interface Loopback1
 no shutdown
 description ip -> stub
 ipv4 address 198.51.101.1 255.255.255.0
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.7

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   passive enable
   cost 1

!
!
router bgp 65002
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.7
 bgp cluster-id 10.255.0.7

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
  network 198.51.101.0/24
!
 neighbor 10.0.0.52
  remote-as 65001
  description frankfurt
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.72
  remote-as 65001
  description hannover
  address-family ipv4 unicast
   send-community-ebgp

!
!
!
router bgp 65002
!
  neighbor 10.0.0.52
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.72
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

