#!/usr/bin/vtysh -f
!
router bgp 65000
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.2
  bgp cluster-id 10.255.0.1
!
  neighbor 10.255.0.1 remote-as 65000
  neighbor 10.255.0.1 description berlin
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.255.0.3 remote-as 65000
  neighbor 10.255.0.3 description essen
  neighbor 10.255.0.3 update-source lo
!
  neighbor 10.255.0.4 remote-as 65000
  neighbor 10.255.0.4 description frankfurt
  neighbor 10.255.0.4 update-source lo
!
  neighbor 10.255.0.5 remote-as 65000
  neighbor 10.255.0.5 description hamburg
  neighbor 10.255.0.5 update-source lo
!
  neighbor 10.255.0.6 remote-as 65000
  neighbor 10.255.0.6 description hannover
  neighbor 10.255.0.6 update-source lo
!
  neighbor 10.255.0.7 remote-as 65000
  neighbor 10.255.0.7 description ip
  neighbor 10.255.0.7 update-source lo
!
  neighbor 10.255.0.8 remote-as 65000
  neighbor 10.255.0.8 description koeln
