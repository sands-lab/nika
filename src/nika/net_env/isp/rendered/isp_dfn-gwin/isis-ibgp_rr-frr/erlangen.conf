hostname erlangen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description erlangen -> berlin [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description erlangen -> essen [internal]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description erlangen -> frankfurt [internal]
 ip address 10.0.0.20/31
!
interface eth3
 no shutdown
 description erlangen -> hamburg [internal]
 ip address 10.0.0.22/31
!
interface eth4
 no shutdown
 description erlangen -> hannover [internal]
 ip address 10.0.0.24/31
!
interface eth5
 no shutdown
 description erlangen -> koeln [internal]
 ip address 10.0.0.26/31
!
interface eth6
 no shutdown
 description erlangen -> leipzig [internal]
 ip address 10.0.0.28/31
!
interface eth7
 no shutdown
 description erlangen -> muenchen [internal]
 ip address 10.0.0.30/31
!
interface eth8
 no shutdown
 description erlangen -> stuttgart [internal]
 ip address 10.0.0.32/31
!
interface eth9
 no shutdown
 description erlangen -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0002.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
