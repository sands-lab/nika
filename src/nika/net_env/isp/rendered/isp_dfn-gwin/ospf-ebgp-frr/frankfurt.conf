hostname frankfurt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description frankfurt -> berlin [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description frankfurt -> erlangen [passive]
 ip address 10.0.0.21/31
!
interface eth2
 no shutdown
 description frankfurt -> essen [internal]
 ip address 10.0.0.35/31
!
interface eth3
 no shutdown
 description frankfurt -> hamburg [internal]
 ip address 10.0.0.48/31
!
interface eth4
 no shutdown
 description frankfurt -> hannover [internal]
 ip address 10.0.0.50/31
!
interface eth5
 no shutdown
 description frankfurt -> ip [passive]
 ip address 10.0.0.52/31
!
interface eth6
 no shutdown
 description frankfurt -> koeln [internal]
 ip address 10.0.0.54/31
!
interface eth7
 no shutdown
 description frankfurt -> leipzig [internal]
 ip address 10.0.0.56/31
!
interface eth8
 no shutdown
 description frankfurt -> muenchen [internal]
 ip address 10.0.0.58/31
!
interface eth9
 no shutdown
 description frankfurt -> stuttgart [internal]
 ip address 10.0.0.60/31
!
interface eth10
 no shutdown
 description frankfurt -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.4
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! frankfurt -> berlin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! frankfurt -> erlangen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! frankfurt -> essen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! frankfurt -> hamburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! frankfurt -> hannover
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! frankfurt -> ip
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth6
! frankfurt -> koeln
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth7
! frankfurt -> leipzig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth8
! frankfurt -> muenchen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth9
! frankfurt -> stuttgart
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth10
! frankfurt -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
