!
interface eth2
 no shutdown
 description hamburg -> essen [internal]
 ip address 10.0.0.37/31
!
interface eth3
 no shutdown
 description hamburg -> frankfurt [internal]
 ip address 10.0.0.49/31
!
interface eth4
 no shutdown
 description hamburg -> hannover [internal]
 ip address 10.0.0.62/31
!
interface eth5
 no shutdown
 description hamburg -> koeln [internal]
 ip address 10.0.0.64/31
!
interface eth6
 no shutdown
 description hamburg -> leipzig [internal]
 ip address 10.0.0.66/31
!
interface eth7
 no shutdown
 description hamburg -> muenchen [internal]
 ip address 10.0.0.68/31
!
interface eth8
 no shutdown
 description hamburg -> stuttgart [internal]
 ip address 10.0.0.70/31
!
interface eth9
 no shutdown
 description hamburg -> stub [stub]
