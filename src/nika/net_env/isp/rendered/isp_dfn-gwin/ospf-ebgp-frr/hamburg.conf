hostname hamburg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.5/32
!
interface eth0
 no shutdown
 description hamburg -> berlin [internal]
