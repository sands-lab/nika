hostname koeln
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.8/32
!
interface eth0
 no shutdown
 description koeln -> berlin [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
