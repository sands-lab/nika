hostname erlangen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description erlangen -> berlin [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description erlangen -> essen [internal]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description erlangen -> frankfurt [internal]
