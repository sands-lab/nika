hostname essen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.3/32
!
interface eth0
 no shutdown
 description essen -> berlin [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description essen -> erlangen [internal]
 ip address 10.0.0.19/31
!
interface eth2
 no shutdown
 description essen -> frankfurt [internal]
