!
interface eth3
 no shutdown
 description n_3 -> n_27 [internal]
 ip address 10.0.0.17/31
!
interface eth4
 no shutdown
 description n_3 -> n_1 [internal]
 ip address 10.0.0.47/31
!
interface eth5
 no shutdown
 description n_3 -> stub [stub]
 ip address 10.254.0.93/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0018.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n_3 -> n_14
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
