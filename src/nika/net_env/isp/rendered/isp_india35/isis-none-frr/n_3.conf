hostname n_3
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.24/32
!
interface eth0
 no shutdown
 description n_3 -> n_14 [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description n_3 -> n_17 [internal]
 ip address 10.0.0.13/31
!
