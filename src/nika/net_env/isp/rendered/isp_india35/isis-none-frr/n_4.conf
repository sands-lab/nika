hostname n_4
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.30/32
!
interface eth0
 no shutdown
 description n_4 -> n_6 [internal]
 ip address 10.0.0.18/31
!
interface eth1
 no shutdown
 description n_4 -> n_18 [internal]
 ip address 10.0.0.21/31
!
interface eth2
 no shutdown
 description n_4 -> n_24 [internal]
 ip address 10.0.0.23/31
!
interface eth3
 no shutdown
 description n_4 -> n_28 [internal]
 ip address 10.0.0.27/31
!
interface eth4
 no shutdown
 description n_4 -> stub [stub]
 ip address 10.254.0.117/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001e.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n_4 -> n_6
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n_4 -> n_18
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n_4 -> n_24
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n_4 -> n_28
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n_4 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
