hostname n_24
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.18/32
!
interface eth0
 no shutdown
 description n_24 -> n_0 [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description n_24 -> n_4 [internal]
 ip address 10.0.0.22/31
!
interface eth2
 no shutdown
 description n_24 -> n_6 [internal]
 ip address 10.0.0.36/31
!
interface eth3
 no shutdown
 description n_24 -> n_32 [internal]
 ip address 10.0.0.136/31
!
interface eth4
 no shutdown
 description n_24 -> stub [stub]
 ip address 10.254.0.69/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.18
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n_24 -> n_0
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n_24 -> n_4
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n_24 -> n_6
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n_24 -> n_32
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n_24 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
