hostname n_14
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description n_14 -> n_3 [internal]
 ip address 10.0.0.10/31
!
interface eth1
 no shutdown
 description n_14 -> n_7 [internal]
 ip address 10.0.0.44/31
!
interface eth2
 no shutdown
 description n_14 -> n_9 [internal]
 ip address 10.0.0.64/31
!
interface eth3
 no shutdown
 description n_14 -> n_25 [internal]
 ip address 10.0.0.88/31
!
interface eth4
 no shutdown
 description n_14 -> n_1 [internal]
 ip address 10.0.0.113/31
!
interface eth5
 no shutdown
 description n_14 -> stub [stub]
 ip address 10.254.0.25/30
!
