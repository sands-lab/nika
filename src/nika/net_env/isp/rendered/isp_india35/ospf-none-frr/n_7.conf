hostname n_7
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.33/32
!
interface eth0
 no shutdown
 description n_7 -> n_9 [internal]
 ip address 10.0.0.42/31
!
interface eth1
 no shutdown
 description n_7 -> n_14 [internal]
 ip address 10.0.0.45/31
!
interface eth2
 no shutdown
 description n_7 -> n_23 [internal]
 ip address 10.0.0.49/31
!
interface eth3
 no shutdown
 description n_7 -> n_31 [internal]
 ip address 10.0.0.51/31
!
interface eth4
 no shutdown
 description n_7 -> stub [stub]
 ip address 10.254.0.129/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.33
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n_7 -> n_9
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n_7 -> n_14
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n_7 -> n_23
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n_7 -> n_31
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n_7 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
