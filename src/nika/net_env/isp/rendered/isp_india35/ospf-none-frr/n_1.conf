hostname n_1
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description n_1 -> n_3 [internal]
 ip address 10.0.0.46/31
!
interface eth1
 no shutdown
 description n_1 -> n_6 [internal]
 ip address 10.0.0.68/31
!
interface eth2
 no shutdown
 description n_1 -> n_9 [internal]
 ip address 10.0.0.90/31
!
interface eth3
 no shutdown
 description n_1 -> n_14 [internal]
 ip address 10.0.0.112/31
!
interface eth4
 no shutdown
 description n_1 -> n_21 [internal]
 ip address 10.0.0.134/31
!
interface eth5
 no shutdown
 description n_1 -> n_28 [internal]
 ip address 10.0.0.156/31
!
interface eth6
 no shutdown
 description n_1 -> stub [stub]
 ip address 10.254.0.5/30
!
