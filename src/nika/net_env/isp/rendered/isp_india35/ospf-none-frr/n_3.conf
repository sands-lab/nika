hostname n_3
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.24/32
!
interface eth0
 no shutdown
 description n_3 -> n_14 [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description n_3 -> n_17 [internal]
 ip address 10.0.0.13/31
!
interface eth2
 no shutdown
 description n_3 -> n_25 [internal]
 ip address 10.0.0.15/31
!
interface eth3
 no shutdown
 description n_3 -> n_27 [internal]
 ip address 10.0.0.17/31
!
interface eth4
 no shutdown
 description n_3 -> n_1 [internal]
 ip address 10.0.0.47/31
!
interface eth5
 no shutdown
 description n_3 -> stub [stub]
 ip address 10.254.0.93/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.24
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n_3 -> n_14
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n_3 -> n_17
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n_3 -> n_25
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n_3 -> n_27
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n_3 -> n_1
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n_3 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
