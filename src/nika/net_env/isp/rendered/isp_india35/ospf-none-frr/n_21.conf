hostname n_21
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.15/32
!
interface eth0
 no shutdown
 description n_21 -> n_6 [internal]
 ip address 10.0.0.34/31
!
interface eth1
 no shutdown
 description n_21 -> n_16 [internal]
 ip address 10.0.0.97/31
!
interface eth2
 no shutdown
 description n_21 -> n_17 [internal]
 ip address 10.0.0.105/31
!
interface eth3
 no shutdown
 description n_21 -> n_32 [internal]
 ip address 10.0.0.126/31
!
interface eth4
