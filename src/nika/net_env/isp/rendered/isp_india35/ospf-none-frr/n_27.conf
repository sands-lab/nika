hostname n_27
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.21/32
!
interface eth0
 no shutdown
 description n_27 -> n_3 [internal]
 ip address 10.0.0.16/31
!
interface eth1
 no shutdown
 description n_27 -> n_5 [internal]
 ip address 10.0.0.30/31
!
interface eth2
 no shutdown
 description n_27 -> n_15 [internal]
 ip address 10.0.0.95/31
!
interface eth3
 no shutdown
 description n_27 -> n_17 [internal]
 ip address 10.0.0.111/31
!
interface eth4
 no shutdown
 description n_27 -> stub [stub]
 ip address 10.254.0.81/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.21
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n_27 -> n_3
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n_27 -> n_5
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n_27 -> n_15
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n_27 -> n_17
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n_27 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
