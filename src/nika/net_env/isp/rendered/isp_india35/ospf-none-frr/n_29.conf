hostname n_29
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.23/32
!
interface eth0
 no shutdown
 description n_29 -> n_20 [internal]
 ip address 10.0.0.123/31
!
interface eth1
 no shutdown
 description n_29 -> n_26 [internal]
 ip address 10.0.0.141/31
!
interface eth2
 no shutdown
 description n_29 -> n_30 [internal]
 ip address 10.0.0.146/31
!
interface eth3
 no shutdown
 description n_29 -> n_32 [internal]
 ip address 10.0.0.148/31
!
interface eth4
 no shutdown
 description n_29 -> n_34 [internal]
 ip address 10.0.0.150/31
!
interface eth5
 no shutdown
 description n_29 -> stub [stub]
 ip address 10.254.0.89/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.23
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n_29 -> n_20
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n_29 -> n_26
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n_29 -> n_30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n_29 -> n_32
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n_29 -> n_34
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n_29 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
