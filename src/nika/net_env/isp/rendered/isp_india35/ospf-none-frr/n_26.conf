hostname n_26
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description n_26 -> n_16 [internal]
 ip address 10.0.0.99/31
!
interface eth1
 no shutdown
 description n_26 -> n_17 [internal]
 ip address 10.0.0.109/31
!
interface eth2
 no shutdown
 description n_26 -> n_20 [internal]
 ip address 10.0.0.121/31
!
interface eth3
 no shutdown
 description n_26 -> n_29 [internal]
 ip address 10.0.0.140/31
!
interface eth4
 no shutdown
 description n_26 -> n_34 [internal]
 ip address 10.0.0.142/31
!
interface eth5
 no shutdown
 description n_26 -> stub [stub]
 ip address 10.254.0.77/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.20
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n_26 -> n_16
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n_26 -> n_17
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n_26 -> n_20
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n_26 -> n_29
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n_26 -> n_34
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n_26 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
