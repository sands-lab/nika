hostname n_8
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.34/32
!
interface eth0
 no shutdown
 description n_8 -> n_11 [internal]
 ip address 10.0.0.53/31
!
interface eth1
 no shutdown
 description n_8 -> n_13 [internal]
 ip address 10.0.0.55/31
!
interface eth2
 no shutdown
 description n_8 -> n_19 [internal]
 ip address 10.0.0.57/31
!
interface eth3
 no shutdown
 description n_8 -> n_22 [internal]
 ip address 10.0.0.59/31
!
interface eth4
 no shutdown
 description n_8 -> n_28 [internal]
 ip address 10.0.0.61/31
!
interface eth5
 no shutdown
 description n_8 -> stub [stub]
 ip address 10.254.0.133/30
