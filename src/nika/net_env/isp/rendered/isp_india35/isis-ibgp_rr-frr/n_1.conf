 isis metric 10
!
interface eth3
! n_1 -> n_14
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n_1 -> n_21
 ip router isis CORE
 isis network point-to-point
