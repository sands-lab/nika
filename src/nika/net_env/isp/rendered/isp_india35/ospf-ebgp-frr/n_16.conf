hostname n_16
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.9/32
!
interface eth0
 no shutdown
 description n_16 -> n_12 [internal]
 ip address 10.0.0.83/31
!
interface eth1
 no shutdown
 description n_16 -> n_21 [passive]
 ip address 10.0.0.96/31
!
interface eth2
 no shutdown
 description n_16 -> n_26 [passive]
 ip address 10.0.0.98/31
!
interface eth3
 no shutdown
 description n_16 -> n_33 [internal]
 ip address 10.0.0.100/31
!
interface eth4
 no shutdown
 description n_16 -> n_34 [passive]
 ip address 10.0.0.102/31
!
interface eth5
 no shutdown
 description n_16 -> stub [stub]
 ip address 10.254.0.33/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.9
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n_16 -> n_12
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n_16 -> n_21
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! n_16 -> n_26
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! n_16 -> n_33
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n_16 -> n_34
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth5
! n_16 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.9
!
  neighbor 10.255.0.3 remote-as 65002
  neighbor 10.255.0.3 description n_10
  neighbor 10.255.0.3 update-source lo
!
  neighbor 10.0.0.97 remote-as 65001
  neighbor 10.0.0.97 description n_21
!
  neighbor 10.0.0.99 remote-as 65001
  neighbor 10.0.0.99 description n_26
!
  neighbor 10.0.0.103 remote-as 65001
  neighbor 10.0.0.103 description n_34
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.3 next-hop-self
  no neighbor 10.255.0.3 send-community all
  neighbor 10.255.0.3 send-community standard
  neighbor 10.255.0.3 send-community large
  neighbor 10.255.0.3 send-community extended
!
  neighbor 10.0.0.97 activate
  no neighbor 10.0.0.97 send-community all
  neighbor 10.0.0.97 send-community standard
  neighbor 10.0.0.97 send-community large
!
  neighbor 10.0.0.99 activate
  no neighbor 10.0.0.99 send-community all
  neighbor 10.0.0.99 send-community standard
  neighbor 10.0.0.99 send-community large
!
  neighbor 10.0.0.103 activate
  no neighbor 10.0.0.103 send-community all
  neighbor 10.0.0.103 send-community standard
  neighbor 10.0.0.103 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.97 route-map BGP-IN in
    neighbor 10.0.0.97 route-map BGP-OUT out

    neighbor 10.0.0.99 route-map BGP-IN in
    neighbor 10.0.0.99 route-map BGP-OUT out

    neighbor 10.0.0.103 route-map BGP-IN in
    neighbor 10.0.0.103 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.3 route-map BGP-IN in
 exit-address-family
!
