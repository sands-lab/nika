hostname snvang
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description snvang -> dnvrng [internal]
 ip address 10.0.0.15/31
!
interface eth1
 no shutdown
 description snvang -> losang [internal]
 ip address 10.0.0.25/31
!
interface eth2
 no shutdown
 description snvang -> sttlng [internal]
 ip address 10.0.0.28/31
!
interface eth3
 no shutdown
 description snvang -> stub [stub]
 ip address 10.254.0.37/30
!
interface lo1
 no shutdown
 description snvang -> stub
 ip address 203.0.113.1/24
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000a.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! snvang -> dnvrng
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! snvang -> losang
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! snvang -> sttlng
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! snvang -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65000
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.10
!
  neighbor 10.255.0.1 remote-as 65000
  neighbor 10.255.0.1 description atlam5
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.255.0.2 remote-as 65000
  neighbor 10.255.0.2 description atlang
  neighbor 10.255.0.2 update-source lo
!
 address-family ipv4 unicast
!

  network 203.0.113.0/24
!
  neighbor 10.255.0.1 activate
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.255.0.2 activate
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
!

router bgp 65000
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
  neighbor 10.255.0.1 route-map BGP-OUT out
  neighbor 10.255.0.2 route-map BGP-IN in
  neighbor 10.255.0.2 route-map BGP-OUT out
 exit-address-family
!
