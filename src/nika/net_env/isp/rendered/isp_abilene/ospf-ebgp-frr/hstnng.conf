hostname hstnng
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.5/32
!
interface eth0
 no shutdown
 description hstnng -> atlang [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description hstnng -> kscyng [passive]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description hstnng -> losang [passive]
 ip address 10.0.0.20/31
!
interface eth3
 no shutdown
 description hstnng -> stub [stub]
 ip address 10.254.0.17/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.5
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! hstnng -> atlang
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! hstnng -> kscyng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! hstnng -> losang
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! hstnng -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.5
!
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 description atlam5
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.0.0.19 remote-as 65002
  neighbor 10.0.0.19 description kscyng
!
  neighbor 10.0.0.21 remote-as 65002
  neighbor 10.0.0.21 description losang
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.0.0.19 activate
  no neighbor 10.0.0.19 send-community all
  neighbor 10.0.0.19 send-community standard
  neighbor 10.0.0.19 send-community large
!
  neighbor 10.0.0.21 activate
  no neighbor 10.0.0.21 send-community all
  neighbor 10.0.0.21 send-community standard
  neighbor 10.0.0.21 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65001
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.19 route-map BGP-IN in
    neighbor 10.0.0.19 route-map BGP-OUT out

    neighbor 10.0.0.21 route-map BGP-IN in
    neighbor 10.0.0.21 route-map BGP-OUT out

!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
 exit-address-family
!
