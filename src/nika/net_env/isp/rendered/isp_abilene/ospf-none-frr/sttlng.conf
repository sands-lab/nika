hostname sttlng
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description sttlng -> dnvrng [internal]
 ip address 10.0.0.17/31
!
interface eth1
 no shutdown
 description sttlng -> snvang [internal]
 ip address 10.0.0.29/31
!
interface eth2
 no shutdown
 description sttlng -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.11
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! sttlng -> dnvrng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! sttlng -> snvang
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! sttlng -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
