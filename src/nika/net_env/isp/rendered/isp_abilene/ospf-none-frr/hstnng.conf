hostname hstnng
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.5/32
!
interface eth0
 no shutdown
 description hstnng -> atlang [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description hstnng -> kscyng [internal]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description hstnng -> losang [internal]
 ip address 10.0.0.20/31
!
interface eth3
 no shutdown
 description hstnng -> stub [stub]
 ip address 10.254.0.17/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.5
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! hstnng -> atlang
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! hstnng -> kscyng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! hstnng -> losang
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! hstnng -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
