hostname atlang
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description atlang -> atlam5 [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description atlang -> hstnng [internal]
 ip address 10.0.0.2/31
!
interface eth2
 no shutdown
 description atlang -> iplsng [internal]
 ip address 10.0.0.4/31
!
interface eth3
 no shutdown
 description atlang -> washng [internal]
 ip address 10.0.0.6/31
!
interface eth4
 no shutdown
 description atlang -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! atlang -> atlam5
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! atlang -> hstnng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! atlang -> iplsng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! atlang -> washng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! atlang -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
