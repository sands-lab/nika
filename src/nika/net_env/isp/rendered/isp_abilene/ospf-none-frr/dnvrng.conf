hostname dnvrng
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description dnvrng -> kscyng [internal]
 ip address 10.0.0.12/31
!
interface eth1
 no shutdown
 description dnvrng -> snvang [internal]
 ip address 10.0.0.14/31
!
interface eth2
 no shutdown
 description dnvrng -> sttlng [internal]
 ip address 10.0.0.16/31
!
interface eth3
 no shutdown
 description dnvrng -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.4
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! dnvrng -> kscyng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! dnvrng -> snvang
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! dnvrng -> sttlng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! dnvrng -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
