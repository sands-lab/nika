hostname atlang
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host atlam5 10.255.0.1
domain ipv4 host chinng 10.255.0.3
domain ipv4 host dnvrng 10.255.0.4
domain ipv4 host hstnng 10.255.0.5
domain ipv4 host iplsng 10.255.0.6
domain ipv4 host kscyng 10.255.0.7
domain ipv4 host losang 10.255.0.8
domain ipv4 host nycmng 10.255.0.9
domain ipv4 host snvang 10.255.0.10
domain ipv4 host sttlng 10.255.0.11
domain ipv4 host washng 10.255.0.12
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.2 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description atlang -> atlam5 [internal]
 ipv4 address 10.0.0.1 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description atlang -> hstnng [internal]
 ipv4 address 10.0.0.2 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description atlang -> iplsng [internal]
 ipv4 address 10.0.0.4 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description atlang -> washng [internal]
 ipv4 address 10.0.0.6 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description atlang -> stub [stub]
 ipv4 address 10.254.0.5 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
!
router isis CORE

 log adjacency changes
 lsp-gen-interval initial-wait 50 secondary-wait 100 maximum-wait 500
 is-type level-2-only
 net 49.0001.0000.0aff.0002.00
!
 address-family ipv4 unicast
  metric-style wide
  spf-interval initial-wait 50 secondary-wait 100 maximum-wait 500
!
!
 interface Loopback0
  passive
  address-family ipv4
!
 interface GigabitEthernet0/0/0/0
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/1
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/2
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/3
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/4
  passive
  circuit-type level-2
  address-family ipv4
    metric 1

!
!
router bgp 65000
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.2
 bgp cluster-id 10.255.0.1

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
