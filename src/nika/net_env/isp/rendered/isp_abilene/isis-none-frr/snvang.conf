hostname snvang
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description snvang -> dnvrng [internal]
 ip address 10.0.0.15/31
!
interface eth1
 no shutdown
 description snvang -> losang [internal]
 ip address 10.0.0.25/31
!
interface eth2
 no shutdown
 description snvang -> sttlng [internal]
 ip address 10.0.0.28/31
!
interface eth3
 no shutdown
 description snvang -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000a.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! snvang -> dnvrng
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! snvang -> losang
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! snvang -> sttlng
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! snvang -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
