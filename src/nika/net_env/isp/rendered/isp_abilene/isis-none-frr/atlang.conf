hostname atlang
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description atlang -> atlam5 [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description atlang -> hstnng [internal]
 ip address 10.0.0.2/31
!
interface eth2
 no shutdown
 description atlang -> iplsng [internal]
 ip address 10.0.0.4/31
!
interface eth3
 no shutdown
 description atlang -> washng [internal]
 ip address 10.0.0.6/31
!
interface eth4
 no shutdown
 description atlang -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0002.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! atlang -> atlam5
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! atlang -> hstnng
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! atlang -> iplsng
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! atlang -> washng
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! atlang -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
