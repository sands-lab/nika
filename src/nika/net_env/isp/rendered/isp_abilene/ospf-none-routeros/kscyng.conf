
/system/identity set name="kscyng"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=atlam5 address=10.255.0.1
/ip/dns/static add name=atlang address=10.255.0.2
/ip/dns/static add name=chinng address=10.255.0.3
/ip/dns/static add name=dnvrng address=10.255.0.4
/ip/dns/static add name=hstnng address=10.255.0.5
/ip/dns/static add name=iplsng address=10.255.0.6
/ip/dns/static add name=losang address=10.255.0.8
/ip/dns/static add name=nycmng address=10.255.0.9
/ip/dns/static add name=snvang address=10.255.0.10
/ip/dns/static add name=sttlng address=10.255.0.11
/ip/dns/static add name=washng address=10.255.0.12

/ip/address add interface=loopback address=10.255.0.7/32




/interface/ethernet set comment="kscyng -> dnvrng [internal]" ether2
/ip/address add interface=ether2 address=10.0.0.13/31
/ip/address set [find where interface=ether2] comment="kscyng -> dnvrng [internal]"

/interface/ethernet set comment="kscyng -> hstnng [internal]" ether3
/ip/address add interface=ether3 address=10.0.0.19/31
/ip/address set [find where interface=ether3] comment="kscyng -> hstnng [internal]"

/interface/ethernet set comment="kscyng -> iplsng [internal]" ether4
/ip/address add interface=ether4 address=10.0.0.23/31
/ip/address set [find where interface=ether4] comment="kscyng -> iplsng [internal]"

/interface/ethernet set comment="kscyng -> stub [stub]" ether5
/ip/address add interface=ether5 address=10.254.0.25/30
/ip/address set [find where interface=ether5] comment="kscyng -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.7 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether5 passive cost=1

