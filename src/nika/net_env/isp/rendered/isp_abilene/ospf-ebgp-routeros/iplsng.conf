/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_4] input.filter=POLICY-BGP-IN output.filter-chain=POLICY-BGP-OUT local.address=10.0.0.5
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_3] input.filter=POLICY-BGP-IN output.filter-chain=POLICY-BGP-OUT local.address=10.255.0.6
