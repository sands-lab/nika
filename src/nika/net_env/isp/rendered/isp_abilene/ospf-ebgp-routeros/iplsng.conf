
/system/identity set name="iplsng"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=atlam5 address=10.255.0.1
/ip/dns/static add name=atlang address=10.255.0.2
/ip/dns/static add name=chinng address=10.255.0.3
/ip/dns/static add name=dnvrng address=10.255.0.4
/ip/dns/static add name=hstnng address=10.255.0.5
/ip/dns/static add name=kscyng address=10.255.0.7
/ip/dns/static add name=losang address=10.255.0.8
/ip/dns/static add name=nycmng address=10.255.0.9
/ip/dns/static add name=snvang address=10.255.0.10
/ip/dns/static add name=sttlng address=10.255.0.11
/ip/dns/static add name=washng address=10.255.0.12

/ip/address add interface=loopback address=10.255.0.6/32




/interface/ethernet set comment="iplsng -> atlang [passive]" ether2
/ip/address add interface=ether2 address=10.0.0.5/31
/ip/address set [find where interface=ether2] comment="iplsng -> atlang [passive]"

/interface/ethernet set comment="iplsng -> chinng [internal]" ether3
/ip/address add interface=ether3 address=10.0.0.9/31
/ip/address set [find where interface=ether3] comment="iplsng -> chinng [internal]"

/interface/ethernet set comment="iplsng -> kscyng [passive]" ether4
/ip/address add interface=ether4 address=10.0.0.22/31
/ip/address set [find where interface=ether4] comment="iplsng -> kscyng [passive]"

/interface/ethernet set comment="iplsng -> stub [stub]" ether5
/ip/address add interface=ether5 address=10.254.0.21/30
/ip/address set [find where interface=ether5] comment="iplsng -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.6 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 passive type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 passive type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether5 passive cost=1


/routing/bgp/template add name=main as=65003 output.network=bgp-networks
/routing/bgp/instance add name=main as=65003

/routing/bgp/instance set [/routing/bgp/instance find name=main] router-id=10.255.0.6


/routing/filter/rule add chain=filter_rr_self_ebgp rule="if ( bgp-input-remote-addr == 10.0.0.4 ) { set gw 10.255.0.6;}"
/routing/filter/rule add chain=filter_rr_self_ebgp rule="if ( bgp-input-remote-addr == 10.0.0.23 ) { set gw 10.255.0.6;}"
/routing/filter/rule add chain=filter_rr_self_ebgp rule="return;"

/routing/filter/rule/add chain=rm_extended_communities rule="delete bgp-ext-communities rt; delete bgp-ext-communities soo; delete bgp-ext-communities other;"
/routing/filter/rule/add chain=rm_extended_communities rule="return;"
/routing/filter/rule/add chain=rm_large_communities rule="delete bgp-large-communities all;"
/routing/filter/rule/add chain=rm_large_communities rule="return;"
/routing/filter/rule/add chain=rm_standard_communities rule="delete bgp-communities other; delete bgp-communities wk;"
/routing/filter/rule/add chain=rm_standard_communities rule="jump rm_large_communities;"
/routing/filter/rule/add chain=rm_standard_communities rule="return;"


/routing/bgp/connection add template=main instance=main name=10_255_0_3 remote.address=10.255.0.3 remote.as=65003 comment="chinng" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_3] afi=ip
/routing/filter/rule add chain=filter_10_255_0_3 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_3] output.filter-chain=filter_10_255_0_3
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_3] local.role=ibgp local.address=10.255.0.6

/routing/filter/rule/add chain=filter_10_255_0_3 rule="jump rm_large_communities;" place-before=0

/routing/bgp/connection add template=main instance=main name=10_0_0_4 remote.address=10.0.0.4 remote.as=65001 comment="atlang" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_4] afi=ip
/routing/filter/rule add chain=filter_10_0_0_4 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_4] output.filter-chain=filter_10_0_0_4

/routing/filter/rule/add chain=filter_10_0_0_4 rule="jump rm_large_communities;" place-before=0
/routing/filter/rule/add chain=filter_10_0_0_4 rule="jump rm_extended_communities;" place-before=0

/routing/bgp/connection add template=main instance=main name=10_0_0_23 remote.address=10.0.0.23 remote.as=65002 comment="kscyng" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_23] afi=ip
/routing/filter/rule add chain=filter_10_0_0_23 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_23] output.filter-chain=filter_10_0_0_23

/routing/filter/rule/add chain=filter_10_0_0_23 rule="jump rm_large_communities;" place-before=0
/routing/filter/rule/add chain=filter_10_0_0_23 rule="jump rm_extended_communities;" place-before=0







