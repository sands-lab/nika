
/system/identity set name="chinng"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=atlam5 address=10.255.0.1
/ip/dns/static add name=atlang address=10.255.0.2
/ip/dns/static add name=dnvrng address=10.255.0.4
/ip/dns/static add name=hstnng address=10.255.0.5
/ip/dns/static add name=iplsng address=10.255.0.6
/ip/dns/static add name=kscyng address=10.255.0.7
/ip/dns/static add name=losang address=10.255.0.8
/ip/dns/static add name=nycmng address=10.255.0.9
/ip/dns/static add name=snvang address=10.255.0.10
/ip/dns/static add name=sttlng address=10.255.0.11
/ip/dns/static add name=washng address=10.255.0.12

/ip/address add interface=loopback address=10.255.0.3/32




/interface/ethernet set comment="chinng -> iplsng [internal]" ether2
/ip/address add interface=ether2 address=10.0.0.8/31
/ip/address set [find where interface=ether2] comment="chinng -> iplsng [internal]"

/interface/ethernet set comment="chinng -> nycmng [internal]" ether3
/ip/address add interface=ether3 address=10.0.0.10/31
/ip/address set [find where interface=ether3] comment="chinng -> nycmng [internal]"

/interface/ethernet set comment="chinng -> stub [stub]" ether4
/ip/address add interface=ether4 address=10.254.0.9/30
/ip/address set [find where interface=ether4] comment="chinng -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.3 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 passive cost=1


/routing/bgp/template add name=main as=65003 output.network=bgp-networks
/routing/bgp/instance add name=main as=65003

/routing/bgp/instance set [/routing/bgp/instance find name=main] router-id=10.255.0.3
/routing/bgp/instance set [/routing/bgp/instance find name=main] cluster-id=10.255.0.3


/routing/filter/rule add chain=filter_rr_self_ebgp rule="return;"

/routing/filter/rule/add chain=rm_extended_communities rule="delete bgp-ext-communities rt; delete bgp-ext-communities soo; delete bgp-ext-communities other;"
/routing/filter/rule/add chain=rm_extended_communities rule="return;"
/routing/filter/rule/add chain=rm_large_communities rule="delete bgp-large-communities all;"
/routing/filter/rule/add chain=rm_large_communities rule="return;"
/routing/filter/rule/add chain=rm_standard_communities rule="delete bgp-communities other; delete bgp-communities wk;"
/routing/filter/rule/add chain=rm_standard_communities rule="jump rm_large_communities;"
/routing/filter/rule/add chain=rm_standard_communities rule="return;"


/routing/bgp/connection add template=main instance=main name=10_255_0_6 remote.address=10.255.0.6 remote.as=65003 comment="iplsng" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_6] afi=ip
/routing/filter/rule add chain=filter_10_255_0_6 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_6] output.filter-chain=filter_10_255_0_6
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_6] local.role=ibgp-rr

/routing/filter/rule/add chain=filter_10_255_0_6 rule="jump rm_large_communities;" place-before=0

/routing/bgp/connection add template=main instance=main name=10_255_0_9 remote.address=10.255.0.9 remote.as=65003 comment="nycmng" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_9] afi=ip
/routing/filter/rule add chain=filter_10_255_0_9 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_9] output.filter-chain=filter_10_255_0_9
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_9] local.role=ibgp-rr

/routing/filter/rule/add chain=filter_10_255_0_9 rule="jump rm_large_communities;" place-before=0







# Policy bindings and business origins
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 198.18.0.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 198.18.0.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 198.51.100.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 198.51.100.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 198.51.101.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 198.51.101.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 198.51.102.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 198.51.102.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 203.0.113.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 203.0.113.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 203.0.114.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 203.0.114.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 203.0.115.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 203.0.115.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="reject;"
/routing filter rule add chain=POLICY-BGP-OUT rule="reject;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_6] input.filter=POLICY-BGP-IN output.filter-chain=POLICY-BGP-OUT local.address=10.255.0.3
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_9] input.filter=POLICY-BGP-IN output.filter-chain=POLICY-BGP-OUT local.address=10.255.0.3
