
/system/identity set name="losang"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=atlam5 address=10.255.0.1
/ip/dns/static add name=atlang address=10.255.0.2
/ip/dns/static add name=chinng address=10.255.0.3
/ip/dns/static add name=dnvrng address=10.255.0.4
/ip/dns/static add name=hstnng address=10.255.0.5
/ip/dns/static add name=iplsng address=10.255.0.6
/ip/dns/static add name=kscyng address=10.255.0.7
/ip/dns/static add name=nycmng address=10.255.0.9
/ip/dns/static add name=snvang address=10.255.0.10
/ip/dns/static add name=sttlng address=10.255.0.11
/ip/dns/static add name=washng address=10.255.0.12
/interface/bridge add name=lo1 protocol-mode=none

/ip/address add interface=loopback address=10.255.0.8/32




/interface/ethernet set comment="losang -> hstnng [passive]" ether2
/ip/address add interface=ether2 address=10.0.0.21/31
/ip/address set [find where interface=ether2] comment="losang -> hstnng [passive]"

/interface/ethernet set comment="losang -> snvang [internal]" ether3
/ip/address add interface=ether3 address=10.0.0.24/31
/ip/address set [find where interface=ether3] comment="losang -> snvang [internal]"

/interface/ethernet set comment="losang -> stub [stub]" ether4
/ip/address add interface=ether4 address=10.254.0.29/30
/ip/address set [find where interface=ether4] comment="losang -> stub [stub]"

/interface/bridge set comment="losang -> stub" lo1
/ip/address add interface=lo1 address=198.51.101.1/24
/ip/address set [find where interface=lo1] comment="losang -> stub"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.8 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 passive type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 passive cost=1


/routing/bgp/template add name=main as=65002 output.network=bgp-networks
/routing/bgp/instance add name=main as=65002

/routing/bgp/instance set [/routing/bgp/instance find name=main] router-id=10.255.0.8


/routing/filter/rule add chain=filter_rr_self_ebgp rule="if ( bgp-input-remote-addr == 10.0.0.20 ) { set gw 10.255.0.8;}"
/routing/filter/rule add chain=filter_rr_self_ebgp rule="return;"

/routing/filter/rule/add chain=rm_extended_communities rule="delete bgp-ext-communities rt; delete bgp-ext-communities soo; delete bgp-ext-communities other;"
/routing/filter/rule/add chain=rm_extended_communities rule="return;"
/routing/filter/rule/add chain=rm_large_communities rule="delete bgp-large-communities all;"
/routing/filter/rule/add chain=rm_large_communities rule="return;"
/routing/filter/rule/add chain=rm_standard_communities rule="delete bgp-communities other; delete bgp-communities wk;"
/routing/filter/rule/add chain=rm_standard_communities rule="jump rm_large_communities;"
/routing/filter/rule/add chain=rm_standard_communities rule="return;"


/routing/bgp/connection add template=main instance=main name=10_255_0_4 remote.address=10.255.0.4 remote.as=65002 comment="dnvrng" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_4] afi=ip
/routing/filter/rule add chain=filter_10_255_0_4 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_4] output.filter-chain=filter_10_255_0_4
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_4] local.role=ibgp local.address=10.255.0.8

/routing/filter/rule/add chain=filter_10_255_0_4 rule="jump rm_large_communities;" place-before=0

/routing/bgp/connection add template=main instance=main name=10_0_0_20 remote.address=10.0.0.20 remote.as=65001 comment="hstnng" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_20] afi=ip
/routing/filter/rule add chain=filter_10_0_0_20 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_20] output.filter-chain=filter_10_0_0_20

/routing/filter/rule/add chain=filter_10_0_0_20 rule="jump rm_large_communities;" place-before=0
/routing/filter/rule/add chain=filter_10_0_0_20 rule="jump rm_extended_communities;" place-before=0



# BGP Network now is controlled by simple ACL
/ip/firewall/address-list add list=bgp-networks address=198.51.101.0/24




