!
interface eth4
 no shutdown
 description koeln -> karlsruhe [internal]
 ip address 10.0.0.55/31
!
interface eth5
 no shutdown
 description koeln -> leipzig [internal]
 ip address 10.0.0.62/31
!
interface eth6
 no shutdown
 description koeln -> muenchen [internal]
 ip address 10.0.0.64/31
!
interface eth7
 no shutdown
 description koeln -> stuttgart [internal]
 ip address 10.0.0.66/31
!
