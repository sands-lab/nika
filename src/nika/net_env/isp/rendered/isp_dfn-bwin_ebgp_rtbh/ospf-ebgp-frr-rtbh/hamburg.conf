#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4

    neighbor 10.0.0.2 route-map BGP-IN in
    neighbor 10.0.0.2 route-map BGP-OUT out

    neighbor 10.0.0.18 route-map BGP-IN in
    neighbor 10.0.0.18 route-map BGP-OUT out

    neighbor 10.0.0.31 route-map BGP-IN in
    neighbor 10.0.0.31 route-map BGP-OUT out

    neighbor 10.0.0.33 route-map BGP-IN in
    neighbor 10.0.0.33 route-map BGP-OUT out

    neighbor 10.0.0.35 route-map BGP-IN in
    neighbor 10.0.0.35 route-map BGP-OUT out

    neighbor 10.0.0.37 route-map BGP-IN in
    neighbor 10.0.0.37 route-map BGP-OUT out

    neighbor 10.0.0.39 route-map BGP-IN in
    neighbor 10.0.0.39 route-map BGP-OUT out

    neighbor 10.0.0.51 route-map BGP-IN in
    neighbor 10.0.0.51 route-map BGP-OUT out

    neighbor 10.0.0.77 route-map BGP-IN in
    neighbor 10.0.0.77 route-map BGP-OUT out

!
!

ip route 192.0.2.1/32 Null0
!
bgp community-list standard BH-SIGNAL permit 65003:666
!
route-map BGP-IN permit 5
 match ip address prefix-list BUSINESS
 match community BH-SIGNAL
 set local-preference 200
 set ip next-hop 192.0.2.1
!
