#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.3
  bgp cluster-id 10.255.0.3
!
  neighbor 10.0.0.2 remote-as 65001
  neighbor 10.0.0.2 description berlin
!
  neighbor 10.0.0.18 remote-as 65002
  neighbor 10.0.0.18 description frankfurt
!
  neighbor 10.0.0.31 remote-as 65001
  neighbor 10.0.0.31 description hannover
