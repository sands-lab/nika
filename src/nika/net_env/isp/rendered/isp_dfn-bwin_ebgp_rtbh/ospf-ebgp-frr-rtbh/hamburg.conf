  neighbor 10.0.0.51 description karlsruhe
!
  neighbor 10.0.0.77 remote-as 65001
  neighbor 10.0.0.77 description nuernberg
!
 address-family ipv4 unicast
!

  network 198.51.102.0/24
!
  neighbor 10.0.0.2 activate
  no neighbor 10.0.0.2 send-community all
  neighbor 10.0.0.2 send-community standard
  neighbor 10.0.0.2 send-community large
!
