hostname stuttgart
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description stuttgart -> berlin [internal]
 ip address 10.0.0.17/31
!
interface eth1
 no shutdown
 description stuttgart -> frankfurt [passive]
 ip address 10.0.0.29/31
!
interface eth2
 no shutdown
 description stuttgart -> hamburg [passive]
 ip address 10.0.0.39/31
!
interface eth3
 no shutdown
 description stuttgart -> hannover [internal]
 ip address 10.0.0.47/31
!
interface eth4
 no shutdown
 description stuttgart -> karlsruhe [internal]
 ip address 10.0.0.61/31
!
interface eth5
 no shutdown
 description stuttgart -> koeln [internal]
 ip address 10.0.0.67/31
!
interface eth6
 no shutdown
 description stuttgart -> leipzig [internal]
 ip address 10.0.0.71/31
!
interface eth7
 no shutdown
 description stuttgart -> muenchen [internal]
 ip address 10.0.0.73/31
!
interface eth8
 no shutdown
 description stuttgart -> nuernberg [internal]
 ip address 10.0.0.89/31
!
interface eth9
 no shutdown
 description stuttgart -> stub [stub]
