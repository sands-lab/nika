hostname kscyng
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description kscyng -> dnvrng [internal]
 ip address 10.0.0.13/31
!
interface eth1
 no shutdown
 description kscyng -> hstnng [passive]
 ip address 10.0.0.19/31
!
interface eth2
 no shutdown
 description kscyng -> iplsng [passive]
 ip address 10.0.0.23/31
!
interface eth3
 no shutdown
 description kscyng -> stub [stub]
 ip address 10.254.0.25/30
!
interface lo1
 no shutdown
 description kscyng -> stub
 ip address 203.0.113.1/24
!
interface lo1
 no shutdown
 description kscyng -> stub
 ip address 203.0.114.1/24
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.7
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! kscyng -> dnvrng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! kscyng -> hstnng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! kscyng -> iplsng
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! kscyng -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.7
!
  neighbor 10.255.0.4 remote-as 65002
  neighbor 10.255.0.4 description dnvrng
  neighbor 10.255.0.4 update-source lo
!
  neighbor 10.0.0.18 remote-as 65001
  neighbor 10.0.0.18 description hstnng
!
  neighbor 10.0.0.22 remote-as 65003
  neighbor 10.0.0.22 description iplsng
!
 address-family ipv4 unicast
!

  network 203.0.113.0/24
  network 203.0.114.0/24
!
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.4 next-hop-self
  no neighbor 10.255.0.4 send-community all
  neighbor 10.255.0.4 send-community standard
  neighbor 10.255.0.4 send-community large
  neighbor 10.255.0.4 send-community extended
!
  neighbor 10.0.0.18 activate
  no neighbor 10.0.0.18 send-community all
  neighbor 10.0.0.18 send-community standard
  neighbor 10.0.0.18 send-community large
!
  neighbor 10.0.0.22 activate
  no neighbor 10.0.0.22 send-community all
  neighbor 10.0.0.22 send-community standard
  neighbor 10.0.0.22 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.18 route-map BGP-IN in
    neighbor 10.0.0.18 route-map BGP-OUT out

    neighbor 10.0.0.22 route-map BGP-IN in
    neighbor 10.0.0.22 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.4 route-map BGP-IN in
 exit-address-family
!

ip prefix-list EXPORT-DENY seq 5 permit 203.0.113.0/24 le 24
ip prefix-list EXPORT-DENY seq 10 permit 203.0.114.0/24 le 24
!
route-map BGP-OUT deny 5
 match ip address prefix-list EXPORT-DENY
!
