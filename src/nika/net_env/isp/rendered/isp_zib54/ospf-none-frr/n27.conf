hostname n27
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description n27 -> n11 [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description n27 -> n23 [internal]
 ip address 10.0.0.41/31
!
interface eth2
 no shutdown
 description n27 -> n26 [internal]
 ip address 10.0.0.53/31
!
interface eth3
 no shutdown
 description n27 -> n28 [internal]
 ip address 10.0.0.54/31
!
interface eth4
 no shutdown
 description n27 -> n54 [internal]
 ip address 10.0.0.144/31
!
interface eth5
 no shutdown
 description n27 -> stub [stub]
 ip address 10.254.0.77/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.20
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n27 -> n11
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n27 -> n23
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n27 -> n26
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n27 -> n28
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n27 -> n54
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n27 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
