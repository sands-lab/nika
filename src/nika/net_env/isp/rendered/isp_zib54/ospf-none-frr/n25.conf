hostname n25
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.18/32
!
interface eth0
 no shutdown
 description n25 -> n23 [internal]
 ip address 10.0.0.37/31
!
interface eth1
 no shutdown
 description n25 -> n24 [internal]
 ip address 10.0.0.49/31
!
interface eth2
 no shutdown
 description n25 -> n26 [internal]
 ip address 10.0.0.50/31
!
interface eth3
 no shutdown
 description n25 -> n29 [internal]
 ip address 10.0.0.56/31
!
interface eth4
 no shutdown
 description n25 -> stub [stub]
 ip address 10.254.0.69/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.18
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n25 -> n23
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n25 -> n24
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n25 -> n26
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n25 -> n29
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n25 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
