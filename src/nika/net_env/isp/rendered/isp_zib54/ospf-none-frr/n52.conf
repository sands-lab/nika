hostname n52
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.48/32
!
interface eth0
 no shutdown
 description n52 -> n4 [internal]
 ip address 10.0.0.125/31
!
interface eth1
 no shutdown
 description n52 -> n21 [internal]
 ip address 10.0.0.127/31
!
interface eth2
 no shutdown
 description n52 -> n21 [internal]
 ip address 10.0.0.129/31
!
interface eth3
 no shutdown
 description n52 -> n22 [internal]
 ip address 10.0.0.133/31
!
interface eth4
 no shutdown
 description n52 -> n26 [internal]
 ip address 10.0.0.135/31
!
interface eth5
 no shutdown
 description n52 -> n30 [internal]
 ip address 10.0.0.137/31
!
interface eth6
 no shutdown
 description n52 -> n50 [internal]
 ip address 10.0.0.139/31
!
interface eth7
 no shutdown
 description n52 -> stub [stub]
 ip address 10.254.0.189/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.48
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n52 -> n4
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n52 -> n21
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n52 -> n21
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n52 -> n22
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n52 -> n26
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n52 -> n30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n52 -> n50
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth7
! n52 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
