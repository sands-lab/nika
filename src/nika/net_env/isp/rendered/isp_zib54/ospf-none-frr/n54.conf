hostname n54
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.50/32
!
interface eth0
 no shutdown
 description n54 -> n10 [internal]
 ip address 10.0.0.141/31
!
interface eth1
 no shutdown
 description n54 -> n41 [internal]
 ip address 10.0.0.143/31
!
interface eth2
 no shutdown
 description n54 -> n27 [internal]
 ip address 10.0.0.145/31
!
interface eth3
 no shutdown
 description n54 -> stub [stub]
 ip address 10.254.0.197/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.50
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n54 -> n10
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n54 -> n41
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n54 -> n27
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n54 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
