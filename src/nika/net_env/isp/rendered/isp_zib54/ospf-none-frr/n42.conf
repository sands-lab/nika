hostname n42
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.37/32
!
interface eth0
 no shutdown
 description n42 -> n38 [internal]
 ip address 10.0.0.95/31
!
interface eth1
 no shutdown
 description n42 -> n40 [internal]
 ip address 10.0.0.97/31
!
interface eth2
 no shutdown
 description n42 -> n8 [internal]
 ip address 10.0.0.160/31
!
interface eth3
 no shutdown
 description n42 -> stub [stub]
 ip address 10.254.0.145/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.37
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n42 -> n38
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n42 -> n40
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n42 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n42 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
