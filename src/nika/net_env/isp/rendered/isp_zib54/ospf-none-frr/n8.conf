hostname n8
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.53/32
!
interface eth0
 no shutdown
 description n8 -> n33 [internal]
 ip address 10.0.0.147/31
!
interface eth1
 no shutdown
 description n8 -> n23 [internal]
 ip address 10.0.0.153/31
!
interface eth2
 no shutdown
 description n8 -> n38 [internal]
 ip address 10.0.0.159/31
!
interface eth3
 no shutdown
 description n8 -> n42 [internal]
 ip address 10.0.0.161/31
!
interface eth4
 no shutdown
 description n8 -> stub [stub]
 ip address 10.254.0.209/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.53
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n8 -> n33
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n8 -> n23
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n8 -> n38
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n8 -> n42
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n8 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
