hostname n50
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.46/32
!
interface eth0
 no shutdown
 description n50 -> n12 [internal]
 ip address 10.0.0.7/31
!
interface eth1
 no shutdown
 description n50 -> n2 [internal]
 ip address 10.0.0.121/31
!
interface eth2
 no shutdown
 description n50 -> n32 [internal]
 ip address 10.0.0.123/31
!
interface eth3
 no shutdown
 description n50 -> n52 [internal]
 ip address 10.0.0.138/31
!
interface eth4
 no shutdown
 description n50 -> stub [stub]
 ip address 10.254.0.181/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.46
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n50 -> n12
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n50 -> n2
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n50 -> n32
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n50 -> n52
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n50 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
