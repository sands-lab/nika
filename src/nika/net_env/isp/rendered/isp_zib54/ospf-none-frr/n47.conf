hostname n47
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.42/32
!
interface eth0
 no shutdown
 description n47 -> n31 [internal]
 ip address 10.0.0.63/31
!
interface eth1
 no shutdown
 description n47 -> n20 [internal]
 ip address 10.0.0.107/31
!
interface eth2
 no shutdown
 description n47 -> n23 [internal]
 ip address 10.0.0.111/31
!
interface eth3
 no shutdown
 description n47 -> n45 [internal]
 ip address 10.0.0.113/31
!
interface eth4
 no shutdown
 description n47 -> n48 [internal]
 ip address 10.0.0.114/31
!
interface eth5
 no shutdown
 description n47 -> stub [stub]
 ip address 10.254.0.165/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.42
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n47 -> n31
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n47 -> n20
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n47 -> n23
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n47 -> n45
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n47 -> n48
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n47 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
