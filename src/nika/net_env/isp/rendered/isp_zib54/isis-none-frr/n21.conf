hostname n21
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.14/32
!
interface eth0
 no shutdown
 description n21 -> n51 [internal]
 ip address 10.0.0.32/31
!
interface eth1
 no shutdown
 description n21 -> n3 [internal]
 ip address 10.0.0.42/31
!
interface eth2
 no shutdown
 description n21 -> n52 [internal]
 ip address 10.0.0.126/31
!
interface eth3
 no shutdown
 description n21 -> n52 [internal]
 ip address 10.0.0.128/31
!
interface eth4
 no shutdown
 description n21 -> n34 [internal]
 ip address 10.0.0.156/31
!
interface eth5
 no shutdown
 description n21 -> stub [stub]
 ip address 10.254.0.53/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000e.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n21 -> n51
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n21 -> n3
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n21 -> n52
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n21 -> n52
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n21 -> n34
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n21 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
