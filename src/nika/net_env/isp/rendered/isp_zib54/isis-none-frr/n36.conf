hostname n36
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.30/32
!
interface eth0
 no shutdown
 description n36 -> n5 [internal]
 ip address 10.0.0.78/31
!
interface eth1
 no shutdown
 description n36 -> n10 [internal]
 ip address 10.0.0.81/31
!
interface eth2
 no shutdown
 description n36 -> n13 [internal]
 ip address 10.0.0.83/31
!
interface eth3
 no shutdown
 description n36 -> n26 [internal]
 ip address 10.0.0.85/31
!
interface eth4
 no shutdown
 description n36 -> stub [stub]
 ip address 10.254.0.117/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001e.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n36 -> n5
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n36 -> n10
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n36 -> n13
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n36 -> n26
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n36 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
