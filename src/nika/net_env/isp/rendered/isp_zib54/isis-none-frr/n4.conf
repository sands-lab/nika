hostname n4
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.34/32
!
interface eth0
 no shutdown
 description n4 -> n14 [internal]
 ip address 10.0.0.13/31
!
interface eth1
 no shutdown
 description n4 -> n52 [internal]
 ip address 10.0.0.124/31
!
interface eth2
 no shutdown
 description n4 -> stub [stub]
 ip address 10.254.0.133/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0022.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n4 -> n14
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n4 -> n52
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n4 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
