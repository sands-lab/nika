hostname n8
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.53/32
!
interface eth0
 no shutdown
 description n8 -> n33 [internal]
 ip address 10.0.0.147/31
!
interface eth1
 no shutdown
 description n8 -> n23 [internal]
 ip address 10.0.0.153/31
!
interface eth2
 no shutdown
 description n8 -> n38 [internal]
 ip address 10.0.0.159/31
!
interface eth3
 no shutdown
 description n8 -> n42 [internal]
 ip address 10.0.0.161/31
!
interface eth4
 no shutdown
 description n8 -> stub [stub]
 ip address 10.254.0.209/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0035.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n8 -> n33
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n8 -> n23
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n8 -> n38
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n8 -> n42
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n8 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
