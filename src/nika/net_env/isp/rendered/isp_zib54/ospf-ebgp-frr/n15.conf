hostname n15
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description n15 -> n39 [internal]
 ip address 10.0.0.16/31
!
interface eth1
 no shutdown
 description n15 -> n53 [internal]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description n15 -> stub [stub]
 ip address 10.254.0.25/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.7
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n15 -> n39
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n15 -> n53
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n15 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.7
  bgp cluster-id 10.255.0.7
!
  neighbor 10.255.0.25 remote-as 65003
  neighbor 10.255.0.25 description n31
  neighbor 10.255.0.25 update-source lo
!
  neighbor 10.255.0.33 remote-as 65003
  neighbor 10.255.0.33 description n39
  neighbor 10.255.0.33 update-source lo
!
  neighbor 10.255.0.43 remote-as 65003
  neighbor 10.255.0.43 description n48
  neighbor 10.255.0.43 update-source lo
!
  neighbor 10.255.0.49 remote-as 65003
  neighbor 10.255.0.49 description n53
  neighbor 10.255.0.49 update-source lo
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.25 activate
  neighbor 10.255.0.25 next-hop-self
  neighbor 10.255.0.25 route-reflector-client
  no neighbor 10.255.0.25 send-community all
  neighbor 10.255.0.25 send-community standard
  neighbor 10.255.0.25 send-community large
  neighbor 10.255.0.25 send-community extended
!
  neighbor 10.255.0.33 activate
  neighbor 10.255.0.33 next-hop-self
  neighbor 10.255.0.33 route-reflector-client
  no neighbor 10.255.0.33 send-community all
  neighbor 10.255.0.33 send-community standard
  neighbor 10.255.0.33 send-community large
  neighbor 10.255.0.33 send-community extended
!
  neighbor 10.255.0.43 activate
  neighbor 10.255.0.43 next-hop-self
  neighbor 10.255.0.43 route-reflector-client
  no neighbor 10.255.0.43 send-community all
  neighbor 10.255.0.43 send-community standard
  neighbor 10.255.0.43 send-community large
  neighbor 10.255.0.43 send-community extended
!
  neighbor 10.255.0.49 activate
  neighbor 10.255.0.49 next-hop-self
  neighbor 10.255.0.49 route-reflector-client
  no neighbor 10.255.0.49 send-community all
  neighbor 10.255.0.49 send-community standard
  neighbor 10.255.0.49 send-community large
  neighbor 10.255.0.49 send-community extended
!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.25 route-map BGP-IN in
  neighbor 10.255.0.33 route-map BGP-IN in
  neighbor 10.255.0.43 route-map BGP-IN in
  neighbor 10.255.0.49 route-map BGP-IN in
 exit-address-family
!
