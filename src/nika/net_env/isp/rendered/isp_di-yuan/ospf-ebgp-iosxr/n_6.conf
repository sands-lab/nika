hostname n_6
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host n_1 10.255.0.1
domain ipv4 host n_10 10.255.0.2
domain ipv4 host n_11 10.255.0.3
domain ipv4 host n_2 10.255.0.4
domain ipv4 host n_3 10.255.0.5
domain ipv4 host n_4 10.255.0.6
domain ipv4 host n_5 10.255.0.7
domain ipv4 host n_7 10.255.0.9
domain ipv4 host n_8 10.255.0.10
domain ipv4 host n_9 10.255.0.11
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.8 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description n_6 -> n_8 [passive]
 ipv4 address 10.0.0.6 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description n_6 -> n_3 [passive]
 ipv4 address 10.0.0.9 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description n_6 -> n_5 [internal]
 ipv4 address 10.0.0.15 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description n_6 -> n_10 [passive]
 ipv4 address 10.0.0.57 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description n_6 -> n_11 [passive]
 ipv4 address 10.0.0.63 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description n_6 -> n_4 [internal]
 ipv4 address 10.0.0.73 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description n_6 -> n_2 [passive]
 ipv4 address 10.0.0.81 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description n_6 -> stub [stub]
 ipv4 address 10.254.0.29 255.255.255.252
!
interface Loopback1
 no shutdown
 description n_6 -> stub
 ipv4 address 198.51.101.1 255.255.255.0
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
prefix-set CUSTOMERS
  198.51.110.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
    done
  endif
  if destination in CUSTOMERS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.8

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/7
   passive enable
   cost 1

!
!
router bgp 65002
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.8

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
  network 198.51.101.0/24
!
 neighbor 10.255.0.6
  remote-as 65002
  description n_4
  update-source Loopback0
  address-family ipv4 unicast

!
 neighbor 10.0.0.7
  remote-as 65001
  description n_8
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.8
  remote-as 65001
  description n_3
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.56
  remote-as 65003
  description n_10
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.62
  remote-as 65001
  description n_11
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.80
  remote-as 65001
  description n_2
  address-family ipv4 unicast
   send-community-ebgp

!
!
!
router bgp 65002
!
  neighbor 10.255.0.6
    address-family ipv4 unicast

  neighbor 10.0.0.7
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.8
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.56
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.62
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.80
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out


router bgp 65002
 neighbor 10.255.0.6
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
