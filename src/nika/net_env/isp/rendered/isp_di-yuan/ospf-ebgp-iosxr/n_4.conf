hostname n_4
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host n_1 10.255.0.1
domain ipv4 host n_10 10.255.0.2
domain ipv4 host n_11 10.255.0.3
domain ipv4 host n_2 10.255.0.4
domain ipv4 host n_3 10.255.0.5
domain ipv4 host n_5 10.255.0.7
domain ipv4 host n_6 10.255.0.8
domain ipv4 host n_7 10.255.0.9
domain ipv4 host n_8 10.255.0.10
domain ipv4 host n_9 10.255.0.11
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.6 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description n_4 -> n_8 [passive]
 ipv4 address 10.0.0.2 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description n_4 -> n_9 [passive]
 ipv4 address 10.0.0.4 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description n_4 -> n_10 [passive]
 ipv4 address 10.0.0.27 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description n_4 -> n_11 [passive]
 ipv4 address 10.0.0.37 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description n_4 -> n_7 [passive]
 ipv4 address 10.0.0.38 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description n_4 -> n_5 [internal]
 ipv4 address 10.0.0.68 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description n_4 -> n_6 [internal]
 ipv4 address 10.0.0.72 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description n_4 -> n_2 [passive]
 ipv4 address 10.0.0.77 255.255.255.254
!
interface GigabitEthernet0/0/0/8
 no shutdown
 description n_4 -> stub [stub]
 ipv4 address 10.254.0.21 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
prefix-set CUSTOMERS
  198.51.110.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
    done
  endif
  if destination in CUSTOMERS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.6

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/7
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/8
   passive enable
   cost 1

!
!
router bgp 65002
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.6
 bgp cluster-id 10.255.0.6

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.7
  remote-as 65002
  description n_5
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.8
  remote-as 65002
  description n_6
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.0.0.3
  remote-as 65001
  description n_8
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.5
  remote-as 65001
  description n_9
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.26
  remote-as 65003
  description n_10
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.36
  remote-as 65001
  description n_11
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.39
  remote-as 65001
  description n_7
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.76
  remote-as 65001
  description n_2
  address-family ipv4 unicast
   send-community-ebgp

!
!
!
router bgp 65002
!
  neighbor 10.255.0.7
    address-family ipv4 unicast

  neighbor 10.255.0.8
    address-family ipv4 unicast

  neighbor 10.0.0.3
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.5
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.26
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.36
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.39
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.76
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out


router bgp 65002
 neighbor 10.255.0.7
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.8
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
