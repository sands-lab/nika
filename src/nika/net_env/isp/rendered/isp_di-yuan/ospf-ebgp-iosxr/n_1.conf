hostname n_1
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host n_10 10.255.0.2
domain ipv4 host n_11 10.255.0.3
domain ipv4 host n_2 10.255.0.4
domain ipv4 host n_3 10.255.0.5
domain ipv4 host n_4 10.255.0.6
domain ipv4 host n_5 10.255.0.7
domain ipv4 host n_6 10.255.0.8
domain ipv4 host n_7 10.255.0.9
domain ipv4 host n_8 10.255.0.10
domain ipv4 host n_9 10.255.0.11
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description n_1 -> n_3 [internal]
 ipv4 address 10.0.0.22 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description n_1 -> n_11 [internal]
 ipv4 address 10.0.0.28 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description n_1 -> n_10 [passive]
 ipv4 address 10.0.0.42 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description n_1 -> n_7 [internal]
 ipv4 address 10.0.0.44 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description n_1 -> n_2 [internal]
 ipv4 address 10.0.0.50 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description n_1 -> n_8 [internal]
 ipv4 address 10.0.0.60 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description n_1 -> n_9 [internal]
 ipv4 address 10.0.0.66 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description n_1 -> stub [stub]
 ipv4 address 10.254.0.1 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.1

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/7
   passive enable
   cost 1

!
!
router bgp 65001
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.1
 bgp cluster-id 10.255.0.1

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.3
  remote-as 65001
  description n_11
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.4
  remote-as 65001
  description n_2
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.5
  remote-as 65001
  description n_3
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.9
  remote-as 65001
  description n_7
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.10
  remote-as 65001
  description n_8
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.11
  remote-as 65001
  description n_9
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.0.0.43
  remote-as 65003
  description n_10
  address-family ipv4 unicast
   send-community-ebgp

!
!
!
router bgp 65001
!
  neighbor 10.255.0.3
    address-family ipv4 unicast

  neighbor 10.255.0.4
    address-family ipv4 unicast

  neighbor 10.255.0.5
    address-family ipv4 unicast

  neighbor 10.255.0.9
    address-family ipv4 unicast

  neighbor 10.255.0.10
    address-family ipv4 unicast

  neighbor 10.255.0.11
    address-family ipv4 unicast

  neighbor 10.0.0.43
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out


router bgp 65001
 neighbor 10.255.0.3
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.4
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.5
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.9
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.10
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.11
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
