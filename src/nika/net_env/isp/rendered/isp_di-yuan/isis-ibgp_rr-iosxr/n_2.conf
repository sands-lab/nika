interface GigabitEthernet0/0/0/8
 no shutdown
 description n_2 -> stub [stub]
 ipv4 address 10.254.0.13 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
!
router isis CORE

 log adjacency changes
 lsp-gen-interval initial-wait 50 secondary-wait 100 maximum-wait 500
 is-type level-2-only
 net 49.0001.0000.0aff.0004.00
!
 address-family ipv4 unicast
  metric-style wide
  spf-interval initial-wait 50 secondary-wait 100 maximum-wait 500
!
!
 interface Loopback0
  passive
  address-family ipv4
!
 interface GigabitEthernet0/0/0/0
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/1
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/2
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/3
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/4
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/5
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/6
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/7
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/8
  passive
  circuit-type level-2
  address-family ipv4
    metric 1

!
!
router bgp 65000
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.4

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.1
  remote-as 65000
  description n_1
  update-source Loopback0
  address-family ipv4 unicast

!
 neighbor 10.255.0.2
  remote-as 65000
  description n_10
  update-source Loopback0
  address-family ipv4 unicast


router bgp 65000
 neighbor 10.255.0.1
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.2
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
