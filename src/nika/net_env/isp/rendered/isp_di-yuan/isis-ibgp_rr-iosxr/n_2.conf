 ipv4 address 10.0.0.51 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description n_2 -> n_3 [internal]
 ipv4 address 10.0.0.74 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description n_2 -> n_4 [internal]
 ipv4 address 10.0.0.76 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description n_2 -> n_5 [internal]
 ipv4 address 10.0.0.78 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
