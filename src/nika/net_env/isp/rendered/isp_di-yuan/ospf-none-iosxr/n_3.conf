hostname n_3
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host n_1 10.255.0.1
domain ipv4 host n_10 10.255.0.2
domain ipv4 host n_11 10.255.0.3
domain ipv4 host n_2 10.255.0.4
domain ipv4 host n_4 10.255.0.6
domain ipv4 host n_5 10.255.0.7
domain ipv4 host n_6 10.255.0.8
domain ipv4 host n_7 10.255.0.9
domain ipv4 host n_8 10.255.0.10
domain ipv4 host n_9 10.255.0.11
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.5 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description n_3 -> n_6 [internal]
 ipv4 address 10.0.0.8 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description n_3 -> n_8 [internal]
 ipv4 address 10.0.0.10 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description n_3 -> n_9 [internal]
 ipv4 address 10.0.0.12 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description n_3 -> n_1 [internal]
 ipv4 address 10.0.0.23 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description n_3 -> n_10 [internal]
 ipv4 address 10.0.0.49 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description n_3 -> n_11 [internal]
 ipv4 address 10.0.0.53 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description n_3 -> n_5 [internal]
 ipv4 address 10.0.0.54 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description n_3 -> n_2 [internal]
 ipv4 address 10.0.0.75 255.255.255.254
!
interface GigabitEthernet0/0/0/8
 no shutdown
 description n_3 -> stub [stub]
 ipv4 address 10.254.0.17 255.255.255.252
!
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.5

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/7
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/8
   passive enable
   cost 1

