hostname n_7
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host n_1 10.255.0.1
domain ipv4 host n_10 10.255.0.2
domain ipv4 host n_11 10.255.0.3
domain ipv4 host n_2 10.255.0.4
domain ipv4 host n_3 10.255.0.5
domain ipv4 host n_4 10.255.0.6
domain ipv4 host n_5 10.255.0.7
domain ipv4 host n_6 10.255.0.8
domain ipv4 host n_8 10.255.0.10
domain ipv4 host n_9 10.255.0.11
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.9 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description n_7 -> n_8 [internal]
 ipv4 address 10.0.0.0 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description n_7 -> n_11 [internal]
 ipv4 address 10.0.0.33 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description n_7 -> n_4 [internal]
 ipv4 address 10.0.0.39 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description n_7 -> n_10 [internal]
 ipv4 address 10.0.0.41 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description n_7 -> n_1 [internal]
 ipv4 address 10.0.0.45 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description n_7 -> n_9 [internal]
 ipv4 address 10.0.0.58 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description n_7 -> n_5 [internal]
 ipv4 address 10.0.0.71 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description n_7 -> stub [stub]
 ipv4 address 10.254.0.33 255.255.255.252
!
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.9

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/7
   passive enable
   cost 1

