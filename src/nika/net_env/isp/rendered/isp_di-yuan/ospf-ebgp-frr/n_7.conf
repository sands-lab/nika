#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.9
!
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 description n_1
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.0.0.38 remote-as 65002
  neighbor 10.0.0.38 description n_4
!
  neighbor 10.0.0.40 remote-as 65003
  neighbor 10.0.0.40 description n_10
!
  neighbor 10.0.0.70 remote-as 65002
  neighbor 10.0.0.70 description n_5
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.0.0.38 activate
  no neighbor 10.0.0.38 send-community all
  neighbor 10.0.0.38 send-community standard
  neighbor 10.0.0.38 send-community large
!
  neighbor 10.0.0.40 activate
  no neighbor 10.0.0.40 send-community all
  neighbor 10.0.0.40 send-community standard
  neighbor 10.0.0.40 send-community large
!
  neighbor 10.0.0.70 activate
  no neighbor 10.0.0.70 send-community all
  neighbor 10.0.0.70 send-community standard
  neighbor 10.0.0.70 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65001
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.38 route-map BGP-IN in
    neighbor 10.0.0.38 route-map BGP-OUT out

    neighbor 10.0.0.40 route-map BGP-IN in
    neighbor 10.0.0.40 route-map BGP-OUT out

    neighbor 10.0.0.70 route-map BGP-IN in
    neighbor 10.0.0.70 route-map BGP-OUT out

!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
 exit-address-family
!
