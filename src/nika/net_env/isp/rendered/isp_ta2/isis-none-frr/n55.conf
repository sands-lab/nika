hostname n55
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.51/32
!
interface eth0
 no shutdown
 description n55 -> n24 [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description n55 -> n28 [internal]
 ip address 10.0.0.7/31
!
interface eth2
 no shutdown
 description n55 -> n34 [internal]
