hostname n40
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.35/32
!
interface eth0
 no shutdown
 description n40 -> n30 [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description n40 -> n7 [internal]
 ip address 10.0.0.112/31
!
interface eth2
 no shutdown
 description n40 -> n50 [internal]
 ip address 10.0.0.114/31
!
interface eth3
 no shutdown
 description n40 -> n13 [internal]
 ip address 10.0.0.211/31
!
interface eth4
 no shutdown
 description n40 -> n16 [internal]
 ip address 10.0.0.213/31
!
interface eth5
 no shutdown
 description n40 -> stub [stub]
 ip address 10.254.0.137/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0023.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n40 -> n30
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n40 -> n7
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n40 -> n50
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n40 -> n13
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n40 -> n16
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n40 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
