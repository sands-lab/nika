hostname n33
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.27/32
!
interface eth0
 no shutdown
 description n33 -> n9 [internal]
 ip address 10.0.0.78/31
!
interface eth1
 no shutdown
 description n33 -> n10 [internal]
 ip address 10.0.0.81/31
!
interface eth2
 no shutdown
 description n33 -> n38 [internal]
 ip address 10.0.0.84/31
!
interface eth3
 no shutdown
 description n33 -> n30 [internal]
 ip address 10.0.0.87/31
!
interface eth4
 no shutdown
 description n33 -> n63 [internal]
 ip address 10.0.0.182/31
!
interface eth5
 no shutdown
 description n33 -> stub [stub]
 ip address 10.254.0.105/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001b.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n33 -> n9
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n33 -> n10
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n33 -> n38
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n33 -> n30
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n33 -> n63
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n33 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

