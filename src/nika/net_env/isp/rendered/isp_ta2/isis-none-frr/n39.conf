hostname n39
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.33/32
!
interface eth0
 no shutdown
 description n39 -> n31 [internal]
 ip address 10.0.0.109/31
!
interface eth1
 no shutdown
 description n39 -> n2 [internal]
 ip address 10.0.0.111/31
!
interface eth2
 no shutdown
 description n39 -> n28 [internal]
 ip address 10.0.0.207/31
!
interface eth3
 no shutdown
 description n39 -> n46 [internal]
 ip address 10.0.0.208/31
!
interface eth4
 no shutdown
 description n39 -> stub [stub]
 ip address 10.254.0.129/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0021.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n39 -> n31
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n39 -> n2
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n39 -> n28
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n39 -> n46
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n39 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
