#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0019.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n31 -> n1
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
