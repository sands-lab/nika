hostname n46
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.41/32
!
interface eth0
 no shutdown
 description n46 -> n28 [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description n46 -> n37 [internal]
 ip address 10.0.0.101/31
!
interface eth2
 no shutdown
 description n46 -> n65 [internal]
 ip address 10.0.0.186/31
!
interface eth3
 no shutdown
 description n46 -> n39 [internal]
 ip address 10.0.0.209/31
!
interface eth4
 no shutdown
 description n46 -> stub [stub]
 ip address 10.254.0.161/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0029.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n46 -> n28
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n46 -> n37
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n46 -> n65
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n46 -> n39
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n46 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65000
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.41
!
  neighbor 10.255.0.1 remote-as 65000
  neighbor 10.255.0.1 description n1
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.255.0.2 remote-as 65000
  neighbor 10.255.0.2 description n10
  neighbor 10.255.0.2 update-source lo
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.1 activate
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.255.0.2 activate
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
!

router bgp 65000
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
  neighbor 10.255.0.1 route-map BGP-OUT out
  neighbor 10.255.0.2 route-map BGP-IN in
  neighbor 10.255.0.2 route-map BGP-OUT out
 exit-address-family
!
