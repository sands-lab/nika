#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.60
!
  neighbor 10.255.0.3 remote-as 65002
  neighbor 10.255.0.3 description n11
  neighbor 10.255.0.3 update-source lo
!
  neighbor 10.0.0.12 remote-as 65001
  neighbor 10.0.0.12 description n30
!
  neighbor 10.0.0.182 remote-as 65001
  neighbor 10.0.0.182 description n33
!
 address-family ipv4 unicast
!

  network 198.51.110.0/24
  network 198.51.101.0/24
!
  neighbor 10.255.0.3 activate
  neighbor 10.255.0.3 next-hop-self
  no neighbor 10.255.0.3 send-community all
  neighbor 10.255.0.3 send-community standard
  neighbor 10.255.0.3 send-community large
  neighbor 10.255.0.3 send-community extended
!
  neighbor 10.0.0.12 activate
  no neighbor 10.0.0.12 send-community all
  neighbor 10.0.0.12 send-community standard
  neighbor 10.0.0.12 send-community large
!
  neighbor 10.0.0.182 activate
  no neighbor 10.0.0.182 send-community all
  neighbor 10.0.0.182 send-community standard
  neighbor 10.0.0.182 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.12 route-map BGP-IN in
    neighbor 10.0.0.12 route-map BGP-OUT-AS65001 out

    neighbor 10.0.0.182 route-map BGP-IN in
    neighbor 10.0.0.182 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.3 route-map BGP-IN in
 exit-address-family
!
