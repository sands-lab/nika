hostname n18
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description n18 -> n64 [internal]
 ip address 10.0.0.36/31
!
interface eth1
 no shutdown
 description n18 -> n44 [internal]
 ip address 10.0.0.40/31
!
interface eth2
 no shutdown
 description n18 -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.10
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n18 -> n64
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n18 -> n44
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n18 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.10
  bgp cluster-id 10.255.0.10
!
  neighbor 10.255.0.28 remote-as 65003
  neighbor 10.255.0.28 description n34
  neighbor 10.255.0.28 update-source lo
!
  neighbor 10.255.0.39 remote-as 65003
  neighbor 10.255.0.39 description n44
  neighbor 10.255.0.39 update-source lo
!
  neighbor 10.255.0.52 remote-as 65003
  neighbor 10.255.0.52 description n56
  neighbor 10.255.0.52 update-source lo
!
  neighbor 10.255.0.61 remote-as 65003
  neighbor 10.255.0.61 description n64
  neighbor 10.255.0.61 update-source lo
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.28 activate
  neighbor 10.255.0.28 next-hop-self
  neighbor 10.255.0.28 route-reflector-client
  no neighbor 10.255.0.28 send-community all
  neighbor 10.255.0.28 send-community standard
  neighbor 10.255.0.28 send-community large
  neighbor 10.255.0.28 send-community extended
!
  neighbor 10.255.0.39 activate
  neighbor 10.255.0.39 next-hop-self
  neighbor 10.255.0.39 route-reflector-client
  no neighbor 10.255.0.39 send-community all
  neighbor 10.255.0.39 send-community standard
  neighbor 10.255.0.39 send-community large
  neighbor 10.255.0.39 send-community extended
!
  neighbor 10.255.0.52 activate
  neighbor 10.255.0.52 next-hop-self
  neighbor 10.255.0.52 route-reflector-client
  no neighbor 10.255.0.52 send-community all
  neighbor 10.255.0.52 send-community standard
  neighbor 10.255.0.52 send-community large
  neighbor 10.255.0.52 send-community extended
!
  neighbor 10.255.0.61 activate
  neighbor 10.255.0.61 next-hop-self
  neighbor 10.255.0.61 route-reflector-client
  no neighbor 10.255.0.61 send-community all
  neighbor 10.255.0.61 send-community standard
  neighbor 10.255.0.61 send-community large
  neighbor 10.255.0.61 send-community extended
!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.28 route-map BGP-IN in
  neighbor 10.255.0.39 route-map BGP-IN in
  neighbor 10.255.0.52 route-map BGP-IN in
  neighbor 10.255.0.61 route-map BGP-IN in
 exit-address-family
!
