hostname n33
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.27/32
!
interface eth0
 no shutdown
 description n33 -> n9 [internal]
 ip address 10.0.0.78/31
!
interface eth1
 no shutdown
 description n33 -> n10 [internal]
 ip address 10.0.0.81/31
!
interface eth2
 no shutdown
 description n33 -> n38 [internal]
 ip address 10.0.0.84/31
!
interface eth3
 no shutdown
 description n33 -> n30 [internal]
 ip address 10.0.0.87/31
!
interface eth4
 no shutdown
 description n33 -> n63 [internal]
 ip address 10.0.0.182/31
!
interface eth5
 no shutdown
 description n33 -> stub [stub]
 ip address 10.254.0.105/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.27
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n33 -> n9
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n33 -> n10
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n33 -> n38
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n33 -> n30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n33 -> n63
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n33 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
