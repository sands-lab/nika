hostname n41
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.36/32
!
interface eth0
 no shutdown
 description n41 -> n22 [internal]
 ip address 10.0.0.49/31
!
interface eth1
 no shutdown
 description n41 -> n23 [internal]
 ip address 10.0.0.117/31
!
interface eth2
 no shutdown
 description n41 -> n14 [internal]
 ip address 10.0.0.201/31
!
interface eth3
 no shutdown
 description n41 -> stub [stub]
 ip address 10.254.0.141/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.36
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n41 -> n22
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n41 -> n23
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n41 -> n14
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n41 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
