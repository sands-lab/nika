hostname n55
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.51/32
!
interface eth0
 no shutdown
 description n55 -> n24 [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description n55 -> n28 [internal]
 ip address 10.0.0.7/31
!
interface eth2
 no shutdown
 description n55 -> n34 [internal]
 ip address 10.0.0.89/31
!
interface eth3
 no shutdown
 description n55 -> n52 [internal]
 ip address 10.0.0.155/31
!
interface eth4
 no shutdown
 description n55 -> n56 [internal]
 ip address 10.0.0.156/31
!
interface eth5
 no shutdown
 description n55 -> n51 [internal]
 ip address 10.0.0.159/31
!
interface eth6
 no shutdown
 description n55 -> stub [stub]
 ip address 10.254.0.201/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.51
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n55 -> n24
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n55 -> n28
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n55 -> n34
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n55 -> n52
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n55 -> n56
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n55 -> n51
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n55 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
