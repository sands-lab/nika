hostname n43
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.38/32
!
interface eth0
 no shutdown
 description n43 -> n1 [internal]
 ip address 10.0.0.121/31
!
interface eth1
 no shutdown
 description n43 -> n13 [internal]
 ip address 10.0.0.123/31
!
interface eth2
 no shutdown
 description n43 -> n65 [internal]
 ip address 10.0.0.188/31
!
interface eth3
 no shutdown
 description n43 -> stub [stub]
 ip address 10.254.0.149/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.38
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n43 -> n1
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n43 -> n13
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n43 -> n65
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n43 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
