hostname n31
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.25/32
!
interface eth0
 no shutdown
 description n31 -> n1 [internal]
 ip address 10.0.0.39/31
!
interface eth1
 no shutdown
 description n31 -> n28 [internal]
 ip address 10.0.0.73/31
!
interface eth2
 no shutdown
 description n31 -> n32 [internal]
 ip address 10.0.0.76/31
!
interface eth3
 no shutdown
 description n31 -> n39 [internal]
 ip address 10.0.0.108/31
!
interface eth4
 no shutdown
 description n31 -> n14 [internal]
 ip address 10.0.0.199/31
!
interface eth5
 no shutdown
 description n31 -> stub [stub]
 ip address 10.254.0.97/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.25
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n31 -> n1
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n31 -> n28
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n31 -> n32
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n31 -> n39
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n31 -> n14
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n31 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
