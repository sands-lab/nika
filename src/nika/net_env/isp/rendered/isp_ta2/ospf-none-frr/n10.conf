hostname n10
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description n10 -> n2 [internal]
 ip address 10.0.0.18/31
!
interface eth1
 no shutdown
 description n10 -> n33 [internal]
 ip address 10.0.0.80/31
!
interface eth2
 no shutdown
 description n10 -> n30 [internal]
 ip address 10.0.0.192/31
!
interface eth3
 no shutdown
 description n10 -> n28 [internal]
 ip address 10.0.0.194/31
!
interface eth4
 no shutdown
 description n10 -> n47 [internal]
 ip address 10.0.0.196/31
!
interface eth5
 no shutdown
 description n10 -> n42 [internal]
 ip address 10.0.0.214/31
!
interface eth6
 no shutdown
 description n10 -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n10 -> n2
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n10 -> n33
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n10 -> n30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n10 -> n28
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n10 -> n47
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n10 -> n42
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n10 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
