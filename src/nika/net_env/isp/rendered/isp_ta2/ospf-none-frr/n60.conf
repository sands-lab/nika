hostname n60
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.57/32
!
interface eth0
 no shutdown
 description n60 -> n59 [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description n60 -> n57 [internal]
 ip address 10.0.0.173/31
!
interface eth2
 no shutdown
 description n60 -> n12 [internal]
 ip address 10.0.0.175/31
!
interface eth3
 no shutdown
 description n60 -> stub [stub]
 ip address 10.254.0.225/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.57
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n60 -> n59
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n60 -> n57
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n60 -> n12
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n60 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
