hostname n13
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.5/32
!
interface eth0
 no shutdown
 description n13 -> n65 [internal]
 ip address 10.0.0.16/31
!
interface eth1
 no shutdown
 description n13 -> n23 [internal]
 ip address 10.0.0.20/31
!
interface eth2
 no shutdown
