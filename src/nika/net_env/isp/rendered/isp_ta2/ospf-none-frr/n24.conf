hostname n24
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.17/32
!
interface eth0
 no shutdown
 description n24 -> n55 [internal]
 ip address 10.0.0.4/31
!
interface eth1
 no shutdown
 description n24 -> n51 [internal]
 ip address 10.0.0.50/31
!
interface eth2
 no shutdown
 description n24 -> n48 [internal]
 ip address 10.0.0.52/31
!
interface eth3
 no shutdown
 description n24 -> n26 [internal]
 ip address 10.0.0.54/31
!
interface eth4
 no shutdown
 description n24 -> n15 [internal]
 ip address 10.0.0.205/31
!
interface eth5
 no shutdown
 description n24 -> stub [stub]
 ip address 10.254.0.65/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.17
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n24 -> n55
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n24 -> n51
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n24 -> n48
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n24 -> n26
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n24 -> n15
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n24 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
