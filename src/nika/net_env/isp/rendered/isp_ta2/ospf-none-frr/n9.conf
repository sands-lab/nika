hostname n9
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.65/32
!
interface eth0
 no shutdown
 description n9 -> n21 [internal]
 ip address 10.0.0.47/31
!
interface eth1
 no shutdown
 description n9 -> n33 [internal]
 ip address 10.0.0.79/31
!
interface eth2
 no shutdown
 description n9 -> n30 [internal]
 ip address 10.0.0.171/31
!
interface eth3
 no shutdown
 description n9 -> stub [stub]
 ip address 10.254.1.1/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.65
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n9 -> n21
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n9 -> n33
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n9 -> n30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n9 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
