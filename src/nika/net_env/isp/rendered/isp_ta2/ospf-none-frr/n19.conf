hostname n19
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description n19 -> n17 [internal]
 ip address 10.0.0.33/31
!
interface eth1
 no shutdown
 description n19 -> n45 [internal]
 ip address 10.0.0.42/31
!
interface eth2
 no shutdown
 description n19 -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.11
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n19 -> n17
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n19 -> n45
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n19 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
