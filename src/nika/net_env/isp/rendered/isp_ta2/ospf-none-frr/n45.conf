hostname n45
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.40/32
!
interface eth0
 no shutdown
 description n45 -> n19 [internal]
 ip address 10.0.0.43/31
!
interface eth1
 no shutdown
 description n45 -> n42 [internal]
 ip address 10.0.0.119/31
!
interface eth2
 no shutdown
 description n45 -> n35 [internal]
 ip address 10.0.0.129/31
!
interface eth3
 no shutdown
 description n45 -> n47 [internal]
 ip address 10.0.0.132/31
!
interface eth4
 no shutdown
 description n45 -> n8 [internal]
 ip address 10.0.0.148/31
!
interface eth5
 no shutdown
 description n45 -> n59 [internal]
 ip address 10.0.0.164/31
!
interface eth6
 no shutdown
 description n45 -> stub [stub]
 ip address 10.254.0.157/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.40
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n45 -> n19
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n45 -> n42
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n45 -> n35
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n45 -> n47
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n45 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n45 -> n59
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n45 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
