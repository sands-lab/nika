hostname n53
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.49/32
!
interface eth0
 no shutdown
 description n53 -> n28 [internal]
 ip address 10.0.0.145/31
!
interface eth1
 no shutdown
 description n53 -> n22 [internal]
 ip address 10.0.0.147/31
!
interface eth2
 no shutdown
 description n53 -> n36 [internal]
 ip address 10.0.0.151/31
!
interface eth3
 no shutdown
 description n53 -> stub [stub]
 ip address 10.254.0.193/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.49
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n53 -> n28
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n53 -> n22
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n53 -> n36
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n53 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
