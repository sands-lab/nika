#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.30
!
  neighbor 10.255.0.8 remote-as 65002
  neighbor 10.255.0.8 description n16
  neighbor 10.255.0.8 update-source lo
!
  neighbor 10.0.0.160 remote-as 65003
  neighbor 10.0.0.160 description n18
!
  neighbor 10.0.0.162 remote-as 65003
  neighbor 10.0.0.162 description n18
!
  neighbor 10.0.0.188 remote-as 65003
  neighbor 10.0.0.188 description n21
!
  neighbor 10.0.0.190 remote-as 65003
  neighbor 10.0.0.190 description n21
!
 address-family ipv4 unicast
!

  network 198.51.101.0/24
!
  neighbor 10.255.0.8 activate
  neighbor 10.255.0.8 next-hop-self
  no neighbor 10.255.0.8 send-community all
  neighbor 10.255.0.8 send-community standard
  neighbor 10.255.0.8 send-community large
  neighbor 10.255.0.8 send-community extended
!
