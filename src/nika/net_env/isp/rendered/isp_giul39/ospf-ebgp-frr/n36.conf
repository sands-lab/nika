  address-family ipv4


    neighbor 10.0.0.160 route-map BGP-IN in
    neighbor 10.0.0.160 route-map BGP-OUT out

    neighbor 10.0.0.162 route-map BGP-IN in
    neighbor 10.0.0.162 route-map BGP-OUT out

    neighbor 10.0.0.188 route-map BGP-IN in
    neighbor 10.0.0.188 route-map BGP-OUT out

    neighbor 10.0.0.190 route-map BGP-IN in
    neighbor 10.0.0.190 route-map BGP-OUT out

!
