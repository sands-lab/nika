#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.21
!
  neighbor 10.255.0.8 remote-as 65002
  neighbor 10.255.0.8 description n16
  neighbor 10.255.0.8 update-source lo
!
  neighbor 10.0.0.212 remote-as 65001
  neighbor 10.0.0.212 description n24
!
  neighbor 10.0.0.214 remote-as 65001
  neighbor 10.0.0.214 description n24
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.8 activate
  neighbor 10.255.0.8 next-hop-self
  no neighbor 10.255.0.8 send-community all
  neighbor 10.255.0.8 send-community standard
  neighbor 10.255.0.8 send-community large
  neighbor 10.255.0.8 send-community extended
!
  neighbor 10.0.0.212 activate
  no neighbor 10.0.0.212 send-community all
  neighbor 10.0.0.212 send-community standard
  neighbor 10.0.0.212 send-community large
!
  neighbor 10.0.0.214 activate
  no neighbor 10.0.0.214 send-community all
  neighbor 10.0.0.214 send-community standard
  neighbor 10.0.0.214 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.212 route-map BGP-IN in
    neighbor 10.0.0.212 route-map BGP-OUT out

    neighbor 10.0.0.214 route-map BGP-IN in
    neighbor 10.0.0.214 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.8 route-map BGP-IN in
 exit-address-family
!
