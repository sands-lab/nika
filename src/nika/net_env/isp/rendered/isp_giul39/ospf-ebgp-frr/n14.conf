!
! Global address families
  address-family ipv4


    neighbor 10.0.0.92 route-map BGP-IN in
    neighbor 10.0.0.92 route-map BGP-OUT out

    neighbor 10.0.0.94 route-map BGP-IN in
    neighbor 10.0.0.94 route-map BGP-OUT out

    neighbor 10.0.0.109 route-map BGP-IN in
    neighbor 10.0.0.109 route-map BGP-OUT out

    neighbor 10.0.0.111 route-map BGP-IN in
    neighbor 10.0.0.111 route-map BGP-OUT out

    neighbor 10.0.0.113 route-map BGP-IN in
    neighbor 10.0.0.113 route-map BGP-OUT out

    neighbor 10.0.0.115 route-map BGP-IN in
    neighbor 10.0.0.115 route-map BGP-OUT out

!
