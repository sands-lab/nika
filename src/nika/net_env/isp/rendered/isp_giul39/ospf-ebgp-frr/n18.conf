#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.10
!
  neighbor 10.255.0.5 remote-as 65003
  neighbor 10.255.0.5 description n13
  neighbor 10.255.0.5 update-source lo
!
  neighbor 10.0.0.25 remote-as 65001
  neighbor 10.0.0.25 description n6
!
  neighbor 10.0.0.27 remote-as 65001
  neighbor 10.0.0.27 description n6
!
  neighbor 10.0.0.161 remote-as 65002
  neighbor 10.0.0.161 description n36
!
  neighbor 10.0.0.163 remote-as 65002
  neighbor 10.0.0.163 description n36
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.5 activate
  neighbor 10.255.0.5 next-hop-self
  no neighbor 10.255.0.5 send-community all
  neighbor 10.255.0.5 send-community standard
  neighbor 10.255.0.5 send-community large
  neighbor 10.255.0.5 send-community extended
!
  neighbor 10.0.0.25 activate
  no neighbor 10.0.0.25 send-community all
  neighbor 10.0.0.25 send-community standard
  neighbor 10.0.0.25 send-community large
!
  neighbor 10.0.0.27 activate
  no neighbor 10.0.0.27 send-community all
  neighbor 10.0.0.27 send-community standard
  neighbor 10.0.0.27 send-community large
!
  neighbor 10.0.0.161 activate
  no neighbor 10.0.0.161 send-community all
  neighbor 10.0.0.161 send-community standard
  neighbor 10.0.0.161 send-community large
!
  neighbor 10.0.0.163 activate
  no neighbor 10.0.0.163 send-community all
  neighbor 10.0.0.163 send-community standard
  neighbor 10.0.0.163 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.25 route-map BGP-IN in
    neighbor 10.0.0.25 route-map BGP-OUT out

    neighbor 10.0.0.27 route-map BGP-IN in
    neighbor 10.0.0.27 route-map BGP-OUT out

    neighbor 10.0.0.161 route-map BGP-IN in
    neighbor 10.0.0.161 route-map BGP-OUT out

    neighbor 10.0.0.163 route-map BGP-IN in
    neighbor 10.0.0.163 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.5 route-map BGP-IN in
 exit-address-family
!
