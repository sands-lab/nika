    neighbor 10.0.0.228 route-map BGP-IN in
    neighbor 10.0.0.228 route-map BGP-OUT out

    neighbor 10.0.0.230 route-map BGP-IN in
    neighbor 10.0.0.230 route-map BGP-OUT out

    neighbor 10.0.0.241 route-map BGP-IN in
    neighbor 10.0.0.241 route-map BGP-OUT out

    neighbor 10.0.0.243 route-map BGP-IN in
    neighbor 10.0.0.243 route-map BGP-OUT out

!
