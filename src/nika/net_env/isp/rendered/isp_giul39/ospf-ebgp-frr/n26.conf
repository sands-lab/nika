#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.19
!
  neighbor 10.255.0.8 remote-as 65002
  neighbor 10.255.0.8 description n16
  neighbor 10.255.0.8 update-source lo
!
  neighbor 10.0.0.112 remote-as 65001
  neighbor 10.0.0.112 description n14
!
  neighbor 10.0.0.114 remote-as 65001
  neighbor 10.0.0.114 description n14
!
  neighbor 10.0.0.168 remote-as 65003
  neighbor 10.0.0.168 description n19
!
