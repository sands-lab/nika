hostname n38
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.32/32
!
interface eth0
 no shutdown
 description n38 -> n34 [internal]
 ip address 10.0.1.61/31
!
interface eth1
 no shutdown
 description n38 -> n34 [internal]
 ip address 10.0.1.63/31
!
interface eth2
 no shutdown
 description n38 -> n36 [internal]
 ip address 10.0.1.69/31
!
interface eth3
 no shutdown
 description n38 -> n36 [internal]
 ip address 10.0.1.71/31
!
interface eth4
 no shutdown
 description n38 -> n37 [internal]
 ip address 10.0.1.73/31
!
interface eth5
 no shutdown
 description n38 -> n37 [internal]
 ip address 10.0.1.75/31
!
interface eth6
 no shutdown
 description n38 -> stub [stub]
 ip address 10.254.0.125/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.32
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n38 -> n34
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n38 -> n34
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n38 -> n36
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n38 -> n36
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n38 -> n37
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n38 -> n37
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n38 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
