hostname n39
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.33/32
!
interface eth0
 no shutdown
 description n39 -> n31 [internal]
 ip address 10.0.1.25/31
!
interface eth1
 no shutdown
 description n39 -> n31 [internal]
 ip address 10.0.1.27/31
!
interface eth2
 no shutdown
 description n39 -> n33 [internal]
 ip address 10.0.1.45/31
!
interface eth3
 no shutdown
 description n39 -> n33 [internal]
 ip address 10.0.1.47/31
!
interface eth4
 no shutdown
 description n39 -> n37 [internal]
 ip address 10.0.1.77/31
!
interface eth5
 no shutdown
 description n39 -> n37 [internal]
 ip address 10.0.1.79/31
!
interface eth6
 no shutdown
 description n39 -> stub [stub]
 ip address 10.254.0.129/30
