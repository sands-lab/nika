hostname n12
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description n12 -> n8 [internal]
 ip address 10.0.0.36/31
!
interface eth1
 no shutdown
 description n12 -> n8 [internal]
 ip address 10.0.0.38/31
!
interface eth2
 no shutdown
 description n12 -> n11 [internal]
 ip address 10.0.0.77/31
!
interface eth3
 no shutdown
 description n12 -> n11 [internal]
 ip address 10.0.0.79/31
!
interface eth4
 no shutdown
 description n12 -> n25 [internal]
 ip address 10.0.0.88/31
!
interface eth5
 no shutdown
 description n12 -> n25 [internal]
 ip address 10.0.0.90/31
!
interface eth6
 no shutdown
 description n12 -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.4
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n12 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n12 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n12 -> n11
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n12 -> n11
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n12 -> n25
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n12 -> n25
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n12 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
