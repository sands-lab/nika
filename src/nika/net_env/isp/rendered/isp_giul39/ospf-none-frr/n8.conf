hostname n8
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.38/32
!
interface eth0
 no shutdown
 description n8 -> n12 [internal]
 ip address 10.0.0.37/31
!
interface eth1
 no shutdown
 description n8 -> n12 [internal]
 ip address 10.0.0.39/31
!
interface eth2
 no shutdown
 description n8 -> n25 [internal]
 ip address 10.0.0.45/31
!
interface eth3
 no shutdown
 description n8 -> n25 [internal]
 ip address 10.0.0.47/31
!
interface eth4
 no shutdown
 description n8 -> n2 [internal]
 ip address 10.0.1.49/31
!
interface eth5
 no shutdown
 description n8 -> n2 [internal]
 ip address 10.0.1.51/31
!
interface eth6
 no shutdown
 description n8 -> stub [stub]
 ip address 10.254.0.149/30
!
