hostname london
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.14/32
!
interface eth0
 no shutdown
 description london -> dublin [internal]
 ip address 10.0.0.33/31
!
interface eth1
 no shutdown
 description london -> paris [internal]
 ip address 10.0.0.40/31
!
interface eth2
 no shutdown
 description london -> amsterdam [internal]
 ip address 10.0.0.67/31
!
interface eth3
 no shutdown
 description london -> stub [stub]
 ip address 10.254.0.53/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.14
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! london -> dublin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! london -> paris
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! london -> amsterdam
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! london -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
