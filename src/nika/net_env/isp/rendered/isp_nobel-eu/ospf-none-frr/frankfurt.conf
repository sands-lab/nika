hostname frankfurt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description frankfurt -> brussels [internal]
 ip address 10.0.0.19/31
!
interface eth1
 no shutdown
 description frankfurt -> hamburg [internal]
 ip address 10.0.0.34/31
!
interface eth2
 no shutdown
 description frankfurt -> munich [internal]
 ip address 10.0.0.36/31
!
interface eth3
 no shutdown
 description frankfurt -> strasbourg [internal]
 ip address 10.0.0.38/31
!
interface eth4
 no shutdown
 description frankfurt -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.11
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! frankfurt -> brussels
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! frankfurt -> hamburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! frankfurt -> munich
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! frankfurt -> strasbourg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! frankfurt -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
