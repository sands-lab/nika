hostname zurich
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.28/32
!
interface eth0
 no shutdown
 description zurich -> milan [internal]
 ip address 10.0.0.51/31
!
interface eth1
 no shutdown
 description zurich -> lyon [internal]
 ip address 10.0.0.65/31
!
interface eth2
 no shutdown
 description zurich -> strasbourg [internal]
 ip address 10.0.0.69/31
!
interface eth3
 no shutdown
 description zurich -> stub [stub]
 ip address 10.254.0.109/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.28
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! zurich -> milan
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! zurich -> lyon
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! zurich -> strasbourg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! zurich -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
