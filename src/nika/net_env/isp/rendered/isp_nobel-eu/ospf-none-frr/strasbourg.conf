hostname strasbourg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.24/32
!
interface eth0
 no shutdown
 description strasbourg -> frankfurt [internal]
 ip address 10.0.0.39/31
!
interface eth1
 no shutdown
 description strasbourg -> paris [internal]
 ip address 10.0.0.57/31
!
interface eth2
 no shutdown
 description strasbourg -> zurich [internal]
 ip address 10.0.0.68/31
!
interface eth3
 no shutdown
 description strasbourg -> stub [stub]
 ip address 10.254.0.93/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.24
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! strasbourg -> frankfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! strasbourg -> paris
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! strasbourg -> zurich
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! strasbourg -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
