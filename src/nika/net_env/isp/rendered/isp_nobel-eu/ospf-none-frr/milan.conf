hostname milan
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.17/32
!
interface eth0
 no shutdown
 description milan -> munich [internal]
 ip address 10.0.0.46/31
!
interface eth1
 no shutdown
 description milan -> rome [internal]
 ip address 10.0.0.48/31
!
interface eth2
 no shutdown
 description milan -> zurich [internal]
 ip address 10.0.0.50/31
!
interface eth3
 no shutdown
 description milan -> stub [stub]
 ip address 10.254.0.65/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.17
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! milan -> munich
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! milan -> rome
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! milan -> zurich
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! milan -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
