hostname paris
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description paris -> bordeaux [internal]
 ip address 10.0.0.17/31
!
interface eth1
 no shutdown
 description paris -> brussels [internal]
 ip address 10.0.0.21/31
!
interface eth2
 no shutdown
 description paris -> london [internal]
 ip address 10.0.0.41/31
!
interface eth3
 no shutdown
 description paris -> lyon [internal]
 ip address 10.0.0.43/31
!
interface eth4
 no shutdown
 description paris -> strasbourg [internal]
 ip address 10.0.0.56/31
!
interface eth5
 no shutdown
 description paris -> stub [stub]
 ip address 10.254.0.77/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0014.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! paris -> bordeaux
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! paris -> brussels
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! paris -> london
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! paris -> lyon
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! paris -> strasbourg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! paris -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
