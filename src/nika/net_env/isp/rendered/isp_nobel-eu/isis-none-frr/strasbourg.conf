hostname strasbourg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.24/32
!
interface eth0
 no shutdown
 description strasbourg -> frankfurt [internal]
 ip address 10.0.0.39/31
!
interface eth1
 no shutdown
 description strasbourg -> paris [internal]
 ip address 10.0.0.57/31
!
interface eth2
 no shutdown
 description strasbourg -> zurich [internal]
 ip address 10.0.0.68/31
!
interface eth3
 no shutdown
 description strasbourg -> stub [stub]
 ip address 10.254.0.93/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0018.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! strasbourg -> frankfurt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! strasbourg -> paris
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! strasbourg -> zurich
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! strasbourg -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
