hostname madrid
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.16/32
!
interface eth0
 no shutdown
 description madrid -> bordeaux [internal]
 ip address 10.0.0.15/31
!
interface eth1
 no shutdown
 description madrid -> barcelona [internal]
 ip address 10.0.0.79/31
!
interface eth2
 no shutdown
 description madrid -> stub [stub]
 ip address 10.254.0.61/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0010.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! madrid -> bordeaux
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! madrid -> barcelona
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! madrid -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
