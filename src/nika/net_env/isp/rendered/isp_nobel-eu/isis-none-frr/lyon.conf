hostname lyon
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.15/32
!
interface eth0
 no shutdown
 description lyon -> paris [internal]
 ip address 10.0.0.42/31
!
interface eth1
 no shutdown
 description lyon -> zurich [internal]
 ip address 10.0.0.64/31
!
interface eth2
 no shutdown
 description lyon -> barcelona [internal]
 ip address 10.0.0.77/31
!
interface eth3
 no shutdown
 description lyon -> stub [stub]
 ip address 10.254.0.57/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000f.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! lyon -> paris
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! lyon -> zurich
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! lyon -> barcelona
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! lyon -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
