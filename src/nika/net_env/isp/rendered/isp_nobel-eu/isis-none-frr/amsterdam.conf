hostname amsterdam
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description amsterdam -> brussels [internal]
 ip address 10.0.0.0/31
!
interface eth1
 no shutdown
 description amsterdam -> glasgow [internal]
 ip address 10.0.0.22/31
!
interface eth2
 no shutdown
 description amsterdam -> hamburg [internal]
 ip address 10.0.0.44/31
!
interface eth3
 no shutdown
 description amsterdam -> london [internal]
 ip address 10.0.0.66/31
!
interface eth4
 no shutdown
 description amsterdam -> stub [stub]
 ip address 10.254.0.1/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0001.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! amsterdam -> brussels
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! amsterdam -> glasgow
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! amsterdam -> hamburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! amsterdam -> london
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! amsterdam -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
