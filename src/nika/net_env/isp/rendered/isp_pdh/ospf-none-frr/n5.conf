hostname n5
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description n5 -> n2 [internal]
 ip address 10.0.0.13/31
!
interface eth1
 no shutdown
 description n5 -> n3 [internal]
 ip address 10.0.0.21/31
!
interface eth2
 no shutdown
 description n5 -> n4 [internal]
 ip address 10.0.0.27/31
!
interface eth3
 no shutdown
 description n5 -> n6 [internal]
 ip address 10.0.0.30/31
!
interface eth4
 no shutdown
 description n5 -> n7 [internal]
 ip address 10.0.0.34/31
!
interface eth5
 no shutdown
 description n5 -> n8 [internal]
 ip address 10.0.0.36/31
!
interface eth6
 no shutdown
 description n5 -> stub [stub]
 ip address 10.254.0.25/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.7
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n5 -> n2
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n5 -> n3
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n5 -> n4
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n5 -> n6
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n5 -> n7
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n5 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n5 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
