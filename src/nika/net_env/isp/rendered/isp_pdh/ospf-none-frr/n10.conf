hostname n10
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description n10 -> n1 [internal]
 ip address 10.0.0.23/31
!
interface eth1
 no shutdown
 description n10 -> n9 [internal]
 ip address 10.0.0.42/31
!
interface eth2
 no shutdown
 description n10 -> n11 [internal]
 ip address 10.0.0.44/31
!
interface eth3
 no shutdown
 description n10 -> n2 [internal]
 ip address 10.0.0.56/31
!
interface eth4
 no shutdown
 description n10 -> n3 [internal]
 ip address 10.0.0.58/31
!
interface eth5
 no shutdown
 description n10 -> n7 [internal]
 ip address 10.0.0.60/31
!
interface eth6
 no shutdown
 description n10 -> n8 [internal]
 ip address 10.0.0.62/31
!
interface eth7
 no shutdown
 description n10 -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n10 -> n1
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n10 -> n9
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n10 -> n11
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n10 -> n2
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n10 -> n3
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n10 -> n7
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n10 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth7
! n10 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

