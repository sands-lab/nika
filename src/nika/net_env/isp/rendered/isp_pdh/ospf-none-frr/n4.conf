hostname n4
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.6/32
!
interface eth0
 no shutdown
 description n4 -> n2 [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description n4 -> n3 [internal]
 ip address 10.0.0.19/31
!
interface eth2
 no shutdown
 description n4 -> n5 [internal]
 ip address 10.0.0.26/31
!
interface eth3
 no shutdown
 description n4 -> n6 [internal]
 ip address 10.0.0.28/31
!
interface eth4
 no shutdown
 description n4 -> stub [stub]
 ip address 10.254.0.21/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.6
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n4 -> n2
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n4 -> n3
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n4 -> n5
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n4 -> n6
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n4 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
