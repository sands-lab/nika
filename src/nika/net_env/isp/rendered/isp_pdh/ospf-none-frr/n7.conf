hostname n7
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.9/32
!
interface eth0
 no shutdown
 description n7 -> n11 [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description n7 -> n1 [internal]
 ip address 10.0.0.9/31
!
interface eth2
 no shutdown
 description n7 -> n5 [internal]
 ip address 10.0.0.35/31
!
interface eth3
 no shutdown
 description n7 -> n8 [internal]
 ip address 10.0.0.40/31
!
interface eth4
 no shutdown
 description n7 -> n9 [internal]
 ip address 10.0.0.52/31
!
interface eth5
 no shutdown
 description n7 -> n10 [internal]
 ip address 10.0.0.61/31
!
interface eth6
 no shutdown
 description n7 -> stub [stub]
 ip address 10.254.0.33/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.9
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n7 -> n11
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n7 -> n1
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n7 -> n5
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n7 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n7 -> n9
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n7 -> n10
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n7 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
