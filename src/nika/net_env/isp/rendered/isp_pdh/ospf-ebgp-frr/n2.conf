! Global address families
  address-family ipv4





    neighbor 10.0.0.17 route-map BGP-IN in
    neighbor 10.0.0.17 route-map BGP-OUT out

    neighbor 10.0.0.49 route-map BGP-IN in
    neighbor 10.0.0.49 route-map BGP-OUT out

    neighbor 10.0.0.56 route-map BGP-IN in
    neighbor 10.0.0.56 route-map BGP-OUT out

    neighbor 10.0.0.64 route-map BGP-IN in
    neighbor 10.0.0.64 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.5 route-map BGP-IN in
  neighbor 10.255.0.6 route-map BGP-IN in
  neighbor 10.255.0.7 route-map BGP-IN in
  neighbor 10.255.0.8 route-map BGP-IN in
