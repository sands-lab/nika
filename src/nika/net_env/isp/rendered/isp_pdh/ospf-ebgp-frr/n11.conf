 no shutdown
 description n11 -> n9 [passive]
 ip address 10.0.0.46/31
!
interface eth4
 no shutdown
 description n11 -> n2 [passive]
 ip address 10.0.0.64/31
!
interface eth5
 no shutdown
 description n11 -> n3 [passive]
 ip address 10.0.0.66/31
