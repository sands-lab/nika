#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.3
  bgp cluster-id 10.255.0.3
!
  neighbor 10.0.0.3 remote-as 65001
  neighbor 10.0.0.3 description n7
!
  neighbor 10.0.0.5 remote-as 65001
  neighbor 10.0.0.5 description n8
!
  neighbor 10.0.0.44 remote-as 65001
  neighbor 10.0.0.44 description n10
!
  neighbor 10.0.0.47 remote-as 65001
  neighbor 10.0.0.47 description n9
!
  neighbor 10.0.0.65 remote-as 65002
  neighbor 10.0.0.65 description n2
!
  neighbor 10.0.0.67 remote-as 65002
  neighbor 10.0.0.67 description n3
!
 address-family ipv4 unicast
!

  network 198.51.110.0/24
  network 198.51.102.0/24
!
  neighbor 10.0.0.3 activate
  no neighbor 10.0.0.3 send-community all
  neighbor 10.0.0.3 send-community standard
  neighbor 10.0.0.3 send-community large
!
  neighbor 10.0.0.5 activate
  no neighbor 10.0.0.5 send-community all
  neighbor 10.0.0.5 send-community standard
  neighbor 10.0.0.5 send-community large
!
  neighbor 10.0.0.44 activate
  no neighbor 10.0.0.44 send-community all
  neighbor 10.0.0.44 send-community standard
  neighbor 10.0.0.44 send-community large
!
  neighbor 10.0.0.47 activate
  no neighbor 10.0.0.47 send-community all
  neighbor 10.0.0.47 send-community standard
  neighbor 10.0.0.47 send-community large
!
  neighbor 10.0.0.65 activate
  no neighbor 10.0.0.65 send-community all
  neighbor 10.0.0.65 send-community standard
  neighbor 10.0.0.65 send-community large
!
  neighbor 10.0.0.67 activate
  no neighbor 10.0.0.67 send-community all
  neighbor 10.0.0.67 send-community standard
  neighbor 10.0.0.67 send-community large
!
!
