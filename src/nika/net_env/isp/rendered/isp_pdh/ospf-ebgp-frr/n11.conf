!
! Global address families
  address-family ipv4

    neighbor 10.0.0.3 route-map BGP-IN in
    neighbor 10.0.0.3 route-map BGP-OUT out

    neighbor 10.0.0.5 route-map BGP-IN in
    neighbor 10.0.0.5 route-map BGP-OUT out

    neighbor 10.0.0.44 route-map BGP-IN in
    neighbor 10.0.0.44 route-map BGP-OUT-AS65001 out

    neighbor 10.0.0.47 route-map BGP-IN in
    neighbor 10.0.0.47 route-map BGP-OUT out

    neighbor 10.0.0.65 route-map BGP-IN in
    neighbor 10.0.0.65 route-map BGP-OUT out

    neighbor 10.0.0.67 route-map BGP-IN in
    neighbor 10.0.0.67 route-map BGP-OUT out

