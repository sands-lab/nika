#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.10
!
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 description n1
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.0.0.4 remote-as 65003
  neighbor 10.0.0.4 description n11
!
  neighbor 10.0.0.16 remote-as 65002
  neighbor 10.0.0.16 description n2
!
  neighbor 10.0.0.36 remote-as 65002
  neighbor 10.0.0.36 description n5
!
  neighbor 10.0.0.38 remote-as 65002
  neighbor 10.0.0.38 description n6
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.0.0.4 activate
  no neighbor 10.0.0.4 send-community all
  neighbor 10.0.0.4 send-community standard
  neighbor 10.0.0.4 send-community large
!
  neighbor 10.0.0.16 activate
  no neighbor 10.0.0.16 send-community all
  neighbor 10.0.0.16 send-community standard
  neighbor 10.0.0.16 send-community large
!
  neighbor 10.0.0.36 activate
  no neighbor 10.0.0.36 send-community all
  neighbor 10.0.0.36 send-community standard
  neighbor 10.0.0.36 send-community large
!
  neighbor 10.0.0.38 activate
  no neighbor 10.0.0.38 send-community all
  neighbor 10.0.0.38 send-community standard
  neighbor 10.0.0.38 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65001
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.4 route-map BGP-IN in
    neighbor 10.0.0.4 route-map BGP-OUT out

    neighbor 10.0.0.16 route-map BGP-IN in
    neighbor 10.0.0.16 route-map BGP-OUT out

    neighbor 10.0.0.36 route-map BGP-IN in
    neighbor 10.0.0.36 route-map BGP-OUT out

    neighbor 10.0.0.38 route-map BGP-IN in
    neighbor 10.0.0.38 route-map BGP-OUT out

!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
 exit-address-family
!
