#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.11
!
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 description n1
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.0.0.46 remote-as 65003
  neighbor 10.0.0.46 description n11
!
  neighbor 10.0.0.48 remote-as 65002
  neighbor 10.0.0.48 description n2
!
  neighbor 10.0.0.50 remote-as 65002
  neighbor 10.0.0.50 description n6
!
 address-family ipv4 unicast
!

  network 198.51.100.0/24
!
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.0.0.46 activate
  no neighbor 10.0.0.46 send-community all
  neighbor 10.0.0.46 send-community standard
  neighbor 10.0.0.46 send-community large
!
  neighbor 10.0.0.48 activate
  no neighbor 10.0.0.48 send-community all
  neighbor 10.0.0.48 send-community standard
  neighbor 10.0.0.48 send-community large
!
  neighbor 10.0.0.50 activate
  no neighbor 10.0.0.50 send-community all
  neighbor 10.0.0.50 send-community standard
  neighbor 10.0.0.50 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65001
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.46 route-map BGP-IN in
    neighbor 10.0.0.46 route-map BGP-OUT out

    neighbor 10.0.0.48 route-map BGP-IN in
    neighbor 10.0.0.48 route-map BGP-OUT out

    neighbor 10.0.0.50 route-map BGP-IN in
    neighbor 10.0.0.50 route-map BGP-OUT out

!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
 exit-address-family
!
