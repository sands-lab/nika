- operation: update
  path: /routing-policy/prefix-set[name=BUSINESS]
  value:
    prefix:
    - ip-prefix: 203.0.113.0/24
      mask-length-range: exact
    - ip-prefix: 203.0.114.0/24
      mask-length-range: exact
    - ip-prefix: 203.0.115.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.100.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.101.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.102.0/24
      mask-length-range: exact
- operation: update
  path: /routing-policy/policy[name=BGP-IN]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: rpe_10
      match:
        prefix-set: BUSINESS
      action:
        policy-result: accept
- operation: update
  path: /routing-policy/policy[name=BGP-OUT]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: rpe_10
      match:
        prefix-set: BUSINESS
      action:
        policy-result: accept
- operation: update
  path: /network-instance[name=default]/protocols/isis
  value:
    instance:
    - name: default
      admin-state: enable
      net:
      - 49.0001.0000.0aff.000a.00
      level-capability: L2
      interface:
      - interface-name: system0.0
        passive: true
        ipv4-unicast:
          admin-state: enable
        ipv6-unicast:
          admin-state: disable
      - interface-name: ethernet-1/1.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/2.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/3.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/4.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/5.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/6.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/7.0
        circuit-type: point-to-point
        passive: false
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 10
      - interface-name: ethernet-1/8.0
