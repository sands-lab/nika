      - interface-name: ethernet-1/9.0
        circuit-type: broadcast
        passive: true
        ipv4-unicast:
          admin-state: enable
          enable-bfd: false
        level:
        - level-number: 1
          disable: true
        - level-number: 2
          metric: 1
- operation: update
  path: /routing-policy/policy[name=accept_all]
  value:
    default-action:
      policy-result: accept
- operation: update
  path: /routing-policy/community-set[name=ibgp-mark]
  value:
    member:
    - 65536:0:65536
- operation: update
  path: /routing-policy/policy[name=ibgp-mark]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: mark-ibgp-routes
      action:
        bgp:
          communities:
            add: ibgp-mark
        policy-result: accept
- operation: update
  path: /routing-policy/prefix-set[name=default_bgp_advertise]
  value:
    prefix: []
- operation: update
  path: /routing-policy/policy[name=default_bgp_export]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: prefixes
      match:
        prefix-set: default_bgp_advertise
      action:
        policy-result: next-policy
    - name: bgp
      match:
        protocol: bgp
      action:
        policy-result: next-policy
        bgp:
          communities:
            remove: ibgp-mark
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    admin-state: enable
    autonomous-system: 65000
    router-id: 10.255.0.10
    ebgp-default-policy:
      export-reject-all: false
      import-reject-all: false
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
- operation: update
  path: /routing-policy/prefix-set[name=default_bgp_advertise]
  value:
    prefix:
    - ip-prefix: 203.0.114.0/24
      mask-length-range: exact
- operation: update
  path: /network-instance[name=default]/protocols/bgp/group[group-name=ibgp-ipv4]
  value:
    admin-state: enable
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
      import-policy:
      - ibgp-mark
      export-policy:
      - default_bgp_export
      - accept_all
    - afi-safi-name: ipv6-unicast
      admin-state: disable
    timers:
      connect-retry: 10
      _annotate_connect-retry: Reduce default 120s to 10s
      minimum-advertisement-interval: 1
    send-community:
      standard: true
      large: true
    peer-as: 65000
    transport:
      local-address: 10.255.0.10
    next-hop-self: false
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    neighbor:
    - peer-address: 10.255.0.1
      description: n1
      peer-group: ibgp-ipv4
      afi-safi:
      - afi-safi-name: ipv4-unicast
        admin-state: enable
      - afi-safi-name: ipv6-unicast
        admin-state: disable
- operation: update
  path: /network-instance[name=default]/protocols/bgp/group[group-name=ibgp-ipv4]
  value:
    admin-state: enable
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
      import-policy:
      - ibgp-mark
      export-policy:
      - default_bgp_export
      - accept_all
    - afi-safi-name: ipv6-unicast
      admin-state: disable
    timers:
      connect-retry: 10
      _annotate_connect-retry: Reduce default 120s to 10s
      minimum-advertisement-interval: 1
    send-community:
      standard: true
      large: true
    peer-as: 65000
    transport:
      local-address: 10.255.0.10
    next-hop-self: false
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    neighbor:
    - peer-address: 10.255.0.2
      description: n10
      peer-group: ibgp-ipv4
      afi-safi:
      - afi-safi-name: ipv4-unicast
        admin-state: enable
      - afi-safi-name: ipv6-unicast
        admin-state: disable
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.1]/afi-safi[afi-safi-name=ipv4-unicast]/import-policy
  value:
  - BGP-IN
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.1]/afi-safi[afi-safi-name=ipv4-unicast]/export-policy
  value:
  - default_bgp_export
  - BGP-OUT
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.2]/afi-safi[afi-safi-name=ipv4-unicast]/import-policy
  value:
  - BGP-IN
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.2]/afi-safi[afi-safi-name=ipv4-unicast]/export-policy
  value:
  - default_bgp_export
  - BGP-OUT
