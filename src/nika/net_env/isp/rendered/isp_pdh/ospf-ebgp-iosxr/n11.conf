hostname n11
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host n1 10.255.0.1
domain ipv4 host n10 10.255.0.2
domain ipv4 host n2 10.255.0.4
domain ipv4 host n3 10.255.0.5
domain ipv4 host n4 10.255.0.6
domain ipv4 host n5 10.255.0.7
domain ipv4 host n6 10.255.0.8
domain ipv4 host n7 10.255.0.9
domain ipv4 host n8 10.255.0.10
domain ipv4 host n9 10.255.0.11
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.3 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description n11 -> n7 [passive]
 ipv4 address 10.0.0.2 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description n11 -> n8 [passive]
 ipv4 address 10.0.0.4 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description n11 -> n10 [passive]
 ipv4 address 10.0.0.45 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description n11 -> n9 [passive]
 ipv4 address 10.0.0.46 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description n11 -> n2 [passive]
 ipv4 address 10.0.0.64 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description n11 -> n3 [passive]
 ipv4 address 10.0.0.66 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description n11 -> stub [stub]
 ipv4 address 198.51.110.1 255.255.255.0
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description n11 -> stub [stub]
 ipv4 address 10.254.0.9 255.255.255.252
!
interface Loopback1
 no shutdown
 description n11 -> stub
 ipv4 address 198.51.102.1 255.255.255.0
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
prefix-set CUSTOMERS
  198.51.110.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
    done
  endif
  if destination in CUSTOMERS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT-AS65001
  if destination in BUSINESS then
    pass
    done
  endif
  if destination in CUSTOMERS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.3

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   passive enable
   cost 1

!
!
router bgp 65003
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.3
 bgp cluster-id 10.255.0.3

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
  network 198.51.110.0/24
  network 198.51.102.0/24
!
 neighbor 10.0.0.3
  remote-as 65001
  description n7
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.5
  remote-as 65001
  description n8
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.44
  remote-as 65001
  description n10
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.47
  remote-as 65001
  description n9
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.65
  remote-as 65002
  description n2
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.67
  remote-as 65002
  description n3
  address-family ipv4 unicast
   send-community-ebgp

!
!
!
router bgp 65003
!
  neighbor 10.0.0.3
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.5
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.44
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT-AS65001 out

  neighbor 10.0.0.47
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.65
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.67
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

