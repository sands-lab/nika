hostname n2
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host n1 10.255.0.1
domain ipv4 host n10 10.255.0.2
domain ipv4 host n11 10.255.0.3
domain ipv4 host n3 10.255.0.5
domain ipv4 host n4 10.255.0.6
domain ipv4 host n5 10.255.0.7
domain ipv4 host n6 10.255.0.8
domain ipv4 host n7 10.255.0.9
domain ipv4 host n8 10.255.0.10
domain ipv4 host n9 10.255.0.11
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.4 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description n2 -> n3 [internal]
 ipv4 address 10.0.0.6 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description n2 -> n4 [internal]
 ipv4 address 10.0.0.10 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description n2 -> n5 [internal]
 ipv4 address 10.0.0.12 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description n2 -> n6 [internal]
 ipv4 address 10.0.0.14 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description n2 -> n8 [passive]
 ipv4 address 10.0.0.16 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description n2 -> n9 [passive]
 ipv4 address 10.0.0.48 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description n2 -> n10 [passive]
 ipv4 address 10.0.0.57 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description n2 -> n11 [passive]
 ipv4 address 10.0.0.65 255.255.255.254
!
interface GigabitEthernet0/0/0/8
 no shutdown
 description n2 -> stub [stub]
 ipv4 address 10.254.0.13 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.4

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/7
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/8
   passive enable
   cost 1

!
!
router bgp 65002
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.4
 bgp cluster-id 10.255.0.4

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.5
  remote-as 65002
  description n3
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.6
  remote-as 65002
  description n4
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.7
  remote-as 65002
  description n5
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.8
  remote-as 65002
  description n6
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.0.0.17
  remote-as 65001
  description n8
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.49
  remote-as 65001
  description n9
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.56
  remote-as 65001
  description n10
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.64
  remote-as 65003
  description n11
  address-family ipv4 unicast
   send-community-ebgp

!
!
!
router bgp 65002
!
  neighbor 10.255.0.5
    address-family ipv4 unicast

  neighbor 10.255.0.6
    address-family ipv4 unicast

  neighbor 10.255.0.7
    address-family ipv4 unicast

  neighbor 10.255.0.8
    address-family ipv4 unicast

  neighbor 10.0.0.17
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.49
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.56
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.64
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out


router bgp 65002
 neighbor 10.255.0.5
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.6
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.7
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.8
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
