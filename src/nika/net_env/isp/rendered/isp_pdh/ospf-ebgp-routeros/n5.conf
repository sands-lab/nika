/routing/filter/rule/add chain=filter_10_0_0_35 rule="jump rm_large_communities;" place-before=0
/routing/filter/rule/add chain=filter_10_0_0_35 rule="jump rm_extended_communities;" place-before=0

/routing/bgp/connection add template=main instance=main name=10_0_0_37 remote.address=10.0.0.37 remote.as=65001 comment="n8" local.role=ebgp
