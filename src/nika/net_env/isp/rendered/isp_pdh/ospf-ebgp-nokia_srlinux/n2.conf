- operation: update
  path: /routing-policy/prefix-set[name=BUSINESS]
  value:
    prefix:
    - ip-prefix: 203.0.113.0/24
      mask-length-range: exact
    - ip-prefix: 203.0.114.0/24
      mask-length-range: exact
    - ip-prefix: 203.0.115.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.100.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.101.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.102.0/24
      mask-length-range: exact
- operation: update
  path: /routing-policy/policy[name=BGP-IN]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: rpe_10
      match:
        prefix-set: BUSINESS
      action:
        policy-result: accept
- operation: update
  path: /routing-policy/policy[name=BGP-OUT]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: rpe_10
      match:
        prefix-set: BUSINESS
      action:
        policy-result: accept
- operation: update
  path: /network-instance[name=default]
  value:
    router-id: 10.255.0.4
    protocols:
      ospf:
        instance:
        - name: '1'
          version: ospf-v2
          admin-state: enable
          max-ecmp-paths: 64
          area:
          - area-id: 0.0.0.0
            interface:
            - interface-name: system0.0
              passive: true
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/1.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/2.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/3.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/4.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/5.0
              passive: true
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/6.0
              passive: true
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
