- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.2]/afi-safi[afi-safi-name=ipv4-unicast]/import-policy
  value:
  - BGP-IN
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.2]/afi-safi[afi-safi-name=ipv4-unicast]/export-policy
  value:
  - default_bgp_export
  - BGP-OUT
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.9]/afi-safi[afi-safi-name=ipv4-unicast]/import-policy
  value:
  - BGP-IN
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.255.0.9]/afi-safi[afi-safi-name=ipv4-unicast]/export-policy
