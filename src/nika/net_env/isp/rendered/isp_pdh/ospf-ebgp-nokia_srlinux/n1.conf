    send-community:
      standard: true
      large: true
    peer-as: 65001
    transport:
      local-address: 10.255.0.1
    route-reflector:
      cluster-id: 10.255.0.1
      client: true
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    neighbor:
    - peer-address: 10.255.0.9
