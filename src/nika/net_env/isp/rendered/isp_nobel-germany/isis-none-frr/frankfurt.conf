hostname frankfurt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.6/32
!
interface eth0
 no shutdown
 description frankfurt -> hannover [internal]
 ip address 10.0.0.8/31
!
interface eth1
 no shutdown
 description frankfurt -> koeln [internal]
 ip address 10.0.0.10/31
!
interface eth2
 no shutdown
 description frankfurt -> leipzig [internal]
 ip address 10.0.0.12/31
!
interface eth3
 no shutdown
 description frankfurt -> mannheim [internal]
 ip address 10.0.0.14/31
!
interface eth4
 no shutdown
 description frankfurt -> nuernberg [internal]
 ip address 10.0.0.16/31
!
interface eth5
 no shutdown
 description frankfurt -> stub [stub]
 ip address 10.254.0.21/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0006.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! frankfurt -> hannover
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! frankfurt -> koeln
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! frankfurt -> leipzig
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! frankfurt -> mannheim
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! frankfurt -> nuernberg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! frankfurt -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
