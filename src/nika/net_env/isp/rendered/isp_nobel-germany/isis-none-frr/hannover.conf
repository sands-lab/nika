hostname hannover
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.8/32
!
interface eth0
 no shutdown
 description hannover -> frankfurt [internal]
 ip address 10.0.0.9/31
!
interface eth1
 no shutdown
 description hannover -> hamburg [internal]
 ip address 10.0.0.19/31
!
interface eth2
 no shutdown
 description hannover -> leipzig [internal]
 ip address 10.0.0.20/31
!
interface eth3
 no shutdown
 description hannover -> berlin [internal]
 ip address 10.0.0.23/31
!
interface eth4
 no shutdown
 description hannover -> bremen [internal]
 ip address 10.0.0.43/31
!
interface eth5
 no shutdown
 description hannover -> dortmund [internal]
 ip address 10.0.0.49/31
!
interface eth6
 no shutdown
 description hannover -> stub [stub]
 ip address 10.254.0.29/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0008.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! hannover -> frankfurt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! hannover -> hamburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! hannover -> leipzig
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! hannover -> berlin
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! hannover -> bremen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! hannover -> dortmund
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth6
! hannover -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
