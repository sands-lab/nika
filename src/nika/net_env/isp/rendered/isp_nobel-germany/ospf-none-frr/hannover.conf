hostname hannover
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.8/32
!
interface eth0
 no shutdown
 description hannover -> frankfurt [internal]
 ip address 10.0.0.9/31
!
interface eth1
 no shutdown
 description hannover -> hamburg [internal]
 ip address 10.0.0.19/31
!
interface eth2
 no shutdown
 description hannover -> leipzig [internal]
 ip address 10.0.0.20/31
!
interface eth3
 no shutdown
 description hannover -> berlin [internal]
 ip address 10.0.0.23/31
!
interface eth4
 no shutdown
 description hannover -> bremen [internal]
 ip address 10.0.0.43/31
!
interface eth5
 no shutdown
 description hannover -> dortmund [internal]
 ip address 10.0.0.49/31
!
interface eth6
 no shutdown
 description hannover -> stub [stub]
 ip address 10.254.0.29/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.8
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! hannover -> frankfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! hannover -> hamburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! hannover -> leipzig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! hannover -> berlin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! hannover -> bremen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! hannover -> dortmund
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! hannover -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
