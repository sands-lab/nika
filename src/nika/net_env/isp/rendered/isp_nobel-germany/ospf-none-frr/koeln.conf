hostname koeln
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description koeln -> duesseldorf [internal]
 ip address 10.0.0.7/31
!
interface eth1
 no shutdown
 description koeln -> frankfurt [internal]
 ip address 10.0.0.11/31
!
interface eth2
 no shutdown
 description koeln -> dortmund [internal]
 ip address 10.0.0.51/31
!
interface eth3
 no shutdown
 description koeln -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.10
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! koeln -> duesseldorf
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! koeln -> frankfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! koeln -> dortmund
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! koeln -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
