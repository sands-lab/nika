hostname mannheim
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.12/32
!
interface eth0
 no shutdown
 description mannheim -> frankfurt [internal]
 ip address 10.0.0.15/31
!
interface eth1
 no shutdown
 description mannheim -> karlsruhe [internal]
 ip address 10.0.0.25/31
!
interface eth2
 no shutdown
 description mannheim -> stub [stub]
 ip address 10.254.0.45/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.12
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! mannheim -> frankfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! mannheim -> karlsruhe
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! mannheim -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
