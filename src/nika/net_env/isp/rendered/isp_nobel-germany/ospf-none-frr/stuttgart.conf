hostname stuttgart
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.16/32
!
interface eth0
 no shutdown
 description stuttgart -> karlsruhe [internal]
 ip address 10.0.0.27/31
!
interface eth1
 no shutdown
 description stuttgart -> nuernberg [internal]
 ip address 10.0.0.35/31
!
interface eth2
 no shutdown
 description stuttgart -> ulm [internal]
 ip address 10.0.0.36/31
!
interface eth3
 no shutdown
 description stuttgart -> stub [stub]
 ip address 10.254.0.61/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.16
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! stuttgart -> karlsruhe
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! stuttgart -> nuernberg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! stuttgart -> ulm
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! stuttgart -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
