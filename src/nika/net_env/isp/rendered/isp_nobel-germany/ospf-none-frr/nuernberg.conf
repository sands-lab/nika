hostname nuernberg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.15/32
!
interface eth0
 no shutdown
 description nuernberg -> frankfurt [internal]
 ip address 10.0.0.17/31
!
interface eth1
 no shutdown
 description nuernberg -> leipzig [internal]
 ip address 10.0.0.29/31
!
interface eth2
 no shutdown
 description nuernberg -> muenchen [internal]
 ip address 10.0.0.31/31
!
interface eth3
 no shutdown
 description nuernberg -> stuttgart [internal]
 ip address 10.0.0.34/31
!
interface eth4
 no shutdown
 description nuernberg -> stub [stub]
 ip address 10.254.0.57/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.15
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! nuernberg -> frankfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! nuernberg -> leipzig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! nuernberg -> muenchen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! nuernberg -> stuttgart
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! nuernberg -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
