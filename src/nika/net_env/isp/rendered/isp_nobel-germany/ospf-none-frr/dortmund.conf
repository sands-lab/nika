hostname dortmund
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.3/32
!
interface eth0
 no shutdown
 description dortmund -> norden [internal]
 ip address 10.0.0.2/31
!
interface eth1
 no shutdown
 description dortmund -> essen [internal]
 ip address 10.0.0.46/31
!
interface eth2
 no shutdown
 description dortmund -> hannover [internal]
 ip address 10.0.0.48/31
!
interface eth3
 no shutdown
 description dortmund -> koeln [internal]
 ip address 10.0.0.50/31
!
interface eth4
 no shutdown
 description dortmund -> stub [stub]
 ip address 10.254.0.9/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.3
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! dortmund -> norden
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! dortmund -> essen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! dortmund -> hannover
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! dortmund -> koeln
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! dortmund -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
