hostname n4
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description n4 -> n3 [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description n4 -> n7 [internal]
 ip address 10.0.0.20/31
!
interface eth2
 no shutdown
 description n4 -> n8 [internal]
 ip address 10.0.0.24/31
!
interface eth3
 no shutdown
 description n4 -> n9 [internal]
 ip address 10.0.0.26/31
!
interface eth4
 no shutdown
 description n4 -> n10 [internal]
 ip address 10.0.0.29/31
!
interface eth5
 no shutdown
 description n4 -> n11 [internal]
 ip address 10.0.0.31/31
!
interface eth6
 no shutdown
 description n4 -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000b.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n4 -> n3
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n4 -> n7
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n4 -> n8
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n4 -> n9
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n4 -> n10
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n4 -> n11
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth6
! n4 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
