hostname n5
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.12/32
!
interface eth0
 no shutdown
 description n5 -> n1 [internal]
 ip address 10.0.0.23/31
!
interface eth1
 no shutdown
 description n5 -> n12 [internal]
 ip address 10.0.0.33/31
!
interface eth2
 no shutdown
 description n5 -> n13 [internal]
 ip address 10.0.0.35/31
!
interface eth3
 no shutdown
 description n5 -> n15 [internal]
 ip address 10.0.0.37/31
!
interface eth4
 no shutdown
 description n5 -> n2 [internal]
 ip address 10.0.0.97/31
!
interface eth5
 no shutdown
 description n5 -> stub [stub]
 ip address 10.254.0.45/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000c.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n5 -> n1
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n5 -> n12
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n5 -> n13
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n5 -> n15
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n5 -> n2
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n5 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
