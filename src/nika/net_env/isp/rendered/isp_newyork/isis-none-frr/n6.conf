hostname n6
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.13/32
!
interface eth0
 no shutdown
 description n6 -> n2 [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description n6 -> n3 [internal]
 ip address 10.0.0.13/31
!
interface eth2
 no shutdown
 description n6 -> n7 [internal]
 ip address 10.0.0.38/31
!
interface eth3
 no shutdown
 description n6 -> n8 [internal]
 ip address 10.0.0.40/31
!
interface eth4
 no shutdown
 description n6 -> n1 [internal]
 ip address 10.0.0.45/31
!
interface eth5
 no shutdown
 description n6 -> stub [stub]
 ip address 10.254.0.49/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000d.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n6 -> n2
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n6 -> n3
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n6 -> n7
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! n6 -> n8
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! n6 -> n1
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! n6 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
