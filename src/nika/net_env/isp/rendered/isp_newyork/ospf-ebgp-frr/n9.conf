#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.16
!
  neighbor 10.255.0.2 remote-as 65002
  neighbor 10.255.0.2 description n10
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.0.0.46 remote-as 65001
  neighbor 10.0.0.46 description n7
!
  neighbor 10.0.0.62 remote-as 65003
  neighbor 10.0.0.62 description n14
!
  neighbor 10.0.0.64 remote-as 65001
  neighbor 10.0.0.64 description n15
!
  neighbor 10.0.0.68 remote-as 65003
  neighbor 10.0.0.68 description n16
!
 address-family ipv4 unicast
!

  network 198.51.110.0/24
  network 198.51.101.0/24
!
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
  neighbor 10.0.0.46 activate
  no neighbor 10.0.0.46 send-community all
  neighbor 10.0.0.46 send-community standard
  neighbor 10.0.0.46 send-community large
!
  neighbor 10.0.0.62 activate
  no neighbor 10.0.0.62 send-community all
  neighbor 10.0.0.62 send-community standard
  neighbor 10.0.0.62 send-community large
!
  neighbor 10.0.0.64 activate
  no neighbor 10.0.0.64 send-community all
  neighbor 10.0.0.64 send-community standard
  neighbor 10.0.0.64 send-community large
!
  neighbor 10.0.0.68 activate
  no neighbor 10.0.0.68 send-community all
  neighbor 10.0.0.68 send-community standard
  neighbor 10.0.0.68 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.46 route-map BGP-IN in
    neighbor 10.0.0.46 route-map BGP-OUT out

    neighbor 10.0.0.62 route-map BGP-IN in
    neighbor 10.0.0.62 route-map BGP-OUT-AS65003 out

    neighbor 10.0.0.64 route-map BGP-IN in
    neighbor 10.0.0.64 route-map BGP-OUT out

    neighbor 10.0.0.68 route-map BGP-IN in
    neighbor 10.0.0.68 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
 exit-address-family
!
