#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.14
!
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 description n1
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.0.0.14 remote-as 65002
  neighbor 10.0.0.14 description n3
!
  neighbor 10.0.0.20 remote-as 65002
  neighbor 10.0.0.20 description n4
!
  neighbor 10.0.0.47 remote-as 65002
  neighbor 10.0.0.47 description n9
!
  neighbor 10.0.0.48 remote-as 65002
  neighbor 10.0.0.48 description n10
!
  neighbor 10.0.0.54 remote-as 65003
  neighbor 10.0.0.54 description n14
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.0.0.14 activate
  no neighbor 10.0.0.14 send-community all
  neighbor 10.0.0.14 send-community standard
  neighbor 10.0.0.14 send-community large
!
  neighbor 10.0.0.20 activate
  no neighbor 10.0.0.20 send-community all
  neighbor 10.0.0.20 send-community standard
  neighbor 10.0.0.20 send-community large
!
  neighbor 10.0.0.47 activate
  no neighbor 10.0.0.47 send-community all
  neighbor 10.0.0.47 send-community standard
  neighbor 10.0.0.47 send-community large
!
  neighbor 10.0.0.48 activate
  no neighbor 10.0.0.48 send-community all
  neighbor 10.0.0.48 send-community standard
  neighbor 10.0.0.48 send-community large
!
  neighbor 10.0.0.54 activate
  no neighbor 10.0.0.54 send-community all
  neighbor 10.0.0.54 send-community standard
  neighbor 10.0.0.54 send-community large
