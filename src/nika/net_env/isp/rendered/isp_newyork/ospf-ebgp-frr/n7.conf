#!/usr/bin/vtysh -f

!
router bgp 65001
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.14 route-map BGP-IN in
    neighbor 10.0.0.14 route-map BGP-OUT out

    neighbor 10.0.0.20 route-map BGP-IN in
    neighbor 10.0.0.20 route-map BGP-OUT out

    neighbor 10.0.0.47 route-map BGP-IN in
    neighbor 10.0.0.47 route-map BGP-OUT out

    neighbor 10.0.0.48 route-map BGP-IN in
    neighbor 10.0.0.48 route-map BGP-OUT out

    neighbor 10.0.0.54 route-map BGP-IN in
    neighbor 10.0.0.54 route-map BGP-OUT out

!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
 exit-address-family
!
