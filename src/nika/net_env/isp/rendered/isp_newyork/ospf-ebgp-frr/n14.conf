#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.6
  bgp cluster-id 10.255.0.6
!
  neighbor 10.255.0.8 remote-as 65003
  neighbor 10.255.0.8 description n16
  neighbor 10.255.0.8 update-source lo
!
  neighbor 10.0.0.55 remote-as 65001
  neighbor 10.0.0.55 description n7
!
  neighbor 10.0.0.63 remote-as 65002
  neighbor 10.0.0.63 description n9
!
  neighbor 10.0.0.72 remote-as 65002
  neighbor 10.0.0.72 description n10
!
  neighbor 10.0.0.80 remote-as 65001
  neighbor 10.0.0.80 description n13
!
  neighbor 10.0.0.85 remote-as 65001
  neighbor 10.0.0.85 description n15
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.8 activate
  neighbor 10.255.0.8 next-hop-self
  neighbor 10.255.0.8 route-reflector-client
  no neighbor 10.255.0.8 send-community all
  neighbor 10.255.0.8 send-community standard
  neighbor 10.255.0.8 send-community large
  neighbor 10.255.0.8 send-community extended
!
