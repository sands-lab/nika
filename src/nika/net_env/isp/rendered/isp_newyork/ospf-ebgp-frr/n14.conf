#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.55 route-map BGP-IN in
    neighbor 10.0.0.55 route-map BGP-OUT out

    neighbor 10.0.0.63 route-map BGP-IN in
    neighbor 10.0.0.63 route-map BGP-OUT out

    neighbor 10.0.0.72 route-map BGP-IN in
    neighbor 10.0.0.72 route-map BGP-OUT out

    neighbor 10.0.0.80 route-map BGP-IN in
    neighbor 10.0.0.80 route-map BGP-OUT out

    neighbor 10.0.0.85 route-map BGP-IN in
    neighbor 10.0.0.85 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.8 route-map BGP-IN in
 exit-address-family
!
