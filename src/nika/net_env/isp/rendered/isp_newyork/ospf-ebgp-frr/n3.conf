hostname n3
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description n3 -> n4 [internal]
 ip address 10.0.0.10/31
!
interface eth1
 no shutdown
 description n3 -> n6 [passive]
 ip address 10.0.0.12/31
!
interface eth2
 no shutdown
 description n3 -> n7 [passive]
 ip address 10.0.0.14/31
!
interface eth3
 no shutdown
 description n3 -> n8 [passive]
 ip address 10.0.0.16/31
!
interface eth4
 no shutdown
 description n3 -> n11 [internal]
 ip address 10.0.0.19/31
!
interface eth5
 no shutdown
 description n3 -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.10
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n3 -> n4
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n3 -> n6
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! n3 -> n7
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! n3 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth4
! n3 -> n11
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n3 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.10
!
  neighbor 10.255.0.2 remote-as 65002
  neighbor 10.255.0.2 description n10
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.0.0.13 remote-as 65001
  neighbor 10.0.0.13 description n6
!
  neighbor 10.0.0.15 remote-as 65001
  neighbor 10.0.0.15 description n7
!
  neighbor 10.0.0.17 remote-as 65001
  neighbor 10.0.0.17 description n8
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
  neighbor 10.0.0.13 activate
  no neighbor 10.0.0.13 send-community all
  neighbor 10.0.0.13 send-community standard
  neighbor 10.0.0.13 send-community large
!
  neighbor 10.0.0.15 activate
  no neighbor 10.0.0.15 send-community all
  neighbor 10.0.0.15 send-community standard
  neighbor 10.0.0.15 send-community large
!
  neighbor 10.0.0.17 activate
  no neighbor 10.0.0.17 send-community all
  neighbor 10.0.0.17 send-community standard
  neighbor 10.0.0.17 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.13 route-map BGP-IN in
    neighbor 10.0.0.13 route-map BGP-OUT out

    neighbor 10.0.0.15 route-map BGP-IN in
    neighbor 10.0.0.15 route-map BGP-OUT out

    neighbor 10.0.0.17 route-map BGP-IN in
    neighbor 10.0.0.17 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
 exit-address-family
!
