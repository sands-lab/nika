hostname wuerzburg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.50/32
!
interface eth0
 no shutdown
 description wuerzburg -> erfurt [internal]
 ip address 10.0.0.57/31
!
interface eth1
 no shutdown
 description wuerzburg -> fulda [internal]
 ip address 10.0.0.131/31
!
interface eth2
 no shutdown
 description wuerzburg -> stuttgart [internal]
 ip address 10.0.0.143/31
!
interface eth3
 no shutdown
 description wuerzburg -> augsburg [internal]
 ip address 10.0.0.165/31
!
interface eth4
 no shutdown
 description wuerzburg -> nuernberg [internal]
 ip address 10.0.0.171/31
!
interface eth5
 no shutdown
 description wuerzburg -> stub [stub]
 ip address 10.254.0.197/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.50
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! wuerzburg -> erfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! wuerzburg -> fulda
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! wuerzburg -> stuttgart
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! wuerzburg -> augsburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! wuerzburg -> nuernberg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! wuerzburg -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
