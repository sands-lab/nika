hostname saarbruecken
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.43/32
!
interface eth0
 no shutdown
 description saarbruecken -> kaiserslautern [internal]
 ip address 10.0.0.123/31
!
interface eth1
 no shutdown
 description saarbruecken -> trier [internal]
 ip address 10.0.0.128/31
!
interface eth2
 no shutdown
 description saarbruecken -> karlsruhe [internal]
 ip address 10.0.0.135/31
!
interface eth3
 no shutdown
 description saarbruecken -> stub [stub]
 ip address 10.254.0.169/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.43
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! saarbruecken -> kaiserslautern
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! saarbruecken -> trier
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! saarbruecken -> karlsruhe
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! saarbruecken -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
