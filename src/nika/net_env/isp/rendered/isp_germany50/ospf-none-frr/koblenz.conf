hostname koblenz
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.29/32
!
interface eth0
 no shutdown
 description koblenz -> siegen [internal]
 ip address 10.0.0.10/31
!
interface eth1
 no shutdown
 description koblenz -> frankfurt [internal]
 ip address 10.0.0.13/31
!
interface eth2
 no shutdown
 description koblenz -> kaiserslautern [internal]
 ip address 10.0.0.15/31
!
interface eth3
 no shutdown
 description koblenz -> trier [internal]
 ip address 10.0.0.16/31
!
interface eth4
 no shutdown
 description koblenz -> koeln [internal]
 ip address 10.0.0.110/31
!
interface eth5
 no shutdown
 description koblenz -> stub [stub]
 ip address 10.254.0.113/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.29
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! koblenz -> siegen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! koblenz -> frankfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! koblenz -> kaiserslautern
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! koblenz -> trier
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! koblenz -> koeln
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! koblenz -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
