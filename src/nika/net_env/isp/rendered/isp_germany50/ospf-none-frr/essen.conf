hostname essen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.15/32
!
interface eth0
 no shutdown
 description essen -> duesseldorf [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description essen -> dortmund [internal]
 ip address 10.0.0.23/31
!
interface eth2
 no shutdown
 description essen -> wesel [internal]
 ip address 10.0.0.44/31
!
interface eth3
 no shutdown
 description essen -> stub [stub]
 ip address 10.254.0.57/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.15
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! essen -> duesseldorf
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! essen -> dortmund
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! essen -> wesel
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! essen -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
