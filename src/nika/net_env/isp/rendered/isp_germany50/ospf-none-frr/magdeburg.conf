hostname magdeburg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.33/32
!
interface eth0
 no shutdown
 description magdeburg -> berlin [internal]
 ip address 10.0.0.35/31
!
interface eth1
 no shutdown
 description magdeburg -> leipzig [internal]
 ip address 10.0.0.43/31
!
interface eth2
 no shutdown
 description magdeburg -> schwerin [internal]
 ip address 10.0.0.60/31
!
interface eth3
 no shutdown
 description magdeburg -> braunschweig [internal]
 ip address 10.0.0.71/31
!
interface eth4
 no shutdown
 description magdeburg -> stub [stub]
 ip address 10.254.0.129/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.33
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! magdeburg -> berlin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! magdeburg -> leipzig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! magdeburg -> schwerin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! magdeburg -> braunschweig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! magdeburg -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
