hostname darmstadt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description darmstadt -> frankfurt [internal]
 ip address 10.0.0.108/31
!
interface eth1
 no shutdown
 description darmstadt -> mannheim [internal]
 ip address 10.0.0.116/31
!
interface eth2
 no shutdown
 description darmstadt -> kaiserslautern [internal]
 ip address 10.0.0.118/31
!
interface eth3
 no shutdown
 description darmstadt -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.10
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! darmstadt -> frankfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! darmstadt -> mannheim
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! darmstadt -> kaiserslautern
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! darmstadt -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
