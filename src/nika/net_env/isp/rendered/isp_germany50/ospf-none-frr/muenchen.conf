hostname muenchen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.35/32
!
interface eth0
 no shutdown
 description muenchen -> augsburg [internal]
 ip address 10.0.0.153/31
!
interface eth1
 no shutdown
 description muenchen -> kempten [internal]
 ip address 10.0.0.157/31
!
interface eth2
 no shutdown
 description muenchen -> passau [internal]
 ip address 10.0.0.158/31
!
interface eth3
 no shutdown
 description muenchen -> nuernberg [internal]
 ip address 10.0.0.160/31
!
interface eth4
 no shutdown
 description muenchen -> regensburg [internal]
 ip address 10.0.0.162/31
!
interface eth5
 no shutdown
 description muenchen -> stub [stub]
 ip address 10.254.0.137/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.35
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! muenchen -> augsburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! muenchen -> kempten
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! muenchen -> passau
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! muenchen -> nuernberg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! muenchen -> regensburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! muenchen -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
