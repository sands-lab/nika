hostname dortmund
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description dortmund -> essen [internal]
 ip address 10.0.0.22/31
!
interface eth1
 no shutdown
 description dortmund -> muenster [internal]
 ip address 10.0.0.132/31
!
interface eth2
 no shutdown
 description dortmund -> siegen [internal]
 ip address 10.0.0.154/31
!
interface eth3
 no shutdown
 description dortmund -> kassel [internal]
 ip address 10.0.0.174/31
!
interface eth4
 no shutdown
 description dortmund -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.11
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! dortmund -> essen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! dortmund -> muenster
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! dortmund -> siegen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! dortmund -> kassel
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! dortmund -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
