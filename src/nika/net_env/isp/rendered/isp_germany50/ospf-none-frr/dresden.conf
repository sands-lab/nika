hostname dresden
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.12/32
!
interface eth0
 no shutdown
 description dresden -> berlin [internal]
 ip address 10.0.0.31/31
!
interface eth1
 no shutdown
 description dresden -> leipzig [internal]
 ip address 10.0.0.38/31
!
interface eth2
 no shutdown
 description dresden -> erfurt [internal]
 ip address 10.0.0.48/31
!
interface eth3
 no shutdown
 description dresden -> chemnitz [internal]
 ip address 10.0.0.51/31
!
interface eth4
 no shutdown
 description dresden -> stub [stub]
 ip address 10.254.0.45/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.12
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! dresden -> berlin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! dresden -> leipzig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! dresden -> erfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! dresden -> chemnitz
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! dresden -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
