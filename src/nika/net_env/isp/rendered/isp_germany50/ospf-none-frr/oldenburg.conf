hostname oldenburg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.39/32
!
interface eth0
 no shutdown
 description oldenburg -> wesel [internal]
 ip address 10.0.0.24/31
!
interface eth1
 no shutdown
 description oldenburg -> bremen [internal]
 ip address 10.0.0.79/31
!
interface eth2
 no shutdown
 description oldenburg -> norden [internal]
 ip address 10.0.0.87/31
!
interface eth3
 no shutdown
 description oldenburg -> osnabrueck [internal]
 ip address 10.0.0.90/31
!
interface eth4
 no shutdown
 description oldenburg -> stub [stub]
 ip address 10.254.0.153/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.39
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! oldenburg -> wesel
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! oldenburg -> bremen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! oldenburg -> norden
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! oldenburg -> osnabrueck
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! oldenburg -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
