hostname braunschweig
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.6/32
!
interface eth0
 no shutdown
 description braunschweig -> magdeburg [internal]
 ip address 10.0.0.70/31
!
interface eth1
 no shutdown
 description braunschweig -> hamburg [internal]
 ip address 10.0.0.76/31
!
interface eth2
 no shutdown
 description braunschweig -> hannover [internal]
 ip address 10.0.0.96/31
!
interface eth3
 no shutdown
 description braunschweig -> bielefeld [internal]
 ip address 10.0.0.101/31
!
interface eth4
 no shutdown
 description braunschweig -> kassel [internal]
 ip address 10.0.0.102/31
!
interface eth5
 no shutdown
 description braunschweig -> stub [stub]
 ip address 10.254.0.21/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.6
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! braunschweig -> magdeburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! braunschweig -> hamburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! braunschweig -> hannover
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! braunschweig -> bielefeld
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! braunschweig -> kassel
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! braunschweig -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
