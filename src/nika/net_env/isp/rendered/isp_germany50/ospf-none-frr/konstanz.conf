hostname konstanz
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.31/32
!
interface eth0
 no shutdown
 description konstanz -> stuttgart [internal]
 ip address 10.0.0.140/31
!
interface eth1
 no shutdown
 description konstanz -> freiburg [internal]
 ip address 10.0.0.149/31
!
interface eth2
 no shutdown
 description konstanz -> kempten [internal]
 ip address 10.0.0.151/31
!
interface eth3
 no shutdown
 description konstanz -> stub [stub]
 ip address 10.254.0.121/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.31
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! konstanz -> stuttgart
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! konstanz -> freiburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! konstanz -> kempten
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! konstanz -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
