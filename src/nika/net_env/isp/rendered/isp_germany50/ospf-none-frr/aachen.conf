hostname aachen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description aachen -> wesel [internal]
 ip address 10.0.0.2/31
!
interface eth1
 no shutdown
 description aachen -> trier [internal]
 ip address 10.0.0.4/31
!
interface eth2
 no shutdown
 description aachen -> koeln [internal]
 ip address 10.0.0.88/31
!
interface eth3
 no shutdown
 description aachen -> stub [stub]
 ip address 10.254.0.1/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.1
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! aachen -> wesel
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! aachen -> trier
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! aachen -> koeln
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! aachen -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
