hostname erfurt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.14/32
!
interface eth0
 no shutdown
 description erfurt -> leipzig [internal]
 ip address 10.0.0.40/31
!
interface eth1
 no shutdown
 description erfurt -> dresden [internal]
 ip address 10.0.0.49/31
!
interface eth2
 no shutdown
 description erfurt -> chemnitz [internal]
 ip address 10.0.0.53/31
!
interface eth3
 no shutdown
 description erfurt -> kassel [internal]
 ip address 10.0.0.54/31
!
interface eth4
 no shutdown
 description erfurt -> wuerzburg [internal]
 ip address 10.0.0.56/31
!
interface eth5
 no shutdown
 description erfurt -> stub [stub]
 ip address 10.254.0.53/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.14
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! erfurt -> leipzig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! erfurt -> dresden
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! erfurt -> chemnitz
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! erfurt -> kassel
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! erfurt -> wuerzburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! erfurt -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
