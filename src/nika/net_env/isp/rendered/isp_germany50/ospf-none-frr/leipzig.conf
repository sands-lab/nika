hostname leipzig
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.32/32
!
interface eth0
 no shutdown
 description leipzig -> berlin [internal]
 ip address 10.0.0.29/31
!
interface eth1
 no shutdown
 description leipzig -> dresden [internal]
 ip address 10.0.0.39/31
!
interface eth2
 no shutdown
 description leipzig -> erfurt [internal]
 ip address 10.0.0.41/31
!
interface eth3
 no shutdown
 description leipzig -> magdeburg [internal]
 ip address 10.0.0.42/31
!
interface eth4
 no shutdown
 description leipzig -> bayreuth [internal]
 ip address 10.0.0.47/31
!
interface eth5
 no shutdown
 description leipzig -> stub [stub]
 ip address 10.254.0.125/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.32
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! leipzig -> berlin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! leipzig -> dresden
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! leipzig -> erfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! leipzig -> magdeburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! leipzig -> bayreuth
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! leipzig -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
