hostname karlsruhe
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.25/32
!
interface eth0
 no shutdown
 description karlsruhe -> mannheim [internal]
 ip address 10.0.0.120/31
!
interface eth1
 no shutdown
 description karlsruhe -> kaiserslautern [internal]
 ip address 10.0.0.125/31
!
interface eth2
 no shutdown
 description karlsruhe -> saarbruecken [internal]
 ip address 10.0.0.134/31
!
interface eth3
 no shutdown
 description karlsruhe -> stuttgart [internal]
 ip address 10.0.0.136/31
!
interface eth4
 no shutdown
 description karlsruhe -> freiburg [internal]
 ip address 10.0.0.145/31
!
interface eth5
 no shutdown
 description karlsruhe -> stub [stub]
 ip address 10.254.0.97/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.25
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! karlsruhe -> mannheim
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! karlsruhe -> kaiserslautern
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! karlsruhe -> saarbruecken
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! karlsruhe -> stuttgart
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! karlsruhe -> freiburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! karlsruhe -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
