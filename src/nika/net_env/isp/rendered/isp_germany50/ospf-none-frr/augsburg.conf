hostname augsburg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description augsburg -> ulm [internal]
 ip address 10.0.0.146/31
!
interface eth1
 no shutdown
 description augsburg -> muenchen [internal]
 ip address 10.0.0.152/31
!
interface eth2
 no shutdown
 description augsburg -> wuerzburg [internal]
 ip address 10.0.0.164/31
!
interface eth3
 no shutdown
 description augsburg -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! augsburg -> ulm
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! augsburg -> muenchen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! augsburg -> wuerzburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! augsburg -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
