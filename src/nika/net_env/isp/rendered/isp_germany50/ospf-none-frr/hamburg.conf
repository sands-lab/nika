hostname hamburg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.22/32
!
interface eth0
 no shutdown
 description hamburg -> schwerin [internal]
 ip address 10.0.0.64/31
!
interface eth1
 no shutdown
 description hamburg -> kiel [internal]
 ip address 10.0.0.72/31
!
interface eth2
 no shutdown
 description hamburg -> hannover [internal]
 ip address 10.0.0.74/31
!
interface eth3
 no shutdown
 description hamburg -> braunschweig [internal]
 ip address 10.0.0.77/31
!
interface eth4
 no shutdown
 description hamburg -> stub [stub]
 ip address 10.254.0.85/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.22
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! hamburg -> schwerin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! hamburg -> kiel
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! hamburg -> hannover
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! hamburg -> braunschweig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! hamburg -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
