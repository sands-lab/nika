hostname fulda
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.19/32
!
interface eth0
 no shutdown
 description fulda -> kassel [internal]
 ip address 10.0.0.106/31
!
interface eth1
 no shutdown
 description fulda -> frankfurt [internal]
 ip address 10.0.0.115/31
!
interface eth2
 no shutdown
 description fulda -> giessen [internal]
 ip address 10.0.0.126/31
!
interface eth3
 no shutdown
 description fulda -> wuerzburg [internal]
 ip address 10.0.0.130/31
!
interface eth4
 no shutdown
 description fulda -> stub [stub]
 ip address 10.254.0.73/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.19
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! fulda -> kassel
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! fulda -> frankfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! fulda -> giessen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! fulda -> wuerzburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! fulda -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
