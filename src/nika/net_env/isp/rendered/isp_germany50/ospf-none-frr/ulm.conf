hostname ulm
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.48/32
!
interface eth0
 no shutdown
 description ulm -> stuttgart [internal]
 ip address 10.0.0.139/31
!
interface eth1
 no shutdown
 description ulm -> augsburg [internal]
 ip address 10.0.0.147/31
!
interface eth2
 no shutdown
 description ulm -> stub [stub]
 ip address 10.254.0.189/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.48
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! ulm -> stuttgart
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! ulm -> augsburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! ulm -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
