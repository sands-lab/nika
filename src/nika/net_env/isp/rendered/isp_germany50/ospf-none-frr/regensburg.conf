hostname regensburg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.42/32
!
interface eth0
 no shutdown
 description regensburg -> muenchen [internal]
 ip address 10.0.0.163/31
!
interface eth1
 no shutdown
 description regensburg -> passau [internal]
 ip address 10.0.0.167/31
!
interface eth2
 no shutdown
 description regensburg -> nuernberg [internal]
 ip address 10.0.0.173/31
!
interface eth3
 no shutdown
 description regensburg -> stub [stub]
 ip address 10.254.0.165/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.42
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! regensburg -> muenchen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! regensburg -> passau
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! regensburg -> nuernberg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! regensburg -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
