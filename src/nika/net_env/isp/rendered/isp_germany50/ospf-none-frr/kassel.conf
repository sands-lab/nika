hostname kassel
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.26/32
!
interface eth0
 no shutdown
 description kassel -> erfurt [internal]
 ip address 10.0.0.55/31
!
interface eth1
 no shutdown
 description kassel -> braunschweig [internal]
 ip address 10.0.0.103/31
!
interface eth2
 no shutdown
 description kassel -> giessen [internal]
 ip address 10.0.0.105/31
!
interface eth3
 no shutdown
 description kassel -> fulda [internal]
 ip address 10.0.0.107/31
!
interface eth4
 no shutdown
 description kassel -> dortmund [internal]
 ip address 10.0.0.175/31
!
interface eth5
 no shutdown
 description kassel -> stub [stub]
 ip address 10.254.0.101/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.26
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! kassel -> erfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! kassel -> braunschweig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! kassel -> giessen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! kassel -> fulda
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! kassel -> dortmund
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! kassel -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
