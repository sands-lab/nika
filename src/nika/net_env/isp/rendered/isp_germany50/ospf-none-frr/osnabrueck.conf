hostname osnabrueck
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.40/32
!
interface eth0
 no shutdown
 description osnabrueck -> muenster [internal]
 ip address 10.0.0.9/31
!
interface eth1
 no shutdown
 description osnabrueck -> oldenburg [internal]
 ip address 10.0.0.91/31
!
interface eth2
 no shutdown
 description osnabrueck -> hannover [internal]
 ip address 10.0.0.99/31
!
interface eth3
 no shutdown
 description osnabrueck -> stub [stub]
 ip address 10.254.0.157/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.40
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! osnabrueck -> muenster
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! osnabrueck -> oldenburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! osnabrueck -> hannover
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! osnabrueck -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
