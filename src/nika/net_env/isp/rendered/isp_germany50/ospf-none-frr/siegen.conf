hostname siegen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.45/32
!
interface eth0
 no shutdown
 description siegen -> koblenz [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description siegen -> bielefeld [internal]
 ip address 10.0.0.19/31
!
interface eth2
 no shutdown
 description siegen -> giessen [internal]
 ip address 10.0.0.21/31
!
interface eth3
 no shutdown
 description siegen -> dortmund [internal]
 ip address 10.0.0.155/31
!
interface eth4
 no shutdown
 description siegen -> stub [stub]
 ip address 10.254.0.177/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.45
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! siegen -> koblenz
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! siegen -> bielefeld
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! siegen -> giessen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! siegen -> dortmund
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! siegen -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
