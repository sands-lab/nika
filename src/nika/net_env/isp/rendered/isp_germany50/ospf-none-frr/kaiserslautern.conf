hostname kaiserslautern
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.24/32
!
interface eth0
 no shutdown
 description kaiserslautern -> koblenz [internal]
 ip address 10.0.0.14/31
!
interface eth1
 no shutdown
 description kaiserslautern -> darmstadt [internal]
 ip address 10.0.0.119/31
!
interface eth2
 no shutdown
 description kaiserslautern -> saarbruecken [internal]
 ip address 10.0.0.122/31
!
interface eth3
 no shutdown
 description kaiserslautern -> karlsruhe [internal]
 ip address 10.0.0.124/31
!
interface eth4
 no shutdown
 description kaiserslautern -> stub [stub]
 ip address 10.254.0.93/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.24
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! kaiserslautern -> koblenz
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! kaiserslautern -> darmstadt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! kaiserslautern -> saarbruecken
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! kaiserslautern -> karlsruhe
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! kaiserslautern -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
