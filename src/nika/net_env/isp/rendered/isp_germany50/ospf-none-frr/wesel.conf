hostname wesel
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.49/32
!
interface eth0
 no shutdown
 description wesel -> aachen [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description wesel -> oldenburg [internal]
 ip address 10.0.0.25/31
!
interface eth2
 no shutdown
 description wesel -> norden [internal]
 ip address 10.0.0.27/31
!
interface eth3
 no shutdown
 description wesel -> essen [internal]
 ip address 10.0.0.45/31
!
interface eth4
 no shutdown
 description wesel -> stub [stub]
 ip address 10.254.0.193/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.49
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! wesel -> aachen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! wesel -> oldenburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! wesel -> norden
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! wesel -> essen
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! wesel -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
