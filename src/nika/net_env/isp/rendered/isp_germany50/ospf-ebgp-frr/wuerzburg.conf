hostname wuerzburg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.50/32
!
interface eth0
 no shutdown
 description wuerzburg -> erfurt [passive]
 ip address 10.0.0.57/31
!
interface eth1
 no shutdown
 description wuerzburg -> fulda [passive]
 ip address 10.0.0.131/31
!
interface eth2
 no shutdown
 description wuerzburg -> stuttgart [passive]
 ip address 10.0.0.143/31
!
interface eth3
 no shutdown
 description wuerzburg -> augsburg [internal]
 ip address 10.0.0.165/31
!
interface eth4
 no shutdown
 description wuerzburg -> nuernberg [internal]
 ip address 10.0.0.171/31
!
interface eth5
 no shutdown
 description wuerzburg -> stub [stub]
 ip address 10.254.0.197/30
!
interface lo1
 no shutdown
 description wuerzburg -> stub
 ip address 198.51.101.1/24
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.50
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! wuerzburg -> erfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth1
! wuerzburg -> fulda
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! wuerzburg -> stuttgart
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! wuerzburg -> augsburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! wuerzburg -> nuernberg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! wuerzburg -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.50
!
  neighbor 10.255.0.2 remote-as 65002
  neighbor 10.255.0.2 description augsburg
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.0.0.56 remote-as 65003
  neighbor 10.0.0.56 description erfurt
!
  neighbor 10.0.0.130 remote-as 65001
  neighbor 10.0.0.130 description fulda
!
  neighbor 10.0.0.142 remote-as 65001
  neighbor 10.0.0.142 description stuttgart
!
 address-family ipv4 unicast
!

  network 198.51.101.0/24
!
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
  neighbor 10.0.0.56 activate
  no neighbor 10.0.0.56 send-community all
  neighbor 10.0.0.56 send-community standard
  neighbor 10.0.0.56 send-community large
!
  neighbor 10.0.0.130 activate
  no neighbor 10.0.0.130 send-community all
  neighbor 10.0.0.130 send-community standard
  neighbor 10.0.0.130 send-community large
!
  neighbor 10.0.0.142 activate
  no neighbor 10.0.0.142 send-community all
  neighbor 10.0.0.142 send-community standard
  neighbor 10.0.0.142 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.56 route-map BGP-IN in
    neighbor 10.0.0.56 route-map BGP-OUT out

    neighbor 10.0.0.130 route-map BGP-IN in
    neighbor 10.0.0.130 route-map BGP-OUT out

    neighbor 10.0.0.142 route-map BGP-IN in
    neighbor 10.0.0.142 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
 exit-address-family
!
