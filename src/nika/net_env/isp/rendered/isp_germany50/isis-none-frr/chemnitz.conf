hostname chemnitz
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.9/32
!
interface eth0
 no shutdown
 description chemnitz -> dresden [internal]
 ip address 10.0.0.50/31
!
interface eth1
 no shutdown
 description chemnitz -> erfurt [internal]
 ip address 10.0.0.52/31
!
interface eth2
 no shutdown
 description chemnitz -> bayreuth [internal]
 ip address 10.0.0.59/31
!
interface eth3
 no shutdown
 description chemnitz -> stub [stub]
 ip address 10.254.0.33/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0009.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! chemnitz -> dresden
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! chemnitz -> erfurt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! chemnitz -> bayreuth
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! chemnitz -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
