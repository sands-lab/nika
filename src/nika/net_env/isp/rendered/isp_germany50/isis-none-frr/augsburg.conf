hostname augsburg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description augsburg -> ulm [internal]
 ip address 10.0.0.146/31
!
interface eth1
 no shutdown
 description augsburg -> muenchen [internal]
 ip address 10.0.0.152/31
!
interface eth2
 no shutdown
 description augsburg -> wuerzburg [internal]
 ip address 10.0.0.164/31
!
interface eth3
 no shutdown
 description augsburg -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0002.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! augsburg -> ulm
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! augsburg -> muenchen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! augsburg -> wuerzburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! augsburg -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
