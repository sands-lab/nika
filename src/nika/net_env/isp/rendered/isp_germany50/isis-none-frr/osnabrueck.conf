hostname osnabrueck
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.40/32
!
interface eth0
 no shutdown
 description osnabrueck -> muenster [internal]
 ip address 10.0.0.9/31
!
interface eth1
 no shutdown
 description osnabrueck -> oldenburg [internal]
 ip address 10.0.0.91/31
!
interface eth2
 no shutdown
 description osnabrueck -> hannover [internal]
 ip address 10.0.0.99/31
!
interface eth3
 no shutdown
 description osnabrueck -> stub [stub]
 ip address 10.254.0.157/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0028.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! osnabrueck -> muenster
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! osnabrueck -> oldenburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! osnabrueck -> hannover
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! osnabrueck -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
