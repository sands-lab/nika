hostname erfurt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.14/32
!
interface eth0
 no shutdown
 description erfurt -> leipzig [internal]
 ip address 10.0.0.40/31
!
interface eth1
 no shutdown
 description erfurt -> dresden [internal]
 ip address 10.0.0.49/31
!
interface eth2
 no shutdown
 description erfurt -> chemnitz [internal]
 ip address 10.0.0.53/31
!
interface eth3
 no shutdown
 description erfurt -> kassel [internal]
 ip address 10.0.0.54/31
!
interface eth4
 no shutdown
 description erfurt -> wuerzburg [internal]
 ip address 10.0.0.56/31
!
interface eth5
 no shutdown
 description erfurt -> stub [stub]
 ip address 10.254.0.53/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000e.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! erfurt -> leipzig
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! erfurt -> dresden
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! erfurt -> chemnitz
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! erfurt -> kassel
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! erfurt -> wuerzburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! erfurt -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
