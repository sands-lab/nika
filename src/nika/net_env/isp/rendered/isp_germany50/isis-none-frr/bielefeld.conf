hostname bielefeld
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.5/32
!
interface eth0
 no shutdown
 description bielefeld -> muenster [internal]
 ip address 10.0.0.6/31
!
interface eth1
 no shutdown
 description bielefeld -> siegen [internal]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description bielefeld -> hannover [internal]
 ip address 10.0.0.94/31
!
interface eth3
 no shutdown
 description bielefeld -> braunschweig [internal]
 ip address 10.0.0.100/31
!
interface eth4
 no shutdown
 description bielefeld -> stub [stub]
 ip address 10.254.0.17/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0005.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! bielefeld -> muenster
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! bielefeld -> siegen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! bielefeld -> hannover
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! bielefeld -> braunschweig
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! bielefeld -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
