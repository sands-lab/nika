hostname muenster
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.36/32
!
interface eth0
 no shutdown
 description muenster -> bielefeld [internal]
 ip address 10.0.0.7/31
!
interface eth1
 no shutdown
 description muenster -> osnabrueck [internal]
 ip address 10.0.0.8/31
!
interface eth2
 no shutdown
 description muenster -> dortmund [internal]
 ip address 10.0.0.133/31
!
interface eth3
 no shutdown
 description muenster -> stub [stub]
 ip address 10.254.0.141/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0024.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! muenster -> bielefeld
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! muenster -> osnabrueck
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! muenster -> dortmund
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! muenster -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
