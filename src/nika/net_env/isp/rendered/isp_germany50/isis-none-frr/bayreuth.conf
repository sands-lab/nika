hostname bayreuth
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.3/32
!
interface eth0
 no shutdown
 description bayreuth -> leipzig [internal]
 ip address 10.0.0.46/31
!
interface eth1
 no shutdown
 description bayreuth -> chemnitz [internal]
 ip address 10.0.0.58/31
!
interface eth2
 no shutdown
 description bayreuth -> nuernberg [internal]
 ip address 10.0.0.168/31
!
interface eth3
 no shutdown
 description bayreuth -> stub [stub]
 ip address 10.254.0.9/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0003.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! bayreuth -> leipzig
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! bayreuth -> chemnitz
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! bayreuth -> nuernberg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! bayreuth -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
