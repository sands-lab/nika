hostname berlin
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description berlin -> leipzig [internal]
 ip address 10.0.0.28/31
!
interface eth1
 no shutdown
 description berlin -> dresden [internal]
 ip address 10.0.0.30/31
!
interface eth2
 no shutdown
 description berlin -> schwerin [internal]
 ip address 10.0.0.32/31
!
interface eth3
 no shutdown
 description berlin -> magdeburg [internal]
 ip address 10.0.0.34/31
!
interface eth4
 no shutdown
 description berlin -> greifswald [internal]
 ip address 10.0.0.36/31
!
interface eth5
 no shutdown
 description berlin -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0004.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! berlin -> leipzig
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! berlin -> dresden
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! berlin -> schwerin
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! berlin -> magdeburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! berlin -> greifswald
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! berlin -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
