hostname kassel
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.26/32
!
interface eth0
 no shutdown
 description kassel -> erfurt [internal]
 ip address 10.0.0.55/31
!
interface eth1
 no shutdown
 description kassel -> braunschweig [internal]
 ip address 10.0.0.103/31
!
interface eth2
 no shutdown
 description kassel -> giessen [internal]
 ip address 10.0.0.105/31
!
interface eth3
 no shutdown
 description kassel -> fulda [internal]
 ip address 10.0.0.107/31
!
interface eth4
 no shutdown
 description kassel -> dortmund [internal]
 ip address 10.0.0.175/31
!
interface eth5
 no shutdown
 description kassel -> stub [stub]
 ip address 10.254.0.101/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001a.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! kassel -> erfurt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! kassel -> braunschweig
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! kassel -> giessen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! kassel -> fulda
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! kassel -> dortmund
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! kassel -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
