hostname karlsruhe
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.25/32
!
interface eth0
 no shutdown
 description karlsruhe -> mannheim [internal]
 ip address 10.0.0.120/31
!
interface eth1
 no shutdown
 description karlsruhe -> kaiserslautern [internal]
 ip address 10.0.0.125/31
!
interface eth2
 no shutdown
 description karlsruhe -> saarbruecken [internal]
 ip address 10.0.0.134/31
!
interface eth3
 no shutdown
 description karlsruhe -> stuttgart [internal]
 ip address 10.0.0.136/31
!
interface eth4
 no shutdown
 description karlsruhe -> freiburg [internal]
 ip address 10.0.0.145/31
!
interface eth5
 no shutdown
 description karlsruhe -> stub [stub]
 ip address 10.254.0.97/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0019.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! karlsruhe -> mannheim
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! karlsruhe -> kaiserslautern
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! karlsruhe -> saarbruecken
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! karlsruhe -> stuttgart
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! karlsruhe -> freiburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! karlsruhe -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
