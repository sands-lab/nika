hostname oldenburg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.39/32
!
interface eth0
 no shutdown
 description oldenburg -> wesel [internal]
 ip address 10.0.0.24/31
!
interface eth1
 no shutdown
 description oldenburg -> bremen [internal]
 ip address 10.0.0.79/31
!
interface eth2
 no shutdown
 description oldenburg -> norden [internal]
 ip address 10.0.0.87/31
!
interface eth3
 no shutdown
 description oldenburg -> osnabrueck [internal]
 ip address 10.0.0.90/31
!
interface eth4
 no shutdown
 description oldenburg -> stub [stub]
 ip address 10.254.0.153/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0027.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! oldenburg -> wesel
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! oldenburg -> bremen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! oldenburg -> norden
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! oldenburg -> osnabrueck
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! oldenburg -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
