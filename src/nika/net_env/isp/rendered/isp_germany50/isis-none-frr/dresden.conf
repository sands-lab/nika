hostname dresden
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.12/32
!
interface eth0
 no shutdown
 description dresden -> berlin [internal]
 ip address 10.0.0.31/31
!
interface eth1
 no shutdown
 description dresden -> leipzig [internal]
 ip address 10.0.0.38/31
!
interface eth2
 no shutdown
 description dresden -> erfurt [internal]
 ip address 10.0.0.48/31
!
interface eth3
 no shutdown
 description dresden -> chemnitz [internal]
 ip address 10.0.0.51/31
!
interface eth4
 no shutdown
 description dresden -> stub [stub]
 ip address 10.254.0.45/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000c.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! dresden -> berlin
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! dresden -> leipzig
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! dresden -> erfurt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! dresden -> chemnitz
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! dresden -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
