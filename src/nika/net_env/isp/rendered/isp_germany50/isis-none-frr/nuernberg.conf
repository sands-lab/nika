hostname nuernberg
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.38/32
!
interface eth0
 no shutdown
 description nuernberg -> muenchen [internal]
 ip address 10.0.0.161/31
!
interface eth1
 no shutdown
 description nuernberg -> bayreuth [internal]
 ip address 10.0.0.169/31
!
interface eth2
 no shutdown
 description nuernberg -> wuerzburg [internal]
 ip address 10.0.0.170/31
!
interface eth3
 no shutdown
 description nuernberg -> regensburg [internal]
 ip address 10.0.0.172/31
!
interface eth4
 no shutdown
 description nuernberg -> stub [stub]
 ip address 10.254.0.149/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0026.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! nuernberg -> muenchen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! nuernberg -> bayreuth
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! nuernberg -> wuerzburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! nuernberg -> regensburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! nuernberg -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
