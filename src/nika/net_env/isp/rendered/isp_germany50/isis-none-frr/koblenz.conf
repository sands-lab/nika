hostname koblenz
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.29/32
!
interface eth0
 no shutdown
 description koblenz -> siegen [internal]
 ip address 10.0.0.10/31
!
interface eth1
 no shutdown
 description koblenz -> frankfurt [internal]
 ip address 10.0.0.13/31
!
interface eth2
 no shutdown
 description koblenz -> kaiserslautern [internal]
 ip address 10.0.0.15/31
!
interface eth3
 no shutdown
 description koblenz -> trier [internal]
 ip address 10.0.0.16/31
!
interface eth4
 no shutdown
 description koblenz -> koeln [internal]
 ip address 10.0.0.110/31
!
interface eth5
 no shutdown
 description koblenz -> stub [stub]
 ip address 10.254.0.113/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001d.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! koblenz -> siegen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! koblenz -> frankfurt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! koblenz -> kaiserslautern
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! koblenz -> trier
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! koblenz -> koeln
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! koblenz -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
