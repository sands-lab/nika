hostname wesel
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.49/32
!
interface eth0
 no shutdown
 description wesel -> aachen [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description wesel -> oldenburg [internal]
 ip address 10.0.0.25/31
!
interface eth2
 no shutdown
 description wesel -> norden [internal]
 ip address 10.0.0.27/31
!
interface eth3
 no shutdown
 description wesel -> essen [internal]
 ip address 10.0.0.45/31
!
interface eth4
 no shutdown
 description wesel -> stub [stub]
 ip address 10.254.0.193/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0031.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! wesel -> aachen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! wesel -> oldenburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! wesel -> norden
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! wesel -> essen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! wesel -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
