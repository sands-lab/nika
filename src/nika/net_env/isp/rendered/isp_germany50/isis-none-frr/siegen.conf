hostname siegen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.45/32
!
interface eth0
 no shutdown
 description siegen -> koblenz [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description siegen -> bielefeld [internal]
 ip address 10.0.0.19/31
!
interface eth2
 no shutdown
 description siegen -> giessen [internal]
 ip address 10.0.0.21/31
!
interface eth3
 no shutdown
 description siegen -> dortmund [internal]
 ip address 10.0.0.155/31
!
interface eth4
 no shutdown
 description siegen -> stub [stub]
 ip address 10.254.0.177/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.002d.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! siegen -> koblenz
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! siegen -> bielefeld
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! siegen -> giessen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! siegen -> dortmund
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! siegen -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
