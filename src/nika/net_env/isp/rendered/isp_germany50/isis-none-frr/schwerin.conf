hostname schwerin
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.44/32
!
interface eth0
 no shutdown
 description schwerin -> berlin [internal]
 ip address 10.0.0.33/31
!
interface eth1
 no shutdown
 description schwerin -> magdeburg [internal]
 ip address 10.0.0.61/31
!
interface eth2
 no shutdown
 description schwerin -> greifswald [internal]
 ip address 10.0.0.63/31
!
interface eth3
 no shutdown
 description schwerin -> hamburg [internal]
 ip address 10.0.0.65/31
!
interface eth4
 no shutdown
 description schwerin -> kiel [internal]
 ip address 10.0.0.69/31
!
interface eth5
 no shutdown
 description schwerin -> stub [stub]
 ip address 10.254.0.173/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.002c.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! schwerin -> berlin
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! schwerin -> magdeburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! schwerin -> greifswald
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! schwerin -> hamburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! schwerin -> kiel
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! schwerin -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
