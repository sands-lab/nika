hostname frankfurt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.17/32
!
interface eth0
 no shutdown
 description frankfurt -> koblenz [internal]
 ip address 10.0.0.12/31
!
interface eth1
 no shutdown
 description frankfurt -> darmstadt [internal]
 ip address 10.0.0.109/31
!
interface eth2
 no shutdown
 description frankfurt -> giessen [internal]
 ip address 10.0.0.112/31
!
interface eth3
 no shutdown
 description frankfurt -> fulda [internal]
 ip address 10.0.0.114/31
!
interface eth4
 no shutdown
 description frankfurt -> stub [stub]
 ip address 10.254.0.65/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0011.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! frankfurt -> koblenz
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! frankfurt -> darmstadt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! frankfurt -> giessen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! frankfurt -> fulda
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! frankfurt -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
