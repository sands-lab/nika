hostname fulda
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.19/32
!
interface eth0
 no shutdown
 description fulda -> kassel [internal]
 ip address 10.0.0.106/31
!
interface eth1
 no shutdown
 description fulda -> frankfurt [internal]
 ip address 10.0.0.115/31
!
interface eth2
 no shutdown
 description fulda -> giessen [internal]
 ip address 10.0.0.126/31
!
interface eth3
 no shutdown
 description fulda -> wuerzburg [internal]
 ip address 10.0.0.130/31
!
interface eth4
 no shutdown
 description fulda -> stub [stub]
 ip address 10.254.0.73/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0013.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! fulda -> kassel
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! fulda -> frankfurt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! fulda -> giessen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! fulda -> wuerzburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! fulda -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
