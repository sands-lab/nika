hostname giessen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description giessen -> siegen [internal]
 ip address 10.0.0.20/31
!
interface eth1
 no shutdown
 description giessen -> kassel [internal]
 ip address 10.0.0.104/31
!
interface eth2
 no shutdown
 description giessen -> frankfurt [internal]
 ip address 10.0.0.113/31
!
interface eth3
 no shutdown
 description giessen -> fulda [internal]
 ip address 10.0.0.127/31
!
interface eth4
 no shutdown
 description giessen -> stub [stub]
 ip address 10.254.0.77/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0014.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! giessen -> siegen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! giessen -> kassel
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! giessen -> frankfurt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! giessen -> fulda
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! giessen -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
