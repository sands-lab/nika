hostname darmstadt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description darmstadt -> frankfurt [internal]
 ip address 10.0.0.108/31
!
interface eth1
 no shutdown
 description darmstadt -> mannheim [internal]
 ip address 10.0.0.116/31
!
interface eth2
 no shutdown
 description darmstadt -> kaiserslautern [internal]
 ip address 10.0.0.118/31
!
interface eth3
 no shutdown
 description darmstadt -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000a.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! darmstadt -> frankfurt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! darmstadt -> mannheim
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! darmstadt -> kaiserslautern
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! darmstadt -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
