hostname koeln
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.30/32
!
interface eth0
 no shutdown
 description koeln -> duesseldorf [internal]
 ip address 10.0.0.67/31
!
interface eth1
 no shutdown
 description koeln -> aachen [internal]
 ip address 10.0.0.89/31
!
interface eth2
 no shutdown
 description koeln -> koblenz [internal]
 ip address 10.0.0.111/31
!
interface eth3
 no shutdown
 description koeln -> stub [stub]
 ip address 10.254.0.117/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001e.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! koeln -> duesseldorf
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! koeln -> aachen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! koeln -> koblenz
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! koeln -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
