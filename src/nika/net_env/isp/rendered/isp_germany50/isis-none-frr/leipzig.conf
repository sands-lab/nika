hostname leipzig
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.32/32
!
interface eth0
 no shutdown
 description leipzig -> berlin [internal]
 ip address 10.0.0.29/31
!
interface eth1
 no shutdown
 description leipzig -> dresden [internal]
 ip address 10.0.0.39/31
!
interface eth2
 no shutdown
 description leipzig -> erfurt [internal]
 ip address 10.0.0.41/31
!
interface eth3
 no shutdown
 description leipzig -> magdeburg [internal]
 ip address 10.0.0.42/31
!
interface eth4
 no shutdown
 description leipzig -> bayreuth [internal]
 ip address 10.0.0.47/31
!
interface eth5
 no shutdown
 description leipzig -> stub [stub]
 ip address 10.254.0.125/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0020.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! leipzig -> berlin
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! leipzig -> dresden
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! leipzig -> erfurt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! leipzig -> magdeburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! leipzig -> bayreuth
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! leipzig -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
