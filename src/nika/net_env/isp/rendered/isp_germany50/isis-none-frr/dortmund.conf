hostname dortmund
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description dortmund -> essen [internal]
 ip address 10.0.0.22/31
!
interface eth1
 no shutdown
 description dortmund -> muenster [internal]
 ip address 10.0.0.132/31
!
interface eth2
 no shutdown
 description dortmund -> siegen [internal]
 ip address 10.0.0.154/31
!
interface eth3
 no shutdown
 description dortmund -> kassel [internal]
 ip address 10.0.0.174/31
!
interface eth4
 no shutdown
 description dortmund -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000b.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! dortmund -> essen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! dortmund -> muenster
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! dortmund -> siegen
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! dortmund -> kassel
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! dortmund -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
