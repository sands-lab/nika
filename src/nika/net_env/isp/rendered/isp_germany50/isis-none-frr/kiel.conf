hostname kiel
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.28/32
!
interface eth0
 no shutdown
 description kiel -> schwerin [internal]
 ip address 10.0.0.68/31
!
interface eth1
 no shutdown
 description kiel -> hamburg [internal]
 ip address 10.0.0.73/31
!
interface eth2
 no shutdown
 description kiel -> flensburg [internal]
 ip address 10.0.0.85/31
!
interface eth3
 no shutdown
 description kiel -> stub [stub]
 ip address 10.254.0.109/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001c.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! kiel -> schwerin
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! kiel -> hamburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! kiel -> flensburg
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! kiel -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
