  address-family ipv4









    neighbor 10.0.0.27 route-map BGP-IN in
    neighbor 10.0.0.27 route-map BGP-OUT out

    neighbor 10.0.0.29 route-map BGP-IN in
    neighbor 10.0.0.29 route-map BGP-OUT out

