#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.13
!
  neighbor 10.255.0.7 remote-as 65002
  neighbor 10.255.0.7 description dallas
  neighbor 10.255.0.7 update-source lo
!
  neighbor 10.0.0.43 remote-as 65001
  neighbor 10.0.0.43 description tulsa
!
  neighbor 10.0.0.49 remote-as 65001
  neighbor 10.0.0.49 description minneapolis
!
  neighbor 10.0.0.53 remote-as 65001
  neighbor 10.0.0.53 description tulsa
!
  neighbor 10.0.0.55 remote-as 65001
  neighbor 10.0.0.55 description minneapolis
!
  neighbor 10.0.0.59 remote-as 65001
  neighbor 10.0.0.59 description stlouis
!
  neighbor 10.0.0.93 remote-as 65001
  neighbor 10.0.0.93 description stlouis
!
 address-family ipv4 unicast
!

  network 198.51.101.0/24
!
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.7 next-hop-self
  no neighbor 10.255.0.7 send-community all
  neighbor 10.255.0.7 send-community standard
  neighbor 10.255.0.7 send-community large
  neighbor 10.255.0.7 send-community extended
!
  neighbor 10.0.0.43 activate
  no neighbor 10.0.0.43 send-community all
  neighbor 10.0.0.43 send-community standard
  neighbor 10.0.0.43 send-community large
!
  neighbor 10.0.0.49 activate
  no neighbor 10.0.0.49 send-community all
  neighbor 10.0.0.49 send-community standard
  neighbor 10.0.0.49 send-community large
!
  neighbor 10.0.0.53 activate
  no neighbor 10.0.0.53 send-community all
  neighbor 10.0.0.53 send-community standard
  neighbor 10.0.0.53 send-community large
!
  neighbor 10.0.0.55 activate
  no neighbor 10.0.0.55 send-community all
  neighbor 10.0.0.55 send-community standard
  neighbor 10.0.0.55 send-community large
!
  neighbor 10.0.0.59 activate
  no neighbor 10.0.0.59 send-community all
  neighbor 10.0.0.59 send-community standard
  neighbor 10.0.0.59 send-community large
!
  neighbor 10.0.0.93 activate
