#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.43 route-map BGP-IN in
    neighbor 10.0.0.43 route-map BGP-OUT out

    neighbor 10.0.0.49 route-map BGP-IN in
    neighbor 10.0.0.49 route-map BGP-OUT out

    neighbor 10.0.0.53 route-map BGP-IN in
    neighbor 10.0.0.53 route-map BGP-OUT out

    neighbor 10.0.0.55 route-map BGP-IN in
    neighbor 10.0.0.55 route-map BGP-OUT out

    neighbor 10.0.0.59 route-map BGP-IN in
    neighbor 10.0.0.59 route-map BGP-OUT out

    neighbor 10.0.0.93 route-map BGP-IN in
    neighbor 10.0.0.93 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.7 route-map BGP-IN in
 exit-address-family
!
