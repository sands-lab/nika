hostname tulsa
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.25/32
!
interface eth0
 no shutdown
 description tulsa -> dallas [passive]
 ip address 10.0.0.29/31
!
interface eth1
 no shutdown
 description tulsa -> dallas [passive]
 ip address 10.0.0.41/31
!
interface eth2
 no shutdown
 description tulsa -> kansascity [passive]
 ip address 10.0.0.43/31
!
interface eth3
 no shutdown
 description tulsa -> stlouis [internal]
 ip address 10.0.0.45/31
!
interface eth4
 no shutdown
 description tulsa -> kansascity [passive]
 ip address 10.0.0.53/31
!
interface eth5
 no shutdown
 description tulsa -> stlouis [internal]
 ip address 10.0.0.89/31
!
interface eth6
 no shutdown
 description tulsa -> stub [stub]
 ip address 10.254.0.97/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.25
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! tulsa -> dallas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth1
! tulsa -> dallas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! tulsa -> kansascity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! tulsa -> stlouis
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! tulsa -> kansascity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth5
! tulsa -> stlouis
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! tulsa -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.25
!
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 description albany
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.0.0.28 remote-as 65002
  neighbor 10.0.0.28 description dallas
!
  neighbor 10.0.0.40 remote-as 65002
  neighbor 10.0.0.40 description dallas
!
  neighbor 10.0.0.42 remote-as 65002
  neighbor 10.0.0.42 description kansascity
!
  neighbor 10.0.0.52 remote-as 65002
  neighbor 10.0.0.52 description kansascity
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.0.0.28 activate
  no neighbor 10.0.0.28 send-community all
  neighbor 10.0.0.28 send-community standard
  neighbor 10.0.0.28 send-community large
!
  neighbor 10.0.0.40 activate
  no neighbor 10.0.0.40 send-community all
  neighbor 10.0.0.40 send-community standard
  neighbor 10.0.0.40 send-community large
!
  neighbor 10.0.0.42 activate
  no neighbor 10.0.0.42 send-community all
  neighbor 10.0.0.42 send-community standard
  neighbor 10.0.0.42 send-community large
!
  neighbor 10.0.0.52 activate
  no neighbor 10.0.0.52 send-community all
  neighbor 10.0.0.52 send-community standard
  neighbor 10.0.0.52 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65001
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.28 route-map BGP-IN in
    neighbor 10.0.0.28 route-map BGP-OUT out

    neighbor 10.0.0.40 route-map BGP-IN in
    neighbor 10.0.0.40 route-map BGP-OUT out

    neighbor 10.0.0.42 route-map BGP-IN in
    neighbor 10.0.0.42 route-map BGP-OUT out

    neighbor 10.0.0.52 route-map BGP-IN in
    neighbor 10.0.0.52 route-map BGP-OUT out

!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
 exit-address-family
!
