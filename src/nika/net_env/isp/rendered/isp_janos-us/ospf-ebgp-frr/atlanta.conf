#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.2
  bgp cluster-id 10.255.0.2
!
  neighbor 10.255.0.4 remote-as 65003
  neighbor 10.255.0.4 description charlotte
  neighbor 10.255.0.4 update-source lo
!
  neighbor 10.255.0.11 remote-as 65003
  neighbor 10.255.0.11 description houston
  neighbor 10.255.0.11 update-source lo
!
  neighbor 10.255.0.16 remote-as 65003
  neighbor 10.255.0.16 description miami
  neighbor 10.255.0.16 update-source lo
!
  neighbor 10.255.0.18 remote-as 65003
  neighbor 10.255.0.18 description nashville
  neighbor 10.255.0.18 update-source lo
!
  neighbor 10.255.0.19 remote-as 65003
  neighbor 10.255.0.19 description neworleans
  neighbor 10.255.0.19 update-source lo
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.4 next-hop-self
  neighbor 10.255.0.4 route-reflector-client
  no neighbor 10.255.0.4 send-community all
  neighbor 10.255.0.4 send-community standard
  neighbor 10.255.0.4 send-community large
  neighbor 10.255.0.4 send-community extended
!
  neighbor 10.255.0.11 activate
  neighbor 10.255.0.11 next-hop-self
  neighbor 10.255.0.11 route-reflector-client
  no neighbor 10.255.0.11 send-community all
  neighbor 10.255.0.11 send-community standard
  neighbor 10.255.0.11 send-community large
  neighbor 10.255.0.11 send-community extended
!
  neighbor 10.255.0.16 activate
  neighbor 10.255.0.16 next-hop-self
  neighbor 10.255.0.16 route-reflector-client
  no neighbor 10.255.0.16 send-community all
  neighbor 10.255.0.16 send-community standard
  neighbor 10.255.0.16 send-community large
  neighbor 10.255.0.16 send-community extended
!
  neighbor 10.255.0.18 activate
  neighbor 10.255.0.18 next-hop-self
  neighbor 10.255.0.18 route-reflector-client
  no neighbor 10.255.0.18 send-community all
  neighbor 10.255.0.18 send-community standard
  neighbor 10.255.0.18 send-community large
  neighbor 10.255.0.18 send-community extended
!
  neighbor 10.255.0.19 activate
  neighbor 10.255.0.19 next-hop-self
  neighbor 10.255.0.19 route-reflector-client
  no neighbor 10.255.0.19 send-community all
  neighbor 10.255.0.19 send-community standard
  neighbor 10.255.0.19 send-community large
  neighbor 10.255.0.19 send-community extended
!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.4 route-map BGP-IN in
  neighbor 10.255.0.11 route-map BGP-IN in
  neighbor 10.255.0.16 route-map BGP-IN in
  neighbor 10.255.0.18 route-map BGP-IN in
  neighbor 10.255.0.19 route-map BGP-IN in
 exit-address-family
!
