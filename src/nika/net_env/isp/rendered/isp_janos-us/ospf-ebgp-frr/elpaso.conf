#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.10
!
  neighbor 10.255.0.7 remote-as 65002
  neighbor 10.255.0.7 description dallas
  neighbor 10.255.0.7 update-source lo
!
  neighbor 10.0.0.21 remote-as 65003
  neighbor 10.0.0.21 description houston
!
  neighbor 10.0.0.35 remote-as 65003
  neighbor 10.0.0.35 description houston
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.7 next-hop-self
  no neighbor 10.255.0.7 send-community all
  neighbor 10.255.0.7 send-community standard
  neighbor 10.255.0.7 send-community large
  neighbor 10.255.0.7 send-community extended
!
  neighbor 10.0.0.21 activate
  no neighbor 10.0.0.21 send-community all
  neighbor 10.0.0.21 send-community standard
  neighbor 10.0.0.21 send-community large
!
  neighbor 10.0.0.35 activate
  no neighbor 10.0.0.35 send-community all
  neighbor 10.0.0.35 send-community standard
  neighbor 10.0.0.35 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.21 route-map BGP-IN in
    neighbor 10.0.0.21 route-map BGP-OUT out

    neighbor 10.0.0.35 route-map BGP-IN in
    neighbor 10.0.0.35 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.7 route-map BGP-IN in
 exit-address-family
!
