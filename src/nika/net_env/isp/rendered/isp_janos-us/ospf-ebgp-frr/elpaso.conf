!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description elpaso -> lasvegas [internal]
 ip address 10.0.0.4/31
!
interface eth1
 no shutdown
 description elpaso -> losangeles [internal]
 ip address 10.0.0.14/31
!
interface eth2
 no shutdown
 description elpaso -> lasvegas [internal]
 ip address 10.0.0.16/31
!
interface eth3
 no shutdown
 description elpaso -> dallas [internal]
 ip address 10.0.0.19/31
!
interface eth4
 no shutdown
 description elpaso -> houston [passive]
 ip address 10.0.0.20/31
!
interface eth5
 no shutdown
 description elpaso -> dallas [internal]
 ip address 10.0.0.23/31
!
interface eth6
 no shutdown
 description elpaso -> houston [passive]
 ip address 10.0.0.34/31
!
interface eth7
 no shutdown
 description elpaso -> losangeles [internal]
