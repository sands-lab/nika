#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT-AS65003 permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT-AS65003 permit 20
  match ip address prefix-list CUSTOMERS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.26
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! washingtondc -> cleveland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! washingtondc -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! washingtondc -> charlotte
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! washingtondc -> cleveland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! washingtondc -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! washingtondc -> charlotte
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth6
! washingtondc -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.26
!
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 description albany
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.0.0.132 remote-as 65003
  neighbor 10.0.0.132 description charlotte
!
  neighbor 10.0.0.164 remote-as 65003
  neighbor 10.0.0.164 description charlotte
!
 address-family ipv4 unicast
!

  network 198.51.110.0/24
  network 198.51.100.0/24
!
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.0.0.132 activate
  no neighbor 10.0.0.132 send-community all
  neighbor 10.0.0.132 send-community standard
  neighbor 10.0.0.132 send-community large
!
  neighbor 10.0.0.164 activate
  no neighbor 10.0.0.164 send-community all
  neighbor 10.0.0.164 send-community standard
  neighbor 10.0.0.164 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65001
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.132 route-map BGP-IN in
    neighbor 10.0.0.132 route-map BGP-OUT-AS65003 out

    neighbor 10.0.0.164 route-map BGP-IN in
    neighbor 10.0.0.164 route-map BGP-OUT out

!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
 exit-address-family
!
