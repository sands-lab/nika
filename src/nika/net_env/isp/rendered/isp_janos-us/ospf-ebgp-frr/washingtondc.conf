!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.26/32
!
interface eth0
 no shutdown
 description washingtondc -> cleveland [internal]
 ip address 10.0.0.115/31
!
interface eth1
 no shutdown
 description washingtondc -> newyork [internal]
 ip address 10.0.0.121/31
!
interface eth2
 no shutdown
 description washingtondc -> charlotte [passive]
 ip address 10.0.0.133/31
!
interface eth3
 no shutdown
 description washingtondc -> cleveland [internal]
 ip address 10.0.0.161/31
!
interface eth4
 no shutdown
 description washingtondc -> newyork [internal]
 ip address 10.0.0.163/31
!
interface eth5
 no shutdown
 description washingtondc -> charlotte [passive]
 ip address 10.0.0.165/31
!
interface eth7
 no shutdown
 description washingtondc -> stub [stub]
 ip address 198.51.110.1/24
!
interface eth6
 no shutdown
 description washingtondc -> stub [stub]
 ip address 10.254.0.101/30
!
interface lo1
 no shutdown
 description washingtondc -> stub
 ip address 198.51.100.1/24
!
