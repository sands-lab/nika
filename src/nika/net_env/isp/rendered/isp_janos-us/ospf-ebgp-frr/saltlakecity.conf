!
interface eth2
 no shutdown
 description saltlakecity -> sanfrancisco [internal]
 ip address 10.0.0.8/31
!
interface eth3
 no shutdown
 description saltlakecity -> lasvegas [internal]
 ip address 10.0.0.11/31
!
interface eth4
 no shutdown
 description saltlakecity -> denver [internal]
 ip address 10.0.0.13/31
!
interface eth5
 no shutdown
 description saltlakecity -> denver [internal]
 ip address 10.0.0.61/31
!
interface eth6
 no shutdown
 description saltlakecity -> sanfrancisco [internal]
 ip address 10.0.0.134/31
!
interface eth7
 no shutdown
 description saltlakecity -> lasvegas [internal]
 ip address 10.0.0.167/31
