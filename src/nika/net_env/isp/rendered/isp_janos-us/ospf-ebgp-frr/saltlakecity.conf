hostname saltlakecity
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.21/32
!
interface eth0
 no shutdown
 description saltlakecity -> seattle [internal]
 ip address 10.0.0.2/31
!
interface eth1
 no shutdown
 description saltlakecity -> seattle [internal]
