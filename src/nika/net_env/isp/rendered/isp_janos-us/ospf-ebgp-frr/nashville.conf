 ip ospf cost 10
 ip ospf passive
!
interface eth3
! nashville -> indianapolis
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth4
! nashville -> charlotte
 ip ospf area 0.0.0.0
