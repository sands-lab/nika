#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.18
!
  neighbor 10.255.0.2 remote-as 65003
  neighbor 10.255.0.2 description atlanta
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.0.0.32 remote-as 65002
  neighbor 10.0.0.32 description dallas
!
  neighbor 10.0.0.80 remote-as 65001
  neighbor 10.0.0.80 description indianapolis
!
  neighbor 10.0.0.98 remote-as 65002
  neighbor 10.0.0.98 description dallas
!
  neighbor 10.0.0.100 remote-as 65001
  neighbor 10.0.0.100 description indianapolis
!
 address-family ipv4 unicast
!

  network 198.51.102.0/24
!
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
  neighbor 10.0.0.32 activate
  no neighbor 10.0.0.32 send-community all
  neighbor 10.0.0.32 send-community standard
  neighbor 10.0.0.32 send-community large
!
  neighbor 10.0.0.80 activate
  no neighbor 10.0.0.80 send-community all
  neighbor 10.0.0.80 send-community standard
  neighbor 10.0.0.80 send-community large
!
  neighbor 10.0.0.98 activate
  no neighbor 10.0.0.98 send-community all
  neighbor 10.0.0.98 send-community standard
  neighbor 10.0.0.98 send-community large
!
  neighbor 10.0.0.100 activate
  no neighbor 10.0.0.100 send-community all
  neighbor 10.0.0.100 send-community standard
  neighbor 10.0.0.100 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.32 route-map BGP-IN in
    neighbor 10.0.0.32 route-map BGP-OUT out

    neighbor 10.0.0.80 route-map BGP-IN in
    neighbor 10.0.0.80 route-map BGP-OUT out

    neighbor 10.0.0.98 route-map BGP-IN in
    neighbor 10.0.0.98 route-map BGP-OUT out

    neighbor 10.0.0.100 route-map BGP-IN in
    neighbor 10.0.0.100 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
 exit-address-family
!
