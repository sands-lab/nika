hostname albany
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description albany -> cleveland [internal]
 ip address 10.0.0.110/31
!
interface eth1
 no shutdown
 description albany -> newyork [internal]
 ip address 10.0.0.116/31
!
interface eth2
 no shutdown
 description albany -> cleveland [internal]
 ip address 10.0.0.122/31
!
interface eth3
 no shutdown
 description albany -> newyork [internal]
 ip address 10.0.0.124/31
!
interface eth4
 no shutdown
 description albany -> boston [internal]
 ip address 10.0.0.126/31
!
interface eth5
 no shutdown
 description albany -> boston [internal]
 ip address 10.0.0.144/31
!
interface eth6
 no shutdown
 description albany -> stub [stub]
 ip address 10.254.0.1/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0001.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! albany -> cleveland
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! albany -> newyork
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! albany -> cleveland
 ip router isis CORE
 isis network point-to-point
