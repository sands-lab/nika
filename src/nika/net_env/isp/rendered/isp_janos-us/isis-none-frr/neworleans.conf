hostname neworleans
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.19/32
!
interface eth0
 no shutdown
 description neworleans -> houston [internal]
 ip address 10.0.0.39/31
!
interface eth1
 no shutdown
 description neworleans -> houston [internal]
 ip address 10.0.0.137/31
!
interface eth2
 no shutdown
 description neworleans -> atlanta [internal]
