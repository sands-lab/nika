!
interface eth5
 no shutdown
 description neworleans -> miami [internal]
 ip address 10.0.0.155/31
!
interface eth6
 no shutdown
 description neworleans -> stub [stub]
 ip address 10.254.0.73/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0013.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! neworleans -> houston
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
