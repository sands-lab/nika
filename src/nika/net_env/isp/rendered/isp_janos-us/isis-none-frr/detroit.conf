hostname detroit
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.9/32
!
interface eth0
 no shutdown
 description detroit -> chicago [internal]
 ip address 10.0.0.73/31
!
interface eth1
 no shutdown
 description detroit -> chicago [internal]
 ip address 10.0.0.85/31
!
interface eth2
 no shutdown
 description detroit -> cleveland [internal]
 ip address 10.0.0.87/31
!
interface eth3
 no shutdown
 description detroit -> cleveland [internal]
 ip address 10.0.0.109/31
!
interface eth4
 no shutdown
 description detroit -> stub [stub]
 ip address 10.254.0.33/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0009.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! detroit -> chicago
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! detroit -> chicago
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! detroit -> cleveland
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! detroit -> cleveland
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! detroit -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
