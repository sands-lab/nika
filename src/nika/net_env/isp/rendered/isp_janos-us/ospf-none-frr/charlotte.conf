hostname charlotte
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description charlotte -> nashville [internal]
 ip address 10.0.0.102/31
!
interface eth1
 no shutdown
 description charlotte -> nashville [internal]
 ip address 10.0.0.128/31
!
interface eth2
 no shutdown
 description charlotte -> atlanta [internal]
 ip address 10.0.0.131/31
!
interface eth3
 no shutdown
 description charlotte -> washingtondc [internal]
 ip address 10.0.0.132/31
!
interface eth4
 no shutdown
 description charlotte -> atlanta [internal]
 ip address 10.0.0.149/31
!
interface eth5
 no shutdown
 description charlotte -> washingtondc [internal]
 ip address 10.0.0.164/31
!
interface eth6
 no shutdown
 description charlotte -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.4
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! charlotte -> nashville
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! charlotte -> nashville
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! charlotte -> atlanta
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! charlotte -> washingtondc
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! charlotte -> atlanta
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! charlotte -> washingtondc
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! charlotte -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
