hostname sanfrancisco
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.22/32
!
interface eth0
 no shutdown
 description sanfrancisco -> seattle [internal]
 ip address 10.0.0.0/31
!
interface eth1
 no shutdown
 description sanfrancisco -> saltlakecity [internal]
 ip address 10.0.0.9/31
!
interface eth2
 no shutdown
 description sanfrancisco -> losangeles [internal]
 ip address 10.0.0.25/31
!
interface eth3
 no shutdown
 description sanfrancisco -> seattle [internal]
 ip address 10.0.0.90/31
!
interface eth4
 no shutdown
 description sanfrancisco -> losangeles [internal]
 ip address 10.0.0.113/31
!
interface eth5
 no shutdown
 description sanfrancisco -> saltlakecity [internal]
 ip address 10.0.0.135/31
!
interface eth6
 no shutdown
 description sanfrancisco -> stub [stub]
 ip address 10.254.0.85/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.22
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! sanfrancisco -> seattle
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! sanfrancisco -> saltlakecity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! sanfrancisco -> losangeles
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! sanfrancisco -> seattle
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! sanfrancisco -> losangeles
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! sanfrancisco -> saltlakecity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
