hostname tulsa
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.25/32
!
interface eth0
 no shutdown
 description tulsa -> dallas [internal]
 ip address 10.0.0.29/31
!
interface eth1
 no shutdown
 description tulsa -> dallas [internal]
 ip address 10.0.0.41/31
!
interface eth2
 no shutdown
 description tulsa -> kansascity [internal]
 ip address 10.0.0.43/31
!
interface eth3
 no shutdown
 description tulsa -> stlouis [internal]
 ip address 10.0.0.45/31
!
interface eth4
 no shutdown
 description tulsa -> kansascity [internal]
 ip address 10.0.0.53/31
!
interface eth5
 no shutdown
 description tulsa -> stlouis [internal]
 ip address 10.0.0.89/31
!
interface eth6
 no shutdown
 description tulsa -> stub [stub]
 ip address 10.254.0.97/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.25
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! tulsa -> dallas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! tulsa -> dallas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! tulsa -> kansascity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! tulsa -> stlouis
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! tulsa -> kansascity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! tulsa -> stlouis
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! tulsa -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
