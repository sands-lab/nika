hostname saltlakecity
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.21/32
!
interface eth0
 no shutdown
 description saltlakecity -> seattle [internal]
 ip address 10.0.0.2/31
!
interface eth1
 no shutdown
 description saltlakecity -> seattle [internal]
 ip address 10.0.0.6/31
!
interface eth2
 no shutdown
 description saltlakecity -> sanfrancisco [internal]
 ip address 10.0.0.8/31
!
interface eth3
 no shutdown
 description saltlakecity -> lasvegas [internal]
 ip address 10.0.0.11/31
!
interface eth4
 no shutdown
 description saltlakecity -> denver [internal]
 ip address 10.0.0.13/31
!
interface eth5
 no shutdown
 description saltlakecity -> denver [internal]
 ip address 10.0.0.61/31
!
interface eth6
 no shutdown
 description saltlakecity -> sanfrancisco [internal]
 ip address 10.0.0.134/31
!
interface eth7
 no shutdown
 description saltlakecity -> lasvegas [internal]
 ip address 10.0.0.167/31
!
interface eth8
 no shutdown
 description saltlakecity -> stub [stub]
 ip address 10.254.0.81/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.21
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! saltlakecity -> seattle
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
