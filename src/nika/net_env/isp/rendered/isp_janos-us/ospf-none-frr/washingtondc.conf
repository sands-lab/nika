hostname washingtondc
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.26/32
!
interface eth0
 no shutdown
 description washingtondc -> cleveland [internal]
 ip address 10.0.0.115/31
!
interface eth1
 no shutdown
 description washingtondc -> newyork [internal]
 ip address 10.0.0.121/31
!
interface eth2
 no shutdown
 description washingtondc -> charlotte [internal]
 ip address 10.0.0.133/31
!
interface eth3
 no shutdown
 description washingtondc -> cleveland [internal]
 ip address 10.0.0.161/31
!
interface eth4
 no shutdown
 description washingtondc -> newyork [internal]
 ip address 10.0.0.163/31
!
interface eth5
 no shutdown
 description washingtondc -> charlotte [internal]
 ip address 10.0.0.165/31
!
interface eth6
 no shutdown
 description washingtondc -> stub [stub]
 ip address 10.254.0.101/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.26
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! washingtondc -> cleveland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! washingtondc -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! washingtondc -> charlotte
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! washingtondc -> cleveland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! washingtondc -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! washingtondc -> charlotte
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! washingtondc -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
