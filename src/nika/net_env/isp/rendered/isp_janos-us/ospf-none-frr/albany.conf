hostname albany
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description albany -> cleveland [internal]
 ip address 10.0.0.110/31
!
interface eth1
 no shutdown
 description albany -> newyork [internal]
 ip address 10.0.0.116/31
!
interface eth2
 no shutdown
 description albany -> cleveland [internal]
 ip address 10.0.0.122/31
!
interface eth3
 no shutdown
 description albany -> newyork [internal]
 ip address 10.0.0.124/31
!
interface eth4
 no shutdown
 description albany -> boston [internal]
 ip address 10.0.0.126/31
!
interface eth5
 no shutdown
 description albany -> boston [internal]
 ip address 10.0.0.144/31
!
interface eth6
 no shutdown
 description albany -> stub [stub]
 ip address 10.254.0.1/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.1
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! albany -> cleveland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! albany -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! albany -> cleveland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! albany -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! albany -> boston
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! albany -> boston
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! albany -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
