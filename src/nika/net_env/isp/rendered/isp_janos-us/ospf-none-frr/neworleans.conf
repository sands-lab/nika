hostname neworleans
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.19/32
!
interface eth0
 no shutdown
 description neworleans -> houston [internal]
 ip address 10.0.0.39/31
!
interface eth1
 no shutdown
 description neworleans -> houston [internal]
 ip address 10.0.0.137/31
!
interface eth2
 no shutdown
 description neworleans -> atlanta [internal]
 ip address 10.0.0.139/31
!
interface eth3
 no shutdown
 description neworleans -> miami [internal]
 ip address 10.0.0.141/31
!
interface eth4
 no shutdown
 description neworleans -> atlanta [internal]
 ip address 10.0.0.151/31
!
interface eth5
 no shutdown
 description neworleans -> miami [internal]
 ip address 10.0.0.155/31
!
interface eth6
 no shutdown
 description neworleans -> stub [stub]
 ip address 10.254.0.73/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.19
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! neworleans -> houston
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! neworleans -> houston
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! neworleans -> atlanta
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! neworleans -> miami
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! neworleans -> atlanta
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! neworleans -> miami
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! neworleans -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

