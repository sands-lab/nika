hostname newyork
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description newyork -> albany [internal]
 ip address 10.0.0.117/31
!
interface eth1
 no shutdown
 description newyork -> boston [internal]
 ip address 10.0.0.119/31
!
interface eth2
 no shutdown
 description newyork -> washingtondc [internal]
 ip address 10.0.0.120/31
!
interface eth3
 no shutdown
 description newyork -> albany [internal]
 ip address 10.0.0.125/31
!
interface eth4
 no shutdown
 description newyork -> boston [internal]
 ip address 10.0.0.143/31
!
interface eth5
 no shutdown
 description newyork -> washingtondc [internal]
 ip address 10.0.0.162/31
!
interface eth6
 no shutdown
 description newyork -> stub [stub]
 ip address 10.254.0.77/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.20
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! newyork -> albany
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! newyork -> boston
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! newyork -> washingtondc
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! newyork -> albany
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! newyork -> boston
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! newyork -> washingtondc
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! newyork -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
