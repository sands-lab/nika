hostname minneapolis
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.17/32
!
interface eth0
 no shutdown
 description minneapolis -> kansascity [internal]
 ip address 10.0.0.49/31
!
interface eth1
 no shutdown
 description minneapolis -> chicago [internal]
 ip address 10.0.0.51/31
!
interface eth2
 no shutdown
 description minneapolis -> kansascity [internal]
 ip address 10.0.0.55/31
!
interface eth3
 no shutdown
 description minneapolis -> chicago [internal]
 ip address 10.0.0.67/31
!
interface eth4
 no shutdown
 description minneapolis -> stub [stub]
 ip address 10.254.0.65/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.17
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! minneapolis -> kansascity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! minneapolis -> chicago
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! minneapolis -> kansascity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! minneapolis -> chicago
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! minneapolis -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
