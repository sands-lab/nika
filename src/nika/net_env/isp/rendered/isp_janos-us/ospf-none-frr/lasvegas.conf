hostname lasvegas
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.14/32
!
interface eth0
 no shutdown
 description lasvegas -> elpaso [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description lasvegas -> saltlakecity [internal]
 ip address 10.0.0.10/31
!
interface eth2
 no shutdown
 description lasvegas -> elpaso [internal]
 ip address 10.0.0.17/31
!
interface eth3
 no shutdown
 description lasvegas -> losangeles [internal]
 ip address 10.0.0.46/31
!
interface eth4
 no shutdown
 description lasvegas -> losangeles [internal]
 ip address 10.0.0.156/31
!
interface eth5
 no shutdown
 description lasvegas -> saltlakecity [internal]
 ip address 10.0.0.166/31
!
interface eth6
 no shutdown
 description lasvegas -> stub [stub]
 ip address 10.254.0.53/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.14
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! lasvegas -> elpaso
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! lasvegas -> saltlakecity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! lasvegas -> elpaso
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! lasvegas -> losangeles
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! lasvegas -> losangeles
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! lasvegas -> saltlakecity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
