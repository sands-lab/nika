hostname losangeles
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.15/32
!
interface eth0
 no shutdown
 description losangeles -> elpaso [internal]
 ip address 10.0.0.15/31
!
interface eth1
 no shutdown
 description losangeles -> sanfrancisco [internal]
 ip address 10.0.0.24/31
!
interface eth2
 no shutdown
 description losangeles -> lasvegas [internal]
 ip address 10.0.0.47/31
!
interface eth3
 no shutdown
 description losangeles -> elpaso [internal]
 ip address 10.0.0.69/31
!
interface eth4
 no shutdown
 description losangeles -> sanfrancisco [internal]
 ip address 10.0.0.112/31
!
interface eth5
 no shutdown
 description losangeles -> lasvegas [internal]
 ip address 10.0.0.157/31
!
interface eth6
 no shutdown
 description losangeles -> stub [stub]
 ip address 10.254.0.57/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.15
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! losangeles -> elpaso
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! losangeles -> sanfrancisco
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! losangeles -> lasvegas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! losangeles -> elpaso
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! losangeles -> sanfrancisco
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! losangeles -> lasvegas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! losangeles -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
