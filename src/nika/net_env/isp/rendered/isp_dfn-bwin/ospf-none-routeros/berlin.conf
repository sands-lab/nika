/interface/ethernet set comment="berlin -> stuttgart [internal]" ether10
/ip/address add interface=ether10 address=10.0.0.16/31
/ip/address set [find where interface=ether10] comment="berlin -> stuttgart [internal]"

/interface/ethernet set comment="berlin -> stub [stub]" ether11
/ip/address add interface=ether11 address=10.254.0.1/30
/ip/address set [find where interface=ether11] comment="berlin -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.1 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether5 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether6 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether7 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether8 type=ptp cost=10
