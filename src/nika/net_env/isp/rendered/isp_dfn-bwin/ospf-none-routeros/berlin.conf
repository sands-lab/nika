
/system/identity set name="berlin"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=frankfurt address=10.255.0.2
/ip/dns/static add name=hamburg address=10.255.0.3
/ip/dns/static add name=hannover address=10.255.0.4
/ip/dns/static add name=karlsruhe address=10.255.0.5
/ip/dns/static add name=koeln address=10.255.0.6
/ip/dns/static add name=leipzig address=10.255.0.7
/ip/dns/static add name=muenchen address=10.255.0.8
/ip/dns/static add name=nuernberg address=10.255.0.9
/ip/dns/static add name=stuttgart address=10.255.0.10

/ip/address add interface=loopback address=10.255.0.1/32




/interface/ethernet set comment="berlin -> frankfurt [internal]" ether2
/ip/address add interface=ether2 address=10.0.0.0/31
/ip/address set [find where interface=ether2] comment="berlin -> frankfurt [internal]"

/interface/ethernet set comment="berlin -> hamburg [internal]" ether3
/ip/address add interface=ether3 address=10.0.0.2/31
/ip/address set [find where interface=ether3] comment="berlin -> hamburg [internal]"

/interface/ethernet set comment="berlin -> hannover [internal]" ether4
/ip/address add interface=ether4 address=10.0.0.4/31
/ip/address set [find where interface=ether4] comment="berlin -> hannover [internal]"

/interface/ethernet set comment="berlin -> karlsruhe [internal]" ether5
/ip/address add interface=ether5 address=10.0.0.6/31
/ip/address set [find where interface=ether5] comment="berlin -> karlsruhe [internal]"

/interface/ethernet set comment="berlin -> koeln [internal]" ether6
/ip/address add interface=ether6 address=10.0.0.8/31
/ip/address set [find where interface=ether6] comment="berlin -> koeln [internal]"

/interface/ethernet set comment="berlin -> leipzig [internal]" ether7
/ip/address add interface=ether7 address=10.0.0.10/31
/ip/address set [find where interface=ether7] comment="berlin -> leipzig [internal]"

/interface/ethernet set comment="berlin -> muenchen [internal]" ether8
/ip/address add interface=ether8 address=10.0.0.12/31
/ip/address set [find where interface=ether8] comment="berlin -> muenchen [internal]"

/interface/ethernet set comment="berlin -> nuernberg [internal]" ether9
