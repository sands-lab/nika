- operation: update
  path: /routing-policy/prefix-set[name=BUSINESS]
  value:
    prefix:
    - ip-prefix: 203.0.113.0/24
      mask-length-range: exact
    - ip-prefix: 203.0.114.0/24
      mask-length-range: exact
    - ip-prefix: 203.0.115.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.100.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.101.0/24
      mask-length-range: exact
    - ip-prefix: 198.51.102.0/24
      mask-length-range: exact
- operation: update
  path: /routing-policy/policy[name=BGP-IN]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: rpe_10
      match:
        prefix-set: BUSINESS
      action:
        policy-result: accept
- operation: update
  path: /routing-policy/policy[name=BGP-OUT]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: rpe_10
      match:
        prefix-set: BUSINESS
      action:
        policy-result: accept
- operation: update
  path: /network-instance[name=default]
  value:
    router-id: 10.255.0.8
    protocols:
      ospf:
        instance:
        - name: '1'
          version: ospf-v2
          admin-state: enable
          max-ecmp-paths: 64
          area:
          - area-id: 0.0.0.0
            interface:
            - interface-name: system0.0
              passive: true
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/1.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/2.0
              passive: true
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/3.0
              passive: true
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/4.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/5.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/6.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/7.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/8.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/9.0
              interface-type: point-to-point
              failure-detection:
                enable-bfd: false
              metric: 10
          - area-id: 0.0.0.0
            interface:
            - interface-name: ethernet-1/10.0
              passive: true
              failure-detection:
                enable-bfd: false
              metric: 1
- operation: update
  path: /routing-policy/policy[name=accept_all]
  value:
    default-action:
      policy-result: accept
- operation: update
  path: /routing-policy/community-set[name=ibgp-mark]
  value:
    member:
    - 65536:0:65536
- operation: update
  path: /routing-policy/policy[name=ibgp-mark]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: mark-ibgp-routes
      action:
        bgp:
          communities:
            add: ibgp-mark
        policy-result: accept
- operation: update
  path: /routing-policy/prefix-set[name=default_bgp_advertise]
  value:
    prefix: []
- operation: update
  path: /routing-policy/policy[name=default_bgp_export]
  value:
    default-action:
      policy-result: reject
    statement:
    - name: prefixes
      match:
        prefix-set: default_bgp_advertise
      action:
        policy-result: next-policy
    - name: bgp
      match:
        protocol: bgp
      action:
        policy-result: next-policy
        bgp:
          communities:
            remove: ibgp-mark
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    admin-state: enable
    autonomous-system: 65001
    router-id: 10.255.0.8
    ebgp-default-policy:
      export-reject-all: false
      import-reject-all: false
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
- operation: update
  path: /network-instance[name=default]/protocols/bgp/group[group-name=ibgp-ipv4]
  value:
    admin-state: enable
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
      import-policy:
      - ibgp-mark
      export-policy:
      - default_bgp_export
      - accept_all
    - afi-safi-name: ipv6-unicast
      admin-state: disable
    timers:
      connect-retry: 10
      _annotate_connect-retry: Reduce default 120s to 10s
      minimum-advertisement-interval: 1
    send-community:
      standard: true
      large: true
    peer-as: 65001
    transport:
      local-address: 10.255.0.8
    next-hop-self: false
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    neighbor:
    - peer-address: 10.255.0.1
      description: berlin
      peer-group: ibgp-ipv4
      afi-safi:
      - afi-safi-name: ipv4-unicast
        admin-state: enable
      - afi-safi-name: ipv6-unicast
        admin-state: disable
- operation: update
  path: /network-instance[name=default]/protocols/bgp/group[group-name=ebgp]
  value:
    admin-state: enable
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
      import-policy:
      - accept_all
      export-policy:
      - default_bgp_export
      - accept_all
    - afi-safi-name: ipv6-unicast
      admin-state: disable
    timers:
      connect-retry: 10
      _annotate_connect-retry: Reduce default 120s to 10s
      minimum-advertisement-interval: 1
    send-community:
      standard: true
      large: true
- operation: update
  path: /network-instance[name=default]/protocols/bgp
  value:
    neighbor:
    - peer-address: 10.0.0.26
      description: frankfurt
      peer-group: ebgp
      afi-safi:
      - afi-safi-name: ipv4-unicast
        admin-state: enable
        export-policy:
        - default_bgp_export
        - accept_all
      - afi-safi-name: ipv6-unicast
        admin-state: disable
      peer-as: 65002
- operation: update
  path: /network-instance[name=default]/protocols/bgp/group[group-name=ebgp]
  value:
    admin-state: enable
    afi-safi:
    - afi-safi-name: ipv4-unicast
      admin-state: enable
      import-policy:
      - accept_all
      export-policy:
      - default_bgp_export
      - accept_all
    - afi-safi-name: ipv6-unicast
