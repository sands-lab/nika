- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.0.0.26]/afi-safi[afi-safi-name=ipv4-unicast]/import-policy
  value:
  - BGP-IN
- operation: replace
  path: /network-instance[name=default]/protocols/bgp/neighbor[peer-address=10.0.0.26]/afi-safi[afi-safi-name=ipv4-unicast]/export-policy
  value:
