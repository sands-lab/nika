hostname berlin
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host frankfurt 10.255.0.2
domain ipv4 host hamburg 10.255.0.3
domain ipv4 host hannover 10.255.0.4
domain ipv4 host karlsruhe 10.255.0.5
domain ipv4 host koeln 10.255.0.6
domain ipv4 host leipzig 10.255.0.7
domain ipv4 host muenchen 10.255.0.8
domain ipv4 host nuernberg 10.255.0.9
domain ipv4 host stuttgart 10.255.0.10
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description berlin -> frankfurt [passive]
 ipv4 address 10.0.0.0 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description berlin -> hamburg [passive]
 ipv4 address 10.0.0.2 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description berlin -> hannover [internal]
 ipv4 address 10.0.0.4 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description berlin -> karlsruhe [internal]
 ipv4 address 10.0.0.6 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description berlin -> koeln [internal]
 ipv4 address 10.0.0.8 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description berlin -> leipzig [internal]
 ipv4 address 10.0.0.10 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description berlin -> muenchen [internal]
 ipv4 address 10.0.0.12 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description berlin -> nuernberg [internal]
 ipv4 address 10.0.0.14 255.255.255.254
!
interface GigabitEthernet0/0/0/8
 no shutdown
 description berlin -> stuttgart [internal]
 ipv4 address 10.0.0.16 255.255.255.254
!
interface GigabitEthernet0/0/0/9
 no shutdown
 description berlin -> stub [stub]
 ipv4 address 10.254.0.1 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
prefix-set CUSTOMERS
  198.51.110.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
    done
  endif
  if destination in CUSTOMERS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.1

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/7
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/8
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/9
   passive enable
   cost 1

!
!
router bgp 65001
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.1
 bgp cluster-id 10.255.0.1

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.4
  remote-as 65001
  description hannover
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.5
  remote-as 65001
  description karlsruhe
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.6
  remote-as 65001
  description koeln
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.7
  remote-as 65001
  description leipzig
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.8
  remote-as 65001
  description muenchen
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.9
  remote-as 65001
  description nuernberg
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.10
  remote-as 65001
  description stuttgart
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.0.0.1
  remote-as 65002
  description frankfurt
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.3
  remote-as 65003
  description hamburg
  address-family ipv4 unicast
   send-community-ebgp

!
!
!
router bgp 65001
!
  neighbor 10.255.0.4
    address-family ipv4 unicast

  neighbor 10.255.0.5
    address-family ipv4 unicast

  neighbor 10.255.0.6
    address-family ipv4 unicast

  neighbor 10.255.0.7
    address-family ipv4 unicast

  neighbor 10.255.0.8
    address-family ipv4 unicast

  neighbor 10.255.0.9
    address-family ipv4 unicast

  neighbor 10.255.0.10
    address-family ipv4 unicast

  neighbor 10.0.0.1
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.3
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out


router bgp 65001
 neighbor 10.255.0.4
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.5
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.6
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.7
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.8
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.9
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.10
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
