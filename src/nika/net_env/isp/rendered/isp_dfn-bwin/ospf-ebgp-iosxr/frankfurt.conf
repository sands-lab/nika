hostname frankfurt
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host berlin 10.255.0.1
domain ipv4 host hamburg 10.255.0.3
domain ipv4 host hannover 10.255.0.4
domain ipv4 host karlsruhe 10.255.0.5
domain ipv4 host koeln 10.255.0.6
domain ipv4 host leipzig 10.255.0.7
domain ipv4 host muenchen 10.255.0.8
domain ipv4 host nuernberg 10.255.0.9
domain ipv4 host stuttgart 10.255.0.10
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.2 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description frankfurt -> berlin [passive]
 ipv4 address 10.0.0.1 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description frankfurt -> hamburg [passive]
 ipv4 address 10.0.0.18 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description frankfurt -> hannover [passive]
 ipv4 address 10.0.0.20 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description frankfurt -> koeln [passive]
 ipv4 address 10.0.0.22 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description frankfurt -> leipzig [passive]
 ipv4 address 10.0.0.24 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description frankfurt -> muenchen [passive]
 ipv4 address 10.0.0.26 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description frankfurt -> stuttgart [passive]
 ipv4 address 10.0.0.28 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description frankfurt -> karlsruhe [passive]
 ipv4 address 10.0.0.48 255.255.255.254
!
interface GigabitEthernet0/0/0/8
 no shutdown
 description frankfurt -> nuernberg [passive]
 ipv4 address 10.0.0.74 255.255.255.254
!
interface GigabitEthernet0/0/0/9
 no shutdown
 description frankfurt -> stub [stub]
 ipv4 address 10.254.0.5 255.255.255.252
!
interface Loopback1
 no shutdown
 description frankfurt -> stub
 ipv4 address 198.51.101.1 255.255.255.0
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
prefix-set CUSTOMERS
  198.51.110.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
    done
  endif
  if destination in CUSTOMERS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.2

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/7
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/8
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/9
   passive enable
   cost 1

!
!
router bgp 65002
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.2
 bgp cluster-id 10.255.0.2

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
  network 198.51.101.0/24
!
 neighbor 10.0.0.0
  remote-as 65001
  description berlin
  address-family ipv4 unicast
   send-community-ebgp

!
