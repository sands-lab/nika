hostname stuttgart
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host berlin 10.255.0.1
domain ipv4 host frankfurt 10.255.0.2
domain ipv4 host hamburg 10.255.0.3
domain ipv4 host hannover 10.255.0.4
domain ipv4 host karlsruhe 10.255.0.5
domain ipv4 host koeln 10.255.0.6
domain ipv4 host leipzig 10.255.0.7
domain ipv4 host muenchen 10.255.0.8
domain ipv4 host nuernberg 10.255.0.9
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.10 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description stuttgart -> berlin [internal]
 ipv4 address 10.0.0.17 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description stuttgart -> frankfurt [internal]
 ipv4 address 10.0.0.29 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description stuttgart -> hamburg [internal]
 ipv4 address 10.0.0.39 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description stuttgart -> hannover [internal]
 ipv4 address 10.0.0.47 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description stuttgart -> karlsruhe [internal]
 ipv4 address 10.0.0.61 255.255.255.254
!
interface GigabitEthernet0/0/0/5
 no shutdown
 description stuttgart -> koeln [internal]
 ipv4 address 10.0.0.67 255.255.255.254
!
interface GigabitEthernet0/0/0/6
 no shutdown
 description stuttgart -> leipzig [internal]
 ipv4 address 10.0.0.71 255.255.255.254
!
interface GigabitEthernet0/0/0/7
 no shutdown
 description stuttgart -> muenchen [internal]
 ipv4 address 10.0.0.73 255.255.255.254
!
interface GigabitEthernet0/0/0/8
 no shutdown
 description stuttgart -> nuernberg [internal]
 ipv4 address 10.0.0.89 255.255.255.254
!
interface GigabitEthernet0/0/0/9
 no shutdown
 description stuttgart -> stub [stub]
 ipv4 address 10.254.0.37 255.255.255.252
!
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.10

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/5
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/6
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/7
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/8
