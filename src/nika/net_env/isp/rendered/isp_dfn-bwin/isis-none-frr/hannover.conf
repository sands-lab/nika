hostname hannover
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description hannover -> berlin [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description hannover -> frankfurt [internal]
 ip address 10.0.0.21/31
!
interface eth2
 no shutdown
 description hannover -> hamburg [internal]
 ip address 10.0.0.31/31
!
interface eth3
 no shutdown
 description hannover -> koeln [internal]
 ip address 10.0.0.40/31
!
interface eth4
 no shutdown
 description hannover -> leipzig [internal]
 ip address 10.0.0.42/31
!
interface eth5
 no shutdown
 description hannover -> muenchen [internal]
 ip address 10.0.0.44/31
!
interface eth6
 no shutdown
 description hannover -> stuttgart [internal]
 ip address 10.0.0.46/31
!
interface eth7
 no shutdown
 description hannover -> karlsruhe [internal]
 ip address 10.0.0.52/31
!
interface eth8
 no shutdown
 description hannover -> nuernberg [internal]
 ip address 10.0.0.78/31
!
interface eth9
 no shutdown
 description hannover -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0004.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! hannover -> berlin
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
