/routing/bgp/template add name=main as=65001 output.network=bgp-networks
/routing/bgp/instance add name=main as=65001

/routing/bgp/instance set [/routing/bgp/instance find name=main] router-id=10.255.0.9


/routing/filter/rule add chain=filter_rr_self_ebgp rule="if ( bgp-input-remote-addr == 10.0.0.74 ) { set gw 10.255.0.9;}"
/routing/filter/rule add chain=filter_rr_self_ebgp rule="if ( bgp-input-remote-addr == 10.0.0.76 ) { set gw 10.255.0.9;}"
/routing/filter/rule add chain=filter_rr_self_ebgp rule="return;"

/routing/filter/rule/add chain=rm_extended_communities rule="delete bgp-ext-communities rt; delete bgp-ext-communities soo; delete bgp-ext-communities other;"
/routing/filter/rule/add chain=rm_extended_communities rule="return;"
/routing/filter/rule/add chain=rm_large_communities rule="delete bgp-large-communities all;"
/routing/filter/rule/add chain=rm_large_communities rule="return;"
/routing/filter/rule/add chain=rm_standard_communities rule="delete bgp-communities other; delete bgp-communities wk;"
/routing/filter/rule/add chain=rm_standard_communities rule="jump rm_large_communities;"
/routing/filter/rule/add chain=rm_standard_communities rule="return;"


/routing/bgp/connection add template=main instance=main name=10_255_0_1 remote.address=10.255.0.1 remote.as=65001 comment="berlin" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_1] afi=ip
/routing/filter/rule add chain=filter_10_255_0_1 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_1] output.filter-chain=filter_10_255_0_1
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_1] local.role=ibgp local.address=10.255.0.9

/routing/filter/rule/add chain=filter_10_255_0_1 rule="jump rm_large_communities;" place-before=0

