hostname berlin
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description berlin -> frankfurt [internal]
 ip address 10.0.0.0/31
!
interface eth1
 no shutdown
 description berlin -> hamburg [internal]
 ip address 10.0.0.2/31
!
interface eth2
 no shutdown
 description berlin -> hannover [internal]
 ip address 10.0.0.4/31
!
interface eth3
 no shutdown
 description berlin -> karlsruhe [internal]
 ip address 10.0.0.6/31
!
interface eth4
 no shutdown
 description berlin -> koeln [internal]
 ip address 10.0.0.8/31
!
interface eth5
 no shutdown
 description berlin -> leipzig [internal]
 ip address 10.0.0.10/31
!
interface eth6
 no shutdown
 description berlin -> muenchen [internal]
 ip address 10.0.0.12/31
!
interface eth7
 no shutdown
 description berlin -> nuernberg [internal]
 ip address 10.0.0.14/31
!
interface eth8
 no shutdown
 description berlin -> stuttgart [internal]
 ip address 10.0.0.16/31
!
interface eth9
 no shutdown
 description berlin -> stub [stub]
 ip address 10.254.0.1/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.1
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! berlin -> frankfurt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
