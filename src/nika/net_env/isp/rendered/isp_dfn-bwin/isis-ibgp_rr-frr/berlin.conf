#!/usr/bin/vtysh -f
!
router bgp 65000
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.1
  bgp cluster-id 10.255.0.1
!
  neighbor 10.255.0.2 remote-as 65000
  neighbor 10.255.0.2 description frankfurt
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.255.0.3 remote-as 65000
  neighbor 10.255.0.3 description hamburg
  neighbor 10.255.0.3 update-source lo
!
  neighbor 10.255.0.4 remote-as 65000
  neighbor 10.255.0.4 description hannover
  neighbor 10.255.0.4 update-source lo
!
  neighbor 10.255.0.5 remote-as 65000
  neighbor 10.255.0.5 description karlsruhe
  neighbor 10.255.0.5 update-source lo
!
  neighbor 10.255.0.6 remote-as 65000
  neighbor 10.255.0.6 description koeln
  neighbor 10.255.0.6 update-source lo
!
  neighbor 10.255.0.7 remote-as 65000
  neighbor 10.255.0.7 description leipzig
  neighbor 10.255.0.7 update-source lo
!
  neighbor 10.255.0.8 remote-as 65000
  neighbor 10.255.0.8 description muenchen
  neighbor 10.255.0.8 update-source lo
!
  neighbor 10.255.0.9 remote-as 65000
  neighbor 10.255.0.9 description nuernberg
  neighbor 10.255.0.9 update-source lo
!
  neighbor 10.255.0.10 remote-as 65000
  neighbor 10.255.0.10 description stuttgart
  neighbor 10.255.0.10 update-source lo
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.2 activate
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
