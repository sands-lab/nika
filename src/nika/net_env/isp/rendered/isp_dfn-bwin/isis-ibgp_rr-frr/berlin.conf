  neighbor 10.255.0.10 route-reflector-client
  no neighbor 10.255.0.10 send-community all
  neighbor 10.255.0.10 send-community standard
  neighbor 10.255.0.10 send-community large
  neighbor 10.255.0.10 send-community extended
!
!

router bgp 65000
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
  neighbor 10.255.0.2 route-map BGP-OUT out
  neighbor 10.255.0.3 route-map BGP-IN in
  neighbor 10.255.0.3 route-map BGP-OUT out
  neighbor 10.255.0.4 route-map BGP-IN in
