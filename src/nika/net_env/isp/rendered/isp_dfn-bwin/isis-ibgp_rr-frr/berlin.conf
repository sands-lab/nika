hostname berlin
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description berlin -> frankfurt [internal]
 ip address 10.0.0.0/31
!
interface eth1
 no shutdown
 description berlin -> hamburg [internal]
 ip address 10.0.0.2/31
!
interface eth2
 no shutdown
 description berlin -> hannover [internal]
 ip address 10.0.0.4/31
!
interface eth3
 no shutdown
 description berlin -> karlsruhe [internal]
 ip address 10.0.0.6/31
!
interface eth4
 no shutdown
 description berlin -> koeln [internal]
 ip address 10.0.0.8/31
!
interface eth5
 no shutdown
 description berlin -> leipzig [internal]
 ip address 10.0.0.10/31
!
interface eth6
 no shutdown
 description berlin -> muenchen [internal]
 ip address 10.0.0.12/31
!
interface eth7
 no shutdown
 description berlin -> nuernberg [internal]
 ip address 10.0.0.14/31
!
interface eth8
 no shutdown
 description berlin -> stuttgart [internal]
 ip address 10.0.0.16/31
!
interface eth9
 no shutdown
 description berlin -> stub [stub]
 ip address 10.254.0.1/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0001.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! berlin -> frankfurt
 ip router isis CORE
