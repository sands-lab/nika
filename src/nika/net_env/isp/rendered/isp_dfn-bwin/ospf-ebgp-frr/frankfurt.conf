#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.2
  bgp cluster-id 10.255.0.2
!
  neighbor 10.0.0.0 remote-as 65001
  neighbor 10.0.0.0 description berlin
!
  neighbor 10.0.0.19 remote-as 65003
  neighbor 10.0.0.19 description hamburg
!
  neighbor 10.0.0.21 remote-as 65001
  neighbor 10.0.0.21 description hannover
!
  neighbor 10.0.0.23 remote-as 65001
  neighbor 10.0.0.23 description koeln
!
  neighbor 10.0.0.25 remote-as 65001
  neighbor 10.0.0.25 description leipzig
!
  neighbor 10.0.0.27 remote-as 65001
  neighbor 10.0.0.27 description muenchen
!
  neighbor 10.0.0.29 remote-as 65001
  neighbor 10.0.0.29 description stuttgart
!
  neighbor 10.0.0.49 remote-as 65001
  neighbor 10.0.0.49 description karlsruhe
!
  neighbor 10.0.0.75 remote-as 65001
  neighbor 10.0.0.75 description nuernberg
!
 address-family ipv4 unicast
!

  network 198.51.101.0/24
!
  neighbor 10.0.0.0 activate
  no neighbor 10.0.0.0 send-community all
  neighbor 10.0.0.0 send-community standard
  neighbor 10.0.0.0 send-community large
!
  neighbor 10.0.0.19 activate
