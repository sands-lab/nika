hostname frankfurt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description frankfurt -> berlin [passive]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description frankfurt -> hamburg [passive]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description frankfurt -> hannover [passive]
 ip address 10.0.0.20/31
!
interface eth3
 no shutdown
 description frankfurt -> koeln [passive]
 ip address 10.0.0.22/31
!
interface eth4
 no shutdown
 description frankfurt -> leipzig [passive]
 ip address 10.0.0.24/31
!
interface eth5
 no shutdown
 description frankfurt -> muenchen [passive]
 ip address 10.0.0.26/31
!
interface eth6
 no shutdown
 description frankfurt -> stuttgart [passive]
 ip address 10.0.0.28/31
!
interface eth7
 no shutdown
 description frankfurt -> karlsruhe [passive]
 ip address 10.0.0.48/31
!
interface eth8
 no shutdown
 description frankfurt -> nuernberg [passive]
 ip address 10.0.0.74/31
!
interface eth9
 no shutdown
 description frankfurt -> stub [stub]
 ip address 10.254.0.5/30
!
interface lo1
 no shutdown
 description frankfurt -> stub
 ip address 198.51.101.1/24
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! frankfurt -> berlin
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth1
! frankfurt -> hamburg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! frankfurt -> hannover
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! frankfurt -> koeln
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth4
! frankfurt -> leipzig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth5
! frankfurt -> muenchen
 ip ospf area 0.0.0.0
