 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! berlin -> karlsruhe
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! berlin -> koeln
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! berlin -> leipzig
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
