#!/usr/bin/vtysh -f

!
router bgp 65001
!
! Global address families
  address-family ipv4








    neighbor 10.0.0.1 route-map BGP-IN in
    neighbor 10.0.0.1 route-map BGP-OUT out

    neighbor 10.0.0.3 route-map BGP-IN in
    neighbor 10.0.0.3 route-map BGP-OUT out

!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.4 route-map BGP-IN in
  neighbor 10.255.0.5 route-map BGP-IN in
  neighbor 10.255.0.6 route-map BGP-IN in
  neighbor 10.255.0.7 route-map BGP-IN in
  neighbor 10.255.0.8 route-map BGP-IN in
  neighbor 10.255.0.9 route-map BGP-IN in
  neighbor 10.255.0.10 route-map BGP-IN in
 exit-address-family
!
