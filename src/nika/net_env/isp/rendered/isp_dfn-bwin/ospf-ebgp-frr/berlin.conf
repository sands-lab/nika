#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.1
  bgp cluster-id 10.255.0.1
!
  neighbor 10.255.0.4 remote-as 65001
  neighbor 10.255.0.4 description hannover
  neighbor 10.255.0.4 update-source lo
!
  neighbor 10.255.0.5 remote-as 65001
  neighbor 10.255.0.5 description karlsruhe
  neighbor 10.255.0.5 update-source lo
!
  neighbor 10.255.0.6 remote-as 65001
  neighbor 10.255.0.6 description koeln
  neighbor 10.255.0.6 update-source lo
!
  neighbor 10.255.0.7 remote-as 65001
  neighbor 10.255.0.7 description leipzig
  neighbor 10.255.0.7 update-source lo
!
  neighbor 10.255.0.8 remote-as 65001
  neighbor 10.255.0.8 description muenchen
  neighbor 10.255.0.8 update-source lo
!
  neighbor 10.255.0.9 remote-as 65001
  neighbor 10.255.0.9 description nuernberg
  neighbor 10.255.0.9 update-source lo
!
  neighbor 10.255.0.10 remote-as 65001
  neighbor 10.255.0.10 description stuttgart
  neighbor 10.255.0.10 update-source lo
!
  neighbor 10.0.0.1 remote-as 65002
  neighbor 10.0.0.1 description frankfurt
!
  neighbor 10.0.0.3 remote-as 65003
  neighbor 10.0.0.3 description hamburg
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.4 next-hop-self
