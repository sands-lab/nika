hostname muenchen
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.8/32
!
interface eth0
 no shutdown
 description muenchen -> berlin [internal]
 ip address 10.0.0.13/31
!
interface eth1
 no shutdown
 description muenchen -> frankfurt [passive]
 ip address 10.0.0.27/31
!
interface eth2
 no shutdown
 description muenchen -> hamburg [passive]
 ip address 10.0.0.37/31
!
interface eth3
 no shutdown
 description muenchen -> hannover [internal]
 ip address 10.0.0.45/31
!
interface eth4
 no shutdown
 description muenchen -> karlsruhe [internal]
 ip address 10.0.0.59/31
!
interface eth5
 no shutdown
 description muenchen -> koeln [internal]
 ip address 10.0.0.65/31
!
interface eth6
 no shutdown
 description muenchen -> leipzig [internal]
 ip address 10.0.0.69/31
!
interface eth7
 no shutdown
 description muenchen -> stuttgart [internal]
 ip address 10.0.0.72/31
!
interface eth8
 no shutdown
 description muenchen -> nuernberg [internal]
 ip address 10.0.0.86/31
!
interface eth9
 no shutdown
 description muenchen -> stub [stub]
 ip address 10.254.0.29/30
!
