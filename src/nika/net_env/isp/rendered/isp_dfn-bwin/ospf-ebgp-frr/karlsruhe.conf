 ip address 10.0.0.51/31
!
interface eth3
 no shutdown
 description karlsruhe -> hannover [internal]
 ip address 10.0.0.53/31
!
interface eth4
 no shutdown
 description karlsruhe -> koeln [internal]
 ip address 10.0.0.54/31
!
interface eth5
 no shutdown
 description karlsruhe -> leipzig [internal]
 ip address 10.0.0.56/31
!
interface eth6
 no shutdown
 description karlsruhe -> muenchen [internal]
 ip address 10.0.0.58/31
!
interface eth7
 no shutdown
 description karlsruhe -> stuttgart [internal]
 ip address 10.0.0.60/31
!
interface eth8
 no shutdown
