hostname n22
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.22/32
!
interface eth0
 no shutdown
 description n22 -> n15 [passive]
 ip address 10.0.0.47/31
!
interface eth1
 no shutdown
 description n22 -> n09 [passive]
 ip address 10.0.0.71/31
!
interface eth2
 no shutdown
 description n22 -> n20 [internal]
 ip address 10.0.0.73/31
!
interface eth3
 no shutdown
 description n22 -> n23 [internal]
 ip address 10.0.0.74/31
!
interface eth4
 no shutdown
 description n22 -> n24 [internal]
 ip address 10.0.0.76/31
!
interface eth5
 no shutdown
 description n22 -> stub [stub]
 ip address 10.254.0.85/30
!
interface lo1
 no shutdown
 description n22 -> stub
 ip address 198.51.102.1/24
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.22
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n22 -> n15
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth1
! n22 -> n09
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! n22 -> n20
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n22 -> n23
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n22 -> n24
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n22 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.22
!
  neighbor 10.255.0.18 remote-as 65003
  neighbor 10.255.0.18 description n18
  neighbor 10.255.0.18 update-source lo
!
  neighbor 10.0.0.46 remote-as 65001
  neighbor 10.0.0.46 description n15
!
  neighbor 10.0.0.70 remote-as 65001
  neighbor 10.0.0.70 description n09
!
 address-family ipv4 unicast
!

  network 198.51.102.0/24
!
  neighbor 10.255.0.18 activate
  neighbor 10.255.0.18 next-hop-self
  no neighbor 10.255.0.18 send-community all
  neighbor 10.255.0.18 send-community standard
  neighbor 10.255.0.18 send-community large
  neighbor 10.255.0.18 send-community extended
!
  neighbor 10.0.0.46 activate
  no neighbor 10.0.0.46 send-community all
  neighbor 10.0.0.46 send-community standard
  neighbor 10.0.0.46 send-community large
!
  neighbor 10.0.0.70 activate
  no neighbor 10.0.0.70 send-community all
  neighbor 10.0.0.70 send-community standard
  neighbor 10.0.0.70 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.46 route-map BGP-IN in
    neighbor 10.0.0.46 route-map BGP-OUT out

    neighbor 10.0.0.70 route-map BGP-IN in
    neighbor 10.0.0.70 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.18 route-map BGP-IN in
 exit-address-family
!
