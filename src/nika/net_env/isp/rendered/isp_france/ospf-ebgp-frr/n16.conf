#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.16
!
  neighbor 10.255.0.10 remote-as 65002
  neighbor 10.255.0.10 description n10
  neighbor 10.255.0.10 update-source lo
!
  neighbor 10.0.0.38 remote-as 65001
  neighbor 10.0.0.38 description n15
!
  neighbor 10.0.0.50 remote-as 65001
  neighbor 10.0.0.50 description n09
!
 address-family ipv4 unicast
!

  network 198.51.110.0/24
  network 198.51.101.0/24
!
  neighbor 10.255.0.10 activate
  neighbor 10.255.0.10 next-hop-self
  no neighbor 10.255.0.10 send-community all
  neighbor 10.255.0.10 send-community standard
  neighbor 10.255.0.10 send-community large
  neighbor 10.255.0.10 send-community extended
!
  neighbor 10.0.0.38 activate
  no neighbor 10.0.0.38 send-community all
  neighbor 10.0.0.38 send-community standard
  neighbor 10.0.0.38 send-community large
!
  neighbor 10.0.0.50 activate
  no neighbor 10.0.0.50 send-community all
  neighbor 10.0.0.50 send-community standard
  neighbor 10.0.0.50 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.38 route-map BGP-IN in
    neighbor 10.0.0.38 route-map BGP-OUT out

    neighbor 10.0.0.50 route-map BGP-IN in
    neighbor 10.0.0.50 route-map BGP-OUT-AS65001 out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.10 route-map BGP-IN in
 exit-address-family
!
