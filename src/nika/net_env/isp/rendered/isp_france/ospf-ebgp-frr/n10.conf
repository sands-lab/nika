#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4





    neighbor 10.0.0.6 route-map BGP-IN in
    neighbor 10.0.0.6 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.11 route-map BGP-IN in
  neighbor 10.255.0.12 route-map BGP-IN in
  neighbor 10.255.0.16 route-map BGP-IN in
  neighbor 10.255.0.17 route-map BGP-IN in
 exit-address-family
!
