#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.10
  bgp cluster-id 10.255.0.10
!
  neighbor 10.255.0.11 remote-as 65002
  neighbor 10.255.0.11 description n11
  neighbor 10.255.0.11 update-source lo
!
  neighbor 10.255.0.12 remote-as 65002
  neighbor 10.255.0.12 description n12
  neighbor 10.255.0.12 update-source lo
!
  neighbor 10.255.0.16 remote-as 65002
  neighbor 10.255.0.16 description n16
  neighbor 10.255.0.16 update-source lo
!
  neighbor 10.255.0.17 remote-as 65002
  neighbor 10.255.0.17 description n17
  neighbor 10.255.0.17 update-source lo
!
  neighbor 10.0.0.6 remote-as 65001
  neighbor 10.0.0.6 description n03
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.11 activate
  neighbor 10.255.0.11 next-hop-self
  neighbor 10.255.0.11 route-reflector-client
  no neighbor 10.255.0.11 send-community all
  neighbor 10.255.0.11 send-community standard
  neighbor 10.255.0.11 send-community large
  neighbor 10.255.0.11 send-community extended
!
  neighbor 10.255.0.12 activate
  neighbor 10.255.0.12 next-hop-self
  neighbor 10.255.0.12 route-reflector-client
  no neighbor 10.255.0.12 send-community all
  neighbor 10.255.0.12 send-community standard
  neighbor 10.255.0.12 send-community large
  neighbor 10.255.0.12 send-community extended
!
  neighbor 10.255.0.16 activate
  neighbor 10.255.0.16 next-hop-self
  neighbor 10.255.0.16 route-reflector-client
  no neighbor 10.255.0.16 send-community all
  neighbor 10.255.0.16 send-community standard
  neighbor 10.255.0.16 send-community large
  neighbor 10.255.0.16 send-community extended
!
  neighbor 10.255.0.17 activate
  neighbor 10.255.0.17 next-hop-self
  neighbor 10.255.0.17 route-reflector-client
  no neighbor 10.255.0.17 send-community all
  neighbor 10.255.0.17 send-community standard
  neighbor 10.255.0.17 send-community large
  neighbor 10.255.0.17 send-community extended
!
  neighbor 10.0.0.6 activate
  no neighbor 10.0.0.6 send-community all
  neighbor 10.0.0.6 send-community standard
  neighbor 10.0.0.6 send-community large
!
!
