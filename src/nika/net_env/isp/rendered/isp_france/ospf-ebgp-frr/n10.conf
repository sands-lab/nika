hostname n10
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description n10 -> n03 [passive]
 ip address 10.0.0.7/31
!
interface eth1
 no shutdown
 description n10 -> n12 [internal]
 ip address 10.0.0.22/31
!
interface eth2
 no shutdown
 description n10 -> n11 [internal]
 ip address 10.0.0.24/31
!
interface eth3
 no shutdown
 description n10 -> n16 [internal]
 ip address 10.0.0.52/31
!
interface eth4
 no shutdown
 description n10 -> n17 [internal]
 ip address 10.0.0.58/31
!
interface eth5
 no shutdown
 description n10 -> stub [stub]
 ip address 10.254.0.37/30
!
