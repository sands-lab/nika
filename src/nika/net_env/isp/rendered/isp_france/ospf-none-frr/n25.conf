hostname n25
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.25/32
!
interface eth0
 no shutdown
 description n25 -> n15 [internal]
 ip address 10.0.0.49/31
!
interface eth1
 no shutdown
 description n25 -> n01 [internal]
 ip address 10.0.0.81/31
!
interface eth2
 no shutdown
 description n25 -> n02 [internal]
