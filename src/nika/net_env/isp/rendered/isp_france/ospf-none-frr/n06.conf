hostname n06
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.6/32
!
interface eth0
 no shutdown
 description n06 -> n04 [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description n06 -> n05 [internal]
 ip address 10.0.0.13/31
!
interface eth2
 no shutdown
 description n06 -> n07 [internal]
 ip address 10.0.0.14/31
!
interface eth3
 no shutdown
 description n06 -> n08 [internal]
 ip address 10.0.0.16/31
!
interface eth4
 no shutdown
 description n06 -> stub [stub]
 ip address 10.254.0.21/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.6
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n06 -> n04
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n06 -> n05
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n06 -> n07
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n06 -> n08
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n06 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
