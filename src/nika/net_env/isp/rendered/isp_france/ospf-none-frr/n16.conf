hostname n16
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.16/32
!
interface eth0
 no shutdown
 description n16 -> n15 [internal]
 ip address 10.0.0.39/31
!
interface eth1
 no shutdown
 description n16 -> n09 [internal]
 ip address 10.0.0.51/31
!
interface eth2
 no shutdown
 description n16 -> n10 [internal]
 ip address 10.0.0.53/31
!
interface eth3
 no shutdown
 description n16 -> n11 [internal]
 ip address 10.0.0.55/31
!
interface eth4
 no shutdown
 description n16 -> n12 [internal]
 ip address 10.0.0.57/31
!
interface eth5
 no shutdown
 description n16 -> n17 [internal]
 ip address 10.0.0.60/31
!
interface eth6
 no shutdown
 description n16 -> stub [stub]
 ip address 10.254.0.61/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.16
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n16 -> n15
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n16 -> n09
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n16 -> n10
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n16 -> n11
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n16 -> n12
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n16 -> n17
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! n16 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
