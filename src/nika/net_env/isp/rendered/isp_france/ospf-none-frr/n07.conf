hostname n07
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description n07 -> n03 [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description n07 -> n06 [internal]
 ip address 10.0.0.15/31
!
interface eth2
 no shutdown
 description n07 -> n08 [internal]
 ip address 10.0.0.18/31
!
interface eth3
 no shutdown
 description n07 -> stub [stub]
 ip address 10.254.0.25/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.7
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n07 -> n03
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n07 -> n06
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n07 -> n08
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n07 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
