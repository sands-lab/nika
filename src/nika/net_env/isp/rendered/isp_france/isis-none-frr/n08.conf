hostname n08
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.8/32
!
interface eth0
 no shutdown
 description n08 -> n06 [internal]
 ip address 10.0.0.17/31
!
interface eth1
 no shutdown
 description n08 -> n07 [internal]
 ip address 10.0.0.19/31
!
interface eth2
 no shutdown
 description n08 -> n09 [internal]
 ip address 10.0.0.20/31
