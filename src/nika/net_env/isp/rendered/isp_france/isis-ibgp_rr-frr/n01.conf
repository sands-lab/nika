hostname n01
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description n01 -> n02 [internal]
 ip address 10.0.0.0/31
!
interface eth1
 no shutdown
 description n01 -> n25 [internal]
 ip address 10.0.0.80/31
!
interface eth2
 no shutdown
 description n01 -> stub [stub]
 ip address 10.254.0.1/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0001.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n01 -> n02
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n01 -> n25
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n01 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
