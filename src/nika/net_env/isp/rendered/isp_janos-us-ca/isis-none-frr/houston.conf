hostname houston
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.12/32
!
interface eth0
 no shutdown
 description houston -> elpaso [internal]
 ip address 10.0.0.65/31
!
interface eth1
 no shutdown
 description houston -> dallas [internal]
 ip address 10.0.0.73/31
!
interface eth2
 no shutdown
 description houston -> elpaso [internal]
 ip address 10.0.0.81/31
!
interface eth3
 no shutdown
 description houston -> dallas [internal]
 ip address 10.0.0.83/31
!
interface eth4
 no shutdown
 description houston -> neworleans [internal]
 ip address 10.0.0.84/31
!
interface eth5
 no shutdown
 description houston -> neworleans [internal]
 ip address 10.0.0.186/31
!
interface eth6
 no shutdown
 description houston -> stub [stub]
 ip address 10.254.0.45/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000c.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! houston -> elpaso
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! houston -> dallas
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! houston -> elpaso
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! houston -> dallas
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! houston -> neworleans
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! houston -> neworleans
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth6
! houston -> stub
