hostname philadelphia
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.25/32
!
interface eth0
 no shutdown
 description philadelphia -> newyork [internal]
 ip address 10.0.0.169/31
!
interface eth1
 no shutdown
 description philadelphia -> washingtondc [internal]
 ip address 10.0.0.214/31
!
interface eth2
 no shutdown
 description philadelphia -> newyork [internal]
 ip address 10.0.0.219/31
!
interface eth3
 no shutdown
 description philadelphia -> washingtondc [internal]
 ip address 10.0.0.220/31
!
interface eth4
 no shutdown
 description philadelphia -> stub [stub]
 ip address 10.254.0.97/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0019.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! philadelphia -> newyork
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! philadelphia -> washingtondc
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! philadelphia -> newyork
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! philadelphia -> washingtondc
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! philadelphia -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
