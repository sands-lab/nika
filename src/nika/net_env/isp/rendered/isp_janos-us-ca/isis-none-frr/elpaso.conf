hostname elpaso
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description elpaso -> phoenix [internal]
 ip address 10.0.0.44/31
!
interface eth1
 no shutdown
 description elpaso -> dallas [internal]
 ip address 10.0.0.63/31
!
interface eth2
 no shutdown
 description elpaso -> houston [internal]
 ip address 10.0.0.64/31
!
interface eth3
 no shutdown
 description elpaso -> phoenix [internal]
 ip address 10.0.0.66/31
!
interface eth4
 no shutdown
 description elpaso -> dallas [internal]
 ip address 10.0.0.71/31
!
interface eth5
 no shutdown
 description elpaso -> houston [internal]
 ip address 10.0.0.80/31
!
interface eth6
 no shutdown
 description elpaso -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000b.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! elpaso -> phoenix
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! elpaso -> dallas
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! elpaso -> houston
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! elpaso -> phoenix
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! elpaso -> dallas
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! elpaso -> houston
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth6
! elpaso -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

