hostname sandiego
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.31/32
!
interface eth0
 no shutdown
 description sandiego -> phoenix [internal]
 ip address 10.0.0.47/31
!
interface eth1
 no shutdown
 description sandiego -> losangeles [internal]
 ip address 10.0.0.51/31
!
interface eth2
 no shutdown
 description sandiego -> phoenix [internal]
 ip address 10.0.0.53/31
!
interface eth3
 no shutdown
 description sandiego -> losangeles [internal]
 ip address 10.0.0.113/31
!
interface eth4
 no shutdown
 description sandiego -> stub [stub]
 ip address 10.254.0.121/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001f.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! sandiego -> phoenix
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! sandiego -> losangeles
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! sandiego -> phoenix
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! sandiego -> losangeles
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! sandiego -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
