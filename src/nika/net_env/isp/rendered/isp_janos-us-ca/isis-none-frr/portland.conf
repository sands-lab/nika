hostname portland
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.28/32
!
interface eth0
 no shutdown
 description portland -> seattle [internal]
 ip address 10.0.0.28/31
!
interface eth1
 no shutdown
 description portland -> sanfrancisco [internal]
 ip address 10.0.0.30/31
!
interface eth2
 no shutdown
 description portland -> saltlakecity [internal]
 ip address 10.0.0.32/31
!
interface eth3
 no shutdown
 description portland -> seattle [internal]
 ip address 10.0.0.34/31
!
interface eth4
 no shutdown
 description portland -> saltlakecity [internal]
 ip address 10.0.0.58/31
!
interface eth5
 no shutdown
 description portland -> sanfrancisco [internal]
 ip address 10.0.0.156/31
!
interface eth6
 no shutdown
 description portland -> stub [stub]
 ip address 10.254.0.109/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.001c.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! portland -> seattle
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! portland -> sanfrancisco
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! portland -> saltlakecity
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! portland -> seattle
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! portland -> saltlakecity
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! portland -> sanfrancisco
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth6
! portland -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
