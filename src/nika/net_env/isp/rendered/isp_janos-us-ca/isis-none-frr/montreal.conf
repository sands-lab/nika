hostname montreal
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description montreal -> boston [internal]
 ip address 10.0.0.173/31
!
interface eth1
 no shutdown
 description montreal -> toronto [internal]
 ip address 10.0.0.174/31
!
interface eth2
 no shutdown
 description montreal -> boston [internal]
 ip address 10.0.0.197/31
!
interface eth3
 no shutdown
 description montreal -> toronto [internal]
 ip address 10.0.0.228/31
!
interface eth4
 no shutdown
 description montreal -> stub [stub]
 ip address 10.254.0.77/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0014.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! montreal -> boston
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! montreal -> toronto
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! montreal -> boston
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! montreal -> toronto
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! montreal -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
