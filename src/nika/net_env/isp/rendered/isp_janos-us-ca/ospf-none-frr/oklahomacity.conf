hostname oklahomacity
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.24/32
!
interface eth0
 no shutdown
 description oklahomacity -> dallas [internal]
 ip address 10.0.0.75/31
!
interface eth1
 no shutdown
 description oklahomacity -> dallas [internal]
 ip address 10.0.0.87/31
!
interface eth2
 no shutdown
 description oklahomacity -> kansascity [internal]
 ip address 10.0.0.89/31
!
interface eth3
 no shutdown
 description oklahomacity -> kansascity [internal]
 ip address 10.0.0.99/31
!
interface eth4
 no shutdown
 description oklahomacity -> stub [stub]
 ip address 10.254.0.93/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.24
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! oklahomacity -> dallas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! oklahomacity -> dallas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! oklahomacity -> kansascity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! oklahomacity -> kansascity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! oklahomacity -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
