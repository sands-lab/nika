hostname denver
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.9/32
!
interface eth0
 no shutdown
 description denver -> saltlakecity [internal]
 ip address 10.0.0.54/31
!
interface eth1
 no shutdown
 description denver -> dallas [internal]
 ip address 10.0.0.77/31
!
interface eth2
 no shutdown
 description denver -> kansascity [internal]
 ip address 10.0.0.102/31
!
interface eth3
 no shutdown
 description denver -> saltlakecity [internal]
 ip address 10.0.0.106/31
!
interface eth4
 no shutdown
 description denver -> dallas [internal]
 ip address 10.0.0.109/31
!
interface eth5
 no shutdown
 description denver -> kansascity [internal]
 ip address 10.0.0.110/31
!
interface eth6
 no shutdown
 description denver -> stub [stub]
