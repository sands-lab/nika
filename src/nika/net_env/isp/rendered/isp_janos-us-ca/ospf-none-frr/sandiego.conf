hostname sandiego
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.31/32
!
interface eth0
 no shutdown
 description sandiego -> phoenix [internal]
 ip address 10.0.0.47/31
!
interface eth1
 no shutdown
 description sandiego -> losangeles [internal]
 ip address 10.0.0.51/31
!
interface eth2
 no shutdown
 description sandiego -> phoenix [internal]
 ip address 10.0.0.53/31
!
interface eth3
 no shutdown
 description sandiego -> losangeles [internal]
 ip address 10.0.0.113/31
!
interface eth4
 no shutdown
 description sandiego -> stub [stub]
 ip address 10.254.0.121/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.31
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! sandiego -> phoenix
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! sandiego -> losangeles
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! sandiego -> phoenix
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! sandiego -> losangeles
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! sandiego -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
