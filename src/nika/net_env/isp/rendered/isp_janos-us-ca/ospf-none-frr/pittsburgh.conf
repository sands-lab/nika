hostname pittsburgh
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.27/32
!
interface eth0
 no shutdown
 description pittsburgh -> cleveland [internal]
 ip address 10.0.0.161/31
!
interface eth1
 no shutdown
 description pittsburgh -> washingtondc [internal]
 ip address 10.0.0.216/31
!
interface eth2
 no shutdown
 description pittsburgh -> cleveland [internal]
 ip address 10.0.0.231/31
!
interface eth3
 no shutdown
 description pittsburgh -> washingtondc [internal]
 ip address 10.0.0.232/31
!
interface eth4
 no shutdown
 description pittsburgh -> stub [stub]
 ip address 10.254.0.105/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.27
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! pittsburgh -> cleveland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! pittsburgh -> washingtondc
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! pittsburgh -> cleveland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! pittsburgh -> washingtondc
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! pittsburgh -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
