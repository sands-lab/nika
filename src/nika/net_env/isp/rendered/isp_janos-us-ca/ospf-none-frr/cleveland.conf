!
interface eth3
 no shutdown
 description cleveland -> pittsburgh [internal]
 ip address 10.0.0.160/31
!
interface eth4
 no shutdown
 description cleveland -> cincinnati [internal]
 ip address 10.0.0.163/31
!
interface eth5
 no shutdown
 description cleveland -> newyork [internal]
 ip address 10.0.0.164/31
!
interface eth6
 no shutdown
 description cleveland -> pittsburgh [internal]
 ip address 10.0.0.230/31
!
interface eth7
 no shutdown
 description cleveland -> cincinnati [internal]
 ip address 10.0.0.237/31
!
interface eth8
 no shutdown
 description cleveland -> stub [stub]
