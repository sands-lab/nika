hostname cleveland
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description cleveland -> detroit [internal]
 ip address 10.0.0.132/31
!
interface eth1
 no shutdown
 description cleveland -> detroit [internal]
 ip address 10.0.0.154/31
!
interface eth2
 no shutdown
