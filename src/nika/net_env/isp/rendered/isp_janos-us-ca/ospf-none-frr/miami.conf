hostname miami
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.18/32
!
interface eth0
 no shutdown
 description miami -> neworleans [internal]
 ip address 10.0.0.190/31
!
interface eth1
 no shutdown
 description miami -> neworleans [internal]
 ip address 10.0.0.208/31
!
interface eth2
 no shutdown
 description miami -> tampa [internal]
 ip address 10.0.0.210/31
!
interface eth3
 no shutdown
 description miami -> tampa [internal]
 ip address 10.0.0.242/31
!
interface eth4
 no shutdown
 description miami -> stub [stub]
 ip address 10.254.0.69/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.18
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! miami -> neworleans
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! miami -> neworleans
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! miami -> tampa
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! miami -> tampa
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! miami -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
