hostname tampa
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.35/32
!
interface eth0
 no shutdown
 description tampa -> charlotte [internal]
 ip address 10.0.0.185/31
!
interface eth1
 no shutdown
 description tampa -> atlanta [internal]
 ip address 10.0.0.207/31
!
interface eth2
 no shutdown
 description tampa -> miami [internal]
 ip address 10.0.0.211/31
!
interface eth3
 no shutdown
 description tampa -> charlotte [internal]
 ip address 10.0.0.239/31
!
interface eth4
 no shutdown
 description tampa -> atlanta [internal]
 ip address 10.0.0.241/31
!
interface eth5
 no shutdown
 description tampa -> miami [internal]
 ip address 10.0.0.243/31
