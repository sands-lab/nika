hostname philadelphia
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.25/32
!
interface eth0
 no shutdown
 description philadelphia -> newyork [internal]
 ip address 10.0.0.169/31
!
interface eth1
 no shutdown
 description philadelphia -> washingtondc [internal]
 ip address 10.0.0.214/31
!
interface eth2
 no shutdown
 description philadelphia -> newyork [internal]
 ip address 10.0.0.219/31
!
interface eth3
 no shutdown
 description philadelphia -> washingtondc [internal]
 ip address 10.0.0.220/31
!
interface eth4
 no shutdown
 description philadelphia -> stub [stub]
 ip address 10.254.0.97/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.25
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! philadelphia -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! philadelphia -> washingtondc
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! philadelphia -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! philadelphia -> washingtondc
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! philadelphia -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
