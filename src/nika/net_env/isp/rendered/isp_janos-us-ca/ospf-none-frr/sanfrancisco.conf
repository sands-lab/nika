hostname sanfrancisco
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.32/32
!
interface eth0
 no shutdown
 description sanfrancisco -> portland [internal]
 ip address 10.0.0.31/31
!
interface eth1
 no shutdown
 description sanfrancisco -> sacrameto [internal]
 ip address 10.0.0.37/31
!
interface eth2
 no shutdown
 description sanfrancisco -> losangeles [internal]
 ip address 10.0.0.69/31
!
interface eth3
 no shutdown
 description sanfrancisco -> losangeles [internal]
 ip address 10.0.0.135/31
!
interface eth4
 no shutdown
 description sanfrancisco -> portland [internal]
 ip address 10.0.0.157/31
!
interface eth5
 no shutdown
 description sanfrancisco -> sacrameto [internal]
 ip address 10.0.0.179/31
!
interface eth6
 no shutdown
 description sanfrancisco -> stub [stub]
 ip address 10.254.0.125/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.32
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! sanfrancisco -> portland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! sanfrancisco -> sacrameto
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! sanfrancisco -> losangeles
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! sanfrancisco -> losangeles
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! sanfrancisco -> portland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! sanfrancisco -> sacrameto
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! sanfrancisco -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
