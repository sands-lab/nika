hostname phoenix
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.26/32
!
interface eth0
 no shutdown
 description phoenix -> lasvegas [internal]
 ip address 10.0.0.27/31
!
interface eth1
 no shutdown
 description phoenix -> lasvegas [internal]
 ip address 10.0.0.43/31
!
interface eth2
 no shutdown
 description phoenix -> elpaso [internal]
 ip address 10.0.0.45/31
!
interface eth3
 no shutdown
 description phoenix -> sandiego [internal]
 ip address 10.0.0.46/31
!
interface eth4
 no shutdown
 description phoenix -> sandiego [internal]
 ip address 10.0.0.52/31
!
interface eth5
 no shutdown
 description phoenix -> elpaso [internal]
 ip address 10.0.0.67/31
!
interface eth6
 no shutdown
 description phoenix -> stub [stub]
 ip address 10.254.0.101/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.26
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! phoenix -> lasvegas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! phoenix -> lasvegas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! phoenix -> elpaso
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! phoenix -> sandiego
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! phoenix -> sandiego
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! phoenix -> elpaso
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! phoenix -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
