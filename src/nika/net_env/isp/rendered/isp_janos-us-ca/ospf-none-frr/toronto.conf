hostname toronto
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.36/32
!
interface eth0
 no shutdown
 description toronto -> detroit [internal]
 ip address 10.0.0.137/31
!
interface eth1
 no shutdown
 description toronto -> newyork [internal]
 ip address 10.0.0.171/31
!
interface eth2
 no shutdown
 description toronto -> montreal [internal]
 ip address 10.0.0.175/31
!
interface eth3
 no shutdown
 description toronto -> detroit [internal]
 ip address 10.0.0.225/31
!
interface eth4
 no shutdown
 description toronto -> newyork [internal]
 ip address 10.0.0.227/31
!
interface eth5
 no shutdown
 description toronto -> montreal [internal]
 ip address 10.0.0.229/31
!
interface eth6
 no shutdown
 description toronto -> stub [stub]
 ip address 10.254.0.141/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.36
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! toronto -> detroit
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! toronto -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! toronto -> montreal
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! toronto -> detroit
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! toronto -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! toronto -> montreal
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! toronto -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
