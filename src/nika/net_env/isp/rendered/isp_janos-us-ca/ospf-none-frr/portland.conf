hostname portland
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.28/32
!
interface eth0
 no shutdown
 description portland -> seattle [internal]
 ip address 10.0.0.28/31
!
interface eth1
 no shutdown
 description portland -> sanfrancisco [internal]
 ip address 10.0.0.30/31
!
interface eth2
 no shutdown
 description portland -> saltlakecity [internal]
 ip address 10.0.0.32/31
!
interface eth3
 no shutdown
 description portland -> seattle [internal]
 ip address 10.0.0.34/31
!
interface eth4
 no shutdown
 description portland -> saltlakecity [internal]
 ip address 10.0.0.58/31
!
interface eth5
 no shutdown
 description portland -> sanfrancisco [internal]
 ip address 10.0.0.156/31
!
interface eth6
 no shutdown
 description portland -> stub [stub]
 ip address 10.254.0.109/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.28
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! portland -> seattle
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! portland -> sanfrancisco
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! portland -> saltlakecity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! portland -> seattle
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! portland -> saltlakecity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! portland -> sanfrancisco
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! portland -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
