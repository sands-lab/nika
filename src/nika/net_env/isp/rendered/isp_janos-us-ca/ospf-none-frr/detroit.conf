hostname detroit
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description detroit -> chicago [internal]
 ip address 10.0.0.119/31
!
interface eth1
 no shutdown
 description detroit -> chicago [internal]
 ip address 10.0.0.131/31
!
interface eth2
 no shutdown
 description detroit -> cleveland [internal]
 ip address 10.0.0.133/31
!
interface eth3
 no shutdown
 description detroit -> toronto [internal]
 ip address 10.0.0.136/31
!
interface eth4
 no shutdown
 description detroit -> cleveland [internal]
 ip address 10.0.0.155/31
!
interface eth5
 no shutdown
 description detroit -> toronto [internal]
 ip address 10.0.0.224/31
!
interface eth6
 no shutdown
 description detroit -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.10
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! detroit -> chicago
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! detroit -> chicago
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! detroit -> cleveland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! detroit -> toronto
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! detroit -> cleveland
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! detroit -> toronto
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! detroit -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
