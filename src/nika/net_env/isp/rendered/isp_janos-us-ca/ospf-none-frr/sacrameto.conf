hostname sacrameto
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.29/32
!
interface eth0
 no shutdown
 description sacrameto -> lasvegas [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description sacrameto -> sanfrancisco [internal]
 ip address 10.0.0.36/31
!
interface eth2
 no shutdown
 description sacrameto -> lasvegas [internal]
 ip address 10.0.0.39/31
!
interface eth3
 no shutdown
 description sacrameto -> saltlakecity [internal]
 ip address 10.0.0.40/31
!
interface eth4
 no shutdown
 description sacrameto -> saltlakecity [internal]
 ip address 10.0.0.60/31
!
interface eth5
 no shutdown
 description sacrameto -> sanfrancisco [internal]
 ip address 10.0.0.178/31
!
interface eth6
 no shutdown
 description sacrameto -> stub [stub]
 ip address 10.254.0.113/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.29
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! sacrameto -> lasvegas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! sacrameto -> sanfrancisco
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! sacrameto -> lasvegas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! sacrameto -> saltlakecity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! sacrameto -> saltlakecity
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! sacrameto -> sanfrancisco
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! sacrameto -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

