hostname houston
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.12/32
!
interface eth0
 no shutdown
 description houston -> elpaso [internal]
 ip address 10.0.0.65/31
!
interface eth1
 no shutdown
 description houston -> dallas [internal]
 ip address 10.0.0.73/31
!
interface eth2
 no shutdown
 description houston -> elpaso [internal]
 ip address 10.0.0.81/31
!
interface eth3
 no shutdown
 description houston -> dallas [internal]
 ip address 10.0.0.83/31
!
interface eth4
 no shutdown
 description houston -> neworleans [internal]
 ip address 10.0.0.84/31
!
interface eth5
 no shutdown
 description houston -> neworleans [internal]
 ip address 10.0.0.186/31
!
interface eth6
 no shutdown
 description houston -> stub [stub]
 ip address 10.254.0.45/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.12
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! houston -> elpaso
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! houston -> dallas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! houston -> elpaso
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! houston -> dallas
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! houston -> neworleans
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! houston -> neworleans
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! houston -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
