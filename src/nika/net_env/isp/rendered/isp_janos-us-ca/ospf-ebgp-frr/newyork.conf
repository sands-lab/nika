 no shutdown
 ip address 10.255.0.23/32
!
interface eth0
 no shutdown
 description newyork -> cleveland [internal]
 ip address 10.0.0.159/31
!
interface eth1
 no shutdown
 description newyork -> cleveland [internal]
 ip address 10.0.0.165/31
!
interface eth2
 no shutdown
 description newyork -> boston [internal]
 ip address 10.0.0.167/31
!
interface eth3
 no shutdown
 description newyork -> philadelphia [passive]
 ip address 10.0.0.168/31
!
interface eth4
 no shutdown
 description newyork -> toronto [internal]
 ip address 10.0.0.170/31
!
interface eth5
 no shutdown
 description newyork -> boston [internal]
 ip address 10.0.0.195/31
!
interface eth6
 no shutdown
 description newyork -> philadelphia [passive]
 ip address 10.0.0.218/31
!
interface eth7
 no shutdown
 description newyork -> toronto [internal]
 ip address 10.0.0.226/31
!
interface eth8
 no shutdown
 description newyork -> stub [stub]
