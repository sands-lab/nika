hostname boston
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description boston -> newyork [internal]
 ip address 10.0.0.166/31
!
interface eth1
 no shutdown
 description boston -> montreal [internal]
 ip address 10.0.0.172/31
!
interface eth2
 no shutdown
 description boston -> newyork [internal]
 ip address 10.0.0.194/31
!
interface eth3
 no shutdown
 description boston -> montreal [internal]
 ip address 10.0.0.196/31
!
interface eth4
 no shutdown
 description boston -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! boston -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! boston -> montreal
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! boston -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! boston -> montreal
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! boston -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.2
  bgp cluster-id 10.255.0.2
!
  neighbor 10.255.0.7 remote-as 65003
  neighbor 10.255.0.7 description cleveland
  neighbor 10.255.0.7 update-source lo
!
  neighbor 10.255.0.10 remote-as 65003
  neighbor 10.255.0.10 description detroit
  neighbor 10.255.0.10 update-source lo
!
  neighbor 10.255.0.20 remote-as 65003
  neighbor 10.255.0.20 description montreal
  neighbor 10.255.0.20 update-source lo
!
  neighbor 10.255.0.23 remote-as 65003
  neighbor 10.255.0.23 description newyork
  neighbor 10.255.0.23 update-source lo
!
  neighbor 10.255.0.36 remote-as 65003
  neighbor 10.255.0.36 description toronto
  neighbor 10.255.0.36 update-source lo
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.7 next-hop-self
  neighbor 10.255.0.7 route-reflector-client
  no neighbor 10.255.0.7 send-community all
  neighbor 10.255.0.7 send-community standard
  neighbor 10.255.0.7 send-community large
  neighbor 10.255.0.7 send-community extended
!
  neighbor 10.255.0.10 activate
  neighbor 10.255.0.10 next-hop-self
  neighbor 10.255.0.10 route-reflector-client
  no neighbor 10.255.0.10 send-community all
  neighbor 10.255.0.10 send-community standard
  neighbor 10.255.0.10 send-community large
  neighbor 10.255.0.10 send-community extended
!
  neighbor 10.255.0.20 activate
  neighbor 10.255.0.20 next-hop-self
  neighbor 10.255.0.20 route-reflector-client
  no neighbor 10.255.0.20 send-community all
  neighbor 10.255.0.20 send-community standard
  neighbor 10.255.0.20 send-community large
  neighbor 10.255.0.20 send-community extended
!
  neighbor 10.255.0.23 activate
  neighbor 10.255.0.23 next-hop-self
  neighbor 10.255.0.23 route-reflector-client
  no neighbor 10.255.0.23 send-community all
  neighbor 10.255.0.23 send-community standard
  neighbor 10.255.0.23 send-community large
  neighbor 10.255.0.23 send-community extended
!
  neighbor 10.255.0.36 activate
  neighbor 10.255.0.36 next-hop-self
  neighbor 10.255.0.36 route-reflector-client
  no neighbor 10.255.0.36 send-community all
  neighbor 10.255.0.36 send-community standard
  neighbor 10.255.0.36 send-community large
  neighbor 10.255.0.36 send-community extended
!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.7 route-map BGP-IN in
  neighbor 10.255.0.10 route-map BGP-IN in
  neighbor 10.255.0.20 route-map BGP-IN in
  neighbor 10.255.0.23 route-map BGP-IN in
  neighbor 10.255.0.36 route-map BGP-IN in
 exit-address-family
!
