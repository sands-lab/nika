hostname atlanta
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description atlanta -> nashville [internal]
 ip address 10.0.0.150/31
!
interface eth1
 no shutdown
 description atlanta -> charlotte [internal]
 ip address 10.0.0.180/31
!
interface eth2
 no shutdown
 description atlanta -> neworleans [internal]
 ip address 10.0.0.188/31
!
interface eth3
 no shutdown
 description atlanta -> nashville [internal]
 ip address 10.0.0.198/31
!
interface eth4
 no shutdown
 description atlanta -> charlotte [internal]
 ip address 10.0.0.202/31
!
interface eth5
 no shutdown
 description atlanta -> neworleans [internal]
 ip address 10.0.0.204/31
!
interface eth6
 no shutdown
 description atlanta -> tampa [internal]
 ip address 10.0.0.206/31
!
interface eth7
 no shutdown
 description atlanta -> tampa [internal]
 ip address 10.0.0.240/31
