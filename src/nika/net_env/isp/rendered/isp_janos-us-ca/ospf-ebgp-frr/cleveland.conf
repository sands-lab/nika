hostname cleveland
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description cleveland -> detroit [internal]
 ip address 10.0.0.132/31
!
interface eth1
 no shutdown
 description cleveland -> detroit [internal]
 ip address 10.0.0.154/31
!
interface eth2
 no shutdown
 description cleveland -> newyork [internal]
 ip address 10.0.0.158/31
!
interface eth3
 no shutdown
 description cleveland -> pittsburgh [passive]
 ip address 10.0.0.160/31
!
interface eth4
 no shutdown
 description cleveland -> cincinnati [passive]
 ip address 10.0.0.163/31
!
interface eth5
 no shutdown
 description cleveland -> newyork [internal]
 ip address 10.0.0.164/31
!
interface eth6
 no shutdown
 description cleveland -> pittsburgh [passive]
 ip address 10.0.0.230/31
!
interface eth7
 no shutdown
 description cleveland -> cincinnati [passive]
 ip address 10.0.0.237/31
!
interface eth8
 no shutdown
 description cleveland -> stub [stub]
 ip address 10.254.0.25/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.7
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! cleveland -> detroit
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! cleveland -> detroit
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! cleveland -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! cleveland -> pittsburgh
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth4
! cleveland -> cincinnati
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth5
! cleveland -> newyork
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! cleveland -> pittsburgh
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth7
! cleveland -> cincinnati
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth8
! cleveland -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.7
!
  neighbor 10.255.0.2 remote-as 65003
  neighbor 10.255.0.2 description boston
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.0.0.161 remote-as 65001
  neighbor 10.0.0.161 description pittsburgh
!
  neighbor 10.0.0.162 remote-as 65001
  neighbor 10.0.0.162 description cincinnati
!
  neighbor 10.0.0.231 remote-as 65001
  neighbor 10.0.0.231 description pittsburgh
!
  neighbor 10.0.0.236 remote-as 65001
  neighbor 10.0.0.236 description cincinnati
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
  neighbor 10.0.0.161 activate
  no neighbor 10.0.0.161 send-community all
  neighbor 10.0.0.161 send-community standard
  neighbor 10.0.0.161 send-community large
!
  neighbor 10.0.0.162 activate
  no neighbor 10.0.0.162 send-community all
  neighbor 10.0.0.162 send-community standard
  neighbor 10.0.0.162 send-community large
!
  neighbor 10.0.0.231 activate
  no neighbor 10.0.0.231 send-community all
  neighbor 10.0.0.231 send-community standard
  neighbor 10.0.0.231 send-community large
!
  neighbor 10.0.0.236 activate
  no neighbor 10.0.0.236 send-community all
  neighbor 10.0.0.236 send-community standard
  neighbor 10.0.0.236 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.161 route-map BGP-IN in
    neighbor 10.0.0.161 route-map BGP-OUT out

    neighbor 10.0.0.162 route-map BGP-IN in
    neighbor 10.0.0.162 route-map BGP-OUT out

    neighbor 10.0.0.231 route-map BGP-IN in
    neighbor 10.0.0.231 route-map BGP-OUT out

    neighbor 10.0.0.236 route-map BGP-IN in
    neighbor 10.0.0.236 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
 exit-address-family
!
