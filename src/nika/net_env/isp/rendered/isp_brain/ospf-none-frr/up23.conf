hostname up23
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.111/32
!
interface eth0
 no shutdown
 description up23 -> up [internal]
 ip address 10.0.1.185/31
!
interface eth1
 no shutdown
 description up23 -> up [internal]
 ip address 10.0.1.207/31
!
interface eth2
 no shutdown
 description up23 -> stub [stub]
 ip address 10.254.1.185/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.111
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! up23 -> up
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! up23 -> up
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! up23 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
