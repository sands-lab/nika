hostname tu18
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.91/32
!
interface eth0
 no shutdown
 description tu18 -> tu [internal]
 ip address 10.0.1.101/31
!
interface eth1
 no shutdown
 description tu18 -> tu [internal]
 ip address 10.0.1.143/31
!
interface eth2
 no shutdown
 description tu18 -> stub [stub]
 ip address 10.254.1.105/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.91
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! tu18 -> tu
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! tu18 -> tu
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! tu18 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
