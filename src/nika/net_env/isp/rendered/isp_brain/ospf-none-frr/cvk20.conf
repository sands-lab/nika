hostname cvk20
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.21/32
!
interface eth0
 no shutdown
 description cvk20 -> cvk [internal]
 ip address 10.0.0.67/31
!
interface eth1
 no shutdown
 description cvk20 -> cvk [internal]
 ip address 10.0.0.105/31
!
interface eth2
 no shutdown
 description cvk20 -> stub [stub]
 ip address 10.254.0.81/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.21
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! cvk20 -> cvk
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! cvk20 -> cvk
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! cvk20 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
