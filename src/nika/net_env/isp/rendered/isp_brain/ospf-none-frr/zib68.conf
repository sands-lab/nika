hostname zib68
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.147/32
!
interface eth0
 no shutdown
 description zib68 -> zib [internal]
 ip address 10.0.2.49/31
!
interface eth1
 no shutdown
 description zib68 -> zib [internal]
 ip address 10.0.2.123/31
!
interface eth2
 no shutdown
 description zib68 -> stub [stub]
 ip address 10.254.2.73/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.147
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! zib68 -> zib
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! zib68 -> zib
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! zib68 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
