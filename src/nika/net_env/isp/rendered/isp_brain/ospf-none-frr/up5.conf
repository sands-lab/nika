hostname up5
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.114/32
!
interface eth0
 no shutdown
 description up5 -> up [internal]
 ip address 10.0.1.191/31
!
interface eth1
 no shutdown
 description up5 -> up [internal]
 ip address 10.0.1.213/31
!
interface eth2
 no shutdown
 description up5 -> stub [stub]
 ip address 10.254.1.197/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.114
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! up5 -> up
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! up5 -> up
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! up5 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
