hostname up21
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.109/32
!
interface eth0
 no shutdown
 description up21 -> up [internal]
 ip address 10.0.1.181/31
!
interface eth1
 no shutdown
 description up21 -> up [internal]
 ip address 10.0.1.203/31
!
interface eth2
 no shutdown
 description up21 -> stub [stub]
 ip address 10.254.1.177/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.109
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! up21 -> up
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! up21 -> up
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! up21 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
