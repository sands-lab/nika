hostname adh11
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.3/32
!
interface eth0
 no shutdown
 description adh11 -> adh [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description adh11 -> adh [internal]
 ip address 10.0.0.29/31
!
interface eth2
 no shutdown
 description adh11 -> stub [stub]
 ip address 10.254.0.9/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.3
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! adh11 -> adh
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! adh11 -> adh
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! adh11 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
