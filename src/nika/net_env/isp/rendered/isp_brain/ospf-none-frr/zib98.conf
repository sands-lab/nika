hostname zib98
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.160/32
!
interface eth0
 no shutdown
 description zib98 -> zib [internal]
 ip address 10.0.2.75/31
!
interface eth1
 no shutdown
 description zib98 -> zib [internal]
 ip address 10.0.2.149/31
!
interface eth2
 no shutdown
 description zib98 -> stub [stub]
 ip address 10.254.2.125/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.160
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! zib98 -> zib
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! zib98 -> zib
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! zib98 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
