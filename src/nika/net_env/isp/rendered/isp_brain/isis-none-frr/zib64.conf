hostname zib64
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.143/32
!
interface eth0
 no shutdown
 description zib64 -> zib [internal]
 ip address 10.0.2.41/31
!
interface eth1
 no shutdown
 description zib64 -> zib [internal]
 ip address 10.0.2.115/31
!
interface eth2
 no shutdown
 description zib64 -> stub [stub]
 ip address 10.254.2.57/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.008f.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! zib64 -> zib
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! zib64 -> zib
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! zib64 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
