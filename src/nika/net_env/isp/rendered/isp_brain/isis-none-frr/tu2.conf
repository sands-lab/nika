hostname tu2
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.93/32
!
interface eth0
 no shutdown
 description tu2 -> tu [internal]
 ip address 10.0.1.115/31
!
interface eth1
 no shutdown
 description tu2 -> tu [internal]
 ip address 10.0.1.147/31
!
interface eth2
 no shutdown
 description tu2 -> stub [stub]
 ip address 10.254.1.113/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.005d.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! tu2 -> tu
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! tu2 -> tu
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! tu2 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
