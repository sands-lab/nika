hostname wias5
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.123/32
!
interface eth0
 no shutdown
 description wias5 -> wias [internal]
 ip address 10.0.1.231/31
!
interface eth1
 no shutdown
 description wias5 -> wias [internal]
 ip address 10.0.2.3/31
!
interface eth2
 no shutdown
 description wias5 -> stub [stub]
 ip address 10.254.1.233/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.007b.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! wias5 -> wias
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! wias5 -> wias
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! wias5 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
