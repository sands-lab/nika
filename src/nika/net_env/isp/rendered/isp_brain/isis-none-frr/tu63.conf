hostname tu63
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.102/32
!
interface eth0
 no shutdown
 description tu63 -> tu [internal]
 ip address 10.0.1.123/31
!
interface eth1
 no shutdown
 description tu63 -> tu [internal]
 ip address 10.0.1.165/31
!
interface eth2
 no shutdown
 description tu63 -> stub [stub]
 ip address 10.254.1.149/30
!
