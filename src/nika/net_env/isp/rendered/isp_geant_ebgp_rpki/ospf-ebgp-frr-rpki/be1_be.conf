hostname be1_be
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description be1_be -> fr1_fr [internal]
 ip address 10.0.0.10/31
!
interface eth1
 no shutdown
 description be1_be -> lu1_lu [internal]
 ip address 10.0.0.12/31
!
interface eth2
 no shutdown
 description be1_be -> nl1_nl [internal]
 ip address 10.0.0.14/31
!
interface eth3
 no shutdown
 description be1_be -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! be1_be -> fr1_fr
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! be1_be -> lu1_lu
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! be1_be -> nl1_nl
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! be1_be -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.2
  bgp cluster-id 10.255.0.2
!
  neighbor 10.255.0.6 remote-as 65002
  neighbor 10.255.0.6 description es1_es
  neighbor 10.255.0.6 update-source lo
!
  neighbor 10.255.0.7 remote-as 65002
  neighbor 10.255.0.7 description fr1_fr
  neighbor 10.255.0.7 update-source lo
!
  neighbor 10.255.0.12 remote-as 65002
  neighbor 10.255.0.12 description il1_il
  neighbor 10.255.0.12 update-source lo
!
  neighbor 10.255.0.14 remote-as 65002
  neighbor 10.255.0.14 description lu1_lu
  neighbor 10.255.0.14 update-source lo
!
  neighbor 10.255.0.15 remote-as 65002
  neighbor 10.255.0.15 description nl1_nl
  neighbor 10.255.0.15 update-source lo
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.6 activate
  neighbor 10.255.0.6 next-hop-self
  neighbor 10.255.0.6 route-reflector-client
  no neighbor 10.255.0.6 send-community all
  neighbor 10.255.0.6 send-community standard
  neighbor 10.255.0.6 send-community large
  neighbor 10.255.0.6 send-community extended
!
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.7 next-hop-self
  neighbor 10.255.0.7 route-reflector-client
  no neighbor 10.255.0.7 send-community all
  neighbor 10.255.0.7 send-community standard
  neighbor 10.255.0.7 send-community large
  neighbor 10.255.0.7 send-community extended
!
  neighbor 10.255.0.12 activate
  neighbor 10.255.0.12 next-hop-self
  neighbor 10.255.0.12 route-reflector-client
  no neighbor 10.255.0.12 send-community all
  neighbor 10.255.0.12 send-community standard
  neighbor 10.255.0.12 send-community large
  neighbor 10.255.0.12 send-community extended
!
  neighbor 10.255.0.14 activate
  neighbor 10.255.0.14 next-hop-self
  neighbor 10.255.0.14 route-reflector-client
  no neighbor 10.255.0.14 send-community all
  neighbor 10.255.0.14 send-community standard
  neighbor 10.255.0.14 send-community large
  neighbor 10.255.0.14 send-community extended
!
  neighbor 10.255.0.15 activate
  neighbor 10.255.0.15 next-hop-self
  neighbor 10.255.0.15 route-reflector-client
  no neighbor 10.255.0.15 send-community all
  neighbor 10.255.0.15 send-community standard
  neighbor 10.255.0.15 send-community large
  neighbor 10.255.0.15 send-community extended
!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.6 route-map BGP-IN in
  neighbor 10.255.0.7 route-map BGP-IN in
  neighbor 10.255.0.12 route-map BGP-IN in
  neighbor 10.255.0.14 route-map BGP-IN in
  neighbor 10.255.0.15 route-map BGP-IN in
 exit-address-family
!

ip prefix-list EXPORT-DENY seq 5 permit 203.0.113.0/24 le 24
ip prefix-list EXPORT-DENY seq 10 permit 203.0.114.0/24 le 24
!
route-map BGP-OUT deny 5
 match ip address prefix-list EXPORT-DENY
!
