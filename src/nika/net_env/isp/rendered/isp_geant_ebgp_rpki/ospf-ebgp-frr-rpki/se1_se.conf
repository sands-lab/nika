hostname se1_se
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.19/32
!
interface eth0
 no shutdown
 description se1_se -> de1_de [passive]
 ip address 10.0.0.37/31
!
interface eth1
 no shutdown
 description se1_se -> pl1_pl [internal]
 ip address 10.0.0.67/31
!
interface eth2
 no shutdown
 description se1_se -> uk1_uk [passive]
 ip address 10.0.0.70/31
!
interface eth3
 no shutdown
 description se1_se -> stub [stub]
 ip address 10.254.0.73/30
!
interface lo1
 no shutdown
 description se1_se -> stub
 ip address 198.51.102.1/24
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.19
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! se1_se -> de1_de
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth1
! se1_se -> pl1_pl
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! se1_se -> uk1_uk
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! se1_se -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.19
!
  neighbor 10.255.0.4 remote-as 65003
  neighbor 10.255.0.4 description cz1_cz
  neighbor 10.255.0.4 update-source lo
!
  neighbor 10.0.0.36 remote-as 65001
  neighbor 10.0.0.36 description de1_de
!
  neighbor 10.0.0.71 remote-as 65001
  neighbor 10.0.0.71 description uk1_uk
!
 address-family ipv4 unicast
!

  network 198.51.102.0/24
!
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.4 next-hop-self
  no neighbor 10.255.0.4 send-community all
  neighbor 10.255.0.4 send-community standard
  neighbor 10.255.0.4 send-community large
  neighbor 10.255.0.4 send-community extended
!
  neighbor 10.0.0.36 activate
  no neighbor 10.0.0.36 send-community all
  neighbor 10.0.0.36 send-community standard
  neighbor 10.0.0.36 send-community large
!
  neighbor 10.0.0.71 activate
  no neighbor 10.0.0.71 send-community all
  neighbor 10.0.0.71 send-community standard
  neighbor 10.0.0.71 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.36 route-map BGP-IN in
    neighbor 10.0.0.36 route-map BGP-OUT out

    neighbor 10.0.0.71 route-map BGP-IN in
    neighbor 10.0.0.71 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.4 route-map BGP-IN in
 exit-address-family
!
