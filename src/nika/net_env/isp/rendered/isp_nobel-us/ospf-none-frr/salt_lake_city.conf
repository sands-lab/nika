hostname salt_lake_city
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description salt_lake_city -> ann_arbor [internal]
 ip address 10.0.0.21/31
!
interface eth1
 no shutdown
 description salt_lake_city -> palo_alto [internal]
 ip address 10.0.0.23/31
!
interface eth2
 no shutdown
 description salt_lake_city -> boulder [internal]
 ip address 10.0.0.39/31
!
interface eth3
 no shutdown
 description salt_lake_city -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.10
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! salt_lake_city -> ann_arbor
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! salt_lake_city -> palo_alto
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! salt_lake_city -> boulder
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! salt_lake_city -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
