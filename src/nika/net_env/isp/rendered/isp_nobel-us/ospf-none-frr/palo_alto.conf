hostname palo_alto
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description palo_alto -> san_diego [internal]
 ip address 10.0.0.0/31
!
interface eth1
 no shutdown
 description palo_alto -> salt_lake_city [internal]
 ip address 10.0.0.22/31
!
interface eth2
 no shutdown
 description palo_alto -> seattle [internal]
 ip address 10.0.0.28/31
!
interface eth3
 no shutdown
 description palo_alto -> stub [stub]
 ip address 10.254.0.25/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.7
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! palo_alto -> san_diego
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! palo_alto -> salt_lake_city
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! palo_alto -> seattle
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! palo_alto -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
