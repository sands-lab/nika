hostname urbana_champaign
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.13/32
!
interface eth0
 no shutdown
 description urbana_champaign -> lincoln [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description urbana_champaign -> pittsburgh [internal]
 ip address 10.0.0.13/31
!
interface eth2
 no shutdown
 description urbana_champaign -> seattle [internal]
 ip address 10.0.0.15/31
!
interface eth3
 no shutdown
 description urbana_champaign -> stub [stub]
 ip address 10.254.0.49/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.13
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! urbana_champaign -> lincoln
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! urbana_champaign -> pittsburgh
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! urbana_champaign -> seattle
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! urbana_champaign -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
