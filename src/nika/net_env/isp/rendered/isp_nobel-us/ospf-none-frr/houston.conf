hostname houston
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description houston -> washington [internal]
 ip address 10.0.0.4/31
!
interface eth1
 no shutdown
 description houston -> atlanta [internal]
 ip address 10.0.0.9/31
!
interface eth2
 no shutdown
 description houston -> san_diego [internal]
 ip address 10.0.0.30/31
!
interface eth3
 no shutdown
 description houston -> boulder [internal]
 ip address 10.0.0.37/31
!
interface eth4
 no shutdown
 description houston -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.4
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! houston -> washington
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! houston -> atlanta
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! houston -> san_diego
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! houston -> boulder
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! houston -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
