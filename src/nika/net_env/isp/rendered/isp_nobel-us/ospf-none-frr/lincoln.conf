hostname lincoln
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.6/32
!
interface eth0
 no shutdown
 description lincoln -> urbana_champaign [internal]
 ip address 10.0.0.10/31
!
interface eth1
 no shutdown
 description lincoln -> boulder [internal]
 ip address 10.0.0.35/31
!
interface eth2
 no shutdown
 description lincoln -> stub [stub]
 ip address 10.254.0.21/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.6
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! lincoln -> urbana_champaign
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! lincoln -> boulder
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! lincoln -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
