hostname ann_arbor
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description ann_arbor -> princeton [internal]
 ip address 10.0.0.16/31
!
interface eth1
 no shutdown
 description ann_arbor -> ithaca [internal]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description ann_arbor -> salt_lake_city [internal]
 ip address 10.0.0.20/31
!
interface eth3
 no shutdown
 description ann_arbor -> stub [stub]
 ip address 10.254.0.1/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.1
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! ann_arbor -> princeton
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! ann_arbor -> ithaca
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! ann_arbor -> salt_lake_city
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! ann_arbor -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
