hostname ann_arbor
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description ann_arbor -> princeton [internal]
 ip address 10.0.0.16/31
!
interface eth1
 no shutdown
 description ann_arbor -> ithaca [internal]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description ann_arbor -> salt_lake_city [internal]
 ip address 10.0.0.20/31
!
interface eth3
 no shutdown
 description ann_arbor -> stub [stub]
 ip address 10.254.0.1/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.1
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! ann_arbor -> princeton
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! ann_arbor -> ithaca
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! ann_arbor -> salt_lake_city
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! ann_arbor -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.1
  bgp cluster-id 10.255.0.1
!
  neighbor 10.255.0.5 remote-as 65001
  neighbor 10.255.0.5 description ithaca
  neighbor 10.255.0.5 update-source lo
!
  neighbor 10.255.0.7 remote-as 65001
  neighbor 10.255.0.7 description palo_alto
  neighbor 10.255.0.7 update-source lo
!
  neighbor 10.255.0.9 remote-as 65001
  neighbor 10.255.0.9 description princeton
  neighbor 10.255.0.9 update-source lo
!
  neighbor 10.255.0.10 remote-as 65001
  neighbor 10.255.0.10 description salt_lake_city
  neighbor 10.255.0.10 update-source lo
!
  neighbor 10.255.0.14 remote-as 65001
  neighbor 10.255.0.14 description washington
  neighbor 10.255.0.14 update-source lo
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.5 activate
  neighbor 10.255.0.5 next-hop-self
  neighbor 10.255.0.5 route-reflector-client
  no neighbor 10.255.0.5 send-community all
  neighbor 10.255.0.5 send-community standard
  neighbor 10.255.0.5 send-community large
  neighbor 10.255.0.5 send-community extended
!
  neighbor 10.255.0.7 activate
  neighbor 10.255.0.7 next-hop-self
  neighbor 10.255.0.7 route-reflector-client
  no neighbor 10.255.0.7 send-community all
  neighbor 10.255.0.7 send-community standard
  neighbor 10.255.0.7 send-community large
  neighbor 10.255.0.7 send-community extended
!
  neighbor 10.255.0.9 activate
  neighbor 10.255.0.9 next-hop-self
  neighbor 10.255.0.9 route-reflector-client
  no neighbor 10.255.0.9 send-community all
  neighbor 10.255.0.9 send-community standard
  neighbor 10.255.0.9 send-community large
  neighbor 10.255.0.9 send-community extended
!
  neighbor 10.255.0.10 activate
  neighbor 10.255.0.10 next-hop-self
  neighbor 10.255.0.10 route-reflector-client
  no neighbor 10.255.0.10 send-community all
  neighbor 10.255.0.10 send-community standard
  neighbor 10.255.0.10 send-community large
  neighbor 10.255.0.10 send-community extended
!
  neighbor 10.255.0.14 activate
  neighbor 10.255.0.14 next-hop-self
  neighbor 10.255.0.14 route-reflector-client
  no neighbor 10.255.0.14 send-community all
  neighbor 10.255.0.14 send-community standard
  neighbor 10.255.0.14 send-community large
  neighbor 10.255.0.14 send-community extended
!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.5 route-map BGP-IN in
  neighbor 10.255.0.7 route-map BGP-IN in
  neighbor 10.255.0.9 route-map BGP-IN in
  neighbor 10.255.0.10 route-map BGP-IN in
  neighbor 10.255.0.14 route-map BGP-IN in
 exit-address-family
!
