hostname houston
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host ann_arbor 10.255.0.1
domain ipv4 host atlanta 10.255.0.2
domain ipv4 host boulder 10.255.0.3
domain ipv4 host ithaca 10.255.0.5
domain ipv4 host lincoln 10.255.0.6
domain ipv4 host palo_alto 10.255.0.7
domain ipv4 host pittsburgh 10.255.0.8
domain ipv4 host princeton 10.255.0.9
domain ipv4 host salt_lake_city 10.255.0.10
domain ipv4 host san_diego 10.255.0.11
domain ipv4 host seattle 10.255.0.12
domain ipv4 host urbana_champaign 10.255.0.13
domain ipv4 host washington 10.255.0.14
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.4 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description houston -> washington [passive]
 ipv4 address 10.0.0.4 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description houston -> atlanta [internal]
 ipv4 address 10.0.0.9 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description houston -> san_diego [internal]
 ipv4 address 10.0.0.30 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description houston -> boulder [passive]
 ipv4 address 10.0.0.37 255.255.255.254
!
interface GigabitEthernet0/0/0/4
 no shutdown
 description houston -> stub [stub]
 ipv4 address 10.254.0.13 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.4

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/4
   passive enable
   cost 1

!
!
router bgp 65002
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.4

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.2
  remote-as 65002
  description atlanta
  update-source Loopback0
  address-family ipv4 unicast

!
 neighbor 10.0.0.5
  remote-as 65001
  description washington
  address-family ipv4 unicast
   send-community-ebgp

!
 neighbor 10.0.0.36
  remote-as 65003
  description boulder
  address-family ipv4 unicast
   send-community-ebgp

!
!
!
router bgp 65002
!
  neighbor 10.255.0.2
    address-family ipv4 unicast

  neighbor 10.0.0.5
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out

  neighbor 10.0.0.36
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out


router bgp 65002
 neighbor 10.255.0.2
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
