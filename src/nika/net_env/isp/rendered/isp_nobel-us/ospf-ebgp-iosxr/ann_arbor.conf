hostname ann_arbor
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host atlanta 10.255.0.2
domain ipv4 host boulder 10.255.0.3
domain ipv4 host houston 10.255.0.4
domain ipv4 host ithaca 10.255.0.5
domain ipv4 host lincoln 10.255.0.6
domain ipv4 host palo_alto 10.255.0.7
domain ipv4 host pittsburgh 10.255.0.8
domain ipv4 host princeton 10.255.0.9
domain ipv4 host salt_lake_city 10.255.0.10
domain ipv4 host san_diego 10.255.0.11
domain ipv4 host seattle 10.255.0.12
domain ipv4 host urbana_champaign 10.255.0.13
domain ipv4 host washington 10.255.0.14
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description ann_arbor -> princeton [internal]
 ipv4 address 10.0.0.16 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description ann_arbor -> ithaca [internal]
 ipv4 address 10.0.0.18 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description ann_arbor -> salt_lake_city [internal]
 ipv4 address 10.0.0.20 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description ann_arbor -> stub [stub]
 ipv4 address 10.254.0.1 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
prefix-set CUSTOMERS
  198.51.110.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
    done
  endif
  if destination in CUSTOMERS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.1

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/3
   passive enable
   cost 1

!
!
router bgp 65001
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.1
 bgp cluster-id 10.255.0.1

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.5
  remote-as 65001
  description ithaca
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.7
  remote-as 65001
  description palo_alto
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.9
  remote-as 65001
  description princeton
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.10
  remote-as 65001
  description salt_lake_city
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client

!
 neighbor 10.255.0.14
  remote-as 65001
  description washington
  update-source Loopback0
  address-family ipv4 unicast
   route-reflector-client


router bgp 65001
 neighbor 10.255.0.5
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.7
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.9
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.10
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.14
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
