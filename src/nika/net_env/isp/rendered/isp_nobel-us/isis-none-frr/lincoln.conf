hostname lincoln
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.6/32
!
interface eth0
 no shutdown
 description lincoln -> urbana_champaign [internal]
 ip address 10.0.0.10/31
!
interface eth1
 no shutdown
 description lincoln -> boulder [internal]
 ip address 10.0.0.35/31
!
interface eth2
 no shutdown
 description lincoln -> stub [stub]
 ip address 10.254.0.21/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0006.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! lincoln -> urbana_champaign
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! lincoln -> boulder
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! lincoln -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
