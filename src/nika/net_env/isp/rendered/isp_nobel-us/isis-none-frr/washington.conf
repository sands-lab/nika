hostname washington
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.14/32
!
interface eth0
 no shutdown
 description washington -> ithaca [internal]
 ip address 10.0.0.3/31
!
interface eth1
 no shutdown
 description washington -> houston [internal]
 ip address 10.0.0.5/31
!
interface eth2
 no shutdown
 description washington -> princeton [internal]
 ip address 10.0.0.41/31
!
interface eth3
 no shutdown
 description washington -> stub [stub]
 ip address 10.254.0.53/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000e.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! washington -> ithaca
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! washington -> houston
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! washington -> princeton
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! washington -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
