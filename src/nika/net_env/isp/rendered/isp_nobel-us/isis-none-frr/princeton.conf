hostname princeton
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.9/32
!
interface eth0
 no shutdown
 description princeton -> ann_arbor [internal]
 ip address 10.0.0.17/31
!
interface eth1
 no shutdown
 description princeton -> pittsburgh [internal]
 ip address 10.0.0.25/31
!
interface eth2
 no shutdown
 description princeton -> washington [internal]
 ip address 10.0.0.40/31
!
interface eth3
 no shutdown
 description princeton -> stub [stub]
 ip address 10.254.0.33/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0009.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! princeton -> ann_arbor
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! princeton -> pittsburgh
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! princeton -> washington
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! princeton -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
