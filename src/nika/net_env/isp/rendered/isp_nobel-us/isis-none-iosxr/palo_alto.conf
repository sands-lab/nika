hostname palo_alto
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host ann_arbor 10.255.0.1
domain ipv4 host atlanta 10.255.0.2
domain ipv4 host boulder 10.255.0.3
domain ipv4 host houston 10.255.0.4
domain ipv4 host ithaca 10.255.0.5
domain ipv4 host lincoln 10.255.0.6
domain ipv4 host pittsburgh 10.255.0.8
domain ipv4 host princeton 10.255.0.9
domain ipv4 host salt_lake_city 10.255.0.10
domain ipv4 host san_diego 10.255.0.11
domain ipv4 host seattle 10.255.0.12
domain ipv4 host urbana_champaign 10.255.0.13
domain ipv4 host washington 10.255.0.14
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.7 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description palo_alto -> san_diego [internal]
 ipv4 address 10.0.0.0 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description palo_alto -> salt_lake_city [internal]
 ipv4 address 10.0.0.22 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description palo_alto -> seattle [internal]
 ipv4 address 10.0.0.28 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description palo_alto -> stub [stub]
 ipv4 address 10.254.0.25 255.255.255.252
!
!
!
!
router isis CORE

 log adjacency changes
 lsp-gen-interval initial-wait 50 secondary-wait 100 maximum-wait 500
 is-type level-2-only
 net 49.0001.0000.0aff.0007.00
!
 address-family ipv4 unicast
  metric-style wide
  spf-interval initial-wait 50 secondary-wait 100 maximum-wait 500
!
!
 interface Loopback0
  passive
  address-family ipv4
!
 interface GigabitEthernet0/0/0/0
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/1
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/2
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/3
  passive
  circuit-type level-2
  address-family ipv4
    metric 1

