hostname atlanta
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host ann_arbor 10.255.0.1
domain ipv4 host boulder 10.255.0.3
domain ipv4 host houston 10.255.0.4
domain ipv4 host ithaca 10.255.0.5
domain ipv4 host lincoln 10.255.0.6
domain ipv4 host palo_alto 10.255.0.7
domain ipv4 host pittsburgh 10.255.0.8
domain ipv4 host princeton 10.255.0.9
domain ipv4 host salt_lake_city 10.255.0.10
domain ipv4 host san_diego 10.255.0.11
domain ipv4 host seattle 10.255.0.12
domain ipv4 host urbana_champaign 10.255.0.13
domain ipv4 host washington 10.255.0.14
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.2 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description atlanta -> pittsburgh [internal]
 ipv4 address 10.0.0.6 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description atlanta -> houston [internal]
 ipv4 address 10.0.0.8 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description atlanta -> stub [stub]
 ipv4 address 10.254.0.5 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
!
router isis CORE

 log adjacency changes
 lsp-gen-interval initial-wait 50 secondary-wait 100 maximum-wait 500
 is-type level-2-only
 net 49.0001.0000.0aff.0002.00
!
 address-family ipv4 unicast
  metric-style wide
  spf-interval initial-wait 50 secondary-wait 100 maximum-wait 500
!
!
 interface Loopback0
  passive
  address-family ipv4
!
 interface GigabitEthernet0/0/0/0
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/1
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/2
  passive
  circuit-type level-2
  address-family ipv4
    metric 1

!
!
router bgp 65000
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.2
 bgp cluster-id 10.255.0.1

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
