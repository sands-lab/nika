
/system/identity set name="houston"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=ann_arbor address=10.255.0.1
/ip/dns/static add name=atlanta address=10.255.0.2
/ip/dns/static add name=boulder address=10.255.0.3
/ip/dns/static add name=ithaca address=10.255.0.5
/ip/dns/static add name=lincoln address=10.255.0.6
/ip/dns/static add name=palo_alto address=10.255.0.7
/ip/dns/static add name=pittsburgh address=10.255.0.8
/ip/dns/static add name=princeton address=10.255.0.9
/ip/dns/static add name=salt_lake_city address=10.255.0.10
/ip/dns/static add name=san_diego address=10.255.0.11
/ip/dns/static add name=seattle address=10.255.0.12
/ip/dns/static add name=urbana_champaign address=10.255.0.13
/ip/dns/static add name=washington address=10.255.0.14

/ip/address add interface=loopback address=10.255.0.4/32




/interface/ethernet set comment="houston -> washington [passive]" ether2
/ip/address add interface=ether2 address=10.0.0.4/31
/ip/address set [find where interface=ether2] comment="houston -> washington [passive]"

/interface/ethernet set comment="houston -> atlanta [internal]" ether3
/ip/address add interface=ether3 address=10.0.0.9/31
/ip/address set [find where interface=ether3] comment="houston -> atlanta [internal]"

/interface/ethernet set comment="houston -> san_diego [internal]" ether4
/ip/address add interface=ether4 address=10.0.0.30/31
/ip/address set [find where interface=ether4] comment="houston -> san_diego [internal]"

/interface/ethernet set comment="houston -> boulder [passive]" ether5
/ip/address add interface=ether5 address=10.0.0.37/31
/ip/address set [find where interface=ether5] comment="houston -> boulder [passive]"

/interface/ethernet set comment="houston -> stub [stub]" ether6
/ip/address add interface=ether6 address=10.254.0.13/30
/ip/address set [find where interface=ether6] comment="houston -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.4 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 passive type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether5 passive type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether6 passive cost=1


/routing/bgp/template add name=main as=65002 output.network=bgp-networks
/routing/bgp/instance add name=main as=65002

/routing/bgp/instance set [/routing/bgp/instance find name=main] router-id=10.255.0.4


/routing/filter/rule add chain=filter_rr_self_ebgp rule="if ( bgp-input-remote-addr == 10.0.0.5 ) { set gw 10.255.0.4;}"
/routing/filter/rule add chain=filter_rr_self_ebgp rule="if ( bgp-input-remote-addr == 10.0.0.36 ) { set gw 10.255.0.4;}"
/routing/filter/rule add chain=filter_rr_self_ebgp rule="return;"

/routing/filter/rule/add chain=rm_extended_communities rule="delete bgp-ext-communities rt; delete bgp-ext-communities soo; delete bgp-ext-communities other;"
/routing/filter/rule/add chain=rm_extended_communities rule="return;"
/routing/filter/rule/add chain=rm_large_communities rule="delete bgp-large-communities all;"
/routing/filter/rule/add chain=rm_large_communities rule="return;"
/routing/filter/rule/add chain=rm_standard_communities rule="delete bgp-communities other; delete bgp-communities wk;"
/routing/filter/rule/add chain=rm_standard_communities rule="jump rm_large_communities;"
/routing/filter/rule/add chain=rm_standard_communities rule="return;"


/routing/bgp/connection add template=main instance=main name=10_255_0_2 remote.address=10.255.0.2 remote.as=65002 comment="atlanta" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_2] afi=ip
/routing/filter/rule add chain=filter_10_255_0_2 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_2] output.filter-chain=filter_10_255_0_2
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_2] local.role=ibgp local.address=10.255.0.4

/routing/filter/rule/add chain=filter_10_255_0_2 rule="jump rm_large_communities;" place-before=0

/routing/bgp/connection add template=main instance=main name=10_0_0_5 remote.address=10.0.0.5 remote.as=65001 comment="washington" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_5] afi=ip
/routing/filter/rule add chain=filter_10_0_0_5 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_5] output.filter-chain=filter_10_0_0_5

/routing/filter/rule/add chain=filter_10_0_0_5 rule="jump rm_large_communities;" place-before=0
/routing/filter/rule/add chain=filter_10_0_0_5 rule="jump rm_extended_communities;" place-before=0

/routing/bgp/connection add template=main instance=main name=10_0_0_36 remote.address=10.0.0.36 remote.as=65003 comment="boulder" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_36] afi=ip
/routing/filter/rule add chain=filter_10_0_0_36 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_36] output.filter-chain=filter_10_0_0_36

/routing/filter/rule/add chain=filter_10_0_0_36 rule="jump rm_large_communities;" place-before=0
/routing/filter/rule/add chain=filter_10_0_0_36 rule="jump rm_extended_communities;" place-before=0







