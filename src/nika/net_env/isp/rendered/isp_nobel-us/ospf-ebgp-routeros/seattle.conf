
/system/identity set name="seattle"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=ann_arbor address=10.255.0.1
/ip/dns/static add name=atlanta address=10.255.0.2
/ip/dns/static add name=boulder address=10.255.0.3
/ip/dns/static add name=houston address=10.255.0.4
/ip/dns/static add name=ithaca address=10.255.0.5
/ip/dns/static add name=lincoln address=10.255.0.6
/ip/dns/static add name=palo_alto address=10.255.0.7
/ip/dns/static add name=pittsburgh address=10.255.0.8
/ip/dns/static add name=princeton address=10.255.0.9
/ip/dns/static add name=salt_lake_city address=10.255.0.10
/ip/dns/static add name=san_diego address=10.255.0.11
/ip/dns/static add name=urbana_champaign address=10.255.0.13
/ip/dns/static add name=washington address=10.255.0.14

/ip/address add interface=loopback address=10.255.0.12/32




/interface/ethernet set comment="seattle -> urbana_champaign [internal]" ether2
/ip/address add interface=ether2 address=10.0.0.14/31
/ip/address set [find where interface=ether2] comment="seattle -> urbana_champaign [internal]"

/interface/ethernet set comment="seattle -> palo_alto [passive]" ether3
/ip/address add interface=ether3 address=10.0.0.29/31
/ip/address set [find where interface=ether3] comment="seattle -> palo_alto [passive]"

/interface/ethernet set comment="seattle -> san_diego [passive]" ether4
/ip/address add interface=ether4 address=10.0.0.33/31
/ip/address set [find where interface=ether4] comment="seattle -> san_diego [passive]"

/interface/ethernet set comment="seattle -> stub [stub]" ether5
/ip/address add interface=ether5 address=10.254.0.45/30
/ip/address set [find where interface=ether5] comment="seattle -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.12 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 passive type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 passive type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether5 passive cost=1


/routing/bgp/template add name=main as=65003 output.network=bgp-networks
/routing/bgp/instance add name=main as=65003

/routing/bgp/instance set [/routing/bgp/instance find name=main] router-id=10.255.0.12


/routing/filter/rule add chain=filter_rr_self_ebgp rule="if ( bgp-input-remote-addr == 10.0.0.28 ) { set gw 10.255.0.12;}"
/routing/filter/rule add chain=filter_rr_self_ebgp rule="if ( bgp-input-remote-addr == 10.0.0.32 ) { set gw 10.255.0.12;}"
/routing/filter/rule add chain=filter_rr_self_ebgp rule="return;"

/routing/filter/rule/add chain=rm_extended_communities rule="delete bgp-ext-communities rt; delete bgp-ext-communities soo; delete bgp-ext-communities other;"
/routing/filter/rule/add chain=rm_extended_communities rule="return;"
/routing/filter/rule/add chain=rm_large_communities rule="delete bgp-large-communities all;"
/routing/filter/rule/add chain=rm_large_communities rule="return;"
/routing/filter/rule/add chain=rm_standard_communities rule="delete bgp-communities other; delete bgp-communities wk;"
/routing/filter/rule/add chain=rm_standard_communities rule="jump rm_large_communities;"
/routing/filter/rule/add chain=rm_standard_communities rule="return;"


/routing/bgp/connection add template=main instance=main name=10_255_0_3 remote.address=10.255.0.3 remote.as=65003 comment="boulder" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_3] afi=ip
/routing/filter/rule add chain=filter_10_255_0_3 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_3] output.filter-chain=filter_10_255_0_3
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_3] local.role=ibgp local.address=10.255.0.12

/routing/filter/rule/add chain=filter_10_255_0_3 rule="jump rm_large_communities;" place-before=0

/routing/bgp/connection add template=main instance=main name=10_0_0_28 remote.address=10.0.0.28 remote.as=65001 comment="palo_alto" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_28] afi=ip
/routing/filter/rule add chain=filter_10_0_0_28 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_28] output.filter-chain=filter_10_0_0_28

/routing/filter/rule/add chain=filter_10_0_0_28 rule="jump rm_large_communities;" place-before=0
/routing/filter/rule/add chain=filter_10_0_0_28 rule="jump rm_extended_communities;" place-before=0

/routing/bgp/connection add template=main instance=main name=10_0_0_32 remote.address=10.0.0.32 remote.as=65002 comment="san_diego" local.role=ebgp
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_32] afi=ip
/routing/filter/rule add chain=filter_10_0_0_32 rule="accept;"
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_32] output.filter-chain=filter_10_0_0_32

/routing/filter/rule/add chain=filter_10_0_0_32 rule="jump rm_large_communities;" place-before=0
/routing/filter/rule/add chain=filter_10_0_0_32 rule="jump rm_extended_communities;" place-before=0







