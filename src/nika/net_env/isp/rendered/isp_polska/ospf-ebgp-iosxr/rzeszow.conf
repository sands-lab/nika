hostname rzeszow
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host bialystok 10.255.0.1
domain ipv4 host bydgoszcz 10.255.0.2
domain ipv4 host gdansk 10.255.0.3
domain ipv4 host katowice 10.255.0.4
domain ipv4 host kolobrzeg 10.255.0.5
domain ipv4 host krakow 10.255.0.6
domain ipv4 host lodz 10.255.0.7
domain ipv4 host poznan 10.255.0.8
domain ipv4 host szczecin 10.255.0.10
domain ipv4 host warsaw 10.255.0.11
domain ipv4 host wroclaw 10.255.0.12
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.9 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description rzeszow -> krakow [passive]
 ipv4 address 10.0.0.23 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description rzeszow -> bialystok [internal]
 ipv4 address 10.0.0.27 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description rzeszow -> stub [stub]
 ipv4 address 10.254.0.33 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
router ospf 1
!
! These throttle timers are probably too aggressive for a production network but
! make labs run better ;)
!
 log adjacency changes
 timers throttle spf 10 20 100
 timers throttle lsa all 10 20 100
 router-id 10.255.0.9

 loopback stub-network enable
 area 0.0.0.0
  interface Loopback0
   passive enable
  interface GigabitEthernet0/0/0/0
   passive enable
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/1
   network point-to-point
   cost 10
  interface GigabitEthernet0/0/0/2
   passive enable
   cost 1

!
!
router bgp 65001
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.9

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.1
  remote-as 65001
  description bialystok
  update-source Loopback0
  address-family ipv4 unicast

!
 neighbor 10.0.0.22
  remote-as 65002
  description krakow
  address-family ipv4 unicast
   send-community-ebgp

!
!
!
router bgp 65001
!
  neighbor 10.255.0.1
    address-family ipv4 unicast

  neighbor 10.0.0.22
    address-family ipv4 unicast
      route-policy BGP-IN in
      route-policy BGP-OUT out


router bgp 65001
 neighbor 10.255.0.1
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
