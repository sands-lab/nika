
/system/identity set name="katowice"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=bialystok address=10.255.0.1
/ip/dns/static add name=bydgoszcz address=10.255.0.2
/ip/dns/static add name=gdansk address=10.255.0.3
/ip/dns/static add name=kolobrzeg address=10.255.0.5
/ip/dns/static add name=krakow address=10.255.0.6
/ip/dns/static add name=lodz address=10.255.0.7
/ip/dns/static add name=poznan address=10.255.0.8
/ip/dns/static add name=rzeszow address=10.255.0.9
/ip/dns/static add name=szczecin address=10.255.0.10
/ip/dns/static add name=warsaw address=10.255.0.11
/ip/dns/static add name=wroclaw address=10.255.0.12

/ip/address add interface=loopback address=10.255.0.4/32




/interface/ethernet set comment="katowice -> wroclaw [internal]" ether2
/ip/address add interface=ether2 address=10.0.0.14/31
/ip/address set [find where interface=ether2] comment="katowice -> wroclaw [internal]"

/interface/ethernet set comment="katowice -> krakow [internal]" ether3
/ip/address add interface=ether3 address=10.0.0.16/31
/ip/address set [find where interface=ether3] comment="katowice -> krakow [internal]"

/interface/ethernet set comment="katowice -> lodz [internal]" ether4
/ip/address add interface=ether4 address=10.0.0.18/31
/ip/address set [find where interface=ether4] comment="katowice -> lodz [internal]"

/interface/ethernet set comment="katowice -> stub [stub]" ether5
/ip/address add interface=ether5 address=10.254.0.13/30
/ip/address set [find where interface=ether5] comment="katowice -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.4 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether5 passive cost=1

