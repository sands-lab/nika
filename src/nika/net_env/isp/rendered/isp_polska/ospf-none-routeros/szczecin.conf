
/system/identity set name="szczecin"

/interface/bridge add name=loopback protocol-mode=none

# Host entries
/ip/dns/static add name=bialystok address=10.255.0.1
/ip/dns/static add name=bydgoszcz address=10.255.0.2
/ip/dns/static add name=gdansk address=10.255.0.3
/ip/dns/static add name=katowice address=10.255.0.4
/ip/dns/static add name=kolobrzeg address=10.255.0.5
/ip/dns/static add name=krakow address=10.255.0.6
/ip/dns/static add name=lodz address=10.255.0.7
/ip/dns/static add name=poznan address=10.255.0.8
/ip/dns/static add name=rzeszow address=10.255.0.9
/ip/dns/static add name=warsaw address=10.255.0.11
/ip/dns/static add name=wroclaw address=10.255.0.12

/ip/address add interface=loopback address=10.255.0.10/32




/interface/ethernet set comment="szczecin -> kolobrzeg [internal]" ether2
/ip/address add interface=ether2 address=10.0.0.13/31
/ip/address set [find where interface=ether2] comment="szczecin -> kolobrzeg [internal]"

/interface/ethernet set comment="szczecin -> poznan [internal]" ether3
/ip/address add interface=ether3 address=10.0.0.35/31
/ip/address set [find where interface=ether3] comment="szczecin -> poznan [internal]"

/interface/ethernet set comment="szczecin -> stub [stub]" ether4
/ip/address add interface=ether4 address=10.254.0.37/30
/ip/address set [find where interface=ether4] comment="szczecin -> stub [stub]"

/ip/neighbor/discovery-settings set discover-interface-list=all


/routing/ospf/instance add name=default4 version=2 router-id=10.255.0.10 vrf=main

/routing/ospf/area add instance=default4 name="main_2_0.0.0.0" area-id=0.0.0.0

/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=loopback 
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether2 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether3 type=ptp cost=10
/routing/ospf/interface-template add area=[/routing ospf area find area-id=0.0.0.0 and instance=default4] interface=ether4 passive cost=1

