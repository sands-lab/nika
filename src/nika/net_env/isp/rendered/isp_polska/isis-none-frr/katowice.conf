hostname katowice
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description katowice -> wroclaw [internal]
 ip address 10.0.0.14/31
!
interface eth1
 no shutdown
 description katowice -> krakow [internal]
 ip address 10.0.0.16/31
!
interface eth2
 no shutdown
 description katowice -> lodz [internal]
 ip address 10.0.0.18/31
!
interface eth3
 no shutdown
 description katowice -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0004.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! katowice -> wroclaw
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! katowice -> krakow
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! katowice -> lodz
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! katowice -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
