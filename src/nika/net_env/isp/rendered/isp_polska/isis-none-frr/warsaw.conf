hostname warsaw
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description warsaw -> gdansk [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description warsaw -> bydgoszcz [internal]
 ip address 10.0.0.7/31
!
interface eth2
 no shutdown
 description warsaw -> krakow [internal]
 ip address 10.0.0.21/31
!
interface eth3
 no shutdown
 description warsaw -> bialystok [internal]
 ip address 10.0.0.25/31
!
interface eth4
 no shutdown
 description warsaw -> lodz [internal]
 ip address 10.0.0.29/31
!
interface eth5
 no shutdown
 description warsaw -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000b.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! warsaw -> gdansk
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! warsaw -> bydgoszcz
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! warsaw -> krakow
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! warsaw -> bialystok
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! warsaw -> lodz
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! warsaw -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
