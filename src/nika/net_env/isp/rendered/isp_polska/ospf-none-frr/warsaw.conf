hostname warsaw
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description warsaw -> gdansk [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description warsaw -> bydgoszcz [internal]
 ip address 10.0.0.7/31
!
interface eth2
 no shutdown
 description warsaw -> krakow [internal]
 ip address 10.0.0.21/31
!
interface eth3
 no shutdown
 description warsaw -> bialystok [internal]
 ip address 10.0.0.25/31
!
interface eth4
 no shutdown
 description warsaw -> lodz [internal]
 ip address 10.0.0.29/31
!
interface eth5
 no shutdown
 description warsaw -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.11
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! warsaw -> gdansk
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! warsaw -> bydgoszcz
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! warsaw -> krakow
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! warsaw -> bialystok
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! warsaw -> lodz
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! warsaw -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
