hostname bydgoszcz
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description bydgoszcz -> warsaw [internal]
 ip address 10.0.0.6/31
!
interface eth1
 no shutdown
 description bydgoszcz -> kolobrzeg [internal]
 ip address 10.0.0.8/31
!
interface eth2
 no shutdown
 description bydgoszcz -> poznan [internal]
 ip address 10.0.0.10/31
!
interface eth3
 no shutdown
 description bydgoszcz -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! bydgoszcz -> warsaw
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! bydgoszcz -> kolobrzeg
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! bydgoszcz -> poznan
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! bydgoszcz -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
