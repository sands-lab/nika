/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_21] input.filter=POLICY-BGP-IN output.filter-chain=POLICY-BGP-OUT local.address=10.0.0.20
/routing/bgp/connection set [/routing/bgp/connection find name=10_0_0_23] input.filter=POLICY-BGP-IN output.filter-chain=POLICY-BGP-OUT local.address=10.0.0.22
/routing/bgp/connection set [/routing/bgp/connection find name=10_255_0_4] input.filter=POLICY-BGP-IN output.filter-chain=POLICY-BGP-OUT local.address=10.255.0.6
