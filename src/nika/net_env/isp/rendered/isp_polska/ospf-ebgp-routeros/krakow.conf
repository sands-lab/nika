/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 198.18.0.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 198.51.100.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 198.51.100.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 198.51.101.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 198.51.101.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 198.51.102.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 198.51.102.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 203.0.113.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 203.0.113.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 203.0.114.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-OUT rule="if (dst == 203.0.114.0/24) { accept; }"
/routing filter rule add chain=POLICY-BGP-IN rule="if (dst == 203.0.115.0/24) { accept; }"
