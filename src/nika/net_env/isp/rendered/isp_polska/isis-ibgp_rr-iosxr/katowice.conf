hostname katowice
!
domain lookup disable
!
lldp
 no management enable
!
domain ipv4 host bialystok 10.255.0.1
domain ipv4 host bydgoszcz 10.255.0.2
domain ipv4 host gdansk 10.255.0.3
domain ipv4 host kolobrzeg 10.255.0.5
domain ipv4 host krakow 10.255.0.6
domain ipv4 host lodz 10.255.0.7
domain ipv4 host poznan 10.255.0.8
domain ipv4 host rzeszow 10.255.0.9
domain ipv4 host szczecin 10.255.0.10
domain ipv4 host warsaw 10.255.0.11
domain ipv4 host wroclaw 10.255.0.12
!
interface Loopback0
 no shutdown
 ipv4 address 10.255.0.4 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 no shutdown
 description katowice -> wroclaw [internal]
 ipv4 address 10.0.0.14 255.255.255.254
!
interface GigabitEthernet0/0/0/1
 no shutdown
 description katowice -> krakow [internal]
 ipv4 address 10.0.0.16 255.255.255.254
!
interface GigabitEthernet0/0/0/2
 no shutdown
 description katowice -> lodz [internal]
 ipv4 address 10.0.0.18 255.255.255.254
!
interface GigabitEthernet0/0/0/3
 no shutdown
 description katowice -> stub [stub]
 ipv4 address 10.254.0.13 255.255.255.252
!
!
!
prefix-set BUSINESS
  198.18.0.0/24,
  198.51.100.0/24,
  198.51.101.0/24,
  198.51.102.0/24,
  203.0.113.0/24,
  203.0.114.0/24,
  203.0.115.0/24
end-set
!
route-policy BGP-IN
  if destination in BUSINESS then
    pass
  endif
end-policy
!
route-policy BGP-OUT
  if destination in BUSINESS then
    pass
  endif
end-policy
!
!
!
router isis CORE

 log adjacency changes
 lsp-gen-interval initial-wait 50 secondary-wait 100 maximum-wait 500
 is-type level-2-only
 net 49.0001.0000.0aff.0004.00
!
 address-family ipv4 unicast
  metric-style wide
  spf-interval initial-wait 50 secondary-wait 100 maximum-wait 500
!
!
 interface Loopback0
  passive
  address-family ipv4
!
 interface GigabitEthernet0/0/0/0
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/1
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/2
  point-to-point
  circuit-type level-2
  address-family ipv4
    metric 10
!
 interface GigabitEthernet0/0/0/3
  passive
  circuit-type level-2
  address-family ipv4
    metric 1

!
!
router bgp 65000
 bgp unsafe-ebgp-policy
 bgp scan-time 5
 bgp update-delay 5
 bgp router-id 10.255.0.4

!
 address-family ipv4 unicast
  bgp scan-time 5
!
!
!
 neighbor 10.255.0.1
  remote-as 65000
  description bialystok
  update-source Loopback0
  address-family ipv4 unicast

!
 neighbor 10.255.0.2
  remote-as 65000
  description bydgoszcz
  update-source Loopback0
  address-family ipv4 unicast


router bgp 65000
 neighbor 10.255.0.1
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
 neighbor 10.255.0.2
  address-family ipv4 unicast
   route-policy BGP-IN in
   route-policy BGP-OUT out
  !
 !
!
