hostname n19
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description n19 -> n2 [internal]
 ip address 10.0.0.40/31
!
interface eth1
 no shutdown
 description n19 -> n15 [passive]
 ip address 10.0.0.45/31
!
interface eth2
 no shutdown
 description n19 -> n16 [passive]
 ip address 10.0.0.69/31
!
interface eth3
 no shutdown
 description n19 -> n7 [passive]
 ip address 10.0.0.74/31
!
interface eth4
 no shutdown
 description n19 -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.11
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n19 -> n2
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n19 -> n15
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! n19 -> n16
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! n19 -> n7
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth4
! n19 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65003
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.11
!
  neighbor 10.255.0.4 remote-as 65003
  neighbor 10.255.0.4 description n12
  neighbor 10.255.0.4 update-source lo
!
  neighbor 10.0.0.44 remote-as 65001
  neighbor 10.0.0.44 description n15
!
  neighbor 10.0.0.68 remote-as 65002
  neighbor 10.0.0.68 description n16
!
  neighbor 10.0.0.75 remote-as 65002
  neighbor 10.0.0.75 description n7
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.4 next-hop-self
  no neighbor 10.255.0.4 send-community all
  neighbor 10.255.0.4 send-community standard
  neighbor 10.255.0.4 send-community large
  neighbor 10.255.0.4 send-community extended
!
  neighbor 10.0.0.44 activate
  no neighbor 10.0.0.44 send-community all
  neighbor 10.0.0.44 send-community standard
  neighbor 10.0.0.44 send-community large
!
  neighbor 10.0.0.68 activate
  no neighbor 10.0.0.68 send-community all
  neighbor 10.0.0.68 send-community standard
  neighbor 10.0.0.68 send-community large
!
  neighbor 10.0.0.75 activate
  no neighbor 10.0.0.75 send-community all
  neighbor 10.0.0.75 send-community standard
  neighbor 10.0.0.75 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.44 route-map BGP-IN in
    neighbor 10.0.0.44 route-map BGP-OUT out

    neighbor 10.0.0.68 route-map BGP-IN in
    neighbor 10.0.0.68 route-map BGP-OUT out

    neighbor 10.0.0.75 route-map BGP-IN in
    neighbor 10.0.0.75 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.4 route-map BGP-IN in
 exit-address-family
!
