!
interface eth3
 no shutdown
 description n12 -> n20 [passive]
 ip address 10.0.0.64/31
!
interface eth4
 no shutdown
 description n12 -> n4 [passive]
 ip address 10.0.0.76/31
!
interface eth5
 no shutdown
