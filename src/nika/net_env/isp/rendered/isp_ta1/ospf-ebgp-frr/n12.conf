#!/usr/bin/vtysh -f

!
router bgp 65003
!
! Global address families
  address-family ipv4






    neighbor 10.0.0.53 route-map BGP-IN in
    neighbor 10.0.0.53 route-map BGP-OUT out

    neighbor 10.0.0.65 route-map BGP-IN in
    neighbor 10.0.0.65 route-map BGP-OUT out

    neighbor 10.0.0.77 route-map BGP-IN in
    neighbor 10.0.0.77 route-map BGP-OUT out

!
!

router bgp 65003
 address-family ipv4 unicast
  neighbor 10.255.0.5 route-map BGP-IN in
  neighbor 10.255.0.11 route-map BGP-IN in
  neighbor 10.255.0.12 route-map BGP-IN in
  neighbor 10.255.0.20 route-map BGP-IN in
  neighbor 10.255.0.21 route-map BGP-IN in
 exit-address-family
