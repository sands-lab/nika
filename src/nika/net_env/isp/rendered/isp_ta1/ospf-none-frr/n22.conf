hostname n22
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.15/32
!
interface eth0
 no shutdown
 description n22 -> n8 [internal]
 ip address 10.0.0.26/31
!
interface eth1
 no shutdown
 description n22 -> n12 [internal]
 ip address 10.0.0.53/31
!
interface eth2
 no shutdown
 description n22 -> n20 [internal]
 ip address 10.0.0.103/31
!
interface eth3
 no shutdown
 description n22 -> stub [stub]
 ip address 10.254.0.57/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.15
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n22 -> n8
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n22 -> n12
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n22 -> n20
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n22 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
