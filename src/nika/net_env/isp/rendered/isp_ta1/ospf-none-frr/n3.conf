hostname n3
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.18/32
!
interface eth0
 no shutdown
 description n3 -> n14 [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description n3 -> n15 [internal]
 ip address 10.0.0.13/31
!
interface eth2
 no shutdown
 description n3 -> n5 [internal]
 ip address 10.0.0.16/31
!
interface eth3
 no shutdown
 description n3 -> n20 [internal]
 ip address 10.0.0.21/31
!
interface eth4
 no shutdown
 description n3 -> n5 [internal]
 ip address 10.0.0.90/31
!
interface eth5
 no shutdown
 description n3 -> stub [stub]
 ip address 10.254.0.69/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.18
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n3 -> n14
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n3 -> n15
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n3 -> n5
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n3 -> n20
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n3 -> n5
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! n3 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
