hostname n5
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description n5 -> n3 [internal]
 ip address 10.0.0.17/31
!
interface eth1
 no shutdown
 description n5 -> n6 [internal]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description n5 -> n15 [internal]
