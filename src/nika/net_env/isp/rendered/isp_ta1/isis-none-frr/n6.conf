hostname n6
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.21/32
!
interface eth0
 no shutdown
 description n6 -> n5 [internal]
 ip address 10.0.0.19/31
!
interface eth1
 no shutdown
 description n6 -> n15 [internal]
 ip address 10.0.0.25/31
!
interface eth2
 no shutdown
 description n6 -> stub [stub]
 ip address 10.254.0.81/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0015.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! n6 -> n5
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! n6 -> n15
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! n6 -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
