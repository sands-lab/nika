hostname n23
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.16/32
!
interface eth0
 no shutdown
 description n23 -> n25 [internal]
 ip address 10.0.0.14/31
!
interface eth1
 no shutdown
 description n23 -> n24 [internal]
 ip address 10.0.0.18/31
!
interface eth2
 no shutdown
 description n23 -> n27 [internal]
 ip address 10.0.0.24/31
!
interface eth3
 no shutdown
 description n23 -> n22 [internal]
 ip address 10.0.0.27/31
!
interface eth4
 no shutdown
 description n23 -> stub [stub]
 ip address 10.254.0.61/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.16
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! n23 -> n25
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! n23 -> n24
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! n23 -> n27
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! n23 -> n22
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! n23 -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
