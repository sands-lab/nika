!
interface eth2
 no shutdown
 description de1_de -> fr1_fr [passive]
 ip address 10.0.0.26/31
!
interface eth3
 no shutdown
 description de1_de -> gr1_gr [internal]
 ip address 10.0.0.28/31
!
interface eth4
 no shutdown
 description de1_de -> ie1_ie [internal]
 ip address 10.0.0.30/31
!
interface eth5
 no shutdown
 description de1_de -> it1_it [internal]
 ip address 10.0.0.32/31
!
interface eth6
 no shutdown
 description de1_de -> nl1_nl [passive]
 ip address 10.0.0.34/31
!
interface eth7
 no shutdown
 description de1_de -> se1_se [passive]
