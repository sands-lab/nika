hostname it1_it
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.13/32
!
interface eth0
 no shutdown
 description it1_it -> ch1_ch [internal]
 ip address 10.0.0.19/31
!
interface eth1
 no shutdown
 description it1_it -> de1_de [internal]
 ip address 10.0.0.33/31
!
interface eth2
 no shutdown
 description it1_it -> es1_es [passive]
 ip address 10.0.0.41/31
!
interface eth3
 no shutdown
 description it1_it -> gr1_gr [internal]
 ip address 10.0.0.49/31
!
interface eth4
 no shutdown
 description it1_it -> il1_il [passive]
 ip address 10.0.0.59/31
!
interface eth5
 no shutdown
 description it1_it -> stub [stub]
 ip address 10.254.0.49/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.13
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! it1_it -> ch1_ch
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! it1_it -> de1_de
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! it1_it -> es1_es
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! it1_it -> gr1_gr
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! it1_it -> il1_il
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth5
! it1_it -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65001
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.13
!
  neighbor 10.255.0.1 remote-as 65001
  neighbor 10.255.0.1 description at1_at
  neighbor 10.255.0.1 update-source lo
!
  neighbor 10.0.0.40 remote-as 65002
  neighbor 10.0.0.40 description es1_es
!
  neighbor 10.0.0.58 remote-as 65002
  neighbor 10.0.0.58 description il1_il
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
  no neighbor 10.255.0.1 send-community all
  neighbor 10.255.0.1 send-community standard
  neighbor 10.255.0.1 send-community large
  neighbor 10.255.0.1 send-community extended
!
  neighbor 10.0.0.40 activate
  no neighbor 10.0.0.40 send-community all
  neighbor 10.0.0.40 send-community standard
  neighbor 10.0.0.40 send-community large
!
  neighbor 10.0.0.58 activate
  no neighbor 10.0.0.58 send-community all
  neighbor 10.0.0.58 send-community standard
  neighbor 10.0.0.58 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65001
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.40 route-map BGP-IN in
    neighbor 10.0.0.40 route-map BGP-OUT out

    neighbor 10.0.0.58 route-map BGP-IN in
    neighbor 10.0.0.58 route-map BGP-OUT out

!
!

router bgp 65001
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-map BGP-IN in
 exit-address-family
!
