hostname fr1_fr
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description fr1_fr -> be1_be [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description fr1_fr -> ch1_ch [passive]
 ip address 10.0.0.17/31
!
interface eth2
 no shutdown
 description fr1_fr -> de1_de [passive]
 ip address 10.0.0.27/31
!
interface eth3
 no shutdown
 description fr1_fr -> es1_es [internal]
 ip address 10.0.0.39/31
!
interface eth4
 no shutdown
 description fr1_fr -> lu1_lu [internal]
 ip address 10.0.0.44/31
!
interface eth5
 no shutdown
 description fr1_fr -> uk1_uk [passive]
 ip address 10.0.0.46/31
!
interface eth6
 no shutdown
 description fr1_fr -> stub [stub]
 ip address 10.254.0.25/30
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.7
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! fr1_fr -> be1_be
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! fr1_fr -> ch1_ch
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth2
! fr1_fr -> de1_de
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! fr1_fr -> es1_es
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! fr1_fr -> lu1_lu
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! fr1_fr -> uk1_uk
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth6
! fr1_fr -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
!
#!/usr/bin/vtysh -f
!
router bgp 65002
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast
  bgp default show-hostname
  bgp default show-nexthop-hostname
  ! Consider AS paths of same length but with different AS as ECMP candidates
  bgp bestpath as-path multipath-relax

  bgp router-id 10.255.0.7
!
  neighbor 10.255.0.2 remote-as 65002
  neighbor 10.255.0.2 description be1_be
  neighbor 10.255.0.2 update-source lo
!
  neighbor 10.0.0.16 remote-as 65001
  neighbor 10.0.0.16 description ch1_ch
!
  neighbor 10.0.0.26 remote-as 65001
  neighbor 10.0.0.26 description de1_de
!
  neighbor 10.0.0.47 remote-as 65001
  neighbor 10.0.0.47 description uk1_uk
!
 address-family ipv4 unicast
!

!
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  no neighbor 10.255.0.2 send-community all
  neighbor 10.255.0.2 send-community standard
  neighbor 10.255.0.2 send-community large
  neighbor 10.255.0.2 send-community extended
!
  neighbor 10.0.0.16 activate
  no neighbor 10.0.0.16 send-community all
  neighbor 10.0.0.16 send-community standard
  neighbor 10.0.0.16 send-community large
!
  neighbor 10.0.0.26 activate
  no neighbor 10.0.0.26 send-community all
  neighbor 10.0.0.26 send-community standard
  neighbor 10.0.0.26 send-community large
!
  neighbor 10.0.0.47 activate
  no neighbor 10.0.0.47 send-community all
  neighbor 10.0.0.47 send-community standard
  neighbor 10.0.0.47 send-community large
!
!
!
#!/usr/bin/vtysh -f

!
router bgp 65002
!
! Global address families
  address-family ipv4


    neighbor 10.0.0.16 route-map BGP-IN in
    neighbor 10.0.0.16 route-map BGP-OUT out

    neighbor 10.0.0.26 route-map BGP-IN in
    neighbor 10.0.0.26 route-map BGP-OUT out

    neighbor 10.0.0.47 route-map BGP-IN in
    neighbor 10.0.0.47 route-map BGP-OUT out

!
!

router bgp 65002
 address-family ipv4 unicast
  neighbor 10.255.0.2 route-map BGP-IN in
 exit-address-family
!
