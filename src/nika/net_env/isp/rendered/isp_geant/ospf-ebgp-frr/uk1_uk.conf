hostname uk1_uk
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.22/32
!
interface eth0
 no shutdown
 description uk1_uk -> fr1_fr [passive]
 ip address 10.0.0.47/31
!
interface eth1
 no shutdown
 description uk1_uk -> ie1_ie [internal]
 ip address 10.0.0.57/31
!
interface eth2
 no shutdown
 description uk1_uk -> nl1_nl [passive]
 ip address 10.0.0.63/31
!
interface eth3
 no shutdown
 description uk1_uk -> ny1_ny [internal]
 ip address 10.0.0.65/31
!
interface eth4
 no shutdown
 description uk1_uk -> pt1_pt [internal]
 ip address 10.0.0.69/31
!
interface eth5
 no shutdown
 description uk1_uk -> se1_se [passive]
 ip address 10.0.0.71/31
!
interface eth6
 no shutdown
 description uk1_uk -> stub [stub]
 ip address 10.254.0.85/30
!
interface lo1
 no shutdown
 description uk1_uk -> stub
 ip address 198.51.100.1/24
!
!
#!/usr/bin/vtysh -f
!
!
route-map BGP-IN permit 10
  match ip address prefix-list BUSINESS

!
route-map BGP-IN permit 20
  match ip address prefix-list CUSTOMERS

!
route-map BGP-OUT permit 10
  match ip address prefix-list BUSINESS

!
ip prefix-list BUSINESS seq 100 permit 198.18.0.0/24
ip prefix-list BUSINESS seq 110 permit 198.51.100.0/24
ip prefix-list BUSINESS seq 120 permit 198.51.101.0/24
ip prefix-list BUSINESS seq 130 permit 198.51.102.0/24
ip prefix-list BUSINESS seq 140 permit 203.0.113.0/24
ip prefix-list BUSINESS seq 150 permit 203.0.114.0/24
ip prefix-list BUSINESS seq 160 permit 203.0.115.0/24
!
ip prefix-list CUSTOMERS seq 100 permit 198.51.110.0/24
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.22
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! uk1_uk -> fr1_fr
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth1
! uk1_uk -> ie1_ie
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! uk1_uk -> nl1_nl
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth3
! uk1_uk -> ny1_ny
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! uk1_uk -> pt1_pt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! uk1_uk -> se1_se
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf passive
!
interface eth6
! uk1_uk -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
