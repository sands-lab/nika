hostname sk1_sk
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.21/32
!
interface eth0
 no shutdown
 description sk1_sk -> cz1_cz [internal]
 ip address 10.0.0.25/31
!
interface eth1
 no shutdown
 description sk1_sk -> hu1_hu [internal]
 ip address 10.0.0.55/31
!
interface eth2
 no shutdown
 description sk1_sk -> stub [stub]
 ip address 10.254.0.81/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.21
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! sk1_sk -> cz1_cz
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! sk1_sk -> hu1_hu
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! sk1_sk -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
