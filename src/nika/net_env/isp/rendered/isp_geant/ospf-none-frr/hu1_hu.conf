hostname hu1_hu
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description hu1_hu -> at1_at [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description hu1_hu -> hr1_hr [internal]
 ip address 10.0.0.51/31
!
interface eth2
 no shutdown
 description hu1_hu -> sk1_sk [internal]
 ip address 10.0.0.54/31
!
interface eth3
 no shutdown
 description hu1_hu -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.10
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! hu1_hu -> at1_at
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! hu1_hu -> hr1_hr
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! hu1_hu -> sk1_sk
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! hu1_hu -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
