hostname lu1_lu
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.14/32
!
interface eth0
 no shutdown
 description lu1_lu -> be1_be [internal]
 ip address 10.0.0.13/31
!
interface eth1
 no shutdown
 description lu1_lu -> fr1_fr [internal]
 ip address 10.0.0.45/31
!
interface eth2
 no shutdown
 description lu1_lu -> stub [stub]
 ip address 10.254.0.53/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.14
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! lu1_lu -> be1_be
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! lu1_lu -> fr1_fr
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! lu1_lu -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
