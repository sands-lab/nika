hostname se1_se
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.19/32
!
interface eth0
 no shutdown
 description se1_se -> de1_de [internal]
 ip address 10.0.0.37/31
!
interface eth1
 no shutdown
 description se1_se -> pl1_pl [internal]
 ip address 10.0.0.67/31
!
interface eth2
 no shutdown
 description se1_se -> uk1_uk [internal]
 ip address 10.0.0.70/31
!
interface eth3
 no shutdown
 description se1_se -> stub [stub]
 ip address 10.254.0.73/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.19
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! se1_se -> de1_de
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! se1_se -> pl1_pl
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! se1_se -> uk1_uk
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! se1_se -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
