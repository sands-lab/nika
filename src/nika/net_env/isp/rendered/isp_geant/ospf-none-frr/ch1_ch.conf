hostname ch1_ch
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.3/32
!
interface eth0
 no shutdown
 description ch1_ch -> at1_at [internal]
 ip address 10.0.0.1/31
!
interface eth1
 no shutdown
 description ch1_ch -> fr1_fr [internal]
 ip address 10.0.0.16/31
!
interface eth2
 no shutdown
 description ch1_ch -> it1_it [internal]
 ip address 10.0.0.18/31
!
interface eth3
 no shutdown
 description ch1_ch -> stub [stub]
 ip address 10.254.0.9/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.3
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! ch1_ch -> at1_at
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! ch1_ch -> fr1_fr
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! ch1_ch -> it1_it
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! ch1_ch -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
