hostname uk1_uk
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.22/32
!
interface eth0
 no shutdown
 description uk1_uk -> fr1_fr [internal]
 ip address 10.0.0.47/31
!
interface eth1
 no shutdown
 description uk1_uk -> ie1_ie [internal]
 ip address 10.0.0.57/31
!
interface eth2
 no shutdown
 description uk1_uk -> nl1_nl [internal]
 ip address 10.0.0.63/31
!
interface eth3
 no shutdown
 description uk1_uk -> ny1_ny [internal]
 ip address 10.0.0.65/31
!
interface eth4
 no shutdown
 description uk1_uk -> pt1_pt [internal]
 ip address 10.0.0.69/31
!
interface eth5
 no shutdown
 description uk1_uk -> se1_se [internal]
 ip address 10.0.0.71/31
!
interface eth6
 no shutdown
 description uk1_uk -> stub [stub]
 ip address 10.254.0.85/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.22
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! uk1_uk -> fr1_fr
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! uk1_uk -> ie1_ie
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! uk1_uk -> nl1_nl
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! uk1_uk -> ny1_ny
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! uk1_uk -> pt1_pt
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! uk1_uk -> se1_se
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! uk1_uk -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
