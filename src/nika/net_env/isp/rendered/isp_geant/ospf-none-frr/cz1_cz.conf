hostname cz1_cz
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.4/32
!
interface eth0
 no shutdown
 description cz1_cz -> de1_de [internal]
 ip address 10.0.0.20/31
!
interface eth1
 no shutdown
 description cz1_cz -> pl1_pl [internal]
 ip address 10.0.0.22/31
!
interface eth2
 no shutdown
 description cz1_cz -> sk1_sk [internal]
 ip address 10.0.0.24/31
!
interface eth3
 no shutdown
 description cz1_cz -> stub [stub]
 ip address 10.254.0.13/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.4
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! cz1_cz -> de1_de
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! cz1_cz -> pl1_pl
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! cz1_cz -> sk1_sk
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! cz1_cz -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
