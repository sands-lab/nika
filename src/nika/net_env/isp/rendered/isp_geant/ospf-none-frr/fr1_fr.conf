hostname fr1_fr
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.7/32
!
interface eth0
 no shutdown
 description fr1_fr -> be1_be [internal]
 ip address 10.0.0.11/31
!
interface eth1
 no shutdown
 description fr1_fr -> ch1_ch [internal]
 ip address 10.0.0.17/31
!
interface eth2
 no shutdown
 description fr1_fr -> de1_de [internal]
 ip address 10.0.0.27/31
!
interface eth3
 no shutdown
 description fr1_fr -> es1_es [internal]
 ip address 10.0.0.39/31
!
interface eth4
 no shutdown
 description fr1_fr -> lu1_lu [internal]
 ip address 10.0.0.44/31
!
interface eth5
 no shutdown
 description fr1_fr -> uk1_uk [internal]
 ip address 10.0.0.46/31
!
interface eth6
 no shutdown
 description fr1_fr -> stub [stub]
 ip address 10.254.0.25/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.7
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! fr1_fr -> be1_be
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! fr1_fr -> ch1_ch
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! fr1_fr -> de1_de
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! fr1_fr -> es1_es
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! fr1_fr -> lu1_lu
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! fr1_fr -> uk1_uk
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth6
! fr1_fr -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
