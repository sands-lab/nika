hostname hr1_hr
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.9/32
!
interface eth0
 no shutdown
 description hr1_hr -> hu1_hu [internal]
 ip address 10.0.0.50/31
!
interface eth1
 no shutdown
 description hr1_hr -> si1_si [internal]
 ip address 10.0.0.52/31
!
interface eth2
 no shutdown
 description hr1_hr -> stub [stub]
 ip address 10.254.0.33/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.9
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! hr1_hr -> hu1_hu
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! hr1_hr -> si1_si
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! hr1_hr -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
