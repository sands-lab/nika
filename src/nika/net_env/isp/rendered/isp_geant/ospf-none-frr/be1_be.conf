hostname be1_be
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.2/32
!
interface eth0
 no shutdown
 description be1_be -> fr1_fr [internal]
 ip address 10.0.0.10/31
!
interface eth1
 no shutdown
 description be1_be -> lu1_lu [internal]
 ip address 10.0.0.12/31
!
interface eth2
 no shutdown
 description be1_be -> nl1_nl [internal]
 ip address 10.0.0.14/31
!
interface eth3
 no shutdown
 description be1_be -> stub [stub]
 ip address 10.254.0.5/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.2
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! be1_be -> fr1_fr
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! be1_be -> lu1_lu
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! be1_be -> nl1_nl
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! be1_be -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
