hostname si1_si
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description si1_si -> at1_at [internal]
 ip address 10.0.0.9/31
!
interface eth1
 no shutdown
 description si1_si -> hr1_hr [internal]
 ip address 10.0.0.53/31
!
interface eth2
 no shutdown
 description si1_si -> stub [stub]
 ip address 10.254.0.77/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.20
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! si1_si -> at1_at
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! si1_si -> hr1_hr
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! si1_si -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
