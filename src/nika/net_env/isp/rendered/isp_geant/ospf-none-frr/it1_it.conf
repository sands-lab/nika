hostname it1_it
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.13/32
!
interface eth0
 no shutdown
 description it1_it -> ch1_ch [internal]
 ip address 10.0.0.19/31
!
interface eth1
 no shutdown
 description it1_it -> de1_de [internal]
 ip address 10.0.0.33/31
!
interface eth2
 no shutdown
 description it1_it -> es1_es [internal]
 ip address 10.0.0.41/31
!
interface eth3
 no shutdown
 description it1_it -> gr1_gr [internal]
 ip address 10.0.0.49/31
!
interface eth4
 no shutdown
 description it1_it -> il1_il [internal]
 ip address 10.0.0.59/31
!
interface eth5
 no shutdown
 description it1_it -> stub [stub]
 ip address 10.254.0.49/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.13
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! it1_it -> ch1_ch
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! it1_it -> de1_de
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! it1_it -> es1_es
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! it1_it -> gr1_gr
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! it1_it -> il1_il
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth5
! it1_it -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
