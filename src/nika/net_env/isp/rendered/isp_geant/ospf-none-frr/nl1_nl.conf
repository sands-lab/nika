hostname nl1_nl
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.15/32
!
interface eth0
 no shutdown
 description nl1_nl -> be1_be [internal]
 ip address 10.0.0.15/31
!
interface eth1
 no shutdown
 description nl1_nl -> de1_de [internal]
 ip address 10.0.0.35/31
!
interface eth2
 no shutdown
 description nl1_nl -> il1_il [internal]
 ip address 10.0.0.61/31
!
interface eth3
 no shutdown
 description nl1_nl -> uk1_uk [internal]
 ip address 10.0.0.62/31
!
interface eth4
 no shutdown
 description nl1_nl -> stub [stub]
 ip address 10.254.0.57/30
!
!
#!/usr/bin/vtysh -f
!
! OSPFv2 FRR configuration
!
router ospf
 ospf router-id 10.255.0.15
 timers throttle spf 10 50 500
 timers throttle lsa all 100
 timers lsa min-arrival 100


exit
!
interface lo
! 
 ip ospf area 0.0.0.0
!
interface eth0
! nl1_nl -> be1_be
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
! nl1_nl -> de1_de
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
! nl1_nl -> il1_il
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth3
! nl1_nl -> uk1_uk
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth4
! nl1_nl -> stub
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!

!
