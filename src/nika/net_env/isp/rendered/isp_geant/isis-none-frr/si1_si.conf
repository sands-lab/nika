hostname si1_si
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.20/32
!
interface eth0
 no shutdown
 description si1_si -> at1_at [internal]
 ip address 10.0.0.9/31
!
interface eth1
 no shutdown
 description si1_si -> hr1_hr [internal]
 ip address 10.0.0.53/31
!
interface eth2
 no shutdown
 description si1_si -> stub [stub]
 ip address 10.254.0.77/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0014.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! si1_si -> at1_at
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! si1_si -> hr1_hr
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! si1_si -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
