hostname pl1_pl
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.17/32
!
interface eth0
 no shutdown
 description pl1_pl -> cz1_cz [internal]
 ip address 10.0.0.23/31
!
interface eth1
 no shutdown
 description pl1_pl -> se1_se [internal]
 ip address 10.0.0.66/31
!
interface eth2
 no shutdown
 description pl1_pl -> stub [stub]
 ip address 10.254.0.65/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0011.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! pl1_pl -> cz1_cz
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! pl1_pl -> se1_se
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! pl1_pl -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
