hostname it1_it
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.13/32
!
interface eth0
 no shutdown
 description it1_it -> ch1_ch [internal]
 ip address 10.0.0.19/31
!
interface eth1
 no shutdown
 description it1_it -> de1_de [internal]
 ip address 10.0.0.33/31
!
interface eth2
 no shutdown
 description it1_it -> es1_es [internal]
 ip address 10.0.0.41/31
!
interface eth3
 no shutdown
 description it1_it -> gr1_gr [internal]
 ip address 10.0.0.49/31
!
interface eth4
 no shutdown
 description it1_it -> il1_il [internal]
 ip address 10.0.0.59/31
!
interface eth5
 no shutdown
 description it1_it -> stub [stub]
 ip address 10.254.0.49/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000d.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! it1_it -> ch1_ch
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! it1_it -> de1_de
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! it1_it -> es1_es
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! it1_it -> gr1_gr
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! it1_it -> il1_il
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! it1_it -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
