hostname hu1_hu
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.10/32
!
interface eth0
 no shutdown
 description hu1_hu -> at1_at [internal]
 ip address 10.0.0.5/31
!
interface eth1
 no shutdown
 description hu1_hu -> hr1_hr [internal]
 ip address 10.0.0.51/31
!
interface eth2
 no shutdown
 description hu1_hu -> sk1_sk [internal]
 ip address 10.0.0.54/31
!
interface eth3
 no shutdown
 description hu1_hu -> stub [stub]
 ip address 10.254.0.37/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000a.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! hu1_hu -> at1_at
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! hu1_hu -> hr1_hr
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! hu1_hu -> sk1_sk
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! hu1_hu -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
