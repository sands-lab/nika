hostname es1_es
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.6/32
!
interface eth0
 no shutdown
 description es1_es -> fr1_fr [internal]
 ip address 10.0.0.38/31
!
interface eth1
 no shutdown
 description es1_es -> it1_it [internal]
 ip address 10.0.0.40/31
!
interface eth2
 no shutdown
 description es1_es -> pt1_pt [internal]
 ip address 10.0.0.42/31
!
interface eth3
 no shutdown
 description es1_es -> stub [stub]
 ip address 10.254.0.21/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0006.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! es1_es -> fr1_fr
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! es1_es -> it1_it
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! es1_es -> pt1_pt
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! es1_es -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
