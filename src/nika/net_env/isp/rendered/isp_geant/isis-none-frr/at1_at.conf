hostname at1_at
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.1/32
!
interface eth0
 no shutdown
 description at1_at -> ch1_ch [internal]
 ip address 10.0.0.0/31
!
interface eth1
 no shutdown
 description at1_at -> de1_de [internal]
 ip address 10.0.0.2/31
!
interface eth2
 no shutdown
 description at1_at -> hu1_hu [internal]
 ip address 10.0.0.4/31
!
interface eth3
 no shutdown
 description at1_at -> ny1_ny [internal]
 ip address 10.0.0.6/31
!
interface eth4
 no shutdown
 description at1_at -> si1_si [internal]
 ip address 10.0.0.8/31
!
interface eth5
 no shutdown
 description at1_at -> stub [stub]
 ip address 10.254.0.1/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0001.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! at1_at -> ch1_ch
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! at1_at -> de1_de
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! at1_at -> hu1_hu
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth3
! at1_at -> ny1_ny
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth4
! at1_at -> si1_si
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth5
! at1_at -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
