hostname ie1_ie
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.11/32
!
interface eth0
 no shutdown
 description ie1_ie -> de1_de [internal]
 ip address 10.0.0.31/31
!
interface eth1
 no shutdown
 description ie1_ie -> uk1_uk [internal]
 ip address 10.0.0.56/31
!
interface eth2
 no shutdown
 description ie1_ie -> stub [stub]
 ip address 10.254.0.41/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.000b.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! ie1_ie -> de1_de
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! ie1_ie -> uk1_uk
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! ie1_ie -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
