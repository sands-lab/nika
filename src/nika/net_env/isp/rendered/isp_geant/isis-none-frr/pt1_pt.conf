hostname pt1_pt
!
log file /var/log/frr/frr.log informational

!
ip forwarding
frr defaults traditional
!
interface lo
 no shutdown
 ip address 10.255.0.18/32
!
interface eth0
 no shutdown
 description pt1_pt -> es1_es [internal]
 ip address 10.0.0.43/31
!
interface eth1
 no shutdown
 description pt1_pt -> uk1_uk [internal]
 ip address 10.0.0.68/31
!
interface eth2
 no shutdown
 description pt1_pt -> stub [stub]
 ip address 10.254.0.69/30
!
!
#!/usr/bin/vtysh -f
!
!
!
router isis CORE
 log-adjacency-changes
 hostname dynamic
 is-type level-2
 metric-style wide
 lsp-timers gen-interval 1 refresh-interval 900 max-lifetime 1800
 net 49.0001.0000.0aff.0012.00

!
interface lo
! 
 ip router isis CORE
 isis passive
!
interface eth0
! pt1_pt -> es1_es
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth1
! pt1_pt -> uk1_uk
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2
 isis metric 10
!
interface eth2
! pt1_pt -> stub
 ip router isis CORE
 isis circuit-type level-2
 isis metric 1
 isis passive
!

!
