apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: llm-d-gateway
  namespace: llm-d
spec:
  deployment:
    spec:
      template:
        spec:
          containers:
          - name: agentgateway
            imagePullPolicy: Never
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-d-gateway
  namespace: llm-d
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: llm-d-gateway
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
# Routes all traffic through the InferencePool, which uses the EPP for P/D routing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-d-pd-route
  namespace: llm-d
spec:
  parentRefs:
  - name: llm-d-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: llm-d-pd
      port: 8000
    timeouts:
      request: 120s
