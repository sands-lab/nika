LAB_DESCRIPTION="A lab implementing a star topology with Kubernetes (k3s) deploying llm-d with disaggregated Prefill/Decode"
LAB_VERSION=0.1
LAB_AUTHOR="M. Scazzariello"

# Simple star network
controller[0]="A"
worker1[0]="A"
worker2[0]="A"
worker3[0]="A"
worker4[0]="A"
worker5[0]="A"
client[0]="A"

# Image definitions
controller[image]="rancher/k3s:v1.34.1-k3s1"
worker1[image]="rancher/k3s:v1.34.1-k3s1"
worker2[image]="rancher/k3s:v1.34.1-k3s1"
worker3[image]="rancher/k3s:v1.34.1-k3s1"
worker4[image]="rancher/k3s:v1.34.1-k3s1"
worker5[image]="rancher/k3s:v1.34.1-k3s1"
client[image]="nika/base"

# Bridged required to download container images
controller[bridged]="true"
worker1[bridged]="true"
worker2[bridged]="true"
worker3[bridged]="true"
worker4[bridged]="true"
worker5[bridged]="true"

# k3s requires privileged nodes
controller[privileged]="true"
worker1[privileged]="true"
worker2[privileged]="true"
worker3[privileged]="true"
worker4[privileged]="true"
worker5[privileged]="true"

# Servers ulimits, needed by k3s
controller[ulimit]="nproc=65535"
controller[ulimit]="nofile=65535"
worker1[ulimit]="nproc=65535"
worker1[ulimit]="nofile=65535"
worker2[ulimit]="nproc=65535"
worker2[ulimit]="nofile=65535"
worker3[ulimit]="nproc=65535"
worker3[ulimit]="nofile=65535"
worker4[ulimit]="nproc=65535"
worker4[ulimit]="nofile=65535"
worker5[ulimit]="nproc=65535"
worker5[ulimit]="nofile=65535"

# Wait for /var/run/nika-net-ready from *.startup, then exec k3s as PID1.
controller[env]="K3S_TOKEN=secret"
controller[env]="VERIFY_CHECKSUM=false"
controller[env]="KUBECONFIG=/etc/rancher/k3s/k3s.yaml"
controller[entrypoint]="/bin/sh"
controller[args]="-c \"while [ ! -f /var/run/nika-net-ready ]; do sleep 1; done; exec /bin/k3s server --disable servicelb --disable traefik --write-kubeconfig-mode 644\""
controller[shell]="/bin/sh"
worker1[env]="K3S_URL=https://controller:6443"
worker1[env]="K3S_TOKEN=secret"
worker1[entrypoint]="/bin/sh"
worker1[args]="-c \"while [ ! -f /var/run/nika-net-ready ]; do sleep 1; done; exec /bin/k3s agent\""
worker1[shell]="/bin/sh"
worker2[env]="K3S_URL=https://controller:6443"
worker2[env]="K3S_TOKEN=secret"
worker2[entrypoint]="/bin/sh"
worker2[args]="-c \"while [ ! -f /var/run/nika-net-ready ]; do sleep 1; done; exec /bin/k3s agent\""
worker2[shell]="/bin/sh"
worker3[env]="K3S_URL=https://controller:6443"
worker3[env]="K3S_TOKEN=secret"
worker3[entrypoint]="/bin/sh"
worker3[args]="-c \"while [ ! -f /var/run/nika-net-ready ]; do sleep 1; done; exec /bin/k3s agent\""
worker3[shell]="/bin/sh"
worker4[env]="K3S_URL=https://controller:6443"
worker4[env]="K3S_TOKEN=secret"
worker4[entrypoint]="/bin/sh"
worker4[args]="-c \"while [ ! -f /var/run/nika-net-ready ]; do sleep 1; done; exec /bin/k3s agent\""
worker4[shell]="/bin/sh"
worker5[env]="K3S_URL=https://controller:6443"
worker5[env]="K3S_TOKEN=secret"
worker5[entrypoint]="/bin/sh"
worker5[args]="-c \"while [ ! -f /var/run/nika-net-ready ]; do sleep 1; done; exec /bin/k3s agent\""
worker5[shell]="/bin/sh"