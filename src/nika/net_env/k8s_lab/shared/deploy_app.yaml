      - name: wait-for-weatherdb
        image: postgres:16
        command: [sh, -c, 'until pg_isready -h weatherdb -p 5432 -U root -d weatherdb -t 2; do sleep 2; done']
      containers:
      - name: weather-container
        image: ik2227/weather:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        startupProbe:
          tcpSocket:
            port: 5000
          periodSeconds: 3
          failureThreshold: 120
