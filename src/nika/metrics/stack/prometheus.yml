global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:8098"]
  # One session exporter per NIKA checkout, each registered by nika.metrics.stack.
  - job_name: nika
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 30s
