scenario: dc_clos
topo_size: s
traffic:
  pattern: incast
  incast_period_sec: 30
schedule:
  agent_start: 10s
  events:
    - traffic: background
      at: 0s
    - problem: link_down
      inject:
        host_name: client_0
        intf_name: eth0
      at: 5s
      duration: 10s
      repeat:
        every: 30s
        count: 2
    - problem: dns_record_error
      inject:
        host_name: dns_pod0
        target_domain: pod0
        target_website: web0
      at: 20s
