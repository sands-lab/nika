# NIKA run-config template for byo.autogen (AutoGen GraphFlow, host).
# Setup: cp config/byo.autogen.example.yaml config/byo.autogen.yaml
# Use:   uv run nika agent run --run-config config/byo.autogen.yaml --problem dc_clos_s_link_down
# Credentials stay in the repo-root .env file. Other keys use built-in defaults;
# see config/nika.example.yaml for the full platform / benchmark reference.

agent:
  type: byo.autogen
  provider: deepseek
  model: deepseek-v4-flash
  max_steps: 20
  # Optional for OpenAI, Anthropic, and supported custom models.
  # DeepSeek ignores this setting.
  # reasoning_effort: medium

nika:
  result_dir: results/autogen
