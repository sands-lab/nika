# NIKA run configuration template.
# Setup: cp config/nika.example.yaml config/nika.yaml, then edit the copy.
# CLI flags override this file. This file overrides built-in defaults.
# Keep API keys and other credentials in the repo-root .env file.
#
# Per-agent templates (use their agent settings in a copy of config/nika.yaml):
#   config/byo.langgraph.example.yaml
#   config/byo.mcp_agent.example.yaml
#   config/byo.autogen.example.yaml
#   config/cli.codex.example.yaml
#   config/cli.claude.example.yaml
#   config/cli.opencode.example.yaml
#   config/cli.dsh.example.yaml
#   config/sdk.codex_sdk.example.yaml
#   config/sdk.claude_sdk.example.yaml
# List registered names with: uv run nika agent list

# Default profile: LangGraph ReAct (every agent runs in a sandbox).
agent:
  type: byo.langgraph
  provider: deepseek
  model: deepseek-v4-flash
  max_steps: 20
  # Wall-clock budget in seconds for one agent run (diagnosis + submission),
  # for every agent type. 0 disables it. Keep it below benchmark.case_timeout_sec.
  timeout_sec: 1800
  # Load shared troubleshooting skills for Claude and Codex agents.
  enable_skills: true
  # Built-in agents default to medium; added agents get no default.
  # DeepSeek ignores this setting.
  # reasoning_effort: medium
  # Output-token cap per model response. Not applied by Codex agents or SADE.
  max_tokens: 8192
  # How the frozen report becomes the scored answer. structured (default): the
  # agent's own model calls submit(). unstructured: the model below maps the
  # report for every agent type; such runs cannot be packed for the leaderboard.
  # submission:
  #   mode: unstructured
  #   provider: custom
  #   model: Qwen/Qwen3.6-35B-A3B-FP8
  #   base_url: http://localhost:8000/v1
  #   samples: 3
  #   temperature: 0.7

# OpenAI-compatible endpoint example (OpenRouter). Uncomment and replace the
# agent block above. Set NIKA_CUSTOM_API_KEY in .env when auth is required.
# agent:
#   type: byo.langgraph
#   provider: custom
#   model: deepseek/deepseek-v4-flash
#   # Used only when provider is custom. Use the OpenAI-style API root,
#   # usually ending in /v1 (not just host:port).
#   base_url: https://openrouter.ai/api/v1
#   max_steps: 20
#   # Optional when the endpoint and model support this parameter.
#   # reasoning_effort: medium

# Configure NIKA runtime and lab behavior.
nika:
  # Write run artifacts under this directory.
  result_dir: results
  remote:
    # Run lab operations on a remote NIKA server.
    enabled: false
    # Required when remote mode is enabled.
    url: null
    # Reserved for remote artifact storage. Keep null.
    artifact_root: null
  execution:
    # Where benchmark trials run their labs: native (this host) or firecracker
    # (microVMs restored from lab images; docs/operations/firecracker.md).
    mode: native
    firecracker:
      # btrfs or XFS directory for the base image, lab and case images and
      # trial copies (relative to the NIKA checkout; uninstall removes it).
      root: runtime/firecracker
      vm_cpus: 4
      vm_memory: 4GiB
      # Scenario id -> VM memory, merged over NIKA's sizes for large labs
      # (k8s_lab, llmd_lab, min3clos, iosxr_simple_bgp: 8GiB; isp_pdh,
      # isp_di-yuan, isp_dfn-gwin: 20GiB), e.g. {k8s_lab: 12GiB}.
      vm_memory_overrides: {}
      # 2 MiB huge pages, required: reserve them on the host first (see the
      # docs). Each running copy holds its own huge pages.
      huge_pages: true
      # Verify the lab again after each restore, as a native deploy does.
      verify_after_restore: true
      # Also keep each failure task as a case image (snapshot right after
      # injection, tens of MiB each): trials skip verification and injection,
      # and all trials of a task start from the same injected state.
      case_images: false
      # Delete the lab and case images a run used when it ends. Keeping them
      # (false) takes disk but makes later runs much faster.
      clean_after_run: false
  sandbox:
    # Sandbox runtime: sbx (Docker Sandboxes) or e2b (E2B-compatible service).
    backend: sbx
    # e2b: URL of a service that serves its API and sandboxes at one address.
    # Null uses E2B_DOMAIN from .env, else E2B cloud.
    url: null
    # Keep the sandbox after a run for debugging.
    keep: false
    # vCPUs per sandbox. Null lets sbx use every host vCPU (e2b: service default).
    cpus: 2
    # Memory per sandbox. Null lets sbx use half of host memory (e2b: service
    # default).
    memory: 4g
    # sbx: install SDK agents from cached wheels instead of downloading
    # packages. e2b templates already contain them.
    offline_sdk_wheels: true
    # sbx: route sandboxd and sbx traffic through this proxy.
    upstream_proxy: null
  judge:
    # Provider used by `nika eval judge`.
    provider: openai
    # Model used by `nika eval judge`.
    model: gpt-5-mini
  lab:
    # Attempt a Kathara deployment up to this many times.
    deploy_attempts: 3
    # Wait this many seconds for Kathara machines to start.
    deploy_ready_timeout_sec: 90
    # Wait this many seconds for services after containers start.
    deploy_settle_sec: 5
    # Wait this many seconds for Kathara containers to stop.
    undeploy_verify_timeout_sec: 30
    # Stop scenario readiness checks after this many seconds.
    ready_max_wait_sec: 180
    # Wait this many seconds between readiness checks.
    ready_retry_delay_sec: 5
    # Check an injected fault this many times before reporting failure.
    failure_verify_max_attempts: 3
    # Wait this many seconds between fault checks.
    failure_verify_retry_delay_sec: 5
    # Limit concurrent Containerlab create/wire workers (clab deploy --max-workers).
    # Lower this (for example to 1) if Containerlab ISP labs OOM during deploy.
    containerlab_max_workers: 2
  mcp:
    # Stop waiting for an MCP response after this many seconds. Set 0 to disable.
    read_timeout_sec: 120
    # Bind the MCP gateway to this address.
    gateway_host: "127.0.0.1"
    # Bind the MCP gateway to this port. Set 0 to choose a free port.
    gateway_port: 0
    # Cap MCP tool text returned to the agent. Over this size, keep the first
    # and last halves and elide the middle (mini-swe-agent style). 0 disables.
    tool_output_max_chars: 10000
  static_validation:
    # Run supported topology checks with Batfish before deployment.
    enabled: false
    # Java heap for the Batfish container NIKA creates (recreate it to apply).
    batfish_heap: 8g
  runtime_validation:
    # light checks readiness. full runs each scenario's deeper verification.
    depth: light
    # Compare healthy and faulty contract evidence after fault injection.
    failure_effect: false

# Configure benchmark execution.
benchmark:
  # Run this frozen benchmark release. Null uses ad-hoc or CLI selection.
  release: null
  # Select a release split, such as dev or test.
  split: null
  # Run this many light trials at the same time.
  batch_size: 1
  # Run this many heavy trials (Containerlab, k8s/llmd/XRd, topo_size l) at the
  # same time. Heavy and light trials never overlap; 1 runs each heavy trial
  # alone on the host.
  heavy_batch_size: 1
  # Stop each trial after this many seconds. Set 0 to disable.
  case_timeout_sec: 2400
  # Continue an ad-hoc batch after a failed trial. Release runs continue unless
  # you pass --abort-on-error.
  continue_on_error: false
  # Retry failed or incomplete trials with this many extra passes.
  retry_passes: 0
  # Reuse completed trial slots instead of running them again.
  resume: true
  # Add this tag to generated session IDs.
  session_tag: null
