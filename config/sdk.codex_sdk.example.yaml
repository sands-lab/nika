# NIKA run-config template for sdk.codex_sdk (Codex SDK, Docker Sandbox).
# Setup: cp config/nika.yaml config/sdk.codex_sdk.yaml
# Replace the copied agent section with this example; preserve your sandbox settings.
# Use:   uv run nika agent run --run-config config/sdk.codex_sdk.yaml --problem dc_clos_s_link_down
# Credentials stay in the repo-root .env file. This template uses sbx by default;
# see config/nika.example.yaml for the full platform / benchmark reference.

agent:
  type: sdk.codex_sdk
  provider: openai
  model: gpt-5-mini
  reasoning_effort: medium

nika:
  result_dir: results/codex_sdk
