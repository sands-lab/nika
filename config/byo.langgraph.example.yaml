# NIKA run-config template for byo.langgraph (LangGraph ReAct, host).
# Setup: cp config/byo.langgraph.example.yaml config/byo.langgraph.yaml
# Use:   uv run nika agent run --run-config config/byo.langgraph.yaml --problem dc_clos_s_link_down
# Credentials stay in the repo-root .env file. Other keys use built-in defaults;
# see config/nika.example.yaml for the full platform / benchmark reference.

version: 1

agent:
  type: byo.langgraph
  provider: deepseek
  model: deepseek-v4-flash
  max_steps: 20
  # Optional for OpenAI, Anthropic, and supported custom models.
  # DeepSeek ignores this setting.
  # reasoning_effort: medium

nika:
  result_dir: results/langgraph
