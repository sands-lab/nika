# NIKA run-config template for cli.claude (Claude Code CLI, Docker Sandbox).
# Setup: cp config/nika.yaml config/cli.claude.yaml
# Replace the copied agent section with this example; preserve your sandbox settings.
# Use:   uv run nika agent run --run-config config/cli.claude.yaml --problem dc_clos_s_link_down
# Credentials stay in the repo-root .env file. This template uses sbx by default;
# see config/nika.example.yaml for the full platform / benchmark reference.

agent:
  type: cli.claude
  provider: deepseek
  model: deepseek-v4-flash

nika:
  result_dir: results/claude
