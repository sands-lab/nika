# adjudication step; dev and test are split by submission.
- submission: 20261007_claude_code_qwen3_6_35b_a3b_fp8
  class: harness_defect
  claim: The FRR vtysh 'show bgp <prefix>' command returned an IPv6 AFI error instead of the route, forcing
    the agent to guess the correct 'show bgp ipv4 unicast' syntax.
  other_claims:
  - The diagnosis prompt's network description contains a typo ('troubeshooting') and the tooling surfaced
    a 'Cannot specify IPv4 address or prefix with IPv6 AFI' error when querying BGP routes, indicating
    a vtysh/AFI misconfiguration the agent could not fix.
  - vtysh on the routers is configured for IPv6 AFI, so querying IPv4 prefixes errors out, preventing
    the agent from inspecting the IPv4 BGP table.
  trials: 3
  fault_trials: 2
  healthy_trials: 1
  cases: 3
  environments:
  - dc_clos
  - isp_dfn-bwin_ebgp_rtbh
  - k8s_lab
  sample_agreement: 0.33
  stratum: multi-trial
  refs:
  - dc_clos__healthy__s__t01:72
  - isp_dfn-bwin_ebgp_rtbh__bgp__hb65dab9be18e__t01:70
  - k8s_lab__k8s_worker_apiserve__hc58ead3adbe3__t01:119
  label: agent_mistake
  label_ref: null
  label_reason: FRR 'show bgp <prefix>' without an AFI uses IPv6 unicast by default; the error is FRR
    rejecting the agent's IPv4 prefix in that AFI, and 'show bgp ipv4 unicast' works.
  groups_in_submission: 701
  multi_trial_groups: 178
