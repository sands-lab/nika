  claim: bgp_max_prefix_exceeded ground truth names both session endpoints
  verdict: rejected
  reason: 'This is by design. root_cause_resources returns both the receiver and the peer (bgp.py:1455-1459)
    because the injector changes both nodes: it sets the maximum-prefix on the receiver and installs the
    flood route-map and prefix list on the peer (bgp.py:1722-1739). That matches the "mutated resource"
    rule in docs/benchmarks/root-cause-evaluation.md. Agents can see both changes, for example TE-MORE-SPECIFICS
    in "show run bgp" on hstnng (20261007_claude_code_qwen3_6_35b_a3b_fp8 t01 step 119; the string appears
    in 24 trials). A one-node answer is incomplete, not a label defect.'
