  claim: enterprise_branch nat_mapping_removed_without_drain nft chain reverts before cleanup
  verdict: rejected
  reason: The fault did not revert. In both t01 and t03 of 20261017_codex_gpt_6_1_sol, the before_cleanup
    evidence in nika.jsonl still shows 198.18.1.10 withdrawn and only 198.18.1.11 on eth3. The "absent"
    verdict is a false negative of the presence check at the run commit 5096d23a (gateway.py verify_fault
    required `not entries.strip()`). That check counted any conntrack entry to 198.18.1.10, including
    the other LAN's flow "src=10.1.30.2 ... dst=198.18.1.10". Commit c00630bc fixed it by filtering on
    the source prefix. This was a presence-check defect, already fixed, not a reverting fault.
