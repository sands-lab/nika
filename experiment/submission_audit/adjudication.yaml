- cluster: C02
  claim: Healthy p4_dc_gateway drops direct TCP/80 to the leaf_1 VIP backends
  verdict: confirmed
  reference_id: REF-P4-GATEWAY-DIRECT-BACKEND-TCP-DROP
  reason: 'Real hidden baseline defect, not agent misuse: release gateway.p4 (git show c00630bc^:src/nika/net_env/p4_dc_gateway/gateway.p4
    line 194) rewrote the source of every TCP packet from 10.0.1.11/10.0.1.12 to the VIP 20.0.0.1, so
    SYN-ACKs of direct connections come back from the wrong address. Every client curl to these IPs (1102
    calls in 288 p4_dc_gateway trials, healthy and faulted) times out and none succeeds; healthy trials
    were answered http_acl_block/p4_table_entry_missing. c00630bc later fixed it with the stateful lb_flow_dip
    rewrite (gateway.p4:123-125, 198-201, 260-266).'
