# Adjudication of the issues the audit runs wrote that matched no reference issue
# (2026-10-28): 144 candidates grouped into 85 distinct claims, each checked against
# the 0.2.0 trajectories and the NIKA code. Confirmed ones are in reference_issues.yaml.
- cluster: C01
  claim: p4_dc_gateway lb_pending_connection_update_race has no observable symptom
  verdict: rejected
  reason: The fault is realized and observable through the normal tools. It sets learning_delay_ms=8000
    in the gateway_1 agent config (gateway.py:128-139, l4_lb.py:77-93; healthy value 5, topology_model.py:34).
    Always-on downloader traffic hits the VIP, and routine pool updates run every 60-180 s (lab.py:320-347,
    topology_model.py:37). lb_agent.py:466-482 and :380-387 log each unsafe update and backend reset to
    /tmp/lb-agent.log, and agents can read that log and the config with exec_shell on gateway_1 (other
    p4_dc_gateway trials do, e.g. telecomgpt_r1 p4_tcam_entry t01 step 161). None of the 45 lb_pending
    trials read the lb-agent log, config, or status, so the 0% solve rate shows the agents never looked,
    not that the fault is absent or hidden. A live lab would show whether the data-plane reset fires in
    each run.
  members:
  - date/FNR-P4-DC-GATEWAY-LB-PENDING-RACE
  - shuffle1/SIG-P4-LB-PENDING-PROBE-BLIND
  - shuffle2/FNR-P4-LB-PENDING-RACE-NO-SYMPTOM
