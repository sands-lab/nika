- cluster: C05
  claim: Time-limited load/stress injectors expire before the cleanup recheck
  verdict: confirmed
  reference_id: REF-FIXED-DURATION-INJECTOR-EXPIRES
  reason: 'The SYN flood runs under `timeout {duration}s` with duration=3600 (tcp_syn_flood.py:22,52,75),
    and the receiver contention stress starts with `--duration 3600` (transport.py:684-685,730,917). All
    7 before_cleanup "absent" rechecks for these two faults come from trials that ran 3900-8800 s after
    injection, and none of those traces has a kill, stress, or tc command against the fault. The fault
    therefore expired on its own while the agent was still working. The cluster''s campus_lan load_balancer_overload
    part does not hold: its ab workers loop until recovery (load_balancer.py:127-130, ab_helpers.py:176-181),
    and its 2 absent rechecks have no duration explanation, so it is excluded.'
