    trial: p4_dc_gateway__healthy__m__t01
    step: 141
    excerpt: namelookup:0.000028, connect:0.000000, appconnect:0.000000, pretransfer:0.000000, starttransfer:0.000000,
      total:5.000469
  - submission: 20261012_react_gemma_4_31b_it
